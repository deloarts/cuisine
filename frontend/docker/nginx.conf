# TLS always terminates outside this container, so $scheme here is plain
# http even when the client connected over https. Only the value "https" is
# ever taken from an incoming X-Forwarded-Proto; anything else, including no
# proxy at all, falls back to our own $scheme.
map $http_x_forwarded_proto $client_proto {
    https   https;
    default $scheme;
}

# Per-client request rate limit for the API: a safety net against a runaway
# client, not a security control; login attempts are throttled by the
# backend itself. The key is the client address the real_ip settings below
# resolve, so a client cannot pick its own bucket with a forged header.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# Stored files served from SeaweedFS run no script on this origin: PDFs may
# open in the browser's viewer, everything else is sandboxed.
map $upstream_http_content_type $stored_object_csp {
    ~*^application/pdf  "frame-ancestors 'none'";
    default             "sandbox; default-src 'none'; frame-ancestors 'none'";
}

# The backend gets a new IP whenever its container is recreated. The
# resolve parameter makes nginx re-resolve the name through Docker's
# embedded DNS instead of dialling a dead address.
upstream backend_app {
    zone backend_app 64k;
    resolver 127.0.0.11 valid=10s;
    server backend:3000 resolve;
}

server {
    listen 80;

    # The client address. A connection from a trusted proxy (the reverse
    # proxy on the host, the cloudflared tunnel) carries the client in
    # X-Forwarded-For; the included file lists those proxies and is written
    # at start from CUISINE_TRUSTED_PROXIES (trusted-proxies.sh). nginx walks
    # the header from the right and takes the first untrusted address, so
    # entries a client prepends are never used.
    include            /etc/nginx/cuisine/trusted-proxies.conf;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    server_tokens off;

    # Inherited by the locations that add no header of their own; every
    # location that does includes the file again (security-headers.conf).
    include /etc/nginx/cuisine/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        include /etc/nginx/cuisine/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # style-src 'unsafe-inline': OpenVue's runtime theming injects
        # <style> tags. img-src data: blob:: the TOTP QR code is a data URL
        # and image previews are object URLs.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        include /etc/nginx/cuisine/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # X-Forwarded-For carries only the resolved client address, never the
    # incoming header, so the backend sees exactly what nginx decided.
    location /api/ {
        proxy_pass         http://backend_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $client_proto;
        include            /etc/nginx/cuisine/security-headers.conf;
        # Above the backend's own image limit, so the backend answers with
        # its own message instead of nginx's bare 413.
        client_max_body_size 30M;
        limit_req          zone=api burst=100 nodelay;
    }

    # The MCP surface takes a recipe image as base64 in one JSON-RPC
    # message, so its body may reach the transport's own 40 MiB limit.
    location = /api/v1/mcp {
        proxy_pass         http://backend_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $client_proto;
        include            /etc/nginx/cuisine/security-headers.conf;
        client_max_body_size 41M;
        limit_req          zone=api burst=100 nodelay;
    }

    # The OAuth discovery documents hosted AI clients read before they
    # connect (RFC 8414 and RFC 9728). They must sit at the root of the
    # origin, so they need their own route to the backend.
    location ^~ /.well-known/oauth- {
        proxy_pass         http://backend_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $client_proto;
        include            /etc/nginx/cuisine/security-headers.conf;
        limit_req          zone=api burst=100 nodelay;
    }

    # Presigned file URLs of the `seaweedfs` storage provider, signed for
    # this origin. Only reads pass; every write goes from the backend to
    # SeaweedFS over the internal network. The bucket path is fixed to
    # `objects`, the only bucket the bundled SeaweedFS creates. The name is
    # resolved per request, so the container starts without the profile.
    location /objects/ {
        resolver 127.0.0.11 valid=30s;
        set $seaweedfs http://seaweedfs:8333;
        proxy_pass $seaweedfs;
        proxy_set_header Host $http_host;
        include /etc/nginx/cuisine/security-headers.conf;
        add_header Content-Security-Policy $stored_object_csp always;
        limit_except GET HEAD {
            deny all;
        }
    }

    # The backend writes robots.txt from the admin's search engine switch:
    # everything closed unless public recipes may be indexed.
    location = /robots.txt {
        proxy_pass         http://backend_app/api/v1/public/robots.txt;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        include            /etc/nginx/cuisine/security-headers.conf;
    }

    location /health {
        proxy_pass  http://backend_app/health;
        access_log  off;
    }

    location = /ready {
        proxy_pass  http://backend_app/ready;
        access_log  off;
    }
}
