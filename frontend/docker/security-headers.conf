# The security headers every response carries. nginx drops a parent's
# add_header list the moment a location defines its own, so nginx.conf
# includes this file at server level and again in every location that adds
# a header. The proxy_hide_header lines drop the backend's copies of the
# same headers, so a proxied response carries each of them once.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# camera=(self): photographing a dish for a recipe from the phone.
add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), camera=(self)" always;

proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Permissions-Policy;
