# Publishes a release when its release PR is merged into main. The release
# PR comes from scripts/release_start.sh on a branch release/X.Y.Z, which
# already bumped both version files and opened the CHANGELOG section. This
# workflow checks that once more, builds both images and pushes them to GHCR
# as the release candidate sha-<commit>, starts the candidate on an empty
# database (scripts/smoke_release_images.sh), and only then tags the merge
# commit vX.Y.Z, retags the tested digests as vX.Y.Z, vX.Y and latest, and
# creates the GitHub release from the CHANGELOG section. docs/RELEASING.md
# has the flow.

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.info.outputs.version }}
      minor: ${{ steps.info.outputs.minor }}
      sha: ${{ steps.info.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Derive version
        id: info
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version="${HEAD_REF#release/}"
          {
            echo "version=${version}"
            echo "minor=v${version%.*}"
            echo "sha=${MERGE_SHA}"
          } >> "$GITHUB_OUTPUT"
      - name: Check version files, CHANGELOG and tag
        run: scripts/check_release_version.sh "${{ steps.info.outputs.version }}"

  # Builds each image once per platform, natively on a runner of that
  # platform, and pushes it by digest only. Nothing a deployment pulls points
  # at these images until the smoke test passed. The matrix mirrors ci.yml's
  # images job; change both together.
  images:
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - component: backend
            target: prod
          - component: frontend
            target: ""
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/docker/${{ matrix.component }}.Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          # Read only: a run for a merged pull request gets a cache token
          # without writable scopes, so a cache-to fails the build. The
          # layers come from the release PR's CI run, which wrote them under
          # the same scope.
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
      # The manifest job below finds each platform's image by this file name.
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins each image's per-platform digests into one image index under the
  # immutable candidate tag sha-<commit>, so a host pulls its own platform
  # under the same name, and fails unless the index holds both platforms.
  manifest:
    needs: [guard, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the candidate's image index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          CANDIDATE: ${{ needs.guard.outputs.sha }}
        run: |
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:sha-$CANDIDATE" "${sources[@]}"
          platforms="$(docker buildx imagetools inspect "$IMAGE:sha-$CANDIDATE" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          echo "$IMAGE:sha-$CANDIDATE: $platforms"
          for platform in linux/amd64 linux/arm64; do
            if [[ " $platforms " != *" $platform "* ]]; then
              echo "::error::$IMAGE:sha-$CANDIDATE has no $platform image." >&2
              exit 1
            fi
          done

  # Pins the candidate by digest, so the smoke test and the retag below act
  # on exactly the images that were built, whatever happens to the tag.
  resolve:
    needs: [guard, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      backend: ${{ steps.digests.outputs.backend }}
      frontend: ${{ steps.digests.outputs.frontend }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the candidate's digests
        id: digests
        env:
          IMAGE_ROOT: ghcr.io/${{ github.repository }}
          CANDIDATE: ${{ needs.guard.outputs.sha }}
        run: |
          for component in backend frontend; do
            repository="$IMAGE_ROOT/$component"
            digest="$(docker buildx imagetools inspect "$repository:sha-$CANDIDATE" --format '{{.Manifest.Digest}}')"
            echo "$component: $repository@$digest"
            echo "$component=$repository@$digest" >> "$GITHUB_OUTPUT"
          done

  # Starts the candidate's images with the release docker-compose.yml on an
  # empty Postgres and Redis before anything is tagged or published: the
  # entrypoint must migrate the database, the backend must report this
  # version and be ready, and the frontend must serve the app and reach the
  # backend. See scripts/smoke_release_images.sh. It runs once per platform,
  # each natively on a runner of that platform.
  smoke:
    needs: [guard, resolve]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the images on an empty database
        env:
          BACKEND: ${{ needs.resolve.outputs.backend }}
          FRONTEND: ${{ needs.resolve.outputs.frontend }}
          VERSION: ${{ needs.guard.outputs.version }}
          SMOKE_PLATFORM: ${{ matrix.platform }}
          SMOKE_TIMEOUT: "600"
        run: scripts/smoke_release_images.sh "$BACKEND" "$FRONTEND" "$VERSION"

  tag:
    needs: [guard, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - name: Create and push tag
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

  # Retags the smoke-tested digests; --prefer-index=false copies each image
  # index as it is, with both platforms, so every release tag names the very
  # digest the candidate had, which the last step confirms.
  publish:
    needs: [guard, resolve, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the candidate's digests
        env:
          BACKEND: ${{ needs.resolve.outputs.backend }}
          FRONTEND: ${{ needs.resolve.outputs.frontend }}
          VERSION: ${{ needs.guard.outputs.version }}
          MINOR: ${{ needs.guard.outputs.minor }}
        run: |
          for source in "$BACKEND" "$FRONTEND"; do
            repository="${source%@*}"
            digest="${source#*@}"
            docker buildx imagetools create --prefer-index=false \
              --tag "$repository:v$VERSION" \
              --tag "$repository:$MINOR" \
              --tag "$repository:latest" \
              "$source"
            for tag in "v$VERSION" "$MINOR" latest; do
              published="$(docker buildx imagetools inspect "$repository:$tag" --format '{{.Manifest.Digest}}')"
              if [[ "$published" != "$digest" ]]; then
                echo "::error::$repository:$tag is $published, not the tested $digest." >&2
                exit 1
              fi
              echo "$repository:$tag -> $digest"
            done
          done

  github-release:
    needs: [guard, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - name: Extract CHANGELOG section
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          name: v${{ needs.guard.outputs.version }}
          body_path: release-notes.md
