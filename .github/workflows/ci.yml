name: CI

on:
  # No push trigger for main: every change reaches it as a squash-merged PR
  # whose checks already ran.
  push:
    branches: ["release/**"]
  pull_request:

permissions:
  contents: read

# The Poetry that wrote backend/poetry.lock. backend/docker/backend.Dockerfile
# pins the same version in its POETRY_VERSION argument; bump both together.
env:
  POETRY_VERSION: "2.4.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            shared:
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '.github/**'
              - '.pre-commit-config.yaml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      # Locally Poetry keeps the virtualenv in its user cache; CI builds it
      # inside backend/ so the cache step below has a fixed path to restore.
      - name: Keep the virtualenv in the project
        run: echo "POETRY_VIRTUALENVS_IN_PROJECT=true" >> "$GITHUB_ENV"

      # The virtualenv links to the interpreter it was built with, so the key
      # carries the full Python version.
      - name: Set up Poetry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff check
        run: poetry run ruff check src tests scripts alembic

      - name: Ruff format check
        run: poetry run ruff format --check src tests scripts alembic

      - name: mypy (strict)
        run: poetry run mypy src scripts tests

      - name: OpenAPI snapshot is current
        run: poetry run python scripts/export_openapi.py --check

      - name: Format schemas are current
        run: poetry run python scripts/export_formats.py --check

      # A throwaway SQLite file and in-process fakes for Redis; no services.
      - name: pytest
        run: poetry run pytest tests -q -n auto --cov=src --cov-report=term-missing:skip-covered

  # The backend tests on linux/arm64, the platform a Raspberry Pi runs, on a
  # native arm64 runner. It builds the Dockerfile's dev stage, which holds
  # every dependency on the image's own Python, and runs pytest in it with
  # the tests mounted, since the build context leaves them out. It runs for
  # pushes only, which are the release branches, before release.yml
  # publishes arm64 images; the release PR shares the commit, so a second
  # run there would only repeat this one.
  backend-arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/docker/backend.Dockerfile
          target: dev
          platforms: linux/arm64
          load: true
          tags: cuisine-backend-dev:arm64
          cache-from: type=gha,scope=backend-dev-arm64
          cache-to: type=gha,mode=max,scope=backend-dev-arm64

      # A throwaway SQLite file and in-process fakes for Redis; no services.
      # The image's entrypoint would migrate a database, so pytest replaces it.
      - name: pytest (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            --volume "$PWD/tests:/app/tests:ro" \
            --entrypoint pytest \
            cuisine-backend-dev:arm64 \
            tests -q -n auto -p no:cacheprovider

  # The migration chain on a real, empty Postgres, so a migration that only
  # works on SQLite fails here instead of on a deploy.
  backend-migrations:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cuisine_ci
          POSTGRES_PASSWORD: cuisine_ci
          POSTGRES_DB: cuisine_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cuisine_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE__URL: postgresql+psycopg://cuisine_ci:cuisine_ci@localhost:5432/cuisine_ci
      REDIS__URL: redis://localhost:6379/0
      SECURITY__SECRET_KEY: ci-secret-key
      SECURITY__ENCRYPTION_KEY: ci-encryption-key
      INIT__FULL_NAME: CI
      INIT__MAIL: ci@example.com
      INIT__PASSWORD: ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --no-interaction --only main
      - name: Upgrade, check for drift, downgrade
        run: |
          poetry run alembic upgrade head
          poetry run alembic check
          poetry run alembic downgrade base

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      # Calls the linters directly (not `npm run lint`, which runs with
      # `--fix` and would mask failures here).
      - name: Lint (oxlint, eslint, stylelint)
        run: npm run lint:check

      - name: Unit tests
        run: npm run test:unit:run

      - name: i18n key parity
        run: npm run check:i18n

      - name: Generated API types are current
        run: npm run check:api-types

      - name: Build
        run: npm run build-only

  # Both images build for every platform the release publishes, so a broken
  # Dockerfile or a dependency without an arm64 wheel fails the PR, not the
  # release. Each platform builds natively on its own runner, as in
  # release.yml, whose matrix this one mirrors; change both together.
  images:
    needs: [changes, backend, frontend]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        component: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - component: backend
            target: prod
          - component: frontend
            target: ""
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/docker/${{ matrix.component }}.Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

  # The required check for the image builds. A skipped matrix job reports one
  # check named `images` instead of one per component, so the ruleset requires
  # this job, which always runs and fails only when an image build failed or
  # was cancelled.
  images-verify:
    needs: [images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Image builds passed or were skipped
        env:
          RESULT: ${{ needs.images.result }}
        run: |
          echo "images: $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  # Secret scan over the full history. Runs the pinned release binary
  # directly, its checksum verified, instead of gitleaks-action. It also
  # checks that every script is committed executable, since this required
  # job runs on every change.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose .
      # A checkout on a file system without executable bits commits scripts as 100644;
      # the workflows and the release script then fail with "Permission denied".
      - name: Scripts are executable
        run: |
          missing=0
          while IFS=$'\t' read -r meta path; do
            mode="${meta%% *}"
            if [ "$mode" = 100644 ] && [ "$(head -c 2 "$path")" = '#!' ]; then
              echo "::error file=$path::$path starts with a shebang but is not executable; run git update-index --chmod=+x $path"
              missing=1
            fi
          done < <(git ls-files --stage)
          exit "$missing"
