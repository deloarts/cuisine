name: Bug report
description: Something in Cuisine does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please remove passwords, tokens, e-mail addresses and other personal data from everything you paste. Security vulnerabilities go through the private advisory form, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the problem, starting from a page or an action.
      placeholder: |
        1. Open a recipe
        2. Click Edit
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recipes and the recipe editor
        - Ingredients, units and equipment
        - Meal plan and cooking calendar
        - Shopping lists
        - Account, sign-in and two-factor authentication
        - Household and groups
        - Admin area
        - Import, export and exchange files
        - Public recipes and peering
        - MCP and agent access
        - Installation, update or operations
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cuisine version
      description: Shown in the admin area on the Server tab, or in the image tag you run.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Only needed for problems in the web interface.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Backend log lines (`docker compose logs backend`), browser console errors or screenshots that show the problem. Log text is formatted as code automatically.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: I removed passwords, tokens and personal data from this report.
          required: true
