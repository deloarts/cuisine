# The ingredient categories (supermarket aisles) every instance is seeded
# with, in aisle order: the walk through an Austrian supermarket that the
# shopping list groups items by. Hand-edited.
#
# Fields: key (stable, never renamed; ingredients.yaml refers to it), names
# per locale. A key is inserted once, with its position in this file as its
# sort order, and never brought back once deleted; the names follow seed
# updates per locale (docs/reference/cookbook.md section 9). household holds
# the non-food items of shared shopping lists and no base ingredient.

