# The kitchen equipment every instance is seeded with: cookware, bakeware,
# appliances and utensils that recipe steps can name. Hand-edited.
#
# Fields: key (stable, never renamed), kind (cookware, bakeware, appliance,
# utensil), names per locale (Austrian German as the de-AT main name),
# aliases per locale (other names that search, pickers and imports match:
# German German and regional variants in de-AT, US names in en-GB; unique
# per locale across every equipment, ingredient and family name and alias,
# ignoring case and diacritics), icon (optional, an icon name of @mdi/font
# without the mdi- prefix), basic (optional, true for the everyday items
# most kitchens have, pre-ticked when a user sets up their kitchen).
# Inserted once by key, never updated or brought back.

