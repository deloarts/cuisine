# The units every instance is seeded with, in this order. Hand-edited.
#
# Fields: key (stable, never renamed; also the unit's code), kind (mass,
# volume, count, other), to_base (grams per unit for mass, millilitres for
# volume, empty otherwise), names per locale as [singular, plural,
# abbreviation]. The startup seed inserts a key once and never updates or
# brings back a unit afterwards (docs/reference/cookbook.md section 10).

- key: g
  kind: mass
  to_base: 1.0
  names:
    en-GB: [gram, grams, g]
    de-AT: [Gramm, Gramm, g]

- key: kg
  kind: mass
  to_base: 1000.0
  names:
    en-GB: [kilogram, kilograms, kg]
    de-AT: [Kilogramm, Kilogramm, kg]

