# The food facts of the start page, one group per base ingredient of
# ingredients.yaml, in its order. Hand-edited and reviewed; every base
# ingredient has at least one fact.
#
# Fields: ingredient (the key in ingredients.yaml), articles (the English
# and German Wikipedia article the facts draw on, per content locale, with
# the revision id the facts were checked against), facts (each with key, a
# kebab-case slug unique within the ingredient; source, the locale of the
# article that backs it; and text in en-GB and de-AT, at most 220
# characters each). Facts are written in our own words, never copied from
# Wikipedia. The curation rules are in docs/reference/cookbook.md section 4f.

- ingredient: potato
  articles:
    en-GB: {title: "Potato", revision: 1386402285}
    de-AT: {title: "Kartoffel", revision: 272199178}
  facts:
    - key: andes
      source: en-GB
      text:
        en-GB: "Potatoes were domesticated in what is now southern Peru and the far north-west of Bolivia, about 7,000 to 10,000 years ago."
        de-AT: "Erdäpfel wurden vor etwa 7.000 bis 10.000 Jahren im Gebiet des heutigen Südperu und des äußersten Nordwestens Boliviens domestiziert."
    - key: spanish-import
      source: en-GB
      text:
        en-GB: "Spanish ships brought the potato to Europe in the second half of the 16th century. Selective breeding has since produced more than 5,000 varieties."
        de-AT: "Spanische Seefahrer brachten den Erdapfel in der zweiten Hälfte des 16. Jahrhunderts nach Europa. Seither sind durch Züchtung über 5.000 Sorten entstanden."
    - key: erdapfel-grundbirne
      source: de-AT
      text:
        en-GB: "German has many regional potato names: Erdapfel rules in Austria and Bavaria, while Vorarlberg and parts of Burgenland traditionally say Grundbirne."
        de-AT: "Im Deutschen hat die Kartoffel viele Namen: In Österreich und Bayern sagt man Erdapfel, in Vorarlberg und Teilen des Burgenlands dagegen traditionell Grundbirne."

- ingredient: sweet_potato
  articles:
    en-GB: {title: "Sweet potato", revision: 1388093828}
    de-AT: {title: "Süßkartoffel", revision: 271988626}
  facts:
    - key: not-a-potato
      source: en-GB
      text:
        en-GB: "Despite the name, the sweet potato is a morning glory relative and only distantly related to the potato, and even more distant from true yams."
        de-AT: "Trotz ihres Namens gehört die Süßkartoffel zu den Windengewächsen und ist mit dem Erdapfel nur entfernt verwandt, mit der echten Yamswurzel noch weniger."
    - key: polynesia
      source: en-GB
      text:
        en-GB: "Sweet potatoes reached Polynesia long before Europeans reached the Americas. Remains on the Cook Islands are dated to 1210 to 1400 CE."
        de-AT: "Die Süßkartoffel kam nach Polynesien, lange bevor Europäer Amerika erreichten. Funde auf den Cookinseln werden auf 1210 bis 1400 n. Chr. datiert."

- ingredient: onion
  articles:
    en-GB: {title: "Onion", revision: 1383660076}
    de-AT: {title: "Zwiebel", revision: 271890166}
  facts:
    - key: ramesses
      source: en-GB
      text:
        en-GB: "Ancient Egyptians saw the onion's concentric rings as a symbol of eternal life, and traces of onion were found in the eye sockets of the mummy of Ramesses IV."
        de-AT: "Die alten Ägypter sahen in den Ringen der Zwiebel ein Sinnbild des ewigen Lebens. In den Augenhöhlen der Mumie von Ramses IV. fand man Spuren von Zwiebeln."
    - key: tears
      source: en-GB
      text:
        en-GB: "Cutting an onion releases a volatile compound, syn-propanethial-S-oxide, which irritates nerves in the eye and makes it water."
        de-AT: "Beim Schneiden einer Zwiebel wird die flüchtige Verbindung syn-Propanthial-S-oxid frei, reizt die Nerven im Auge und treibt Tränen hervor."
    - key: no-wild-form
      source: en-GB
      text:
        en-GB: "The onion is known only from cultivation. Its original wild ancestor has never been identified."
        de-AT: "Die Speisezwiebel kennt man nur aus dem Anbau, ihre ursprüngliche Wildform wurde nie gefunden."

- ingredient: red_onion
  articles:
    en-GB: {title: "Red onion", revision: 1384408109}
  facts:
    - key: tropea
      source: en-GB
      text:
        en-GB: "The red onion of Tropea grows only in a small part of Calabria and has carried an EU protected geographical indication since July 2007."
        de-AT: "Die rote Zwiebel aus Tropea wächst nur in einem kleinen Gebiet Kalabriens und trägt seit Juli 2007 eine geschützte geografische Angabe der EU."
    - key: mild-and-dye
      source: en-GB
      text:
        en-GB: "Red onions taste sweeter than white or yellow ones because they contain less pyruvic acid and fewer sulphur compounds. Their skins have also been used as a dye."
        de-AT: "Rote Zwiebeln schmecken süßer als weiße oder gelbe, weil sie weniger Brenztraubensäure und Schwefelverbindungen enthalten. Mit den Schalen wurde auch gefärbt."

- ingredient: spring_onion
  articles:
    en-GB: {title: "Scallion", revision: 1383810304}
    de-AT: {title: "Winterzwiebel", revision: 271890271}
  facts:
    - key: ascalon
      source: en-GB
      text:
        en-GB: "The words scallion and shallot both go back to the Latin for Ascalonian onion, named after the ancient Mediterranean port city of Ascalon."
        de-AT: "Die englischen Wörter scallion und shallot gehen beide auf das lateinische Wort für „Zwiebel aus Askalon“ zurück, eine antike Hafenstadt am Mittelmeer."
    - key: no-bulb
      source: en-GB
      text:
        en-GB: "Scallions grow hollow green leaves straight from a bulb that never fully develops, which is why they stay slim instead of swelling like a storage onion."
        de-AT: "Frühlingszwiebeln bilden hohle grüne Blätter direkt aus einer Zwiebel, die sich nie ganz entwickelt. Darum bleiben sie schlank, statt dick zu werden wie eine Speisezwiebel."

- ingredient: shallot
  articles:
    en-GB: {title: "Shallot", revision: 1386202819}
    de-AT: {title: "Schalotte", revision: 270147915}
  facts:
    - key: onion-since-2010
      source: en-GB
      text:
        en-GB: "Until 2010 the shallot counted as its own species, Allium ascalonicum. Botanists then merged it into the common onion because the difference was too small."
        de-AT: "Bis 2010 galt die Schalotte als eigene Art, Allium ascalonicum. Dann ordneten Botaniker sie der Speisezwiebel zu, weil der Unterschied zu gering war."
    - key: grey-shallot
      source: en-GB
      text:
        en-GB: "The French grey shallot, also called griselle or true shallot, is actually a separate species, Allium oschaninii, which grows wild from Central to south-west Asia."
        de-AT: "Die französische graue Schalotte, auch Griselle genannt, ist eine eigene Art, Allium oschaninii, die wild von Zentral- bis Südwestasien wächst."

- ingredient: leek
  articles:
    en-GB: {title: "Leek", revision: 1384737928}
    de-AT: {title: "Lauch", revision: 271826727}
  facts:
    - key: wales
      source: en-GB
      text:
        en-GB: "The leek is a national emblem of Wales and is worn on St David's Day. One legend says Welsh soldiers wore leeks on their helmets in a battle fought in a leek field."
        de-AT: "Der Lauch ist ein Nationalsymbol von Wales und wird am St. David's Day getragen. Einer Sage nach steckten walisische Krieger in einer Schlacht auf einem Lauchfeld Lauch an ihre Helme."
    - key: nero
      source: en-GB
      text:
        en-GB: "Emperor Nero loved raw leek and ate it in soup or oil, convinced it improved his singing voice."
        de-AT: "Kaiser Nero aß Lauch am liebsten roh, in Suppe oder Öl, weil er glaubte, er tue seiner Stimme gut."
    - key: not-a-stem
      source: en-GB
      text:
        en-GB: "The part of a leek we eat is not a stem at all but a tight bundle of leaf sheaths."
        de-AT: "Was wir beim Lauch essen, ist gar kein Stängel, sondern ein dichtes Bündel aus Blattscheiden."

- ingredient: garlic
  articles:
    en-GB: {title: "Garlic", revision: 1388187209}
    de-AT: {title: "Knoblauch", revision: 272171551}
  facts:
    - key: china-73
      source: en-GB
      text:
        en-GB: "China grew 73 per cent of the world's garlic in 2024, according to the UN's FAOSTAT figures."
        de-AT: "China erzeugte 2024 laut den FAOSTAT-Zahlen der UNO 73 Prozent des weltweiten Knoblauchs."
    - key: allicin
      source: en-GB
      text:
        en-GB: "Garlic's bite comes from allicin, which only forms when a clove is crushed or chewed. Cooking destroys it, which is why roasted garlic tastes mellow."
        de-AT: "Die Schärfe von Knoblauch stammt vom Allicin, das erst beim Zerdrücken oder Kauen entsteht. Hitze zerstört es, darum schmeckt gebratener Knoblauch mild."
    - key: turns-green
      source: en-GB
      text:
        en-GB: "Pickled garlic can turn blue or green: sulphur compounds react with amino acids to form pyrrole molecules, and chains of three or four look blue or green."
        de-AT: "Eingelegter Knoblauch kann blau oder grün werden. Schwefelverbindungen bilden mit Aminosäuren Pyrrole, und Ketten aus drei oder vier davon wirken blau oder grün."

- ingredient: carrot
  articles:
    en-GB: {title: "Carrot", revision: 1388259207}
    de-AT: {title: "Karotte", revision: 271638938}
  facts:
    - key: dutch-orange
      source: en-GB
      text:
        en-GB: "Orange carrots only became a stable variety when Dutch growers bred the Long Orange in the early 18th century. Older carrots were often purple, white or yellow."
        de-AT: "Orange Karotten wurden erst zur stabilen Sorte, als niederländische Züchter Anfang des 18. Jahrhunderts die „Long Orange“ schufen. Davor gab es auch violette, weiße und gelbe."
    - key: radar-myth
      source: en-GB
      text:
        en-GB: "The idea that carrots help you see in the dark was spread as Second World War propaganda to hide the real secret of British night fighters: radar."
        de-AT: "Dass Karotten im Dunkeln besser sehen lassen, wurde im Zweiten Weltkrieg als Propaganda verbreitet. So sollte das wahre Geheimnis der britischen Nachtjäger verborgen bleiben, das Radar."
    - key: leaves-first
      source: en-GB
      text:
        en-GB: "The domesticated carrot probably originated in Iran, where it was first grown for its leaves and seeds rather than its root."
        de-AT: "Die Kulturkarotte stammt vermutlich aus dem Iran. Dort baute man sie zunächst wegen ihrer Blätter und Samen an, nicht wegen der Wurzel."

- ingredient: parsnip
  articles:
    en-GB: {title: "Parsnip", revision: 1382816400}
    de-AT: {title: "Pastinak", revision: 267137815}
  facts:
    - key: frost-sweet
      source: en-GB
      text:
        en-GB: "Parsnips left in the ground grow sweeter after winter frosts. Before cane sugar reached Europe they were even used as a sweetener."
        de-AT: "Pastinaken, die im Boden bleiben, werden nach Winterfrösten süßer. Bevor Rohrzucker nach Europa kam, verwendete man sie sogar zum Süßen."
    - key: roman-confusion
      source: en-GB
      text:
        en-GB: "The Romans grew parsnips, but their writers mixed them up with carrots so often that it is hard to tell which root they meant."
        de-AT: "Schon die Römer bauten Pastinaken an, doch ihre Schriften verwechseln sie so oft mit Karotten, dass kaum zu sagen ist, welche Wurzel gemeint war."

- ingredient: celeriac
  articles:
    en-GB: {title: "Celeriac", revision: 1362040737}
    de-AT: {title: "Echter Sellerie", revision: 268092268}
  facts:
    - key: hypocotyl
      source: en-GB
      text:
        en-GB: "The celeriac bulb is not really a root. It is a swollen hypocotyl, the part of the stem between root and leaves, and it keeps for months in winter."
        de-AT: "Die Sellerieknolle ist eigentlich keine Wurzel, sondern ein verdicktes Hypokotyl, also der Sprossteil zwischen Wurzel und Blättern. Im Winter hält sie sich monatelang."
    - key: selinon
      source: en-GB
      text:
        en-GB: "Wild celery, the ancestor of both celeriac and celery, already appears in Homer's Iliad and Odyssey under the name selinon."
        de-AT: "Wilder Sellerie, der Vorfahre von Knollen- und Stangensellerie, kommt schon in Homers Ilias und Odyssee vor, dort unter dem Namen selinon."

- ingredient: celery
  articles:
    en-GB: {title: "Celery", revision: 1382856469}
    de-AT: {title: "Echter Sellerie", revision: 268092268}
  facts:
    - key: tutankhamun
      source: en-GB
      text:
        en-GB: "Celery leaves and flowers were part of the garlands found in the tomb of Tutankhamun, who died in 1323 BCE."
        de-AT: "Blätter und Blüten von Sellerie waren Teil der Girlanden im Grab des Tutanchamun, der 1323 v. Chr. starb."
    - key: victory-wreath
      source: en-GB
      text:
        en-GB: "In ancient Greece the winners of the Isthmian Games were first crowned with celery wreaths, which were later replaced by pine."
        de-AT: "Im antiken Griechenland bekamen die Sieger der Isthmischen Spiele zuerst Kränze aus Sellerie, später wurden sie durch Kiefernkränze ersetzt."

- ingredient: beetroot
  articles:
    en-GB: {title: "Beetroot", revision: 1386059077}
    de-AT: {title: "Rote Bete", revision: 271571319}
  facts:
    - key: sugar-beet-cousin
      source: en-GB
      text:
        en-GB: "Beetroot, sugar beet, Swiss chard and the fodder crop mangelwurzel are all cultivars of the same subspecies, Beta vulgaris subsp. vulgaris."
        de-AT: "Rote Rüben, Zuckerrüben, Mangold und Futterrüben sind alle Sorten derselben Unterart, Beta vulgaris subsp. vulgaris."
    - key: greens-first
      source: en-GB
      text:
        en-GB: "Beet was first domesticated in the ancient Middle East mainly for its leaves. Egyptians, Greeks and Romans all grew it."
        de-AT: "Die Rübe wurde im alten Nahen Osten zuerst vor allem wegen ihrer Blätter kultiviert. Ägypter, Griechen und Römer bauten sie an."
    - key: betanin
      source: en-GB
      text:
        en-GB: "The red pigment betanin passes through the body unchanged, so a large helping of beetroot can briefly tint urine red, a harmless effect called beeturia."
        de-AT: "Der rote Farbstoff Betanin wird im Körper nicht abgebaut. Nach einer großen Portion Roter Rüben kann sich der Harn daher kurz rötlich färben, harmlos und „Beeturie“ genannt."

- ingredient: radish
  articles:
    en-GB: {title: "Radish", revision: 1388238500}
    de-AT: {title: "Radieschen", revision: 259479770}
  facts:
    - key: night-of-radishes
      source: en-GB
      text:
        en-GB: "Every 23 December the people of Oaxaca in Mexico celebrate the Night of the Radishes, part of their Christmas festivities."
        de-AT: "Jedes Jahr am 23. Dezember feiern die Menschen im mexikanischen Oaxaca die „Nacht der Radieschen“ als Teil ihrer Weihnachtsfeiern."
    - key: radix-quick
      source: de-AT
      text:
        en-GB: "The German name Radieschen comes from Latin radix, root. The plants grow so fast that they can be harvested four to six weeks after sowing."
        de-AT: "Der Name Radieschen kommt vom lateinischen radix, Wurzel. Die Pflanzen wachsen so schnell, dass man sie schon nach vier bis sechs Wochen ernten kann."

- ingredient: black_radish
  articles:
    en-GB: {title: "Daikon", revision: 1387055640}
    de-AT: {title: "Winterrettich", revision: 269992902}
  facts:
    - key: weight
      source: de-AT
      text:
        en-GB: "A winter radish usually weighs 1 to 4 kilograms, and in rare cases as much as 20 kilograms."
        de-AT: "Ein Winterrettich wiegt meist 1 bis 4 Kilogramm, in seltenen Fällen sogar bis zu 20 Kilogramm."
    - key: soil-loosener
      source: en-GB
      text:
        en-GB: "Some farmers leave daikon in the field on purpose: the long roots loosen compacted soil and recover nutrients."
        de-AT: "Manche Bauern lassen den Rettich absichtlich im Feld stehen. Die langen Wurzeln lockern verdichteten Boden auf und holen Nährstoffe zurück."

- ingredient: horseradish
  articles:
    en-GB: {title: "Horseradish", revision: 1384463341}
    de-AT: {title: "Meerrettich", revision: 271831921}
  facts:
    - key: kren-slavic
      source: de-AT
      text:
        en-GB: "The word Kren, used in Austria and Bavaria since the 13th century, was borrowed from Slavic languages, as in Czech křen."
        de-AT: "Das Wort Kren, in Österreich und Bayern seit dem 13. Jahrhundert gebräuchlich, ist ein Lehnwort aus slawischen Sprachen, etwa aus dem tschechischen křen."
    - key: styria
      source: de-AT
      text:
        en-GB: "Austria's traditional horseradish country is Styria, in districts such as Hartberg-Fürstenfeld, Leibnitz, Weiz and Südoststeiermark."
        de-AT: "Österreichs traditionelles Krenland ist die Steiermark, etwa die Bezirke Hartberg-Fürstenfeld, Leibnitz, Weiz und Südoststeiermark."
    - key: sinigrin
      source: en-GB
      text:
        en-GB: "An intact horseradish root hardly smells. Grating it lets enzymes turn sinigrin into allyl isothiocyanate, the mustard oil that makes the eyes water."
        de-AT: "Eine unversehrte Krenwurzel riecht kaum. Erst beim Reiben verwandeln Enzyme das Sinigrin in Allylsenföl, das in Nase und Augen brennt."

- ingredient: turnip
  articles:
    en-GB: {title: "Turnip", revision: 1382940895}
    de-AT: {title: "Speiserübe", revision: 254446068}
  facts:
    - key: townshend
      source: en-GB
      text:
        en-GB: "Around 1700 Charles Townshend, nicknamed Turnip Townshend, promoted turnips in a four-year crop rotation that let English farmers feed livestock all year."
        de-AT: "Um 1700 warb der Engländer Charles Townshend, genannt „Turnip Townshend“, für Rüben in einer vierjährigen Fruchtfolge, damit das Vieh das ganze Jahr Futter hatte."
    - key: turn-neep
      source: en-GB
      text:
        en-GB: "The English name turnip may combine turn, as in rounded on a lathe, with neep, from the Latin napus, to set the round root apart from long ones."
        de-AT: "Das englische turnip verbindet vielleicht turn, rund gedrechselt, mit neep vom lateinischen napus, um die runde Rübe von länglichen zu unterscheiden."

- ingredient: kohlrabi
  articles:
    en-GB: {title: "Kohlrabi", revision: 1382428736}
    de-AT: {title: "Kohlrabi", revision: 270711467}
  facts:
    - key: kohl-rube
      source: en-GB
      text:
        en-GB: "English borrowed the name kohlrabi from German: Kohl for cabbage plus Rübe or Rabi for turnip, because the swollen stem looks like a turnip."
        de-AT: "Das Englische hat kohlrabi aus dem Deutschen übernommen: Kohl plus Rübe oder schweizerisch Rabi, weil der verdickte Stängel wie eine Rübe aussieht."
    - key: mattioli
      source: en-GB
      text:
        en-GB: "The first European written record of kohlrabi comes from the botanist Mattioli in 1554, who noted that it had lately come into Italy."
        de-AT: "Die erste schriftliche Erwähnung des Kohlrabi in Europa stammt vom Botaniker Mattioli. Er schrieb 1554, er sei erst vor Kurzem nach Italien gekommen."

- ingredient: tomato
  articles:
    en-GB: {title: "Tomato", revision: 1384241377}
    de-AT: {title: "Tomate", revision: 270762773}
  facts:
    - key: vienna-1900
      source: de-AT
      text:
        en-GB: "Tomatoes long went by names like love apple, paradise apple or golden apple. The first Paradeiser appeared on Vienna's markets around 1900."
        de-AT: "Die Tomate hieß lange Liebesapfel, Paradiesapfel oder Goldapfel. Um 1900 kamen die ersten Paradeiser auf die Wiener Märkte."
    - key: ornamental
      source: en-GB
      text:
        en-GB: "In much of Europe the tomato was first grown as an ornamental, because people knew it was related to the nightshades and assumed it was poisonous."
        de-AT: "In weiten Teilen Europas zog man Paradeiser zuerst als Zierpflanzen, weil man wusste, dass sie mit Nachtschatten verwandt sind, und sie für giftig hielt."
    - key: uniform-red
      source: en-GB
      text:
        en-GB: "Modern tomatoes were bred to ripen evenly red, and that breeding goal has cost the fruit some of its sweetness and flavour."
        de-AT: "Moderne Paradeiser wurden auf gleichmäßig rote Reife gezüchtet, und genau das hat die Früchte einen Teil ihrer Süße und ihres Aromas gekostet."

- ingredient: cherry_tomato
  articles:
    en-GB: {title: "Cherry tomato", revision: 1383438772}
    de-AT: {title: "Tomate", revision: 270762773}
  facts:
    - key: wild-mix
      source: en-GB
      text:
        en-GB: "Cherry tomatoes are thought to be a genetic mix between wild currant tomatoes and domesticated garden tomatoes, close to the ancestors of all tomatoes."
        de-AT: "Cocktailparadeiser gelten als genetische Mischung aus wilden Johannisbeertomaten und Kulturtomaten und stehen den Urformen aller Paradeiser nahe."
    - key: grape-tomato
      source: en-GB
      text:
        en-GB: "Cherry tomatoes can be orange, yellow, green, purple or black as well as red. The oblong ones resemble plum tomatoes and are sold as grape tomatoes."
        de-AT: "Cocktailparadeiser gibt es nicht nur rot, sondern auch orange, gelb, grün, violett und schwarz. Die länglichen ähneln Eierparadeisern und heißen Traubentomaten."

- ingredient: cucumber
  articles:
    en-GB: {title: "Cucumber", revision: 1387260423}
    de-AT: {title: "Gurke", revision: 271325267}
  facts:
    - key: tiberius
      source: en-GB
      text:
        en-GB: "Cucumbers have been grown for at least 3,000 years. The Roman emperor Tiberius ate them all year round, and Charlemagne had them grown for him."
        de-AT: "Gurken werden seit mindestens 3.000 Jahren angebaut. Kaiser Tiberius aß sie das ganze Jahr über, und Karl der Große ließ sie für sich ziehen."
    - key: umurken
      source: de-AT
      text:
        en-GB: "In eastern Bavaria and Austria the dialect word for cucumber was Umurken, while further west Guckummer or Kukumer, from the Latin cucumis, was common."
        de-AT: "Im östlichen Bayern und in Österreich sagte man mundartlich Umurken, weiter westlich Guckummer oder Kukumer, nach dem lateinischen cucumis."
    - key: cucurbitacin
      source: en-GB
      text:
        en-GB: "The slight bitterness of cucumber skin comes from cucurbitacins, compounds the plant probably makes to defend itself."
        de-AT: "Die leichte Bitterkeit der Gurkenschale kommt von Cucurbitacinen, die die Pflanze vermutlich zur Abwehr bildet."

- ingredient: zucchini
  articles:
    en-GB: {title: "Zucchini", revision: 1386454595}
    de-AT: {title: "Zucchini", revision: 272091799}
  facts:
    - key: milan
      source: en-GB
      text:
        en-GB: "Squashes were domesticated in Mexico and Central America over 7,000 years ago, but the courgette itself was bred in Milan in the late 19th century."
        de-AT: "Kürbisse wurden vor über 7.000 Jahren in Mexiko und Mittelamerika domestiziert. Die Zucchini selbst entstand aber erst im späten 19. Jahrhundert in Mailand."
    - key: little-gourd
      source: en-GB
      text:
        en-GB: "Zucchini is the Italian plural of zucchino, meaning little gourd. Left on the plant, a courgette keeps growing and becomes a marrow."
        de-AT: "Zucchini ist die italienische Mehrzahl von zucchino, kleiner Kürbis. Bleibt die Frucht an der Pflanze, wächst sie weiter und wird zum Gemüsekürbis."

- ingredient: aubergine
  articles:
    en-GB: {title: "Eggplant", revision: 1384608579}
    de-AT: {title: "Aubergine", revision: 271158119}
  facts:
    - key: white-eggs
      source: en-GB
      text:
        en-GB: "The American name eggplant, first recorded in 1763, originally described white varieties that look remarkably like hen's eggs."
        de-AT: "Der englische Name eggplant, erstmals 1763 belegt, bezog sich ursprünglich auf weiße Sorten, die Hühnereiern verblüffend ähnlich sehen."
    - key: old-world
      source: en-GB
      text:
        en-GB: "Unlike its relatives the tomato, potato and chilli, which come from the Americas, the aubergine is a Eurasian plant, probably domesticated twice, in South and East Asia."
        de-AT: "Anders als ihre Verwandten Paradeiser, Erdapfel und Chili stammt die Melanzani nicht aus Amerika, sondern aus Eurasien und wurde wohl zweimal domestiziert, in Süd- und Ostasien."
    - key: sponge
      source: en-GB
      text:
        en-GB: "The spongy flesh of an aubergine soaks up oil and flavours during cooking, which is the main reason it is so useful in the kitchen."
        de-AT: "Das schwammige Fruchtfleisch der Melanzani saugt beim Kochen Öl und Aromen auf. Genau das macht sie in der Küche so vielseitig."

- ingredient: bell_pepper_red
  articles:
    en-GB: {title: "Bell pepper", revision: 1387588130}
    de-AT: {title: "Spanischer Pfeffer", revision: 263923305}
  facts:
    - key: ripe-green
      source: en-GB
      text:
        en-GB: "A red pepper is simply a green pepper left to ripen. Only a few varieties, such as Permagreen, stay green when fully ripe."
        de-AT: "Ein roter Paprika ist einfach ein grüner, der ausreifen durfte. Nur wenige Sorten wie ‚Permagreen‘ bleiben auch reif grün."
    - key: spain-1493
      source: en-GB
      text:
        en-GB: "Peppers come from Mexico, Central America, the Caribbean and northern South America. Their seeds reached Spain in 1493 and spread from there across Europe and Asia."
        de-AT: "Paprika stammt aus Mexiko, Mittelamerika, der Karibik und dem Norden Südamerikas. Die Samen kamen 1493 nach Spanien und verbreiteten sich von dort über Europa und Asien."

- ingredient: bell_pepper_green
  articles:
    en-GB: {title: "Bell pepper", revision: 1387588130}
    de-AT: {title: "Spanischer Pfeffer", revision: 263923305}
  facts:
    - key: unripe
      source: en-GB
      text:
        en-GB: "Green peppers are usually just unripe fruit. Unripe peppers are less often pale yellow or purple, and they change colour as they ripen."
        de-AT: "Grüne Paprika sind meist einfach unreife Früchte. Seltener sind unreife Schoten blassgelb oder violett, beim Reifen wechseln sie dann die Farbe."
    - key: mango
      source: en-GB
      text:
        en-GB: "In parts of the American Midwest, bell peppers have traditionally been called mangoes."
        de-AT: "In Teilen des amerikanischen Mittleren Westens nennt man Gemüsepaprika traditionell „mango“."

- ingredient: bell_pepper_yellow
  articles:
    en-GB: {title: "Bell pepper", revision: 1387588130}
    de-AT: {title: "Spanischer Pfeffer", revision: 263923305}
  facts:
    - key: colours
      source: en-GB
      text:
        en-GB: "All bell peppers belong to one group of Capsicum annuum, yet cultivars come in red, yellow, orange, green, white and purple."
        de-AT: "Alle Gemüsepaprika gehören zu einer Sortengruppe von Capsicum annuum, und doch gibt es Sorten in Rot, Gelb, Orange, Grün, Weiß und Violett."
    - key: stoplight
      source: en-GB
      text:
        en-GB: "Red, yellow and green peppers are often packed together as a tricolour or stoplight mix, and fruit caught mid-ripening can show several colours at once."
        de-AT: "Rote, gelbe und grüne Paprika werden oft als „Ampelmix“ zusammen verkauft. Früchte mitten in der Reife können sogar mehrere Farben zugleich zeigen."

- ingredient: chili
  articles:
    en-GB: {title: "Chili pepper", revision: 1386970586}
    de-AT: {title: "Paprika", revision: 269332835}
  facts:
    - key: birds
      source: en-GB
      text:
        en-GB: "Capsaicin is the plant's defence against mammals. Birds lack the pain receptor it targets, so they can eat even very hot chillies."
        de-AT: "Capsaicin schützt die Pflanze vor Säugetieren. Vögeln fehlt der passende Schmerzrezeptor, deshalb fressen sie auch sehr scharfe Pfefferoni."
    - key: pimientos
      source: en-GB
      text:
        en-GB: "Columbus and his crew called the fruits pimientos, peppers, because they were as pungent as black pepper, although the two plants are unrelated."
        de-AT: "Kolumbus und seine Leute nannten die Früchte pimientos, also Pfeffer, weil sie so scharf waren wie schwarzer Pfeffer. Verwandt sind die Pflanzen aber nicht."
    - key: five-species
      source: en-GB
      text:
        en-GB: "Chillies were first cultivated in Mexico, and five Capsicum species are widely grown today: annuum, baccatum, chinense, frutescens and pubescens."
        de-AT: "Chilis wurden zuerst in Mexiko kultiviert. Heute baut man vor allem fünf Capsicum-Arten an: annuum, baccatum, chinense, frutescens und pubescens."

- ingredient: pumpkin
  articles:
    en-GB: {title: "Pumpkin", revision: 1387969462}
    de-AT: {title: "Gartenkürbis", revision: 261616315}
  facts:
    - key: record
      source: en-GB
      text:
        en-GB: "The heaviest pumpkin on record, grown in October 2023, weighed 1,246.9 kilograms."
        de-AT: "Der schwerste je gemessene Kürbis wog im Oktober 2023 stolze 1.246,9 Kilogramm."
    - key: styrian-oil
      source: de-AT
      text:
        en-GB: "Styrian pumpkin seed oil comes mostly from the Styrian oil pumpkin, whose seeds are naked, with only a thin membrane instead of a hard shell."
        de-AT: "Steirisches Kürbiskernöl stammt meist vom Steirischen Ölkürbis. Seine Kerne sind „nackt“ und haben statt einer harten Schale nur ein dünnes Häutchen."
    - key: turnip-lanterns
      source: en-GB
      text:
        en-GB: "Carved jack-o'-lanterns grew out of an older custom in Ireland, Scotland and elsewhere in Britain of carving lanterns from turnips, mangelwurzels or swedes."
        de-AT: "Geschnitzte Halloween-Kürbisse gehen auf einen älteren Brauch in Irland, Schottland und anderen Teilen Großbritanniens zurück, Laternen aus Rüben zu schnitzen."

- ingredient: butternut
  articles:
    en-GB: {title: "Butternut squash", revision: 1383814946}
    de-AT: {title: "Moschus-Kürbis", revision: 264282591}
  facts:
    - key: leggett-1944
      source: en-GB
      text:
        en-GB: "Butternut squash was developed in 1944 by Charles Leggett of Stow, Massachusetts, who crossed pumpkin with gooseneck squash."
        de-AT: "Der Butternusskürbis wurde 1944 von Charles Leggett aus Stow in Massachusetts gezüchtet, der Kürbis mit Gooseneck-Squash kreuzte."
    - key: askutasquash
      source: en-GB
      text:
        en-GB: "The word squash comes from the Narragansett askutasquash, meaning eaten raw or uncooked."
        de-AT: "Das englische Wort squash kommt vom Narragansett-Wort askutasquash, das „roh gegessen“ bedeutet."

- ingredient: hokkaido
  articles:
    en-GB: {title: "Red kuri squash", revision: 1382436873}
    de-AT: {title: "Hokkaidokürbis", revision: 266412782}
  facts:
    - key: eat-the-skin
      source: de-AT
      text:
        en-GB: "Unlike most pumpkins, the thin skin of a Hokkaido softens during cooking and can simply be eaten along with the flesh."
        de-AT: "Anders als bei den meisten Kürbissen wird die dünne Schale des Hokkaido beim Kochen weich und kann einfach mitgegessen werden."
    - key: hubbard-1878
      source: de-AT
      text:
        en-GB: "In 1878 American farm advisers brought the Hubbard squash to Japan. On Hokkaido it was bred into Kuri aji, which means chestnut flavour."
        de-AT: "1878 brachten amerikanische Agrarberater den Hubbard-Kürbis nach Japan. Auf Hokkaidō wurde daraus die Sorte Kuri aji gezüchtet, was „Kastaniengeschmack“ heißt."
    - key: onion-squash
      source: en-GB
      text:
        en-GB: "In France this squash is called potimarron and in the United Kingdom onion squash, while in Japan kuri can mean either the squash or a chestnut."
        de-AT: "In Frankreich heißt dieser Kürbis potimarron, in Großbritannien onion squash. Im Japanischen kann kuri den Kürbis oder die Kastanie meinen."

- ingredient: broccoli
  articles:
    en-GB: {title: "Broccoli", revision: 1382943068}
    de-AT: {title: "Brokkoli", revision: 272224572}
  facts:
    - key: little-nail
      source: en-GB
      text:
        en-GB: "The word broccoli comes from the Italian for the flowering crest of a cabbage, a diminutive of brocco, which means small nail or sprout."
        de-AT: "Das Wort Brokkoli kommt aus dem Italienischen und bezeichnet den blühenden Schopf eines Kohls. Es ist eine Verkleinerung von brocco, kleiner Nagel oder Spross."
    - key: italian-immigrants
      source: en-GB
      text:
        en-GB: "Broccoli had spread to northern Europe by the 18th century, but it only reached North America in the 19th century with Italian immigrants."
        de-AT: "Im 18. Jahrhundert war Brokkoli schon in Nordeuropa verbreitet, nach Nordamerika kam er erst im 19. Jahrhundert mit italienischen Einwanderern."

- ingredient: cauliflower
  articles:
    en-GB: {title: "Cauliflower", revision: 1386615204}
    de-AT: {title: "Blumenkohl", revision: 271664816}
  facts:
    - key: curd
      source: en-GB
      text:
        en-GB: "The white head of a cauliflower is a dense mass of undeveloped flower buds, called the curd because it looks like cheese curd."
        de-AT: "Der weiße Kopf des Karfiols ist eine dichte Masse unentwickelter Blütenknospen. Auf Englisch heißt er curd, weil er an Käsebruch erinnert."
    - key: caulis-flos
      source: en-GB
      text:
        en-GB: "The name cauliflower goes back to the Latin words caulis, cabbage, and flos, flower."
        de-AT: "Der englische Name cauliflower geht auf die lateinischen Wörter caulis, Kohl, und flos, Blume, zurück, genau wie das deutsche Blumenkohl."

- ingredient: white_cabbage
  articles:
    en-GB: {title: "Cabbage", revision: 1384003797}
    de-AT: {title: "Kopfkohl", revision: 261316229}
  facts:
    - key: cap-head
      source: en-GB
      text:
        en-GB: "Many European and Asian words for cabbage come from an old root cap or kap meaning head, and the variety name capitata is Latin for having a head."
        de-AT: "Viele europäische und asiatische Wörter für Kohl stammen von einer alten Wurzel cap oder kap, die Kopf bedeutet. Auch der Sortenname capitata heißt „mit Kopf“."
    - key: scurvy
      source: en-GB
      text:
        en-GB: "European sailors took cabbage on long sea voyages to ward off scurvy."
        de-AT: "Europäische Seefahrer nahmen Kraut auf lange Reisen mit, um Skorbut vorzubeugen."
    - key: wax
      source: de-AT
      text:
        en-GB: "The outer leaves of white cabbage are coated with wax, which gives them their yellowish green shade."
        de-AT: "Die äußeren Blätter des Weißkrauts sind mit Wachs überzogen und darum gelbgrün."

- ingredient: red_cabbage
  articles:
    en-GB: {title: "Red cabbage", revision: 1376469229}
    de-AT: {title: "Rotkohl", revision: 270543872}
  facts:
    - key: ph-indicator
      source: en-GB
      text:
        en-GB: "Red cabbage juice works as a homemade pH indicator: it turns red in acid and green or yellow in alkaline solutions."
        de-AT: "Rotkrautsaft ist ein Indikator zum Selbermachen: In Säure färbt er sich rot, in basischen Lösungen grün oder gelb."
    - key: vinegar
      source: en-GB
      text:
        en-GB: "Cooked red cabbage normally turns blue, which is why recipes add vinegar or sour fruit to keep its red colour."
        de-AT: "Beim Kochen wird Rotkraut normalerweise blau. Darum kommen Essig oder säuerliches Obst in den Topf, damit es rot bleibt."
    - key: blaukraut
      source: de-AT
      text:
        en-GB: "Whether you say Rotkraut or Blaukraut depends on region: both are used in Austria, and the pigment really does shift between red and blue with soil and cooking."
        de-AT: "Ob Rotkraut oder Blaukraut, hängt von der Gegend ab, in Österreich sagt man beides. Der Farbstoff schwankt je nach Boden und Zubereitung tatsächlich zwischen Rot und Blau."

- ingredient: savoy_cabbage
  articles:
    en-GB: {title: "Savoy cabbage", revision: 1314867933}
    de-AT: {title: "Wirsing", revision: 270956751}
  facts:
    - key: austrian-kohl
      source: de-AT
      text:
        en-GB: "In standard German the crinkly cabbage is Wirsing, but in Austria it is simply called Kohl, and in Switzerland Wirz."
        de-AT: "Im Bundesdeutschen heißt das krause Gemüse Wirsing. In Österreich sagt man einfach Kohl, in der Schweiz Wirz."
    - key: savoy-milan
      source: en-GB
      text:
        en-GB: "Savoy cabbage is named after the Savoy region, but it is also called Milan or Lombard cabbage, since it probably comes from northern Italy."
        de-AT: "Der Kohl ist nach der Region Savoyen benannt, heißt aber auch Mailänder Kohl, denn er stammt vermutlich aus Norditalien."

- ingredient: chinese_cabbage
  articles:
    en-GB: {title: "Napa cabbage", revision: 1386492005}
    de-AT: {title: "Chinakohl", revision: 255458396}
  facts:
    - key: nappa
      source: en-GB
      text:
        en-GB: "The name napa comes from the Japanese nappa, a word for the leaves of any vegetable, while the Chinese name báicài simply means white vegetable."
        de-AT: "Der englische Name napa kommt vom japanischen nappa, einem Wort für Gemüseblätter allgemein. Der chinesische Name báicài heißt einfach „weißes Gemüse“."
    - key: beijing
      source: en-GB
      text:
        en-GB: "Chinese cabbage originated near Beijing and only became a common crop in Europe, the Americas and Australia during the 20th century."
        de-AT: "Chinakohl stammt aus der Gegend um Peking und wird erst seit dem 20. Jahrhundert auch in Europa, Amerika und Australien verbreitet angebaut."

- ingredient: pak_choi
  articles:
    en-GB: {title: "Bok choy", revision: 1386872053}
    de-AT: {title: "Pak Choi", revision: 267186169}
  facts:
    - key: little-white
      source: en-GB
      text:
        en-GB: "Bok choy comes from the Cantonese for white vegetable. The small kind is siu bok choy, while dai bok choy, big white vegetable, means napa cabbage."
        de-AT: "Pak Choi kommt aus dem Kantonesischen und heißt „weißes Gemüse“. Der kleine heißt siu bok choy, dai bok choy, „großes weißes Gemüse“, meint den Chinakohl."
    - key: no-head
      source: en-GB
      text:
        en-GB: "Pak choi never forms a head. Its flavour is often described as somewhere between spinach and water chestnut, with a slightly peppery note."
        de-AT: "Pak Choi bildet nie einen Kopf. Sein Geschmack wird oft als irgendwo zwischen Spinat und Wasserkastanie beschrieben, mit leicht pfeffriger Note."

- ingredient: brussels_sprouts
  articles:
    en-GB: {title: "Brussels sprout", revision: 1386594513}
    de-AT: {title: "Rosenkohl", revision: 270575511}
  facts:
    - key: brussels-13th
      source: en-GB
      text:
        en-GB: "Brussels sprouts take their name from Brussels, near which they were grown possibly as early as the 13th century. The group name gemmifera means bud-bearing."
        de-AT: "Kohlsprossen sind nach Brüssel benannt, in dessen Umgebung sie vielleicht schon im 13. Jahrhundert angebaut wurden. Der Sortenname gemmifera heißt „Knospen tragend“."
    - key: kohlsprossen
      source: de-AT
      text:
        en-GB: "Austrian German calls them Kohlsprossen or Sprossenkohl. Growers leave the green leaves on the stalk because they protect the sprouts from frost."
        de-AT: "Im österreichischen Deutsch heißen sie Kohlsprossen oder Sprossenkohl. Die grünen Blätter bleiben am Strunk, weil sie die Röschen vor Frost schützen."

- ingredient: kale
  articles:
    en-GB: {title: "Kale", revision: 1387284595}
    de-AT: {title: "Grünkohl", revision: 272085638}
  facts:
    - key: caulis
      source: en-GB
      text:
        en-GB: "The word kale comes from northern Middle English cale, a relative of Scots kail and German Kohl, and goes back to the Latin caulis, cabbage."
        de-AT: "Das englische kale stammt vom nordmittelenglischen cale ab, verwandt mit schottisch kail und deutsch Kohl, und geht auf das lateinische caulis zurück."
    - key: schaffermahlzeit
      source: de-AT
      text:
        en-GB: "In Bremen, kale has been served every year since 1545 at the Schaffermahlzeit, a February banquet for merchants, sea captains and guests."
        de-AT: "In Bremen gibt es Grünkohl seit 1545 jedes Jahr bei der Schaffermahlzeit, einem Festessen im Februar für Kaufleute, Kapitäne und Gäste."

- ingredient: spinach
  articles:
    en-GB: {title: "Spinach", revision: 1388152521}
    de-AT: {title: "Spinat", revision: 270356574}
  facts:
    - key: iron-myth
      source: de-AT
      text:
        en-GB: "Spinach's legendary iron content is a myth: the figures were mixed up between dried and fresh spinach. Fresh leaves contain about 3.5 mg per 100 g."
        de-AT: "Der sagenhafte Eisengehalt von Spinat ist ein Irrtum, man verwechselte die Werte von getrocknetem und frischem Spinat. Frisch sind es etwa 3,5 mg pro 100 g."
    - key: persian-word
      source: en-GB
      text:
        en-GB: "The word spinach travelled from Persian aspānāḵ through Andalusian Arabic isbinakh into medieval Latin spinagium."
        de-AT: "Das Wort Spinat wanderte vom persischen aspānāḵ über das andalusisch-arabische isbinakh ins mittelalterliche Latein als spinagium."
    - key: florentine
      source: en-GB
      text:
        en-GB: "In classical French cuisine, a dish made with spinach may be called à la Florentine."
        de-AT: "In der klassischen französischen Küche nennt man ein Gericht mit Spinat gern à la Florentine."

- ingredient: chard
  articles:
    en-GB: {title: "Chard", revision: 1380658202}
    de-AT: {title: "Mangold", revision: 270514834}
  facts:
    - key: same-as-beet
      source: en-GB
      text:
        en-GB: "Chard is the same species as beetroot, bred for its leaves and stalks rather than its root, which is why it is also called leaf beet or perpetual spinach."
        de-AT: "Mangold ist dieselbe Art wie die Rote Rübe, nur auf Blätter und Stiele statt auf die Wurzel gezüchtet. Darum heißt er auf Englisch auch leaf beet."
    - key: sea-beet
      source: de-AT
      text:
        en-GB: "Chard descends from the wild sea beet that grows along coastlines, and is related to sugar beet, fodder beet and beetroot."
        de-AT: "Mangold stammt von der Wilden Rübe ab, die an Küstensäumen wächst, und ist mit Zuckerrübe, Futterrübe und Roter Rübe verwandt."

- ingredient: lettuce
  articles:
    en-GB: {title: "Lettuce", revision: 1383446612}
    de-AT: {title: "Gartensalat", revision: 269091673}
  facts:
    - key: lac-milk
      source: en-GB
      text:
        en-GB: "The Romans named lettuce after lac, milk, because of the white latex that oozes from cut stems. Breeding has since reduced this latex."
        de-AT: "Die Römer benannten den Salat nach lac, Milch, wegen des weißen Milchsafts, der aus angeschnittenen Stängeln tritt. Die Züchtung hat ihn seither verringert."
    - key: egypt-oil
      source: en-GB
      text:
        en-GB: "Ancient Egyptians first grew lettuce for oil from its seeds. Depictions of lettuce growing in Egypt date back to 2680 BC."
        de-AT: "Die alten Ägypter bauten Salat zuerst wegen des Öls aus seinen Samen an. Darstellungen des Salatanbaus in Ägypten reichen bis 2680 v. Chr. zurück."

- ingredient: romaine
  articles:
    en-GB: {title: "Romaine lettuce", revision: 1381258505}
    de-AT: {title: "Römersalat", revision: 260874256}
  facts:
    - key: cos
      source: en-GB
      text:
        en-GB: "British English calls romaine cos lettuce, a name many dictionaries trace to the Greek island of Kos, though some link it to the Arabic word for lettuce."
        de-AT: "Im britischen Englisch heißt Römersalat cos lettuce, was viele auf die griechische Insel Kos zurückführen. Andere sehen darin das arabische Wort für Salat."
    - key: heat-tolerant
      source: en-GB
      text:
        en-GB: "Unlike most lettuces, romaine copes well with heat, and it grows tall with sturdy dark leaves and firm central ribs."
        de-AT: "Anders als die meisten Salate verträgt Römersalat Hitze gut. Er wächst hoch, mit kräftigen dunklen Blättern und festen Mittelrippen."

- ingredient: rocket
  articles:
    en-GB: {title: "Eruca sativa", revision: 1386435361}
    de-AT: {title: "Senfrauke", revision: 267250554}
  facts:
    - key: caterpillar
      source: en-GB
      text:
        en-GB: "The name rocket came via French roquette from Italian ruchetta, a diminutive of ruca, from the Latin eruca, which means caterpillar."
        de-AT: "Der englische Name rocket kam über das französische roquette vom italienischen ruchetta, einer Verkleinerung von ruca, aus dem lateinischen eruca, Raupe."
    - key: wild-rocket
      source: en-GB
      text:
        en-GB: "Rocket is often confused with perennial wall rocket, Diplotaxis tenuifolia, a different plant of the same family that is used the same way."
        de-AT: "Rucola wird oft mit der Schmalblättrigen Doppelsame verwechselt, Diplotaxis tenuifolia, einer anderen Pflanze derselben Familie, die genauso verwendet wird."
    - key: ancient-crop
      source: de-AT
      text:
        en-GB: "Rocket has been grown as a crop since Greek and Roman antiquity."
        de-AT: "Die Senfrauke, unsere Rucola, wird schon seit der griechischen und römischen Antike als Kulturpflanze genutzt."

- ingredient: lambs_lettuce
  articles:
    en-GB: {title: "Valeriana locusta", revision: 1368455239}
    de-AT: {title: "Gewöhnlicher Feldsalat", revision: 269719092}
  facts:
    - key: vogerlsalat
      source: de-AT
      text:
        en-GB: "What Germans call Feldsalat is Vogerlsalat in Austria and Nüsslisalat in Switzerland, and dialects add names like Mausohrsalat and Rapunzel."
        de-AT: "Was in Deutschland Feldsalat heißt, ist in Österreich der Vogerlsalat und in der Schweiz der Nüsslisalat. Mundartlich heißt er auch Mausohrsalat oder Rapunzel."
    - key: honeysuckle
      source: en-GB
      text:
        en-GB: "Lamb's lettuce is not related to lettuce at all. It belongs to the honeysuckle family and is a hardy winter green."
        de-AT: "Vogerlsalat ist mit dem Gartensalat gar nicht verwandt. Er gehört zu den Geißblattgewächsen und ist ein winterhartes Blattgemüse."

- ingredient: radicchio
  articles:
    en-GB: {title: "Radicchio", revision: 1371618507}
    de-AT: {title: "Radicchio", revision: 269028840}
  facts:
    - key: van-den-borre
      source: en-GB
      text:
        en-GB: "Today's deep red radicchio was created in 1860 by the Belgian agronomist Francesco Van den Borre using a blanching technique called imbianchimento."
        de-AT: "Den heutigen tiefroten Radicchio schuf 1860 der belgische Agronom Francesco Van den Borre mit einer Bleichtechnik namens imbianchimento."
    - key: named-by-town
      source: en-GB
      text:
        en-GB: "Radicchio varieties are named after their home areas, such as Chioggia and Treviso. The protected Chioggia area covers just ten towns."
        de-AT: "Radicchio-Sorten tragen die Namen ihrer Herkunftsorte wie Chioggia oder Treviso. Das geschützte Gebiet für Chioggia umfasst nur zehn Gemeinden."

- ingredient: fennel
  articles:
    en-GB: {title: "Fennel", revision: 1381053442}
    de-AT: {title: "Fenchel", revision: 269375366}
  facts:
    - key: marathon
      source: en-GB
      text:
        en-GB: "The Greek word for fennel is marathon, so the site of the famous battle of Marathon literally means a plain of fennel."
        de-AT: "Fenchel heißt auf Griechisch marathon. Der Ort der berühmten Schlacht von Marathon bedeutet also wörtlich „Fenchelfeld“."
    - key: prometheus
      source: en-GB
      text:
        en-GB: "In Hesiod's Theogony, Prometheus smuggles fire down from Mount Olympus inside a hollow fennel stalk."
        de-AT: "In Hesiods Theogonie schmuggelt Prometheus das Feuer in einem hohlen Fenchelstängel vom Olymp."
    - key: absinthe
      source: en-GB
      text:
        en-GB: "Together with the similar-tasting anise, fennel is one of the main ingredients of absinthe. The vegetable bulb is a swollen stem base bred into Florence fennel."
        de-AT: "Zusammen mit dem ähnlich schmeckenden Anis gehört Fenchel zu den Hauptzutaten von Absinth. Die Gemüseknolle ist ein verdickter Stängelgrund des Florentiner Fenchels."

- ingredient: asparagus_green
  articles:
    en-GB: {title: "Asparagus", revision: 1385979379}
    de-AT: {title: "Gemüsespargel", revision: 272189411}
  facts:
    - key: china-87
      source: en-GB
      text:
        en-GB: "China grew 87 per cent of the world's asparagus in 2024, out of a total harvest of 8.9 million tonnes."
        de-AT: "China erntete 2024 rund 87 Prozent des weltweiten Spargels, bei einer Gesamternte von 8,9 Millionen Tonnen."
    - key: cladodes
      source: en-GB
      text:
        en-GB: "The feathery 'leaves' of a grown asparagus plant are not leaves at all but needle-like modified stems called cladodes."
        de-AT: "Das fedrige „Laub“ einer ausgewachsenen Spargelpflanze besteht gar nicht aus Blättern, sondern aus nadelförmigen, umgebildeten Sprossen, den Phyllokladien."
    - key: salt-tolerant
      source: en-GB
      text:
        en-GB: "Asparagus often comes from coastal habitats, so it thrives in soils too salty for ordinary weeds."
        de-AT: "Spargel stammt oft von Küstenstandorten und gedeiht darum in Böden, die für gewöhnliche Unkräuter zu salzig sind."

- ingredient: asparagus_white
  articles:
    en-GB: {title: "Asparagus", revision: 1385979379}
    de-AT: {title: "Gemüsespargel", revision: 272189411}
  facts:
    - key: no-light
      source: en-GB
      text:
        en-GB: "White asparagus is grown by heaping soil over the shoots as they grow. Without sunlight there is no photosynthesis, so the spears stay white."
        de-AT: "Weißer Spargel entsteht, indem man die Triebe beim Wachsen mit Erde anhäuft. Ohne Sonnenlicht findet keine Fotosynthese statt, und die Stangen bleiben weiß."
    - key: 24-june
      source: en-GB
      text:
        en-GB: "The German asparagus season traditionally ends on 24 June, and roadside stands then sell about half of the country's white asparagus."
        de-AT: "Die Spargelzeit in Deutschland endet traditionell am 24. Juni. Straßenstände und Märkte verkaufen dort etwa die Hälfte des weißen Spargels."
    - key: goldgebener
      source: de-AT
      text:
        en-GB: "White, green and purple asparagus are often a matter of harvesting, not variety. Goldgebener is an old Austrian variety grown mainly for white spears."
        de-AT: "Weiß, grün oder violett ist beim Spargel oft eine Frage der Ernte, nicht der Sorte. Der Goldgebener ist eine alte österreichische Sorte, vor allem für Bleichspargel."

- ingredient: green_beans
  articles:
    en-GB: {title: "Green bean", revision: 1387375152}
    de-AT: {title: "Gartenbohne", revision: 271599534}
  facts:
    - key: string-beans
      source: en-GB
      text:
        en-GB: "Green beans are the unripe pods of the common bean. They are still called string beans, although most modern varieties have been bred stringless."
        de-AT: "Fisolen sind die unreifen Hülsen der Gartenbohne. Auf Englisch heißen sie noch string beans, obwohl die meisten modernen Sorten keine Fäden mehr haben."
    - key: phasin
      source: de-AT
      text:
        en-GB: "Raw beans contain the lectin phasin, which is poisonous to humans. Cooking destroys it, which is why Fisolen are always eaten cooked."
        de-AT: "Rohe Bohnen enthalten das Lektin Phasin, das für Menschen giftig ist. Beim Kochen wird es zerstört, darum isst man Fisolen immer gegart."

- ingredient: peas
  articles:
    en-GB: {title: "Pea", revision: 1387252718}
    de-AT: {title: "Erbse", revision: 272091617}
  facts:
    - key: mendel
      source: de-AT
      text:
        en-GB: "Between 1856 and 1863 the monk Gregor Mendel crossed pea plants and discovered the rules of inheritance named after him."
        de-AT: "Zwischen 1856 und 1863 kreuzte der Mönch Gregor Mendel Erbsen und entdeckte dabei die nach ihm benannten Vererbungsregeln."
    - key: theophrastus
      source: en-GB
      text:
        en-GB: "In the early 3rd century BC, Theophrastus listed peas among the legumes sown late in winter because they were so tender."
        de-AT: "Schon im frühen 3. Jahrhundert v. Chr. zählte Theophrast Erbsen zu den Hülsenfrüchten, die man ihrer Zartheit wegen erst spät im Winter sät."
    - key: linnaeus
      source: en-GB
      text:
        en-GB: "Linnaeus named the pea Pisum sativum, cultivated pea, in 1753. Some botanists now call it Lathyrus oleraceus, though the change is disputed."
        de-AT: "Linné gab der Erbse 1753 den Namen Pisum sativum, „angebaute Erbse“. Manche Botaniker nennen sie heute Lathyrus oleraceus, doch das ist umstritten."

- ingredient: corn
  articles:
    en-GB: {title: "Sweet corn", revision: 1386864528}
    de-AT: {title: "Zuckermais", revision: 271263949}
  facts:
    - key: mutation
      source: en-GB
      text:
        en-GB: "Sweet corn exists because of a natural recessive mutation that slows the conversion of sugar into starch inside the kernel."
        de-AT: "Zuckermais verdankt seine Süße einer natürlichen rezessiven Mutation, die die Umwandlung von Zucker in Stärke im Korn bremst."
    - key: papoon
      source: en-GB
      text:
        en-GB: "The first recorded sweet corn grown for European settlers came from the Iroquois in 1779, a variety called Papoon."
        de-AT: "Den ersten belegten Zuckermais für europäische Siedler bauten 1779 die Irokesen an, eine Sorte namens „Papoon“."
    - key: milk-stage
      source: en-GB
      text:
        en-GB: "Sweet corn is picked at the milk stage, while still immature. Its sugar turns to starch as it ages, so it must be eaten fresh, canned or frozen quickly."
        de-AT: "Zuckermais wird unreif in der Milchreife geerntet. Danach wandelt sich sein Zucker in Stärke um, darum muss er rasch gegessen, eingemacht oder eingefroren werden."

- ingredient: mushroom
  articles:
    en-GB: {title: "Agaricus bisporus", revision: 1381073283}
    de-AT: {title: "Zucht-Champignon", revision: 269145087}
  facts:
    - key: same-species
      source: en-GB
      text:
        en-GB: "Button mushrooms, chestnut mushrooms and portobellos are all the same species, Agaricus bisporus, sold at different colours and stages of maturity."
        de-AT: "Weiße Champignons, braune Champignons und Portobellos gehören alle zur selben Art, Agaricus bisporus, und werden nur in unterschiedlicher Farbe und Reife verkauft."
    - key: pasteur-spawn
      source: en-GB
      text:
        en-GB: "Early mushroom growing was a gamble with contaminated spawn until the Pasteur Institute in Paris produced sterile pure-culture spawn in 1893."
        de-AT: "Lange war die Champignonzucht ein Glücksspiel mit verunreinigter Pilzbrut, bis das Institut Pasteur in Paris 1893 sterile Reinkulturen herstellte."

- ingredient: porcini
  articles:
    en-GB: {title: "Boletus edulis", revision: 1380972864}
    de-AT: {title: "Gemeiner Steinpilz", revision: 271876512}
  facts:
    - key: hog-mushroom
      source: en-GB
      text:
        en-GB: "The Italian name porcino means piglet-like. It echoes suilli, hog mushrooms, the word the ancient Romans used for this fungus."
        de-AT: "Der italienische Name porcino bedeutet „Schweinchen“. Er erinnert an suilli, „Schweinepilze“, wie schon die alten Römer diesen Pilz nannten."
    - key: hard-to-farm
      source: en-GB
      text:
        en-GB: "Porcini live in partnership with tree roots, wrapping them in sheaths of fungal tissue, which is why the mushroom is very difficult to cultivate."
        de-AT: "Steinpilze leben in Symbiose mit Baumwurzeln, die sie mit einem Mantel aus Pilzgewebe umhüllen. Darum lassen sie sich kaum züchten."
    - key: herrenpilz
      source: de-AT
      text:
        en-GB: "German has several names for the porcino: besides Steinpilz it is called Herrenpilz or Edelpilz, and in eastern Bavaria and Bohemia Dobernickel."
        de-AT: "Der Steinpilz hat viele Namen: Herrenpilz, Edelpilz oder Fichten-Steinpilz, in Ostbayern und Böhmen auch Dobernickel."

- ingredient: chanterelle
  articles:
    en-GB: {title: "Cantharellus cibarius", revision: 1384679005}
    de-AT: {title: "Echter Pfifferling", revision: 270582472}
  facts:
    - key: protected
      source: de-AT
      text:
        en-GB: "The chanterelle is classed as endangered in Austria and is therefore protected in every federal state."
        de-AT: "Das Eierschwammerl gilt in Österreich als gefährdet und ist deshalb in allen Bundesländern geschützt."
    - key: eierschwammerl
      source: de-AT
      text:
        en-GB: "Austria and Bavaria call it Eierschwammerl or Reherl, Franconia says Gelberle and Switzerland Eierschwämmli, while standard German uses Pfifferling."
        de-AT: "In Österreich und Bayern heißt er Eierschwammerl oder Reherl, in Franken Gelberle, in der Schweiz Eierschwämmli und im Hochdeutschen Pfifferling."
    - key: apricot
      source: en-GB
      text:
        en-GB: "Golden chanterelles have a faint apricot aroma, and their Latin name cibarius simply means culinary."
        de-AT: "Eierschwammerl duften leicht nach Marille, und ihr lateinischer Beiname cibarius bedeutet schlicht „zum Essen“."

- ingredient: shiitake
  articles:
    en-GB: {title: "Shiitake", revision: 1375418776}
    de-AT: {title: "Shiitake", revision: 269984569}
  facts:
    - key: song-1209
      source: en-GB
      text:
        en-GB: "The earliest written record of shiitake cultivation dates from 1209, during China's Song dynasty."
        de-AT: "Die älteste schriftliche Erwähnung des Shiitake-Anbaus stammt aus dem Jahr 1209, aus der Zeit der Song-Dynastie in China."
    - key: shii-tree
      source: en-GB
      text:
        en-GB: "The Japanese name combines shii, the tree Castanopsis cuspidata on whose dead logs the mushroom is grown, with take, mushroom."
        de-AT: "Der japanische Name setzt sich aus shii zusammen, dem Baum Castanopsis cuspidata, auf dessen totem Holz der Pilz wächst, und take, Pilz."

- ingredient: avocado
  articles:
    en-GB: {title: "Avocado", revision: 1386870652}
    de-AT: {title: "Avocado", revision: 272333189}
  facts:
    - key: megafauna
      source: en-GB
      text:
        en-GB: "Some scientists think the avocado's huge seed evolved to be spread by giant animals that are now extinct, though others point out that agoutis and bears eat it too."
        de-AT: "Manche Forscher glauben, der riesige Avocadokern sei auf heute ausgestorbene Großtiere ausgerichtet gewesen. Andere wenden ein, dass auch Agutis und Bären Avocados fressen."
    - key: ripen-after
      source: en-GB
      text:
        en-GB: "Commercial avocados are picked while still unripe and only ripen after harvest."
        de-AT: "Avocados für den Handel werden unreif gepflückt und reifen erst nach der Ernte."
    - key: nahuatl
      source: en-GB
      text:
        en-GB: "The word avocado comes via Spanish from Nahuatl. A popular claim says it originally meant testicle, but that was only a later euphemistic use."
        de-AT: "Das Wort Avocado kam über das Spanische aus dem Nahuatl. Oft heißt es, es habe ursprünglich Hoden bedeutet, doch das war nur ein späterer verhüllender Gebrauch."

- ingredient: ginger
  articles:
    en-GB: {title: "Ginger", revision: 1375500055}
    de-AT: {title: "Ingwer", revision: 271935940}
  facts:
    - key: austronesian
      source: en-GB
      text:
        en-GB: "Ginger was probably first domesticated by Austronesian peoples, who carried it across the Indo-Pacific as far as Hawaii."
        de-AT: "Ingwer wurde vermutlich zuerst von austronesischen Völkern kultiviert, die ihn über den Indopazifik bis nach Hawaii mitnahmen."
    - key: early-spice
      source: en-GB
      text:
        en-GB: "Ginger was one of the first spices exported from Asia to Europe and was already used by the ancient Greeks and Romans. India grows about 45 per cent of it today."
        de-AT: "Ingwer war eines der ersten Gewürze, die aus Asien nach Europa kamen, und schon Griechen und Römer verwendeten ihn. Heute stammen etwa 45 Prozent aus Indien."
    - key: pseudostem
      source: en-GB
      text:
        en-GB: "The stalks of a ginger plant are false stems, made of rolled-up leaf bases, and the flowers sprout straight from the rhizome on separate shoots."
        de-AT: "Die Stängel der Ingwerpflanze sind Scheinstämme aus eingerollten Blattscheiden. Die Blüten treiben auf eigenen Sprossen direkt aus dem Wurzelstock."

- ingredient: bean_sprouts
  articles:
    en-GB: {title: "Mung bean", revision: 1376337437}
    de-AT: {title: "Mungbohne", revision: 272095384}
  facts:
    - key: not-soy
      source: de-AT
      text:
        en-GB: "Most so-called soy sprouts sold in German-speaking countries are actually mung bean sprouts. The name stuck because they look like real soybean sprouts."
        de-AT: "Was bei uns als Sojasprossen verkauft wird, sind meist Mungbohnensprossen. Der Name blieb hängen, weil sie echten Sojasprossen ähneln."
    - key: harappan
      source: en-GB
      text:
        en-GB: "The mung bean was domesticated in India. Charred beans from the Harappan civilisation are about 4,500 years old."
        de-AT: "Die Mungbohne wurde in Indien domestiziert. Verkohlte Bohnen aus der Harappa-Kultur sind etwa 4.500 Jahre alt."

- ingredient: artichoke
  articles:
    en-GB: {title: "Artichoke", revision: 1382935401}
    de-AT: {title: "Artischocke", revision: 271472163}
  facts:
    - key: thistle-bud
      source: en-GB
      text:
        en-GB: "An artichoke is the unopened flower bud of a thistle. Left to bloom, the head turns coarse and barely edible, with purple florets."
        de-AT: "Eine Artischocke ist die noch geschlossene Blütenknospe einer Distel. Lässt man sie aufblühen, bildet sie violette Blüten und wird hart und kaum essbar."
    - key: arabic-name
      source: en-GB
      text:
        en-GB: "The English word artichoke came from northern Italian articiocco in the 16th century, which in turn goes back to the Andalusi Arabic al-kharshūfa."
        de-AT: "Das englische artichoke wurde im 16. Jahrhundert aus dem norditalienischen articiocco entlehnt, das auf das andalusisch-arabische al-kharshūfa zurückgeht."
    - key: henry-viii
      source: en-GB
      text:
        en-GB: "The Dutch brought artichokes to England, where they grew in Henry VIII's garden at Newhall in 1530."
        de-AT: "Die Niederländer brachten die Artischocke nach England, wo sie 1530 im Garten Heinrichs VIII. in Newhall wuchs."

- ingredient: jerusalem_artichoke
  articles:
    en-GB: {title: "Jerusalem artichoke", revision: 1378057939}
    de-AT: {title: "Topinambur", revision: 271664447}
  facts:
    - key: sunflower
      source: en-GB
      text:
        en-GB: "The Jerusalem artichoke is neither from Jerusalem nor an artichoke. It is a sunflower species native to central North America, grown for its tubers."
        de-AT: "Topinambur ist eine Sonnenblumenart aus dem mittleren Nordamerika, die man wegen ihrer Knollen anbaut. Auf Englisch heißt sie trotzdem Jerusalem artichoke."
    - key: tupinamba
      source: de-AT
      text:
        en-GB: "The name Topinambur comes from the Tupinambá, an Indigenous people of Brazil whose envoys happened to be visiting France when the tuber arrived there."
        de-AT: "Der Name Topinambur stammt vom brasilianischen Volk der Tupinambá. Dessen Abgesandte waren gerade in Frankreich zu Besuch, als die Knolle dort ankam."
    - key: inulin
      source: en-GB
      text:
        en-GB: "The tubers store inulin, a fructose polymer. In storage it breaks down into fructose, which is about one and a half times as sweet as table sugar."
        de-AT: "Die Knollen speichern Inulin, eine Kette aus Fruchtzucker. Beim Lagern zerfällt es in Fruktose, die etwa eineinhalbmal so süß ist wie Haushaltszucker."

- ingredient: salsify
  articles:
    en-GB: {title: "Pseudopodospermum hispanicum", revision: 1379184088}
    de-AT: {title: "Garten-Schwarzwurzel", revision: 272091213}
  facts:
    - key: viper
      source: en-GB
      text:
        en-GB: "The name scorzonera most likely comes from the Catalan escurçonera, from escurçó, viper, and the plant is also called viper's grass."
        de-AT: "Der Name Scorzonera kommt wohl vom katalanischen escurçonera, abgeleitet von escurçó, Viper. Auf Englisch heißt die Pflanze auch viper's grass."
    - key: winterspargel
      source: de-AT
      text:
        en-GB: "Black salsify is nicknamed winter asparagus or poor man's asparagus. Its sticky, rubbery milky sap stains your hands brown, so peel it with gloves."
        de-AT: "Die Schwarzwurzel heißt auch Winterspargel oder Arme-Leute-Spargel. Der klebrige, kautschukhaltige Milchsaft färbt die Haut braun, darum schält man sie mit Handschuhen."
    - key: turns-black
      source: en-GB
      text:
        en-GB: "The roots contain a milky latex that turns them dark as soon as they meet the air."
        de-AT: "Die Wurzeln enthalten einen milchigen Saft, der sie an der Luft rasch dunkel färbt."

- ingredient: endive
  articles:
    en-GB: {title: "Endive", revision: 1383330371}
    de-AT: {title: "Endivie", revision: 268731862}
  facts:
    - key: escariol
      source: de-AT
      text:
        en-GB: "Endive comes in two main forms: the smooth broad-leaved Escariol, also called winter endive, and the curly Frisée."
        de-AT: "Die Endivie gibt es in zwei Hauptformen, als glatte, breitblättrige Escariol oder Winterendivie und als krause Frisée."
    - key: lactucopicrin
      source: de-AT
      text:
        en-GB: "Endive's bitterness comes from its milky sap, which contains the bitter compound lactucopicrin."
        de-AT: "Die Bitterkeit der Endivie stammt aus ihrem Milchsaft, der den Bitterstoff Lactucopikrin enthält."
    - key: name-muddle
      source: en-GB
      text:
        en-GB: "Endive and chicory are hopelessly mixed up: curly endive is often sold as chicory in the United States, and in French it is chicorée frisée."
        de-AT: "Endivie und Chicorée werden ständig verwechselt. In den USA verkauft man krause Endivie oft als chicory, auf Französisch heißt sie chicorée frisée."

- ingredient: chicory
  articles:
    en-GB: {title: "Belgian endive", revision: 1368383451}
    de-AT: {title: "Chicorée", revision: 252990942}
  facts:
    - key: white-gold
      source: en-GB
      text:
        en-GB: "Belgian endive was developed in Belgium in the 1850s and is nicknamed white gold there. In 2021 Brussels listed it as intangible cultural heritage."
        de-AT: "Chicorée wurde in den 1850er-Jahren in Belgien entwickelt und heißt dort „weißes Gold“. 2021 nahm Brüssel ihn ins immaterielle Kulturerbe auf."
    - key: lammers
      source: en-GB
      text:
        en-GB: "Legend says a farmer, Jan Lammers, found that chicory roots he had stored had sprouted while he was away at war, and the pale shoots were good to eat."
        de-AT: "Der Legende nach fand ein Bauer namens Jan Lammers nach seinem Militärdienst ausgetriebene Zichorienwurzeln im Lager, und die blassen Sprossen schmeckten gut."
    - key: whiter-milder
      source: en-GB
      text:
        en-GB: "The whiter a chicory leaf, the less bitter it tastes. Cooking turns the remaining bitterness into a nutty flavour."
        de-AT: "Je weißer ein Chicoréeblatt, desto weniger bitter ist es. Beim Kochen wird die restliche Bitterkeit zu einem nussigen Aroma."

- ingredient: jalapeno
  articles:
    en-GB: {title: "Jalapeño", revision: 1385994841}
    de-AT: {title: "Jalapeño", revision: 272370047}
  facts:
    - key: xalapa
      source: en-GB
      text:
        en-GB: "Jalapeño means from Xalapa, the capital of Veracruz. The peppers are not actually grown there, but the city is where pickling and canning them was invented."
        de-AT: "Jalapeño heißt „aus Xalapa“, der Hauptstadt von Veracruz. Angebaut werden sie dort gar nicht, aber dort wurde das Einlegen und Konservieren erfunden."
    - key: space-shuttle
      source: en-GB
      text:
        en-GB: "Jalapeños flew into space: they were on the Space Shuttle menu as early as 1982."
        de-AT: "Jalapeños waren schon im All: Bereits 1982 standen sie auf dem Speiseplan des Space Shuttle."
    - key: chipotle
      source: en-GB
      text:
        en-GB: "Chipotles are smoked jalapeños, and Aztec markets were already selling them, and mole made from them, before the Spanish conquest."
        de-AT: "Chipotles sind geräucherte Jalapeños. Auf den Märkten der Azteken wurden sie schon vor der spanischen Eroberung verkauft, ebenso Mole daraus."

- ingredient: parsley_root
  articles:
    en-GB: {title: "Parsley", revision: 1380990209}
    de-AT: {title: "Wurzelpetersilie", revision: 266126618}
  facts:
    - key: peterwurzen
      source: de-AT
      text:
        en-GB: "Root parsley is a subspecies of ordinary parsley bred for its thick root. In Austria it is also called Peterwurzen."
        de-AT: "Die Petersilwurzel ist eine Unterart der gewöhnlichen Petersilie mit verdickter Rübe. In Österreich heißt sie auch Peterwurzen."
    - key: hamburg
      source: en-GB
      text:
        en-GB: "English calls it Hamburg root parsley. It is very common in Central, Eastern and Southern European cooking, in soups, stews and broth."
        de-AT: "Auf Englisch heißt sie Hamburg root parsley. In Mittel-, Ost- und Südeuropa ist sie in Suppen, Eintöpfen und Brühen weit verbreitet."

- ingredient: soup_vegetables
  articles:
    en-GB: {title: "Mirepoix", revision: 1366605211}
    de-AT: {title: "Suppengrün", revision: 268320167}
  facts:
    - key: mirepoix-duke
      source: en-GB
      text:
        en-GB: "The French mirepoix, a close cousin of soup vegetables, is named after the Duke of Lévis-Mirepoix (1699 to 1757), whose cook is credited with it."
        de-AT: "Das französische Mirepoix, ein naher Verwandter des Suppengemüses, ist nach dem Herzog von Lévis-Mirepoix (1699 bis 1757) benannt, dessen Koch es zugeschrieben wird."
    - key: national-bases
      source: en-GB
      text:
        en-GB: "Nearly every cuisine has its own aromatic base: the German one uses leek, carrot and celeriac, the Polish adds parsley root, and Cajun cooking uses onion, celery and pepper."
        de-AT: "Fast jede Küche hat ihre Würzbasis: Die deutsche nimmt Lauch, Karotte und Sellerie, die polnische zusätzlich Petersilwurzel, die Cajun-Küche Zwiebel, Sellerie und Paprika."
    - key: wurzelwerk
      source: de-AT
      text:
        en-GB: "Soup vegetables go by many names, including Suppengrün, Kochgemüse and Wurzelwerk, and the mix of roots, alliums and herbs varies by region."
        de-AT: "Suppengemüse hat viele Namen, etwa Suppengrün, Kochgemüse oder Wurzelwerk. Die Mischung aus Wurzeln, Lauchgewächsen und Kräutern ist je nach Region anders."

- ingredient: mangetout
  articles:
    en-GB: {title: "Snow pea", revision: 1384694945}
    de-AT: {title: "Zuckererbse", revision: 254381819}
  facts:
    - key: holland-pea
      source: en-GB
      text:
        en-GB: "Mangetout is often called Chinese pea in the West, yet in Chinese it is helandou, the Holland pea."
        de-AT: "Im Westen nennt man Zuckerschoten oft „chinesische Erbsen“, auf Chinesisch heißen sie aber helandou, „holländische Erbse“."
    - key: no-parchment
      source: de-AT
      text:
        en-GB: "Mangetout pods lack the tough parchment layer of shelling peas, so they never turn stringy and can be eaten whole. Other names are Kefe and Kaiserschote."
        de-AT: "Den Hülsen der Zuckerschote fehlt die zähe Pergamentschicht, darum isst man sie ganz. Andere Namen sind Kefe und Kaiserschote."

- ingredient: romanesco
  articles:
    en-GB: {title: "Romanesco broccoli", revision: 1385869265}
    de-AT: {title: "Blumenkohl", revision: 271664816}
  facts:
    - key: fractal
      source: en-GB
      text:
        en-GB: "Romanesco naturally forms an approximate fractal: each bud is made of smaller buds, all arranged in logarithmic spirals."
        de-AT: "Romanesco bildet von Natur aus beinahe ein Fraktal. Jede Knospe besteht aus kleineren Knospen, alle in logarithmischen Spiralen angeordnet."
    - key: rome
      source: en-GB
      text:
        en-GB: "Romanesco is a cultivar of cauliflower, not of broccoli, and as its name suggests it is thought to come from the area around Rome."
        de-AT: "Romanesco ist eine Sorte des Karfiols, nicht des Brokkolis, und stammt, wie der Name verrät, vermutlich aus der Gegend um Rom."

- ingredient: pointed_cabbage
  articles:
    en-GB: {title: "Pointed cabbage", revision: 1323890446}
    de-AT: {title: "Spitzkohl", revision: 267282117}
  facts:
    - key: earliest
      source: en-GB
      text:
        en-GB: "Pointed cabbage is the earliest cabbage of the year. It tastes milder and more delicate than ordinary white cabbage."
        de-AT: "Spitzkraut ist das früheste Kraut des Jahres und schmeckt milder und feiner als gewöhnliches Weißkraut."
    - key: filderkraut
      source: de-AT
      text:
        en-GB: "Filderkraut, a pointed cabbage from the plain south of Stuttgart, has been an EU protected geographical indication since 24 October 2012."
        de-AT: "Das Filderkraut, ein Spitzkraut von der Ebene südlich von Stuttgart, ist seit 24. Oktober 2012 eine geschützte geografische Angabe der EU."
    - key: red-sauerkraut
      source: en-GB
      text:
        en-GB: "In northern Bohemia, red pointed cabbage is fermented with nothing but salt into a red sauerkraut."
        de-AT: "In Nordböhmen wird rotes Spitzkraut nur mit Salz zu rotem Sauerkraut vergoren."

- ingredient: oyster_mushroom
  articles:
    en-GB: {title: "Pleurotus ostreatus", revision: 1366763686}
    de-AT: {title: "Austern-Seitling", revision: 271394754}
  facts:
    - key: nematodes
      source: en-GB
      text:
        en-GB: "The oyster mushroom is partly carnivorous: its mycelium can kill and digest tiny nematode worms, probably to get nitrogen."
        de-AT: "Der Austernpilz ist teilweise ein Fleischfresser. Sein Myzel kann winzige Fadenwürmer töten und verdauen, vermutlich um an Stickstoff zu kommen."
    - key: wwi-germany
      source: en-GB
      text:
        en-GB: "Commercial cultivation of oyster mushrooms began in Germany during the First World War, as a way to get by on scarce food."
        de-AT: "Der erwerbsmäßige Anbau von Austernpilzen begann im Ersten Weltkrieg in Deutschland, als Notmaßnahme gegen den Hunger."
    - key: coffee-grounds
      source: de-AT
      text:
        en-GB: "Growers raise oyster mushrooms on straw, paper, coffee grounds or coffee cherry pulp."
        de-AT: "Gezüchtet werden Austernpilze auf Stroh, Papier, Kaffeesatz oder dem Fruchtfleisch von Kaffeekirschen."

- ingredient: king_oyster_mushroom
  articles:
    en-GB: {title: "Pleurotus eryngii", revision: 1372973021}
    de-AT: {title: "Brauner Kräuter-Seitling", revision: 245301055}
  facts:
    - key: eryngo
      source: en-GB
      text:
        en-GB: "The king oyster is named after Eryngium, the eryngo or sea holly, because in the wild it grows in association with the roots of these plants."
        de-AT: "Der Kräuterseitling heißt nach dem Mannstreu, botanisch Eryngium, weil er in der Natur an den Wurzeln dieser Pflanzen wächst."
    - key: root-parasite
      source: de-AT
      text:
        en-GB: "Unlike most oyster mushrooms, which live on wood, the king oyster parasitises the roots of field eryngo, but it can be grown on artificial substrates."
        de-AT: "Anders als die meist holzbewohnenden Seitlinge schmarotzt der Kräuterseitling an den Wurzeln des Feld-Mannstreus. Gezüchtet wird er aber auf künstlichem Substrat."

- ingredient: okra
  articles:
    en-GB: {title: "Okra", revision: 1384480256}
    de-AT: {title: "Okra", revision: 272033213}
  facts:
    - key: cotton-cousin
      source: en-GB
      text:
        en-GB: "Okra belongs to the mallow family, which makes it a relative of cotton, cocoa and hibiscus."
        de-AT: "Okra gehört zu den Malvengewächsen und ist damit mit Baumwolle, Kakao und Hibiskus verwandt."
    - key: gumbo
      source: en-GB
      text:
        en-GB: "Okra pods turn slimy when cooked because of their mucilage, which is exactly why okra is one of the three classic thickeners for Louisiana gumbo."
        de-AT: "Okraschoten werden beim Kochen schleimig. Genau deshalb ist Okra eines der drei klassischen Bindemittel für den Gumbo aus Louisiana."
    - key: jefferson
      source: en-GB
      text:
        en-GB: "Thomas Jefferson noted that okra was well established in Virginia by 1781."
        de-AT: "Thomas Jefferson hielt fest, dass Okra 1781 in Virginia bereits fest etabliert war."

- ingredient: apple
  articles:
    en-GB: {title: "Apple", revision: 1387925377}
    de-AT: {title: "Kulturapfel", revision: 271100989}
  facts:
    - key: tian-shan
      source: en-GB
      text:
        en-GB: "The ancestor of the eating apple, Malus sieversii, still grows wild in the mountains of Central Asia, and cultivation probably began on the slopes of the Tian Shan."
        de-AT: "Der Vorfahre des Kulturapfels, Malus sieversii, wächst noch heute wild in den Bergen Zentralasiens. Angebaut wurde er wohl zuerst an den Hängen des Tian Shan."
    - key: old-english-fruit
      source: en-GB
      text:
        en-GB: "The Old English word æppel simply meant fruit, and until the 17th century apple could still stand for almost any fruit, nuts included."
        de-AT: "Das altenglische Wort æppel bedeutete einfach Frucht, und noch bis ins 17. Jahrhundert konnte apple im Englischen fast jedes Obst bezeichnen, sogar Nüsse."
    - key: grafting
      source: en-GB
      text:
        en-GB: "Apple seeds do not grow true to their parent, so every one of the more than 7,500 cultivars is kept alive by grafting onto rootstocks."
        de-AT: "Aus Apfelkernen wachsen Bäume, die ihren Eltern kaum ähneln. Darum wird jede der über 7.500 Sorten durch Veredelung auf eine Unterlage vermehrt."

- ingredient: pear
  articles:
    en-GB: {title: "Pear", revision: 1387826380}
    de-AT: {title: "Birnen", revision: 270010194}
  facts:
    - key: woodwind
      source: en-GB
      text:
        en-GB: "Pear wood is a favourite material for high-quality woodwind instruments and fine furniture."
        de-AT: "Birnenholz ist ein begehrtes Material für hochwertige Holzblasinstrumente und edle Möbel."
    - key: 3000-varieties
      source: en-GB
      text:
        en-GB: "About 3,000 pear varieties are grown around the world, and most of them barely change colour as they ripen."
        de-AT: "Weltweit werden etwa 3.000 Birnensorten angebaut, und die meisten ändern beim Reifen kaum ihre Farbe."
    - key: stone-cells
      source: de-AT
      text:
        en-GB: "The slightly gritty feel of some pears comes from clusters of stone cells in the flesh, which other varieties lack."
        de-AT: "Das leicht sandige Gefühl mancher Birnen kommt von grießartigen Gruppen aus Steinzellen im Fruchtfleisch. Anderen Sorten fehlen sie."

- ingredient: banana
  articles:
    en-GB: {title: "Banana", revision: 1388104988}
    de-AT: {title: "Bananen", revision: 270581979}
  facts:
    - key: largest-herb
      source: en-GB
      text:
        en-GB: "The banana plant is the largest herbaceous flowering plant. Its trunk is a false stem made of tightly packed leaf stalks."
        de-AT: "Die Bananenpflanze ist die größte krautige Blütenpflanze der Welt. Der Stamm ist ein Scheinstamm aus dicht gepackten Blattstielen."
    - key: curve
      source: de-AT
      text:
        en-GB: "Bananas grow pointing upwards and curve because of negative gravitropism, bending away from gravity towards the light."
        de-AT: "Bananen wachsen nach oben und krümmen sich wegen des negativen Gravitropismus, sie biegen sich also von der Schwerkraft weg zum Licht."
    - key: cavendish
      source: en-GB
      text:
        en-GB: "Almost all bananas sold in the West are Cavendish, a single seedless triploid variety threatened by Panama disease and black sigatoka."
        de-AT: "Fast alle Bananen im westlichen Handel sind Cavendish, eine kernlose triploide Sorte, die von der Panamakrankheit und Black Sigatoka bedroht ist."

- ingredient: orange
  articles:
    en-GB: {title: "Orange (fruit)", revision: 1385652401}
    de-AT: {title: "Orange (Frucht)", revision: 272091739}
  facts:
    - key: hybrid
      source: en-GB
      text:
        en-GB: "The sweet orange is a hybrid of pomelo and mandarin, and its maternal line is pomelo. It was first mentioned in Chinese literature in 314 BC."
        de-AT: "Die Orange ist eine Kreuzung aus Pampelmuse und Mandarine, mütterlicherseits stammt sie von der Pampelmuse. In chinesischen Texten wird sie erstmals 314 v. Chr. erwähnt."
    - key: colour-1512
      source: en-GB
      text:
        en-GB: "The colour was named after the fruit, not the other way round. Orange was first recorded as a colour name in English in 1512."
        de-AT: "Die Farbe wurde nach der Frucht benannt, nicht umgekehrt. Als Farbwort ist orange im Englischen erstmals 1512 belegt."
    - key: dravidian
      source: en-GB
      text:
        en-GB: "The word orange has its roots in the Dravidian languages of South India and reached Europe via Sanskrit, Persian and Arabic."
        de-AT: "Das Wort Orange hat seine Wurzeln in den drawidischen Sprachen Südindiens und kam über Sanskrit, Persisch und Arabisch nach Europa."

- ingredient: mandarin
  articles:
    en-GB: {title: "Mandarin orange", revision: 1387797880}
    de-AT: {title: "Mandarine", revision: 270768987}
  facts:
    - key: two-domestications
      source: en-GB
      text:
        en-GB: "Mandarins were domesticated at least twice, north and south of China's Nanling Mountains. The northern line gives larger, redder fruit like the satsuma."
        de-AT: "Mandarinen wurden mindestens zweimal domestiziert, nördlich und südlich des Nanling-Gebirges in China. Die nördliche Linie bringt größere, rötere Früchte wie die Satsuma."
    - key: easy-peel
      source: en-GB
      text:
        en-GB: "Mandarins peel so easily because their skin is thin and loose, with very little white pith underneath."
        de-AT: "Mandarinen lassen sich so leicht schälen, weil ihre Schale dünn und locker ist und kaum weiße Haut darunter liegt."

- ingredient: lemon
  articles:
    en-GB: {title: "Lemon", revision: 1383438383}
    de-AT: {title: "Zitrone", revision: 270539786}
  facts:
    - key: hybrid
      source: en-GB
      text:
        en-GB: "A true lemon is a hybrid of citron and bitter orange that probably arose in north-eastern India during the 1st millennium BC."
        de-AT: "Die echte Zitrone ist eine Kreuzung aus Zitronatzitrone und Bitterorange und entstand vermutlich im 1. Jahrtausend v. Chr. im Nordosten Indiens."
    - key: genoa
      source: en-GB
      text:
        en-GB: "Lemons were first grown on a large scale in Europe in Genoa in the mid-15th century, and Columbus took lemon seeds to Hispaniola in 1493."
        de-AT: "Im großen Stil wurden Zitronen in Europa zuerst um die Mitte des 15. Jahrhunderts in Genua angebaut. 1493 brachte Kolumbus Zitronenkerne nach Hispaniola."
    - key: citron-name
      source: de-AT
      text:
        en-GB: "The name Zitrone, Latin citrum, used to refer to the citron, and goes back via Greek to kedrómēlon, cedar apple, because of its scent."
        de-AT: "Der Name Zitrone, lateinisch citrum, meinte früher die Zitronatzitrone. Er geht über das Griechische auf kedrómēlon zurück, „Zedernapfel“, wegen des Dufts."

- ingredient: lime
  articles:
    en-GB: {title: "Lime (fruit)", revision: 1388177255}
    de-AT: {title: "Limette", revision: 265378404}
  facts:
    - key: limey
      source: en-GB
      text:
        en-GB: "In the 19th century British sailors took citrus, limes included, to prevent scurvy, which earned them the nickname limey."
        de-AT: "Im 19. Jahrhundert aßen britische Seeleute Zitrusfrüchte, auch Limetten, gegen Skorbut. Das brachte ihnen den Spitznamen „Limey“ ein."
    - key: persian-lime
      source: en-GB
      text:
        en-GB: "The lime found in most shops is the Persian lime, a nearly seedless hybrid of key lime and lemon, while key limes are generally full of seeds."
        de-AT: "Die Limette aus dem Supermarkt ist meist die Persische Limette, eine fast kernlose Kreuzung aus Key Lime und Zitrone. Key Limes haben dagegen viele Kerne."

- ingredient: grapefruit
  articles:
    en-GB: {title: "Grapefruit", revision: 1383091638}
    de-AT: {title: "Grapefruit", revision: 266234238}
  facts:
    - key: barbados
      source: en-GB
      text:
        en-GB: "Grapefruit arose in Barbados in the 18th century as an accidental cross of sweet orange and pomelo. In 1750 Griffith Hughes described it as the forbidden fruit."
        de-AT: "Die Grapefruit entstand im 18. Jahrhundert auf Barbados als zufällige Kreuzung aus Orange und Pampelmuse. 1750 beschrieb Griffith Hughes sie als „verbotene Frucht“."
    - key: grape-taste
      source: en-GB
      text:
        en-GB: "One early writer reported that the grapefruit got its name because its taste resembled that of the grape."
        de-AT: "Ein früher Autor berichtete, die Grapefruit habe ihren Namen bekommen, weil sie ähnlich wie Weintrauben schmecke."
    - key: ruby-red
      source: en-GB
      text:
        en-GB: "Red grapefruit began with a red fruit discovered on a pink variety. The 1929 Ruby Red patent turned it into a real commercial success."
        de-AT: "Die rote Grapefruit begann mit einer roten Frucht, die an einer rosa Sorte entdeckt wurde. Das Patent für ‚Ruby Red‘ von 1929 machte sie zum Verkaufserfolg."

- ingredient: lemon_juice
  articles:
    en-GB: {title: "Citric acid", revision: 1380075662}
    de-AT: {title: "Citronensäure", revision: 272259882}
  facts:
    - key: scheele
      source: en-GB
      text:
        en-GB: "Citric acid, about 47 grams per litre in lemon juice, was first isolated in 1784 by Carl Wilhelm Scheele, who crystallised it from lemon juice."
        de-AT: "Die Zitronensäure, rund 47 Gramm pro Liter Zitronensaft, isolierte Carl Wilhelm Scheele 1784 erstmals, indem er sie aus Zitronensaft kristallisierte."
    - key: mould
      source: en-GB
      text:
        en-GB: "Most citric acid today is not made from lemons but by the mould Aspergillus niger fed on sugar, a method found in 1917 and industrialised by Pfizer two years later."
        de-AT: "Die meiste Zitronensäure stammt heute nicht aus Zitronen, sondern vom Schimmelpilz Aspergillus niger auf Zuckerlösung. Das Verfahren wurde 1917 entdeckt, Pfizer setzte es zwei Jahre später um."
    - key: lind
      source: en-GB
      text:
        en-GB: "In 1747 the physician James Lind added lemon juice to the diet of sailors with scurvy, long before vitamin C was known."
        de-AT: "1747 gab der Arzt James Lind an Skorbut erkrankten Seeleuten Zitronensaft, lange bevor man Vitamin C kannte."

- ingredient: strawberry
  articles:
    en-GB: {title: "Strawberry", revision: 1386693488}
    de-AT: {title: "Gartenerdbeere", revision: 267068333}
  facts:
    - key: achenes
      source: en-GB
      text:
        en-GB: "A strawberry is not a berry. Each 'seed' on its surface is actually a tiny fruit called an achene, with a seed inside."
        de-AT: "Die Erdbeere ist botanisch keine Beere. Jedes „Kernchen“ auf ihrer Oberfläche ist eine winzige Nussfrucht mit einem Samen darin."
    - key: brittany
      source: en-GB
      text:
        en-GB: "The garden strawberry was bred in Brittany in the 1750s by crossing a Chilean strawberry, brought to France in 1714, with the Virginia strawberry from North America."
        de-AT: "Die Gartenerdbeere entstand in den 1750er-Jahren in der Bretagne, als man eine 1714 aus Chile gebrachte Erdbeere mit der nordamerikanischen Virginia-Erdbeere kreuzte."

- ingredient: raspberry
  articles:
    en-GB: {title: "Raspberry", revision: 1388224702}
    de-AT: {title: "Himbeere", revision: 271011869}
  facts:
    - key: hollow-core
      source: en-GB
      text:
        en-GB: "When you pick a raspberry the core stays on the plant and leaves the fruit hollow. A blackberry keeps its core, which is how you tell the two apart."
        de-AT: "Beim Pflücken einer Himbeere bleibt der Zapfen an der Pflanze, die Frucht ist innen hohl. Die Brombeere behält ihren Zapfen, daran unterscheidet man die beiden."
    - key: mount-ida
      source: de-AT
      text:
        en-GB: "Rubus idaeus is named after Mount Ida. Pliny the Elder wrote that the Greeks called it Idaeus rubus because it grew only on Ida."
        de-AT: "Rubus idaeus ist nach dem Ida-Gebirge benannt. Plinius der Ältere schrieb, die Griechen hätten die Pflanze so genannt, weil sie nur am Ida wachse."
    - key: russia
      source: en-GB
      text:
        en-GB: "The world harvested 940,979 tonnes of raspberries in 2023, and Russia grew 23 per cent of them."
        de-AT: "2023 wurden weltweit 940.979 Tonnen Himbeeren geerntet, 23 Prozent davon in Russland."

- ingredient: blueberry
  articles:
    en-GB: {title: "Blueberry", revision: 1384423912}
    de-AT: {title: "Kulturheidelbeeren", revision: 269394751}
  facts:
    - key: not-bilberry
      source: de-AT
      text:
        en-GB: "Cultivated blueberries do not descend from the European wild bilberry but come from North America. Their pale flesh is why they do not stain your mouth blue."
        de-AT: "Kulturheidelbeeren stammen nicht von der heimischen Waldheidelbeere ab, sondern aus Nordamerika. Das Fruchtfleisch ist hell, darum färben sie den Mund nicht blau."
    - key: coville
      source: en-GB
      text:
        en-GB: "After 1910 the botanist Frederick Coville found that blueberries need very acidic soil and do not self-pollinate, which made large-scale cultivation possible."
        de-AT: "Nach 1910 entdeckte der Botaniker Frederick Coville, dass Heidelbeeren sehr sauren Boden brauchen und sich nicht selbst bestäuben. Das ermöglichte den großen Anbau."
    - key: bloom
      source: en-GB
      text:
        en-GB: "The silvery film on blueberries is a protective coating of powdery wax known as the bloom. Highbush blueberries reached Europe in the 1930s."
        de-AT: "Der silbrige Hauch auf Heidelbeeren ist eine schützende Wachsschicht. Die hohen Kulturheidelbeeren kamen erst in den 1930er-Jahren nach Europa."

- ingredient: blackberry
  articles:
    en-GB: {title: "Blackberry", revision: 1383475342}
    de-AT: {title: "Brombeere (Frucht)", revision: 263127912}
  facts:
    - key: michaelmas
      source: en-GB
      text:
        en-GB: "British and Irish folklore says blackberries should not be picked after Old Michaelmas Day, 11 October, because the devil has spoiled them."
        de-AT: "Nach britischem und irischem Volksglauben soll man Brombeeren nach dem alten Michaelistag, dem 11. Oktober, nicht mehr pflücken, weil der Teufel sie verdorben habe."
    - key: drupelets
      source: en-GB
      text:
        en-GB: "A blackberry is not a true berry but an aggregate fruit made of many small drupelets, each a tiny stone fruit."
        de-AT: "Die Brombeere ist keine echte Beere, sondern eine Sammelfrucht aus vielen kleinen Steinfrüchtchen."

- ingredient: redcurrant
  articles:
    en-GB: {title: "Redcurrant", revision: 1387942399}
    de-AT: {title: "Rote Johannisbeere", revision: 267140902}
  facts:
    - key: st-john
      source: en-GB
      text:
        en-GB: "The German name Johannisbeere, John's berry, comes from the belief that the fruit ripens first on St John's Day, 24 June."
        de-AT: "Der Name Johannisbeere kommt daher, dass die Früchte angeblich am Johannistag, dem 24. Juni, als Erste reif werden."
    - key: bar-le-duc
      source: en-GB
      text:
        en-GB: "For Bar-le-Duc jelly from Lorraine, the pips were traditionally removed from each currant by hand with a goose feather, originally by monks."
        de-AT: "Für das Bar-le-Duc-Gelee aus Lothringen wurden die Kerne traditionell von Hand mit einer Gänsefeder aus jeder Beere geholt, ursprünglich von Mönchen."
    - key: ribisel
      source: de-AT
      text:
        en-GB: "Ribisel is the Austrian name, also used in Bavaria and South Tyrol. The wild redcurrant is native to only a few countries, Austria among them."
        de-AT: "Ribisel ist der österreichische Name, auch in Bayern und Südtirol gebräuchlich. Wild wächst die Rote Ribisel nur in wenigen Ländern, darunter Österreich."

- ingredient: cherry
  articles:
    en-GB: {title: "Cherry", revision: 1382944606}
    de-AT: {title: "Vogelkirsche", revision: 271791021}
  facts:
    - key: kerasous
      source: en-GB
      text:
        en-GB: "The word cherry goes back to the Latin cerasum and the Greek region of Kerasous, near today's Giresun in Turkey, once thought to be where cherries came from."
        de-AT: "Das Wort Kirsche geht auf das lateinische cerasum zurück und auf die griechische Gegend Kerasous beim heutigen Giresun in der Türkei, die als Herkunft galt."
    - key: lucullus
      source: en-GB
      text:
        en-GB: "Lucius Licinius Lucullus is recorded as bringing a cultivated cherry to Rome from the Pontus region of Anatolia in 72 BCE."
        de-AT: "Lucius Licinius Lucullus soll 72 v. Chr. eine Kulturkirsche aus der Region Pontus in Anatolien nach Rom gebracht haben."
    - key: avium
      source: de-AT
      text:
        en-GB: "The botanical name of the sweet cherry, Prunus avium, means birds' cherry, because birds love the fruit as much as people do."
        de-AT: "Der botanische Name der Süßkirsche, Prunus avium, heißt „Kirsche der Vögel“, weil Vögel die Früchte genauso gern fressen wie wir."

- ingredient: sour_cherry
  articles:
    en-GB: {title: "Prunus cerasus", revision: 1372118937}
    de-AT: {title: "Sauerkirsche", revision: 267909335}
  facts:
    - key: hybrid
      source: en-GB
      text:
        en-GB: "The sour cherry probably began as a natural hybrid of sweet cherry and ground cherry, in the Iranian Plateau or Eastern Europe, and then became its own species."
        de-AT: "Die Weichsel entstand vermutlich als natürliche Kreuzung aus Süßkirsche und Zwergkirsche, im Iranischen Hochland oder in Osteuropa, und wurde dann zur eigenen Art."
    - key: weichsel
      source: de-AT
      text:
        en-GB: "In Old Bavaria, Austria and Switzerland the sour cherry is simply called Weichsel, a name that strictly speaking belongs to the morello group."
        de-AT: "In Altbayern, Österreich und der Schweiz heißt die Sauerkirsche kurz Weichsel. Genau genommen bezeichnet das Wort die Sortengruppe der Morellen."
    - key: kriek
      source: en-GB
      text:
        en-GB: "Morello-type sour cherries grew in Schaerbeek in Belgium as early as the 12th century and are a key part of Kriek lambic beer culture."
        de-AT: "Schon im 12. Jahrhundert wuchsen in Schaerbeek in Belgien Weichseln vom Typ Morelle, die fest zur Kultur des Kriek-Lambic-Biers gehören."

- ingredient: apricot
  articles:
    en-GB: {title: "Apricot", revision: 1382740667}
    de-AT: {title: "Aprikose", revision: 269809364}
  facts:
    - key: early-ripening
      source: en-GB
      text:
        en-GB: "The word apricot goes back to the Latin praecocia, meaning early ripening, and travelled through Byzantine Greek, Arabic al-barqūq and Spanish before reaching English as abrecock in the 16th century."
        de-AT: "Das Wort Aprikose stammt vom lateinischen praecox, „frühreif“, und gelangte über das Byzantinisch-Griechische und das Arabische zu uns. Die Marille trägt den Namen also wegen ihrer frühen Reife."
    - key: wachau-origin
      source: de-AT
      text:
        en-GB: "Wachauer Marille is not an apricot variety at all: it is a protected designation of origin for apricots from the Wachau valley in Lower Austria."
        de-AT: "Die Wachauer Marille ist keine eigene Sorte, sondern eine geschützte Ursprungsbezeichnung für Marillen aus der niederösterreichischen Wachau."
    - key: sachertorte
      source: de-AT
      text:
        en-GB: "Apricot jam is an essential part of the Sachertorte and the usual filling of Austrian carnival doughnuts, the Faschingskrapfen."
        de-AT: "Marillenmarmelade ist ein unverzichtbarer Bestandteil der Sachertorte und steckt auch in vielen Faschingskrapfen."

- ingredient: peach
  articles:
    en-GB: {title: "Peach", revision: 1385624404}
    de-AT: {title: "Pfirsich", revision: 272472193}
  facts:
    - key: chinese-not-persian
      source: en-GB
      text:
        en-GB: "Despite its species name persica, the peach was first domesticated in China in the Neolithic period. The name points to Persia, from where the tree was brought on to Europe."
        de-AT: "Trotz des Artnamens persica wurde der Pfirsich schon in der Jungsteinzeit in China domestiziert. Der Name erinnert an Persien, von wo der Baum nach Europa weitergereicht wurde."
    - key: persian-apple
      source: en-GB
      text:
        en-GB: "The ancient Romans called the peach persicum malum, the Persian apple. The same Latin root lives on in the German word Pfirsich and the Finnish persikka."
        de-AT: "Die alten Römer nannten den Pfirsich persicum malum, „persischer Apfel“. Auf diese lateinische Wurzel gehen das deutsche Wort Pfirsich und das finnische persikka zurück."
    - key: longevity
      source: en-GB
      text:
        en-GB: "In China the peach is a symbol of long life, and China alone grew 65% of the world's peaches and nectarines in 2023."
        de-AT: "In China gilt der Pfirsich als Symbol für ein langes Leben. 2023 stammten 65 % aller Pfirsiche und Nektarinen weltweit aus China."

- ingredient: plum
  articles:
    en-GB: {title: "Plum", revision: 1383677982}
    de-AT: {title: "Zwetschge", revision: 271179094}
  facts:
    - key: no-wild-ancestor
      source: en-GB
      text:
        en-GB: "The European plum, Prunus domestica, is not found in the wild at all. It grows only around human settlements and was probably one of the first fruits people domesticated."
        de-AT: "Die Kulturpflaume Prunus domestica kommt in freier Natur gar nicht vor, sondern nur rund um menschliche Siedlungen und gehört wohl zu den ersten Früchten, die der Mensch kultiviert hat."
    - key: damascus
      source: de-AT
      text:
        en-GB: "The German word Zwetschke comes from the Latin damascena and originally meant fruit from Damascus, a nod to the plum's origins in the east."
        de-AT: "Das Wort Zwetschke geht auf das lateinische damascēna zurück und bedeutete ursprünglich „Frucht aus Damaskus“, ein Hinweis auf die östliche Herkunft der Pflaume."
    - key: zwetschkenkrampus
      source: de-AT
      text:
        en-GB: "Dried plums, other fruit, nuts and iron wire are traditionally put together to make the Zwetschkenkrampus, a little Krampus figure."
        de-AT: "Aus Dörrzwetschken, anderen Früchten, Nüssen und Eisendraht wird traditionell der Zwetschkenkrampus gebastelt."

- ingredient: grape
  articles:
    en-GB: {title: "Grape", revision: 1386792535}
    de-AT: {title: "Weintraube", revision: 271190489}
  facts:
    - key: areni-winery
      source: en-GB
      text:
        en-GB: "The oldest known winery, Areni-1 in Armenia, dates back to around 4000 BC."
        de-AT: "Die älteste bekannte Kelterei der Welt, Areni-1 in Armenien, stammt aus der Zeit um 4000 v. Chr."
    - key: not-a-cluster
      source: de-AT
      text:
        en-GB: "Botanically a bunch of grapes is not a raceme but a panicle, because its side stalks branch again. Winegrowers call the flower clusters Gescheine."
        de-AT: "Botanisch ist eine Weintraube gar keine Traube, sondern eine Rispe, weil sich ihre Seitenachsen weiter verzweigen. Die Blütenstände heißen im Weinbau Gescheine."
    - key: yeast-on-skin
      source: en-GB
      text:
        en-GB: "Wild yeast lives naturally on grape skins, which is how people came to discover alcoholic drinks such as wine."
        de-AT: "Auf der Schale von Weintrauben sitzen von Natur aus Hefen. So kam der Mensch auf alkoholische Getränke wie Wein."

- ingredient: pineapple
  articles:
    en-GB: {title: "Pineapple", revision: 1387932324}
    de-AT: {title: "Ananas", revision: 269344916}
  facts:
    - key: columbus-1493
      source: en-GB
      text:
        en-GB: "The first European to meet a pineapple was Christopher Columbus, on Guadeloupe on 4 November 1493. He called it piña de Indes, pine of the Indians."
        de-AT: "Als erster Europäer begegnete Christoph Kolumbus am 4. November 1493 auf Guadeloupe einer Ananas. Er nannte sie piña de Indes, „Kiefer der Indianer“."
    - key: nanas
      source: en-GB
      text:
        en-GB: "The name ananas comes from nanas, the word the Tupi-Guarani and Carib peoples of South America used for the fruit, which they ate as a staple."
        de-AT: "Der Name Ananas stammt von nanas, so nannten die Tupí-Guaraní und die Kariben in Südamerika die Frucht, die für sie ein Grundnahrungsmittel war."
    - key: bromelain
      source: en-GB
      text:
        en-GB: "Raw pineapple contains bromelain, enzymes that break down protein, so the juice can tenderise meat. Cooking and canning destroy this activity."
        de-AT: "Rohe Ananas enthält Bromelain, Enzyme, die Eiweiß spalten. Der Saft kann deshalb Fleisch mürbe machen, beim Kochen und Einkochen geht diese Wirkung verloren."

- ingredient: mango
  articles:
    en-GB: {title: "Mango", revision: 1387164700}
    de-AT: {title: "Mango", revision: 269983679}
  facts:
    - key: tamil-name
      source: en-GB
      text:
        en-GB: "The word mango reached English in the 16th century via Malay and Malayalam. It goes back to the Tamil words for mango tree and unripe fruit."
        de-AT: "Das Wort Mango kam im 16. Jahrhundert über das Malaiische und Malayalam ins Englische. Es geht auf tamilische Wörter für Mangobaum und unreife Frucht zurück."
    - key: tall-tree
      source: en-GB
      text:
        en-GB: "Mango trees can grow 30 to 40 metres tall. The fruit is the national fruit of India, Pakistan and the Philippines, and the tree is the national tree of Bangladesh."
        de-AT: "Mangobäume werden 30 bis 40 Meter hoch. Die Mango ist Nationalfrucht von Indien, Pakistan und den Philippinen, in Bangladesch ist der Mangobaum sogar Nationalbaum."
    - key: poison-ivy-relative
      source: en-GB
      text:
        en-GB: "Mango skin and sap can trigger contact dermatitis, and people sensitive to urushiol, the allergen of poison ivy, are most at risk because the allergens can cross-react."
        de-AT: "Schale und Saft der Mango können Hautausschläge auslösen. Besonders betroffen ist, wer auf Urushiol reagiert, den Allergieauslöser des Giftefeus, denn die Stoffe können kreuzreagieren."

- ingredient: kiwi
  articles:
    en-GB: {title: "Kiwifruit", revision: 1387680261}
    de-AT: {title: "Kiwifrucht", revision: 267450703}
  facts:
    - key: renamed-1959
      source: en-GB
      text:
        en-GB: "Kiwifruit used to be sold as Chinese gooseberry. In 1959 the New Zealand exporter Turners & Growers switched to kiwifruit, a nod to the nickname for New Zealanders, partly to ease quarantine worries."
        de-AT: "Die Kiwi hieß früher Chinesische Stachelbeere. 1959 benannte sie der neuseeländische Exporteur Turners & Growers nach dem Spitznamen der Neuseeländer um, auch wegen Problemen beim Zoll."
    - key: song-dynasty
      source: en-GB
      text:
        en-GB: "Kiwifruit is native to central and eastern China, where it was first described in the 12th century under the Song dynasty. Commercial growing began only in the 20th century in New Zealand."
        de-AT: "Die Kiwi stammt aus Mittel- und Ostchina und wurde dort schon im 12. Jahrhundert unter der Song-Dynastie beschrieben. Der Erwerbsanbau begann erst im 20. Jahrhundert in Neuseeland."

- ingredient: melon
  articles:
    en-GB: {title: "Honeydew (melon)", revision: 1336580665}
    de-AT: {title: "Honigmelone", revision: 272092132}
  facts:
    - key: white-antibes
      source: en-GB
      text:
        en-GB: "Honeydew is the American name for the White Antibes cultivar, long grown in southern France and Algeria."
        de-AT: "Honigmelone ist eigentlich der amerikanische Name der Sorte White Antibes, die seit Langem in Südfrankreich und Algerien angebaut wird."
    - key: wallace-lanzhou
      source: en-GB
      text:
        en-GB: "In China honeydews are called Bailan melons. According to Chinese sources, the US agriculture secretary Henry A. Wallace gave the seeds to farmers near Lanzhou in the 1940s."
        de-AT: "In China heißen Honigmelonen Bailan-Melonen. Laut chinesischen Quellen brachte US-Landwirtschaftsminister Henry A. Wallace die Samen in den 1940er-Jahren in die Gegend von Lanzhou."

- ingredient: watermelon
  articles:
    en-GB: {title: "Watermelon", revision: 1385318453}
    de-AT: {title: "Wassermelone", revision: 269458194}
  facts:
    - key: sudan
      source: en-GB
      text:
        en-GB: "The watermelon was first domesticated in Sudan and was grown in Egypt by 2000 BCE. Botanically the fruit is a large berry known as a pepo."
        de-AT: "Die Wassermelone wurde im Sudan domestiziert und schon um 2000 v. Chr. in Ägypten angebaut. Botanisch ist die Frucht eine große Beere, eine sogenannte Panzerbeere."
    - key: seedless-1939
      source: en-GB
      text:
        en-GB: "Seedless watermelons were first bred by Japanese scientists in 1939 as triploid hybrids. Their pollen is sterile, so growers have to plant rows of seeded varieties among them."
        de-AT: "Kernlose Wassermelonen züchteten japanische Forscher erstmals 1939 als triploide Hybriden. Weil deren Pollen steril ist, müssen zwischen ihnen Reihen kernhaltiger Sorten stehen."

- ingredient: pomegranate
  articles:
    en-GB: {title: "Pomegranate", revision: 1386262901}
    de-AT: {title: "Granatapfel", revision: 271515965}
  facts:
    - key: grenade
      source: en-GB
      text:
        en-GB: "The name comes from Old French pomme-grenade, the seeded apple. Its descendant grenade gave the hand grenade its name."
        de-AT: "Der englische Name geht auf das altfranzösische pomme-grenade zurück, den „Apfel mit Kernen“. Daraus wurde das französische grenade, von dem auch die Handgranate ihren Namen hat."
    - key: persephone
      source: en-GB
      text:
        en-GB: "In Greek myth Persephone ate pomegranate seeds in the underworld, which bound her to spend part of every year there."
        de-AT: "Im griechischen Mythos aß Persephone in der Unterwelt Granatapfelkerne und musste deshalb jedes Jahr einige Monate dort verbringen."
    - key: iranian-plateau
      source: en-GB
      text:
        en-GB: "Pomegranates were first domesticated on the Iranian plateau about 5,000 years ago."
        de-AT: "Der Granatapfel wurde vor rund 5.000 Jahren auf dem Iranischen Hochland domestiziert."

- ingredient: fig
  articles:
    en-GB: {title: "Fig", revision: 1384934984}
    de-AT: {title: "Echte Feige", revision: 271959502}
  facts:
    - key: gilgal
      source: en-GB
      text:
        en-GB: "Nine sterile figs from about 9400 to 9200 BC were found in the Neolithic village of Gilgal I near Jericho. They predate domesticated wheat and may be the first known case of agriculture."
        de-AT: "In der jungsteinzeitlichen Siedlung Gilgal I bei Jericho fand man neun sterile Feigen aus der Zeit um 9400 bis 9200 v. Chr., älter als Kulturweizen und vielleicht der früheste Beleg für Landwirtschaft."
    - key: flowers-inside
      source: en-GB
      text:
        en-GB: "A fig is a false fruit with its flowers on the inside. A tiny opening at the tip lets the fig wasp crawl in to pollinate them."
        de-AT: "Die Feige ist eine Scheinfrucht, deren Blüten innen liegen. Durch eine winzige Öffnung an der Spitze kriecht die Feigenwespe hinein und bestäubt sie."

- ingredient: quince
  articles:
    en-GB: {title: "Quince", revision: 1385933805}
    de-AT: {title: "Quitte", revision: 271664668}
  facts:
    - key: marmalade
      source: en-GB
      text:
        en-GB: "Marmalade owes its name to the quince: the Portuguese marmelada was a quince paste, from marmelo, quince."
        de-AT: "Das Wort Marmelade verdankt seinen Namen der Quitte. Die portugiesische marmelada war ursprünglich ein Quittenmus, von marmelo, „Quitte“."
    - key: tower-of-london
      source: en-GB
      text:
        en-GB: "Quinces were first recorded in England around 1275, when Edward I had some planted at the Tower of London."
        de-AT: "In England sind Quitten erstmals um 1275 belegt, als König Eduard I. sie am Tower of London pflanzen ließ."
    - key: only-cydonia
      source: en-GB
      text:
        en-GB: "The quince is the only member of its genus, Cydonia. The Greeks linked it with Kydonia on Crete and held it sacred to Aphrodite."
        de-AT: "Die Quitte ist die einzige Art ihrer Gattung Cydonia. Die Griechen verbanden sie mit Kydonia auf Kreta und weihten sie der Aphrodite."

- ingredient: rhubarb
  articles:
    en-GB: {title: "Rhubarb", revision: 1382055411}
    de-AT: {title: "Gemeiner Rhabarber", revision: 270504510}
  facts:
    - key: candlelight
      source: en-GB
      text:
        en-GB: "In England the first rhubarb of the year is picked by candlelight in dark forcing sheds in Yorkshire's Rhubarb Triangle, which makes the stalks sweeter and more tender."
        de-AT: "In England wird der erste Rhabarber des Jahres im „Rhubarb Triangle“ in Yorkshire bei Kerzenlicht in dunklen Treibhäusern geerntet. So werden die Stangen süßer und zarter."
    - key: foreign-rha
      source: en-GB
      text:
        en-GB: "The name goes back to the Greek rha barbaron, the foreign rha. Botanically rhubarb is a vegetable, even though it is cooked like a fruit."
        de-AT: "Der Name geht auf das griechische rha barbaron zurück, „fremdes Rha“. Botanisch ist Rhabarber ein Gemüse, auch wenn er in der Küche wie Obst verwendet wird."

- ingredient: coconut
  articles:
    en-GB: {title: "Coconut", revision: 1383275266}
    de-AT: {title: "Kokospalme", revision: 272232379}
  facts:
    - key: skull-face
      source: en-GB
      text:
        en-GB: "The name comes from the 16th-century Portuguese coco, meaning head or skull, because the three dents on the shell look like a face."
        de-AT: "Der Name stammt vom portugiesischen coco aus dem 16. Jahrhundert, „Kopf“ oder „Schädel“, weil die drei Vertiefungen auf der Schale wie ein Gesicht aussehen."
    - key: not-a-nut
      source: en-GB
      text:
        en-GB: "Botanically a coconut is not a nut but a drupe. Its fibrous middle layer is coir, used for doormats and ropes."
        de-AT: "Botanisch ist die Kokosnuss keine Nuss, sondern eine Steinfrucht. Die faserige mittlere Schicht heißt Coir und wird zum Beispiel zu Fußmatten und Seilen verarbeitet."
    - key: human-dispersal
      source: en-GB
      text:
        en-GB: "Drift models of wind and ocean currents show coconuts could not have crossed the Pacific on their own. Austronesian seafarers spread them."
        de-AT: "Modelle zu Wind und Meeresströmungen zeigen, dass Kokosnüsse den Pazifik nicht allein überquert haben können. Verbreitet wurden sie von austronesischen Seefahrern."

- ingredient: dates
  articles:
    en-GB: {title: "Date palm", revision: 1385827415}
    de-AT: {title: "Echte Dattelpalme", revision: 271550968}
  facts:
    - key: methuselah
      source: en-GB
      text:
        en-GB: "Seven Judean date palm seeds about 2,000 years old have sprouted into trees, one of them named Methuselah."
        de-AT: "Sieben rund 2.000 Jahre alte Samen der Judäischen Dattelpalme sind gekeimt und zu Bäumen herangewachsen. Einer davon trägt den Namen Methusalem."
    - key: male-female
      source: en-GB
      text:
        en-GB: "Date palms have separate male and female trees, and like all Phoenix palms their sex is set by an XY system much like ours."
        de-AT: "Bei Dattelpalmen gibt es getrennt männliche und weibliche Bäume. Wie bei allen Phoenix-Palmen wird das Geschlecht über ein XY-System bestimmt, ähnlich wie beim Menschen."

- ingredient: raisins
  articles:
    en-GB: {title: "Raisin", revision: 1385998784}
    de-AT: {title: "Rosine", revision: 269922778}
  facts:
    - key: three-names
      source: en-GB
      text:
        en-GB: "Raisin, sultana and currant are all dried grapes: currants are small Black Corinth grapes, and golden sultanas usually get their colour from a sulphur dioxide treatment."
        de-AT: "Rosinen, Sultaninen und Korinthen sind alle getrocknete Weintrauben. Korinthen stammen von kleinen schwarzen Trauben, helle Sultaninen verdanken ihre Farbe meist einer Behandlung mit Schwefeldioxid."
    - key: pets
      source: en-GB
      text:
        en-GB: "Raisins can cause kidney failure in both cats and dogs."
        de-AT: "Rosinen können bei Hunden und Katzen zu Nierenversagen führen."

- ingredient: dried_apricot
  articles:
    en-GB: {title: "Dried apricot", revision: 1371688774}
    de-AT: {title: "Aprikose", revision: 269809364}
  facts:
    - key: malatya
      source: en-GB
      text:
        en-GB: "Turkey leads the world in dried apricots, and about 95% of its production comes from a single province, Malatya."
        de-AT: "Die Türkei ist weltweit führend bei getrockneten Marillen, rund 95 % davon stammen aus einer einzigen Provinz, Malatya."
    - key: orange-sulphur
      source: en-GB
      text:
        en-GB: "The bright orange of many dried apricots comes from sulphur dioxide. Untreated fruit dries much darker, and the lighter the colour, the more SO2 it holds."
        de-AT: "Das leuchtende Orange vieler getrockneter Marillen kommt vom Schwefeldioxid. Ungeschwefelte Früchte werden deutlich dunkler, und je heller die Farbe, desto mehr SO2 steckt darin."
    - key: silk-road
      source: en-GB
      text:
        en-GB: "Thanks to their long shelf life, dried apricots were an important trade good on the Silk Road and could travel enormous distances."
        de-AT: "Dank ihrer langen Haltbarkeit waren getrocknete Marillen ein wichtiges Handelsgut auf der Seidenstraße und konnten riesige Strecken zurücklegen."

- ingredient: prunes
  articles:
    en-GB: {title: "Prune", revision: 1387487023}
    de-AT: {title: "Trockenpflaume", revision: 267346333}
  facts:
    - key: dried-plums
      source: en-GB
      text:
        en-GB: "In 2001 the US Food and Drug Administration allowed growers to sell prunes as dried plums, because the old word had an image problem."
        de-AT: "2001 erlaubte die US-Lebensmittelbehörde FDA den Bauern, Dörrzwetschken als „dried plums“ zu verkaufen, weil das alte Wort prune ein Imageproblem hatte."
    - key: drying-varieties
      source: en-GB
      text:
        en-GB: "Not every plum makes a good prune. Drying varieties need firm flesh and plenty of sugar so they do not ferment while drying, and over 1,000 cultivars are grown for this."
        de-AT: "Nicht jede Zwetschke eignet sich zum Dörren. Die Früchte brauchen festes Fleisch und viel Zucker, damit sie beim Trocknen nicht gären. Über 1.000 Sorten werden dafür angebaut."

- ingredient: lingonberries
  articles:
    en-GB: {title: "Vaccinium vitis-idaea", revision: 1385072266}
    de-AT: {title: "Preiselbeere", revision: 271526728}
  facts:
    - key: vattlingon
      source: en-GB
      text:
        en-GB: "Before sugar was affordable, Swedes and Russians kept lingonberries until the next season simply by bottling them whole in water, known in Swedish as vattlingon."
        de-AT: "Als Zucker noch Luxus war, hielten sich Preiselbeeren in Schweden und Russland bis zur nächsten Saison, indem man sie einfach ganz in Flaschen mit Wasser füllte. Auf Schwedisch heißt das vattlingon."
    - key: ling
      source: en-GB
      text:
        en-GB: "The English name lingonberry comes from the Swedish lingon, which goes back to the Old Norse lyngr, the same root as ling, another word for heather."
        de-AT: "Der englische Name lingonberry kommt vom schwedischen lingon. Es geht auf das altnordische lyngr zurück, dieselbe Wurzel wie das englische ling für Heidekraut."

- ingredient: gooseberry
  articles:
    en-GB: {title: "Ribes uva-crispa", revision: 1365386110}
    de-AT: {title: "Stachelbeere", revision: 272391532}
  facts:
    - key: mackerel-berry
      source: en-GB
      text:
        en-GB: "In French the gooseberry is called groseille à maquereau, the mackerel berry, because old French cooking served it in a sauce for mackerel."
        de-AT: "Auf Französisch heißt die Stachelbeere groseille à maquereau, „Makrelenbeere“, weil man sie in der alten französischen Küche als Sauce zur Makrele reichte."
    - key: lancashire
      source: en-GB
      text:
        en-GB: "In the late 18th century, cotton spinners in Lancashire bred gooseberries from seed as a hobby, chiefly to grow ever larger fruit."
        de-AT: "Im späten 18. Jahrhundert züchteten Baumwollspinner in Lancashire in ihrer Freizeit Stachelbeeren aus Samen, vor allem um immer größere Früchte zu erzielen."

- ingredient: blackcurrant
  articles:
    en-GB: {title: "Blackcurrant", revision: 1382197632}
    de-AT: {title: "Schwarze Johannisbeere", revision: 266161948}
  facts:
    - key: us-ban
      source: en-GB
      text:
        en-GB: "Because blackcurrants host white pine blister rust, a disease deadly to American white pines, the plant was banned in the United States for much of the 20th century. The federal ban ended in 1966."
        de-AT: "Weil die Schwarze Ribisel den Strobenrost überträgt, der amerikanische Weymouth-Kiefern tötet, war sie in den USA einen Großteil des 20. Jahrhunderts verboten. Das Bundesverbot fiel erst 1966."
    - key: wartime-syrup
      source: en-GB
      text:
        en-GB: "When oranges became scarce in wartime Britain, the government promoted blackcurrant growing, and from 1942 children under two received blackcurrant syrup free of charge."
        de-AT: "Als im Zweiten Weltkrieg in Großbritannien Orangen knapp wurden, förderte die Regierung den Anbau von Schwarzen Ribiseln. Ab 1942 bekamen Kinder unter zwei Jahren den Sirup gratis."
    - key: kir
      source: en-GB
      text:
        en-GB: "Crème de cassis, the blackcurrant liqueur, mixed with white wine makes a Kir and with champagne a Kir Royal."
        de-AT: "Crème de cassis, der Likör aus Schwarzen Ribiseln, wird mit Weißwein zum Kir und mit Champagner zum Kir Royal."

- ingredient: elderberry
  articles:
    en-GB: {title: "Sambucus nigra", revision: 1380322926}
    de-AT: {title: "Schwarzer Holunder", revision: 270307934}
  facts:
    - key: sambunigrin
      source: en-GB
      text:
        en-GB: "Apart from the flowers and ripe berries, every part of the elder, including the seeds, contains the cyanogenic glycoside sambunigrin and is poisonous to mammals."
        de-AT: "Bis auf die Blüten und die reifen Beeren enthalten alle Teile des Holunders, auch die Samen, das cyanogene Glykosid Sambunigrin und sind für Säugetiere giftig."
    - key: elder-mother
      source: en-GB
      text:
        en-GB: "In early Scandinavian and English folklore the elder tree was linked to a goddess called the Elder Mother."
        de-AT: "In der frühen skandinavischen und englischen Volksüberlieferung war der Holunder mit einer Göttin verbunden, der „Holundermutter“."

- ingredient: dried_cranberries
  articles:
    en-GB: {title: "Cranberry", revision: 1384391289}
    de-AT: {title: "Großfrüchtige Moosbeere", revision: 272519802}
  facts:
    - key: crane-berry
      source: en-GB
      text:
        en-GB: "The name cranberry comes from the Middle Low German kraanbere, crane berry, because the flower, stem and petals were thought to look like a crane's neck, head and bill."
        de-AT: "Der Name Cranberry kommt vom mittelniederdeutschen kraanbere, „Kranichbeere“, weil Blüte, Stiel und Kronblätter an Hals, Kopf und Schnabel eines Kranichs erinnern."
    - key: floating-harvest
      source: en-GB
      text:
        en-GB: "For the harvest, cranberry beds are flooded in autumn. The berries float, so they can be herded into a corner of the bed and pumped out."
        de-AT: "Zur Ernte werden die Cranberry-Felder im Herbst geflutet. Die Beeren schwimmen auf, lassen sich in einer Ecke zusammentreiben und werden abgepumpt."
    - key: added-sugar
      source: en-GB
      text:
        en-GB: "Dried cranberries are usually sweetened with added sugar, up to 17 times their natural sugar content."
        de-AT: "Getrocknete Cranberrys werden meist mit Zucker gesüßt, und zwar mit bis zum 17-Fachen ihres natürlichen Zuckergehalts."

- ingredient: nectarine
  articles:
    en-GB: {title: "Peach", revision: 1385624404}
    de-AT: {title: "Nektarine", revision: 270418040}
  facts:
    - key: same-species
      source: en-GB
      text:
        en-GB: "A nectarine is not a cross between a peach and a plum. It is a peach whose fuzzless skin comes from a single recessive gene."
        de-AT: "Die Nektarine ist keine Kreuzung aus Pfirsich und Pflaume, sondern ein Pfirsich, dessen glatte Haut auf ein einziges rezessives Gen zurückgeht."
    - key: nectar-like
      source: en-GB
      text:
        en-GB: "The word nectarine was coined in English to mean nectar-like and first appeared in print in 1611."
        de-AT: "Das Wort nectarine wurde im Englischen geprägt und bedeutet so viel wie „nektarartig“. Gedruckt erschien es erstmals 1611."

- ingredient: persimmon
  articles:
    en-GB: {title: "Persimmon", revision: 1386925829}
    de-AT: {title: "Kaki", revision: 272129177}
  facts:
    - key: powhatan
      source: en-GB
      text:
        en-GB: "The English word persimmon comes from the Powhatan language of eastern North America, where it meant a dry fruit."
        de-AT: "Das englische Wort persimmon stammt aus der Sprache der Powhatan im Osten Nordamerikas und bedeutete dort „trockene Frucht“."
    - key: tannin
      source: en-GB
      text:
        en-GB: "Unripe astringent persimmons are full of soluble tannins that dry out the mouth. Alcohol or carbon dioxide can turn the tannins insoluble and remove the astringency."
        de-AT: "Unreife Kakis stecken voller löslicher Gerbstoffe, die den Mund pelzig machen. Alkohol oder Kohlendioxid machen die Tannine unlöslich und nehmen der Frucht die Herbheit."
    - key: china-80
      source: en-GB
      text:
        en-GB: "Botanically the persimmon is a berry, just like the tomato, and in 2023 China grew 80% of the world's persimmons."
        de-AT: "Botanisch ist die Kaki eine Beere, genau wie der Paradeiser. 2023 stammten 80 % aller Kakis weltweit aus China."

- ingredient: blood_orange
  articles:
    en-GB: {title: "Blood orange", revision: 1384676568}
    de-AT: {title: "Blutorange", revision: 215979372}
  facts:
    - key: cold-nights
      source: en-GB
      text:
        en-GB: "Blood oranges owe their red flesh to anthocyanins, pigments that are rare in citrus fruit. The colour develops only when the fruit ripens with cold nights."
        de-AT: "Das rote Fruchtfleisch der Blutorange stammt von Anthocyanen, Farbstoffen, die bei Zitrusfrüchten selten sind. Die Farbe entsteht nur, wenn die Frucht in kühlen Nächten reift."
    - key: raspberry-orange
      source: en-GB
      text:
        en-GB: "The blood orange is a natural mutation of the sweet orange and is also called the raspberry orange, after its berry-like flavour."
        de-AT: "Die Blutorange ist eine natürliche Mutation der Orange. Wegen ihres beerigen Aromas wird sie auch „Himbeerorange“ genannt."

- ingredient: physalis
  articles:
    en-GB: {title: "Physalis peruviana", revision: 1381053912}
    de-AT: {title: "Kapstachelbeere", revision: 263651286}
  facts:
    - key: husk
      source: en-GB
      text:
        en-GB: "After flowering, the calyx keeps growing until it forms a papery husk around the berry. Left inside its husk, the fruit keeps for about 30 to 45 days at room temperature."
        de-AT: "Nach der Blüte wächst der Kelch weiter, bis er die Beere als papierene Hülle umschließt. Bleibt sie darin, hält sich die Frucht bei Zimmertemperatur etwa 30 bis 45 Tage."
    - key: nightshade
      source: en-GB
      text:
        en-GB: "The physalis belongs to the nightshade family, like tomatoes, and was grown in England by 1774 and at the Cape of Good Hope before 1807."
        de-AT: "Die Physalis gehört wie der Paradeiser zu den Nachtschattengewächsen. In England wurde sie schon 1774 angebaut, am Kap der Guten Hoffnung vor 1807."

- ingredient: passion_fruit
  articles:
    en-GB: {title: "Passiflora edulis", revision: 1380446612}
    de-AT: {title: "Passiflora edulis", revision: 270701561}
  facts:
    - key: five-wounds
      source: en-GB
      text:
        en-GB: "The name comes from the passion flower. Missionaries in Brazil around 1700 used its parts to illustrate the crucifixion of Christ and called it the flower of the five wounds."
        de-AT: "Der Name kommt von der Passionsblume. Missionare in Brasilien deuteten um 1700 ihre Blütenteile als Sinnbilder der Kreuzigung Christi und nannten sie „Blume der fünf Wunden“."
    - key: carpenter-bees
      source: en-GB
      text:
        en-GB: "Passion flowers are pollinated best by carpenter bees, so some gardeners leave rotting logs near the vines to give the bees a home."
        de-AT: "Passionsblumen werden am besten von Holzbienen bestäubt. Manche Gärtner legen deshalb morsche Holzstücke neben die Ranken, damit die Bienen dort wohnen können."

- ingredient: papaya
  articles:
    en-GB: {title: "Papaya", revision: 1383654418}
    de-AT: {title: "Papaya", revision: 272091515}
  facts:
    - key: papain
      source: en-GB
      text:
        en-GB: "Green papaya and its latex are rich in papain, an enzyme that breaks down protein and has long been used to tenderise meat."
        de-AT: "Grüne Papaya und ihr Milchsaft enthalten viel Papain, ein Enzym, das Eiweiß spaltet und seit Langem zum Zartmachen von Fleisch verwendet wird."
    - key: arawak
      source: en-GB
      text:
        en-GB: "The word papaya comes from the Arawakan languages of the Caribbean and was first used in English around 1600."
        de-AT: "Das Wort Papaya stammt aus den Arawak-Sprachen der Karibik und taucht im Englischen um 1600 erstmals auf."

- ingredient: lychee
  articles:
    en-GB: {title: "Lychee", revision: 1383613580}
    de-AT: {title: "Litschibaum", revision: 267000487}
  facts:
    - key: horse-couriers
      source: en-GB
      text:
        en-GB: "Under the Han dynasty fresh lychees were so prized at the imperial court that a special courier service on fast horses rushed them from Guangdong."
        de-AT: "Zur Zeit der Han-Dynastie waren frische Litschis am Kaiserhof so begehrt, dass ein eigener Kurierdienst sie mit schnellen Pferden aus Guangdong heranbrachte."
    - key: aril
      source: en-GB
      text:
        en-GB: "The juicy white part of a lychee is an aril, a fleshy coat around the seed. Fruits with shrivelled seeds, called chicken tongues, fetch a higher price."
        de-AT: "Das saftige weiße Fruchtfleisch der Litschi ist ein Samenmantel. Früchte mit verkümmerten Kernen, „Hühnerzungen“ genannt, sind wegen des größeren Fleischanteils teurer."

- ingredient: rosehip
  articles:
    en-GB: {title: "Rose hip", revision: 1386640366}
    de-AT: {title: "Hagebutte", revision: 271424402}
  facts:
    - key: itching-powder
      source: en-GB
      text:
        en-GB: "The fine hairs inside rose hips irritate the skin and are used as itching powder."
        de-AT: "Die feinen Härchen im Inneren der Hagebutte reizen die Haut und werden als Juckpulver verwendet."
    - key: after-frost
      source: en-GB
      text:
        en-GB: "Rose hips are often picked after the first frost, which softens the fruit and makes it sweeter."
        de-AT: "Hagebutten werden oft erst nach dem ersten Frost geerntet, weil die Früchte dann weicher und süßer sind."

- ingredient: parsley
  articles:
    en-GB: {title: "Parsley", revision: 1380990209}
    de-AT: {title: "Petersilie", revision: 271541070}
  facts:
    - key: rock-celery
      source: en-GB
      text:
        en-GB: "Parsley and the German Petersilie both go back to the Greek petroselinon, rock celery, from petra, rock, and selinon, celery."
        de-AT: "Petersilie und das englische parsley gehen beide auf das griechische petroselinon zurück, „Felsensellerie“, von petra, Fels, und selinon, Sellerie."
    - key: biennial
      source: en-GB
      text:
        en-GB: "In temperate climates parsley is biennial: in its first year it forms only a leafy rosette, and in the second it shoots up a flowering stem up to 75 cm tall."
        de-AT: "In gemäßigtem Klima ist Petersilie zweijährig. Im ersten Jahr bildet sie nur eine Blattrosette, im zweiten treibt sie einen bis zu 75 cm hohen Blütenstängel."

- ingredient: chives
  articles:
    en-GB: {title: "Chives", revision: 1368912750}
    de-AT: {title: "Schnittlauch", revision: 272285882}
  facts:
    - key: both-worlds
      source: en-GB
      text:
        en-GB: "Chives are the only species of Allium native to both the Old World and the New World."
        de-AT: "Schnittlauch ist die einzige Lauchart, die sowohl in der Alten als auch in der Neuen Welt heimisch ist."
    - key: rush-leek
      source: en-GB
      text:
        en-GB: "The species name schoenoprasum combines the Greek words for rush and leek, and in the Middle Ages chives were known as rush leek."
        de-AT: "Der Artname schoenoprasum verbindet die griechischen Wörter für Binse und Lauch. Im Mittelalter hieß Schnittlauch auf Englisch auch „rush leek“, Binsenlauch."
    - key: insects
      source: en-GB
      text:
        en-GB: "Their sulphur compounds keep most insects away, yet the flowers attract bees, so gardeners plant chives to encourage useful insects."
        de-AT: "Seine Schwefelverbindungen halten die meisten Insekten fern, die Blüten locken aber Bienen an. Deshalb wird Schnittlauch auch gepflanzt, um nützliche Insekten anzuziehen."

- ingredient: dill
  articles:
    en-GB: {title: "Dill", revision: 1373033162}
    de-AT: {title: "Dill (Pflanze)", revision: 265745675}
  facts:
    - key: amenhotep
      source: en-GB
      text:
        en-GB: "Dill was found in the tomb of the Egyptian pharaoh Amenhotep II, dating from around 1400 BC."
        de-AT: "Im Grab des ägyptischen Pharaos Amenophis II. aus der Zeit um 1400 v. Chr. wurde Dille gefunden."
    - key: dill-and-anise
      source: en-GB
      text:
        en-GB: "The Greek word behind the genus name Anethum meant both dill and anise. Latin later split it into anisum for anise and anethum for dill."
        de-AT: "Das griechische Wort hinter dem Gattungsnamen Anethum bedeutete sowohl Dille als auch Anis. Erst das Lateinische trennte es in anisum für Anis und anethum für Dille."

- ingredient: basil
  articles:
    en-GB: {title: "Basil", revision: 1375753314}
    de-AT: {title: "Basilikum", revision: 272121653}
  facts:
    - key: royal-plant
      source: en-GB
      text:
        en-GB: "Basil comes from the Greek basilikón phytón, the royal plant, perhaps because it was used in royal perfumes. In French it is sometimes called l'herbe royale."
        de-AT: "Basilikum kommt vom griechischen basilikón phytón, „königliche Pflanze“, vielleicht weil es für königliche Duftöle verwendet wurde. Auf Französisch heißt es manchmal l'herbe royale."
    - key: eugenol
      source: en-GB
      text:
        en-GB: "The clove note in sweet basil comes from eugenol, the same aroma compound that dominates cloves."
        de-AT: "Die nelkenartige Note im Basilikum stammt von Eugenol, demselben Aromastoff, der auch Gewürznelken prägt."

- ingredient: coriander
  articles:
    en-GB: {title: "Coriander", revision: 1388132118}
    de-AT: {title: "Echter Koriander", revision: 271004346}
  facts:
    - key: soap-gene
      source: en-GB
      text:
        en-GB: "Some people find coriander leaves soapy because of variations in OR6A2, a gene for a smell receptor that is highly sensitive to aldehydes, the main aroma compounds of coriander."
        de-AT: "Manche Menschen finden Koriandergrün seifig. Grund sind Varianten des Gens OR6A2 für einen Geruchsrezeptor, der stark auf Aldehyde anspricht, die Hauptaromastoffe des Korianders."
    - key: bed-bug
      source: en-GB
      text:
        en-GB: "The name coriander may come from the Greek kóris, bed bug, because of the plant's pungent bug-like smell."
        de-AT: "Der Name Koriander geht möglicherweise auf das griechische kóris zurück, die Bettwanze, wegen des strengen, wanzenartigen Geruchs der Pflanze."
    - key: tutankhamun
      source: en-GB
      text:
        en-GB: "About 500 millilitres of coriander seeds were found in the tomb of Tutankhamun."
        de-AT: "Im Grab des Tutanchamun fand man rund einen halben Liter Koriandersamen."

- ingredient: mint
  articles:
    en-GB: {title: "Mentha", revision: 1387596484}
    de-AT: {title: "Minzen", revision: 272306681}
  facts:
    - key: minthe
      source: en-GB
      text:
        en-GB: "In Greek myth Minthe was a nymph loved by Hades, whom Persephone or Demeter turned into a mint plant."
        de-AT: "Im griechischen Mythos war Minthe eine Nymphe, die Hades liebte. Persephone oder Demeter verwandelten sie in eine Minze."
    - key: hybrids
      source: en-GB
      text:
        en-GB: "Mints cross so readily that nobody knows exactly how many species there are. Estimates range from 18 to 24."
        de-AT: "Minzen kreuzen sich so leicht, dass niemand genau weiß, wie viele Arten es gibt. Die Schätzungen liegen zwischen 18 und 24."

- ingredient: rosemary
  articles:
    en-GB: {title: "Rosemary", revision: 1388091849}
    de-AT: {title: "Rosmarin", revision: 271444995}
  facts:
    - key: now-a-sage
      source: en-GB
      text:
        en-GB: "Since 2017 rosemary has officially been a sage. Molecular evidence moved it into the genus Salvia, so its scientific name is now Salvia rosmarinus."
        de-AT: "Seit 2017 gehört Rosmarin offiziell zu den Salbeien. Genetische Untersuchungen haben ihn in die Gattung Salvia verschoben, sein wissenschaftlicher Name lautet jetzt Salvia rosmarinus."
    - key: sea-dew
      source: en-GB
      text:
        en-GB: "The name comes from the Latin ros marinus, dew of the sea, and the plant does indeed thrive near the coast."
        de-AT: "Der Name kommt vom lateinischen ros marinus, „Tau des Meeres“, und tatsächlich gedeiht die Pflanze besonders gut in Küstennähe."
    - key: remembrance
      source: en-GB
      text:
        en-GB: "Rosemary has long stood for memory. In Shakespeare's Hamlet, Ophelia hands it out with the words that it is for remembrance."
        de-AT: "Rosmarin steht seit jeher für die Erinnerung. In Shakespeares „Hamlet“ verteilt Ophelia ihn mit den Worten, er sei zum Gedenken."

- ingredient: thyme
  articles:
    en-GB: {title: "Thyme", revision: 1368697748}
    de-AT: {title: "Echter Thymian", revision: 261537713}
  facts:
    - key: embalming
      source: en-GB
      text:
        en-GB: "The ancient Egyptians used common thyme for embalming, and the Greeks burned it as incense in their temples."
        de-AT: "Die alten Ägypter verwendeten Thymian zum Einbalsamieren, die Griechen verbrannten ihn in ihren Tempeln als Räucherwerk."
    - key: courage
      source: en-GB
      text:
        en-GB: "Thyme was long thought to bring courage. In the Middle Ages women gave knights and warriors gifts containing thyme leaves."
        de-AT: "Thymian galt lange als Quelle des Mutes. Im Mittelalter schenkten Frauen Rittern und Kriegern Gaben mit Thymianblättern."

- ingredient: sage
  articles:
    en-GB: {title: "Salvia officinalis", revision: 1385869857}
    de-AT: {title: "Echter Salbei", revision: 272480431}
  facts:
    - key: officina
      source: en-GB
      text:
        en-GB: "The name officinalis refers to the officina, the monastery storeroom where medicinal herbs were kept."
        de-AT: "Der Beiname officinalis verweist auf die officina, den Vorratsraum eines Klosters, in dem Heilkräuter aufbewahrt wurden."
    - key: charlemagne
      source: en-GB
      text:
        en-GB: "Charlemagne recommended growing sage in the early Middle Ages, and in the Carolingian Empire it was planted in monastery gardens."
        de-AT: "Karl der Große empfahl im frühen Mittelalter den Anbau von Salbei, und im Karolingerreich wuchs er in den Klostergärten."

- ingredient: marjoram
  articles:
    en-GB: {title: "Marjoram", revision: 1385953397}
    de-AT: {title: "Majoran", revision: 270182640}
  facts:
    - key: aphrodite
      source: en-GB
      text:
        en-GB: "The ancient Greeks believed marjoram had been created by Aphrodite, and Greeks and Romans saw it as a symbol of happiness."
        de-AT: "Die alten Griechen glaubten, Aphrodite habe den Majoran erschaffen. Bei Griechen und Römern galt er als Symbol des Glücks."
    - key: amaracus
      source: en-GB
      text:
        en-GB: "In one legend the royal perfumer of Cyprus, Amaracus, was turned into marjoram."
        de-AT: "Einer Legende nach wurde Amarakos, der königliche Parfümeur von Zypern, in Majoran verwandelt."

- ingredient: bay_leaf
  articles:
    en-GB: {title: "Bay leaf", revision: 1388201896}
    de-AT: {title: "Echter Lorbeer", revision: 270638750}
  facts:
    - key: killing-jars
      source: en-GB
      text:
        en-GB: "Bay leaves keep insects out of pantries and are also used in killing jars, the containers entomologists use to collect insects."
        de-AT: "Lorbeerblätter halten Insekten aus der Speisekammer fern und werden auch in Tötungsgläsern verwendet, mit denen Insektenkundler Tiere sammeln."
    - key: fish-them-out
      source: en-GB
      text:
        en-GB: "Bay leaves stay stiff even after long cooking, which is why they are usually taken out before serving."
        de-AT: "Lorbeerblätter bleiben auch nach langem Kochen steif. Deshalb werden sie meist vor dem Servieren wieder herausgefischt."

- ingredient: lemongrass
  articles:
    en-GB: {title: "Cymbopogon", revision: 1374628561}
    de-AT: {title: "Zitronengräser", revision: 261692659}
  facts:
    - key: citronella
      source: en-GB
      text:
        en-GB: "Lemongrass belongs to the genus Cymbopogon, whose relatives citronella grasses yield the citronella oil used in insect repellents and candles."
        de-AT: "Zitronengras gehört zur Gattung Cymbopogon, deren Verwandte, die Citronellgräser, das Citronellöl für Insektensprays und Duftkerzen liefern."
    - key: west-indian
      source: en-GB
      text:
        en-GB: "Despite its name, West Indian lemongrass, the usual kitchen species, is native to maritime Southeast Asia."
        de-AT: "Das Westindische Zitronengras, die übliche Küchenart, stammt trotz seines Namens aus dem maritimen Südostasien."

- ingredient: wild_garlic
  articles:
    en-GB: {title: "Allium ursinum", revision: 1375036004}
    de-AT: {title: "Bärlauch", revision: 271265965}
  facts:
    - key: bears
      source: en-GB
      text:
        en-GB: "The species name ursinum means of the bear. Folk tales tell of brown bears eating the bulbs after waking from hibernation."
        de-AT: "Der Artname ursinum verweist auf den Bären. Volkserzählungen berichten, dass Braunbären nach dem Winterschlaf die Zwiebeln fressen."
    - key: lookalikes
      source: en-GB
      text:
        en-GB: "Wild garlic leaves look much like those of poisonous lily of the valley and autumn crocus. The garlic smell test can fail once your fingers already smell of garlic."
        de-AT: "Bärlauchblätter sehen denen von giftigem Maiglöckchen und Herbstzeitloser sehr ähnlich. Der Geruchstest täuscht, sobald die Finger schon nach Knoblauch riechen."

- ingredient: lovage
  articles:
    en-GB: {title: "Lovage", revision: 1365919161}
    de-AT: {title: "Liebstöckel", revision: 268563438}
  facts:
    - key: love-ache
      source: en-GB
      text:
        en-GB: "The English name lovage is a folk twist on love-ache, ache being a medieval word for parsley. It goes back to the Latin ligusticum, of Liguria."
        de-AT: "Der englische Name lovage ist eine volkstümliche Umdeutung zu „love-ache“, wobei ache ein altes Wort für Petersilie war. Er geht auf das lateinische ligusticum zurück, „aus Ligurien“."
    - key: only-species
      source: en-GB
      text:
        en-GB: "Lovage is the only species in its genus, Levisticum, and tastes like a stronger, spicier mix of celery and parsley."
        de-AT: "Liebstöckel ist die einzige Art der Gattung Levisticum und schmeckt wie eine kräftigere, würzigere Mischung aus Sellerie und Petersilie."

- ingredient: tarragon
  articles:
    en-GB: {title: "Tarragon", revision: 1379153146}
    de-AT: {title: "Estragon", revision: 271409601}
  facts:
    - key: sterile-french
      source: en-GB
      text:
        en-GB: "French tarragon, the kitchen variety, has sterile flowers and cannot be grown from seed. It is propagated by dividing the roots."
        de-AT: "Französischer Estragon, die Küchensorte, hat sterile Blüten und lässt sich nicht aus Samen ziehen. Er wird durch Teilung der Wurzeln vermehrt."
    - key: tarkhuna
      source: en-GB
      text:
        en-GB: "Tarragon gives Tarkhuna, a fizzy drink from Georgia also popular in Armenia and Russia, both its flavour and its bright green colour."
        de-AT: "Estragon verleiht Tarchuna, einer Limonade aus Georgien, die auch in Armenien und Russland beliebt ist, ihren Geschmack und ihre leuchtend grüne Farbe."

- ingredient: chervil
  articles:
    en-GB: {title: "Chervil", revision: 1360920171}
    de-AT: {title: "Echter Kerbel", revision: 265239143}
  facts:
    - key: leaves-of-joy
      source: en-GB
      text:
        en-GB: "The name chervil goes back to the Latin chaerephyllum, from a Greek word meaning leaves of joy."
        de-AT: "Der Name Kerbel geht auf das lateinische chaerephyllum zurück, nach einem griechischen Wort für „Blätter der Freude“."
    - key: fines-herbes
      source: en-GB
      text:
        en-GB: "Chervil is one of the four classic French fines herbes, along with tarragon, chives and parsley, which are added at the very last minute."
        de-AT: "Kerbel gehört mit Estragon, Schnittlauch und Petersilie zu den vier klassischen französischen fines herbes, die erst ganz zum Schluss dazukommen."

- ingredient: cress
  articles:
    en-GB: {title: "Garden cress", revision: 1380942921}
    de-AT: {title: "Gartenkresse", revision: 270871554}
  facts:
    - key: damp-paper
      source: en-GB
      text:
        en-GB: "Garden cress sprouts readily on damp paper or cotton wool and grows so fast that it is a classic for demonstrating plant growth."
        de-AT: "Gartenkresse keimt problemlos auf feuchtem Papier oder Watte und wächst so schnell, dass sie ein Klassiker für Wachstumsversuche ist."
    - key: poor-mans-pepper
      source: en-GB
      text:
        en-GB: "Garden cress is related to watercress and mustard, and its peppery bite earned it names such as pepperwort and poor man's pepper."
        de-AT: "Gartenkresse ist mit Brunnenkresse und Senf verwandt. Die pfeffrige Schärfe brachte ihr englische Namen wie „poor man's pepper“, Pfeffer des armen Mannes, ein."

- ingredient: fresh_oregano
  articles:
    en-GB: {title: "Oregano", revision: 1387896742}
    de-AT: {title: "Oregano", revision: 271179153}
  facts:
    - key: pizza-herb
      source: en-GB
      text:
        en-GB: "Oregano became popular in the United States only after soldiers returning from the Second World War brought home a taste for the pizza herb from southern Italy."
        de-AT: "In den USA wurde Oregano erst populär, als Soldaten aus dem Zweiten Weltkrieg den Geschmack am „Pizzakraut“ aus Süditalien mit nach Hause brachten."
    - key: mountain-joy
      source: en-GB
      text:
        en-GB: "Oregano may come from the Greek óros, mountain, and gános, joy, though the Oxford English Dictionary thinks it is more likely a loanword."
        de-AT: "Der Name Oregano stammt vielleicht vom griechischen óros, Berg, und gános, Freude. Das Oxford English Dictionary hält ein Lehnwort aber für wahrscheinlicher."
    - key: dried-stronger
      source: en-GB
      text:
        en-GB: "Unusually for a leafy herb, oregano can taste more intense dried than fresh. Its aroma comes mainly from carvacrol and thymol."
        de-AT: "Anders als die meisten Blattkräuter kann Oregano getrocknet intensiver schmecken als frisch. Sein Aroma stammt vor allem von Carvacrol und Thymol."

- ingredient: lemon_balm
  articles:
    en-GB: {title: "Lemon balm", revision: 1375912388}
    de-AT: {title: "Zitronenmelisse", revision: 270021424}
  facts:
    - key: honey-bee
      source: en-GB
      text:
        en-GB: "The genus name Melissa is the Ancient Greek word for honey bee, because bees love the plant's flowers. It has been grown to attract bees since at least the 16th century."
        de-AT: "Der Gattungsname Melissa ist das altgriechische Wort für Honigbiene, weil Bienen die Blüten lieben. Seit mindestens dem 16. Jahrhundert wird sie gezielt für Bienen angepflanzt."
    - key: seventh-century
      source: en-GB
      text:
        en-GB: "Lemon balm, a member of the mint family, was formally introduced into Europe in the 7th century."
        de-AT: "Die Zitronenmelisse, ein Lippenblütler wie die Minze, wurde im 7. Jahrhundert in Europa eingeführt."

- ingredient: savory
  articles:
    en-GB: {title: "Summer savory", revision: 1384739567}
    de-AT: {title: "Sommer-Bohnenkraut", revision: 265028521}
  facts:
    - key: bulgarian-table
      source: en-GB
      text:
        en-GB: "Instead of salt and pepper, a Bulgarian table traditionally has three condiments: salt, sweet red pepper and summer savory."
        de-AT: "Statt Salz und Pfeffer stehen auf einem bulgarischen Tisch traditionell drei Würzen: Salz, edelsüßer Paprika und Bohnenkraut."
    - key: aphids
      source: en-GB
      text:
        en-GB: "Savory has a natural affinity with beans, and grown next to broad beans it helps keep aphids away."
        de-AT: "Bohnenkraut passt von Natur aus zu Bohnen. Neben Saubohnen gepflanzt hilft es außerdem, Blattläuse fernzuhalten."

- ingredient: thai_basil
  articles:
    en-GB: {title: "Thai basil", revision: 1383579644}
    de-AT: {title: "Thai-Basilikum", revision: 243081196}
  facts:
    - key: heat-stable
      source: en-GB
      text:
        en-GB: "Thai basil is a cultivar of sweet basil with an anise and liquorice scent, and it holds up to high or long cooking better than sweet basil."
        de-AT: "Thai-Basilikum ist eine Sorte des gewöhnlichen Basilikums mit Anis- und Lakritznote. Es verträgt hohe Temperaturen und lange Garzeiten besser als dieses."
    - key: square-stem
      source: en-GB
      text:
        en-GB: "Thai basil has a purple stem that, like those of other mint family plants, is square in cross-section."
        de-AT: "Thai-Basilikum hat einen violetten Stängel, der wie bei anderen Lippenblütlern im Querschnitt quadratisch ist."

- ingredient: kaffir_lime_leaves
  articles:
    en-GB: {title: "Kaffir lime", revision: 1381417220}
    de-AT: {title: "Kaffernlimette", revision: 264250187}
  facts:
    - key: hourglass
      source: en-GB
      text:
        en-GB: "The hourglass-shaped leaf is really two parts: the leaf blade and a flattened, leaf-like winged stalk."
        de-AT: "Das sanduhrförmige Blatt besteht eigentlich aus zwei Teilen: der Blattspreite und einem flachen, blattartig geflügelten Stiel."
    - key: wart-lime
      source: en-GB
      text:
        en-GB: "In Javanese and Malay the fruit is called wart lime, after its bumpy skin. Many cooks now prefer the Thai name makrut."
        de-AT: "Auf Javanisch und Malaiisch heißt die Frucht wegen ihrer höckrigen Schale „Warzenlimette“. Heute wird oft der thailändische Name Makrut verwendet."

- ingredient: curry_leaves
  articles:
    en-GB: {title: "Curry tree", revision: 1385105956}
    de-AT: {title: "Currybaum", revision: 272373217}
  facts:
    - key: citrus-family
      source: en-GB
      text:
        en-GB: "The curry tree belongs to the citrus family. Its leaves have been used in South Asian cooking for millennia and appear in Tamil literature from the 1st to 4th centuries CE."
        de-AT: "Der Currybaum gehört zu den Rautengewächsen wie die Zitrusfrüchte. Seine Blätter werden seit Jahrtausenden verwendet und schon in tamilischer Literatur des 1. bis 4. Jahrhunderts erwähnt."
    - key: kari
      source: en-GB
      text:
        en-GB: "The word curry comes from the Tamil kari, a spiced sauce. Curry leaves are usually fried in oil with mustard seeds at the very start of cooking."
        de-AT: "Das Wort Curry kommt vom tamilischen kari, „gewürzte Sauce“. Curryblätter werden meist ganz am Anfang mit Senfkörnern in Öl angebraten."

- ingredient: white_bread
  articles:
    en-GB: {title: "White bread", revision: 1384051187}
    de-AT: {title: "Weißbrot", revision: 259381368}
  facts:
    - key: luxury
      source: en-GB
      text:
        en-GB: "Because wheat was the dearest grain and sifting flour took so much labour, white bread was mostly a food for the wealthy and for special occasions until the mid-19th century."
        de-AT: "Weil Weizen das teuerste Getreide war und das Sieben des Mehls viel Arbeit machte, war Weißbrot bis Mitte des 19. Jahrhunderts meist den Reichen und Festtagen vorbehalten."
    - key: industrial-symbol
      source: en-GB
      text:
        en-GB: "Once industrial milling made it cheap, white bread became a symbol of the success of industrialisation, especially after machine-sliced bread arrived in the 1920s."
        de-AT: "Als die industrielle Herstellung es billig machte, wurde Weißbrot zum Symbol für den Erfolg der Industrialisierung, vor allem nach dem Aufkommen von maschinell geschnittenem Brot in den 1920er-Jahren."

- ingredient: wholemeal_bread
  articles:
    en-GB: {title: "Whole wheat bread", revision: 1387443108}
    de-AT: {title: "Vollkornbrot", revision: 268346457}
  facts:
    - key: meal-mill
      source: en-GB
      text:
        en-GB: "The meal in wholemeal is an old word for flour, from Old English melu, and is related to mill and to the German Mehl."
        de-AT: "Das englische meal in wholemeal ist ein altes Wort für Mehl. Es stammt vom altenglischen melu und ist mit mill, Mühle, und dem deutschen Mehl verwandt."
    - key: caramel-colour
      source: en-GB
      text:
        en-GB: "Much of the bread sold in the US as wheat bread is mostly white flour, coloured with caramel to look more wholegrain than it is."
        de-AT: "Viel von dem, was in den USA als „wheat bread“ verkauft wird, besteht großteils aus Weißmehl und ist mit Karamell gefärbt, damit es nach mehr Vollkorn aussieht."

- ingredient: rye_bread
  articles:
    en-GB: {title: "Rye bread", revision: 1386663202}
    de-AT: {title: "Roggenbrot", revision: 270833687}
  facts:
    - key: amylase
      source: en-GB
      text:
        en-GB: "Rye flour contains starch-splitting amylases that stay active at much higher temperatures than those in wheat and can wreck the dough. Sourdough acid keeps them in check."
        de-AT: "Roggenmehl enthält stärkespaltende Amylasen, die bei viel höheren Temperaturen aktiv bleiben als beim Weizen und den Teig zerstören können. Die Säure des Sauerteigs bremst sie."
    - key: pentosans
      source: en-GB
      text:
        en-GB: "Rye gluten is weak, so a rye loaf gets its structure not from gluten but from rye starch and complex sugars called pentosans."
        de-AT: "Das Klebereiweiß des Roggens ist schwach. Ein Roggenbrot verdankt seine Struktur daher nicht dem Gluten, sondern der Roggenstärke und Vielfachzuckern, den Pentosanen."

- ingredient: mixed_bread
  articles:
    en-GB: {title: "Rye bread", revision: 1386663202}
    de-AT: {title: "Mischbrot", revision: 266187857}
  facts:
    - key: schwarzbrot
      source: de-AT
      text:
        en-GB: "In Austria, southern Germany and Switzerland, Schwarzbrot usually means a mixed wheat and rye loaf, which is called Graubrot in parts of Germany."
        de-AT: "In Österreich, Süddeutschland und der Schweiz meint man mit Schwarzbrot meist ein Mischbrot aus Weizen- und Roggenmehl, in Teilen Deutschlands heißt es Graubrot."
    - key: 50-90-rule
      source: de-AT
      text:
        en-GB: "Under German food rules, a rye mixed bread has more than 50% rye, and from over 90% it counts as rye bread. More rye keeps the loaf fresh for longer."
        de-AT: "Nach deutschem Lebensmittelrecht hat ein Roggenmischbrot über 50 % Roggen, ab über 90 % gilt es als Roggenbrot. Je mehr Roggen, desto länger bleibt das Brot frisch."

- ingredient: toast_bread
  articles:
    en-GB: {title: "Toast (food)", revision: 1387138681}
    de-AT: {title: "Toastbrot", revision: 272490370}
  facts:
    - key: torrere
      source: de-AT
      text:
        en-GB: "The word toast goes back to the Latin torrere, to parch or dry. Toasted slices of almost any bread used to be called Bähschnitten in German."
        de-AT: "Das Wort Toast geht auf das lateinische torrere, „dörren“, zurück. Geröstete Scheiben von fast jedem Brot hießen früher Bähschnitten."
    - key: drink-flavour
      source: en-GB
      text:
        en-GB: "In the 15th and 16th centuries, toast was used to flavour drinks and then thrown away or eaten, and even in the 1600s it was still mainly something to put into drinks."
        de-AT: "Im 15. und 16. Jahrhundert diente geröstetes Brot dazu, Getränke zu aromatisieren, und wurde danach weggeworfen oder gegessen. Auch im 17. Jahrhundert tauchte man Toast noch vor allem in Getränke."
    - key: protein-aroma
      source: de-AT
      text:
        en-GB: "Toast bread has a fine crumb thanks to its high protein content, and that protein, together with sugar and fat, produces the roasted aroma of the Maillard reaction."
        de-AT: "Toastbrot bekommt seine feine Porung durch den hohen Eiweißgehalt. Eiweiß, Zucker und Fett sorgen beim Toasten dann für das typische Röstaroma der Maillard-Reaktion."

- ingredient: roll
  articles:
    en-GB: {title: "Bread roll", revision: 1388119855}
    de-AT: {title: "Semmel", revision: 266873588}
  facts:
    - key: many-names
      source: en-GB
      text:
        en-GB: "The German-speaking world has many names for a bread roll: Semmel in Austria, Saxony and southern Bavaria, Schrippe in Berlin, Weck in Baden-Württemberg and Rundstück in Hamburg."
        de-AT: "Für das Brötchen gibt es im deutschen Sprachraum viele Namen: Semmel in Österreich, Sachsen und Südbayern, Schrippe in Berlin, Weckle in Baden-Württemberg und Rundstück in Hamburg."
    - key: michetta
      source: en-GB
      text:
        en-GB: "The Kaisersemmel lives on in Italy as the michetta or rosetta."
        de-AT: "Die Kaisersemmel taucht in Italien als Michetta oder Rosetta wieder auf."

- ingredient: baguette
  articles:
    en-GB: {title: "Baguette", revision: 1380944137}
    de-AT: {title: "Baguette", revision: 271094355}
  facts:
    - key: wand
      source: en-GB
      text:
        en-GB: "Baguette means wand or stick in French, the same word as in baguette magique, a magic wand, and baguettes chinoises, chopsticks."
        de-AT: "Baguette bedeutet auf Französisch Stab oder Stäbchen, wie in baguette magique, Zauberstab, oder baguettes chinoises, Essstäbchen."
    - key: unesco
      source: en-GB
      text:
        en-GB: "In 2022 the artisanal know-how and culture of the baguette were inscribed on UNESCO's Intangible Cultural Heritage lists."
        de-AT: "2022 wurden das handwerkliche Wissen und die Kultur rund um das Baguette in die UNESCO-Listen des immateriellen Kulturerbes aufgenommen."
    - key: viennese-steam
      source: en-GB
      text:
        en-GB: "Viennese steam-oven baking reached Paris in 1839 with August Zang, and in 1867 the Austrian Adolf Ignaz Mautner von Markhof showed his compressed yeast there."
        de-AT: "1839 brachte August Zang das Wiener Backen mit Dampf nach Paris, und 1867 präsentierte dort der Österreicher Adolf Ignaz Mautner von Markhof seine Presshefe."

- ingredient: croissant
  articles:
    en-GB: {title: "Croissant", revision: 1378299546}
    de-AT: {title: "Croissant", revision: 270666370}
  facts:
    - key: kipferl
      source: en-GB
      text:
        en-GB: "The croissant was inspired by the Austrian Kipferl, which dates back to at least the 13th century. French bakers swapped its dough for laminated yeast dough in the early 20th century."
        de-AT: "Vorbild des Croissants ist das österreichische Kipferl, das mindestens bis ins 13. Jahrhundert zurückreicht. Französische Bäcker ersetzten seinen Teig Anfang des 20. Jahrhunderts durch Plunderteig."
    - key: boulangerie-viennoise
      source: en-GB
      text:
        en-GB: "In 1838 or 1839 the Austrian artillery officer August Zang opened a Viennese bakery in the rue de Richelieu in Paris, which made Viennese pastries famous there."
        de-AT: "1838 oder 1839 eröffnete der österreichische Artillerieoffizier August Zang in der Pariser Rue de Richelieu eine Wiener Bäckerei, die das Wiener Gebäck in Paris berühmt machte."
    - key: laminating
      source: en-GB
      text:
        en-GB: "For croissant dough, butter is layered into the dough, which is then rolled and folded several times in a row, a technique called laminating."
        de-AT: "Beim Croissantteig wird Butter eingeschlagen und der Teig mehrmals hintereinander ausgerollt und gefaltet. Diese Technik nennt man Tourieren."

- ingredient: tortilla
  articles:
    en-GB: {title: "Tortilla", revision: 1387094252}
    de-AT: {title: "Tortilla (Mexiko)", revision: 271116978}
  facts:
    - key: little-cake
      source: en-GB
      text:
        en-GB: "Tortilla means little cake, from the Spanish torta plus a diminutive ending. The Aztecs called it tlaxcalli in Nahuatl."
        de-AT: "Tortilla heißt „kleiner Kuchen“, von spanisch torta und einer Verkleinerungsendung. Die Azteken nannten sie auf Nahuatl tlaxcalli."
    - key: nixtamal
      source: en-GB
      text:
        en-GB: "For corn tortillas, the maize is treated with limewater, a process called nixtamalisation, which turns it into the dough known as masa."
        de-AT: "Für Maistortillas wird der Mais in Kalkwasser eingeweicht. Dieses Verfahren heißt Nixtamalisation und macht ihn zu einem Teig, der Masa."
    - key: flour-later
      source: en-GB
      text:
        en-GB: "Wheat flour tortillas only appeared after the Spanish brought wheat to Mexico, and they caught on mainly among settlers in the north."
        de-AT: "Weizentortillas entstanden erst, als die Spanier den Weizen nach Mexiko brachten. Verbreitet wurden sie vor allem bei den Siedlern im Norden."

- ingredient: breadcrumbs
  articles:
    en-GB: {title: "Breadcrumbs", revision: 1382170144}
    de-AT: {title: "Paniermehl", revision: 219827828}
  facts:
    - key: paner
      source: de-AT
      text:
        en-GB: "The German word Paniermehl comes from the French paner, to coat with grated bread. In Austria the crumbs are better known as Semmelbrösel."
        de-AT: "Das Wort Paniermehl kommt vom französischen paner, „mit geriebenem Brot bestreuen“. In Österreich sagt man meist Semmelbrösel."
    - key: butter-brosel
      source: de-AT
      text:
        en-GB: "Toasted golden in plenty of butter, breadcrumbs become a topping for sweet strudels and dumplings, and in Polish cooking a classic garnish for vegetables known as polonaise."
        de-AT: "In reichlich Butter goldbraun geröstet, kommen Brösel auf süße Strudel und Knödel. In der polnischen Küche sind sie als „Polonaise“ eine klassische Beigabe zu Gemüse."

- ingredient: bread_cubes
  articles:
    en-GB: {title: "Knödel", revision: 1370405811}
    de-AT: {title: "Knödelbrot", revision: 234587227}
  facts:
    - key: knot
      source: en-GB
      text:
        en-GB: "The word Knödel is related to the English knot and the Latin nodus. Bread dumplings, Semmelknödel, are made from dried white bread, milk and egg yolks."
        de-AT: "Das Wort Knödel ist mit dem englischen knot und dem lateinischen nodus, „Knoten“, verwandt. Semmelknödel entstehen aus getrocknetem Weißbrot, Milch und Eidotter."
    - key: semmelwuerfel
      source: de-AT
      text:
        en-GB: "Knödelbrot, also called Semmelwürfel and in Franconia Breggerla, is diced white bread made specially for dumplings."
        de-AT: "Knödelbrot, auch Semmelwürfel und in Franken Breggerla genannt, sind zerkleinerte Weißgebäcke, die eigens für Knödel verwendet werden."

- ingredient: pretzel
  articles:
    en-GB: {title: "Pretzel", revision: 1378707752}
    de-AT: {title: "Brezel", revision: 272099979}
  facts:
    - key: bakers-emblem
      source: en-GB
      text:
        en-GB: "The pretzel has been the emblem of bakers and their guilds in southern Germany since at least the 12th century."
        de-AT: "Die Brezel ist mindestens seit dem 12. Jahrhundert das Zunftzeichen der Bäcker im süddeutschen Raum."
    - key: lye
      source: en-GB
      text:
        en-GB: "Pretzels get their shiny brown skin and typical flavour from a dip in lye or washing soda before baking, which speeds up the Maillard reaction."
        de-AT: "Die glänzend braune Kruste und den typischen Geschmack bekommt die Brezel durch ein Bad in Natronlauge oder Soda vor dem Backen, das die Maillard-Reaktion fördert."
    - key: little-arms
      source: en-GB
      text:
        en-GB: "The name Brezel may come from the Latin bracchiola, little arms, a nod to the crossed arms of its knot."
        de-AT: "Der Name Brezel geht möglicherweise auf das lateinische bracchiola, „Ärmchen“, zurück, denn ihre Form erinnert an verschränkte Arme."

- ingredient: puff_pastry
  articles:
    en-GB: {title: "Puff pastry", revision: 1381378947}
    de-AT: {title: "Blätterteig", revision: 270075167}
  facts:
    - key: steam-lift
      source: en-GB
      text:
        en-GB: "Puff pastry rises without any yeast: during baking the water in the butter turns to steam and pushes the thin layers of dough apart."
        de-AT: "Blätterteig geht ganz ohne Hefe auf. Beim Backen verdampft das Wasser in der Butter und drückt die dünnen Teigschichten auseinander."
    - key: la-varenne
      source: en-GB
      text:
        en-GB: "The first recipe to describe folding solid butter into dough layer by layer was published by François Pierre La Varenne in 1651 in Le cuisinier français."
        de-AT: "Das erste Rezept, das das schichtweise Einschlagen fester Butter in den Teig beschreibt, veröffentlichte François Pierre La Varenne 1651 in „Le cuisinier français“."
    - key: 16-degrees
      source: en-GB
      text:
        en-GB: "Puff pastry has to be kept at around 16 °C while it is made so the fat does not melt, and it needs rests between folds so the layers stay separate."
        de-AT: "Blätterteig muss bei der Herstellung auf etwa 16 °C gehalten werden, damit das Fett nicht schmilzt. Zwischen dem Falten braucht er Pausen, damit die Schichten getrennt bleiben."

- ingredient: filo
  articles:
    en-GB: {title: "Filo", revision: 1388194148}
    de-AT: {title: "Yufka", revision: 260495483}
  facts:
    - key: leaf
      source: en-GB
      text:
        en-GB: "Filo is the Greek word for leaf, after the pastry's paper-thin sheets."
        de-AT: "Filo ist das griechische Wort für Blatt, nach den hauchdünnen Teigblättern."
    - key: ottoman-strudel
      source: en-GB
      text:
        en-GB: "Paper-thin filo was developed in the Ottoman Empire by the 15th century. After the Ottoman conquest of Hungary, sources there mention rétes, the first recorded name for strudel."
        de-AT: "Der hauchdünne Filoteig entstand spätestens im 15. Jahrhundert im Osmanischen Reich. Nach der osmanischen Eroberung Ungarns ist dort von rétes die Rede, dem ersten belegten Namen für Strudel."

- ingredient: shortcrust
  articles:
    en-GB: {title: "Shortcrust pastry", revision: 1385933314}
    de-AT: {title: "Mürbeteig", revision: 270636174}
  facts:
    - key: half-fat
      source: en-GB
      text:
        en-GB: "Shortcrust recipes usually use twice as much flour as fat by weight. British cooks often mix butter for flavour with lard for texture."
        de-AT: "Für Mürbteig nimmt man meist doppelt so viel Mehl wie Fett. In Großbritannien wird oft Butter für den Geschmack mit Schmalz für die Konsistenz gemischt."
    - key: sablee
      source: en-GB
      text:
        en-GB: "French pâte sablée gets more sugar, which hinders the gluten strands and gives a pastry that crumbles easily in the mouth."
        de-AT: "Die französische pâte sablée enthält mehr Zucker. Er hemmt die Bildung des Klebers, und der Teig zerfällt dadurch leicht im Mund."

- ingredient: biscuits
  articles:
    en-GB: {title: "Butter cookie", revision: 1384038102}
    de-AT: {title: "Keks", revision: 272442344}
  facts:
    - key: blue-tin
      source: en-GB
      text:
        en-GB: "Danish butter cookies come in a cylindrical blue tin that has become a cultural icon, because so many households reuse it to store sewing kits."
        de-AT: "Dänische Butterkekse stecken in einer runden blauen Dose, die Kultstatus hat, weil sie in unzähligen Haushalten als Nähkästchen weiterverwendet wird."
    - key: cakes-plural
      source: de-AT
      text:
        en-GB: "The German word Keks comes from cakes, the English plural of cake. In Austrian standard German it is usually das Keks."
        de-AT: "Das Wort Keks kommt von cakes, der englischen Mehrzahl von cake. Im österreichischen Hochdeutsch heißt es meist das Keks."
    - key: leibniz-teeth
      source: de-AT
      text:
        en-GB: "Rectangular butter biscuits with four big corners, 14 teeth along the length and 10 across have existed since 1886. Bahlsen's Leibniz biscuit followed in 1891."
        de-AT: "Rechteckige Butterkekse mit vier großen Ecken, 14 Zähnen in der Länge und 10 in der Breite gibt es seit 1886. 1891 folgte der Leibniz-Keks von Bahlsen."

- ingredient: ladyfingers
  articles:
    en-GB: {title: "Ladyfingers (biscuits)", revision: 1376496858}
    de-AT: {title: "Löffelbiskuit", revision: 266136970}
  facts:
    - key: savoy
      source: en-GB
      text:
        en-GB: "Ladyfingers are said to have been created at the court of Savoy in the 14th century to mark a visit by the King of France, hence their Italian name savoiardi."
        de-AT: "Biskotten sollen im 14. Jahrhundert am Hof von Savoyen zum Besuch des französischen Königs erfunden worden sein. Daher stammt auch ihr italienischer Name Savoiardi."
    - key: soakers
      source: en-GB
      text:
        en-GB: "Being dry and airy, ladyfingers are made to be soaked in syrup, liqueur or, for tiramisu, espresso."
        de-AT: "Weil sie trocken und luftig sind, eignen sich Biskotten perfekt zum Tränken mit Sirup, Likör oder für Tiramisu mit Espresso."

- ingredient: sourdough_bread
  articles:
    en-GB: {title: "Sourdough", revision: 1387996343}
    de-AT: {title: "Sauerteig", revision: 272329850}
  facts:
    - key: 3700-bc
      source: en-GB
      text:
        en-GB: "One of the oldest known sourdough breads, from 3700 BC, was dug up in Switzerland. Baker's yeast, by contrast, has been used for less than 150 years."
        de-AT: "Eines der ältesten bekannten Sauerteigbrote stammt aus der Zeit um 3700 v. Chr. und wurde in der Schweiz ausgegraben. Backhefe ist dagegen erst seit weniger als 150 Jahren im Einsatz."
    - key: sanfranciscensis
      source: en-GB
      text:
        en-GB: "A sourdough bacterium is named after San Francisco: Fructilactobacillus sanfranciscensis, after the city's famously sour bread."
        de-AT: "Ein Sauerteigbakterium trägt San Francisco im Namen: Fructilactobacillus sanfranciscensis, benannt nach dem berühmt sauren Brot der Stadt."
    - key: klondike
      source: en-GB
      text:
        en-GB: "Gold prospectors carried sourdough to Alaska and the Yukon in the Klondike Gold Rush of 1898, because yeast and baking soda were unreliable in those conditions."
        de-AT: "Goldsucher brachten den Sauerteig im Klondike-Goldrausch 1898 nach Alaska und ins Yukon-Gebiet, weil Hefe und Natron unter den rauen Bedingungen unzuverlässig waren."

- ingredient: panko
  articles:
    en-GB: {title: "Breadcrumbs", revision: 1382170144}
    de-AT: {title: "Panko (Paniermehl)", revision: 271889480}
  facts:
    - key: electric-bread
      source: en-GB
      text:
        en-GB: "Panko is made from bread baked by passing an electric current through the dough, which gives a loaf with no crust that is then ground into fine slivers."
        de-AT: "Panko wird aus Brot gemacht, das mit elektrischem Strom durch den Teig gebacken wird. So entsteht ein Brot ganz ohne Kruste, das dann zu feinen Splittern zermahlen wird."
    - key: airier
      source: en-GB
      text:
        en-GB: "Panko is crisper and airier than most Western breadcrumbs and keeps its texture when baked or deep-fried, giving a lighter coating."
        de-AT: "Panko ist knuspriger und luftiger als die meisten westlichen Brösel. Es bleibt beim Backen und Frittieren knusprig und ergibt eine leichtere Panier."

- ingredient: egg
  articles:
    en-GB: {title: "Eggs as food", revision: 1384621689}
    de-AT: {title: "Ei (Lebensmittel)", revision: 266834036}
  facts:
    - key: 300-eggs
      source: en-GB
      text:
        en-GB: "The wild Asian jungle fowl lays about a dozen eggs a year. Millennia of breeding have produced hens that lay more than 300 a year, all year round."
        de-AT: "Das wilde asiatische Bankivahuhn legt etwa ein Dutzend Eier im Jahr. Jahrtausende der Zucht haben Hennen hervorgebracht, die über 300 Eier im Jahr legen, und das ganzjährig."
    - key: greece-quail
      source: en-GB
      text:
        en-GB: "Chickens reached Sumer and Egypt by 1500 BCE and Greece around 800 BCE. Until then the Greeks got their eggs mainly from quails."
        de-AT: "Hühner kamen um 1500 v. Chr. nach Sumer und Ägypten und um 800 v. Chr. nach Griechenland. Bis dahin aßen die Griechen vor allem Wachteleier."
    - key: candling
      source: en-GB
      text:
        en-GB: "Eggs can be candled, held against a bright light, to check their quality from inside without breaking them."
        de-AT: "Eier lassen sich durchleuchten, also gegen ein helles Licht halten, um ihre Qualität von innen zu prüfen, ohne sie aufzuschlagen."

- ingredient: egg_yolk
  articles:
    en-GB: {title: "Yolk", revision: 1385357414}
    de-AT: {title: "Eigelb", revision: 261703499}
  facts:
    - key: feed-colour
      source: en-GB
      text:
        en-GB: "The yellow of a yolk comes from xanthophylls such as lutein and zeaxanthin, and its shade depends directly on what the hen eats."
        de-AT: "Das Gelb des Dotters stammt von Xanthophyllen wie Lutein und Zeaxanthin. Wie kräftig es ist, hängt direkt vom Futter der Henne ab."
    - key: lecithin
      source: en-GB
      text:
        en-GB: "Egg yolk is about 9% lecithin by weight, which makes it a natural emulsifier for mayonnaise and hollandaise."
        de-AT: "Eidotter besteht zu etwa 9 % aus Lecithin und ist deshalb ein natürlicher Emulgator für Mayonnaise und Sauce hollandaise."

- ingredient: egg_white
  articles:
    en-GB: {title: "Egg white", revision: 1373670142}
    de-AT: {title: "Eiklar", revision: 269132373}
  facts:
    - key: albumen-prints
      source: en-GB
      text:
        en-GB: "From about 1855 to 1890, egg white was used as the binder in early photographs, known as albumen prints."
        de-AT: "Von etwa 1855 bis 1890 diente Eiklar in der frühen Fotografie als Bindemittel. Solche Abzüge heißen Albuminpapierabzüge."
    - key: wine-fining
      source: en-GB
      text:
        en-GB: "Egg white is about 90% water and 10% protein, and winemakers use it as a fining agent to clarify and stabilise wine."
        de-AT: "Eiklar besteht zu etwa 90 % aus Wasser und zu 10 % aus Eiweiß. Winzer nutzen es zum Schönen, um Wein zu klären und zu stabilisieren."

- ingredient: milk
  articles:
    en-GB: {title: "Milk", revision: 1384497798}
    de-AT: {title: "Milch", revision: 272149481}
  facts:
    - key: pasteur-wine
      source: en-GB
      text:
        en-GB: "Louis Pasteur invented pasteurisation in 1863, but originally as a way to stop wine and beer from souring."
        de-AT: "Louis Pasteur erfand die Pasteurisierung 1863, ursprünglich aber, um Wein und Bier vor dem Sauerwerden zu schützen."
    - key: fat-globules
      source: en-GB
      text:
        en-GB: "Milk is an emulsion of tiny fat globules in water. In unhomogenised cow's milk they average two to four micrometres across, and homogenisation breaks them much smaller."
        de-AT: "Milch ist eine Emulsion aus winzigen Fettkügelchen in Wasser. In nicht homogenisierter Kuhmilch messen sie im Schnitt zwei bis vier Mikrometer, das Homogenisieren macht sie viel kleiner."
    - key: india
      source: en-GB
      text:
        en-GB: "India is the world's largest producer of milk, both from cows and from buffaloes."
        de-AT: "Indien ist der größte Milchproduzent der Welt, sowohl bei Kuh- als auch bei Büffelmilch."

- ingredient: semi_skimmed_milk
  articles:
    en-GB: {title: "Skimmed milk", revision: 1346814125}
    de-AT: {title: "Milch", revision: 272149481}
  facts:
    - key: pig-feed
      source: en-GB
      text:
        en-GB: "Skimmed milk was historically used to fatten pigs and was praised as the very best supplement for growing pigs."
        de-AT: "Entrahmte Milch diente früher zur Schweinemast und wurde als bestes Zusatzfutter für junge Schweine gepriesen."
    - key: uk-colours
      source: en-GB
      text:
        en-GB: "In the UK, semi-skimmed milk has around 1.8% fat and is sold in green packaging, while whole milk comes in blue."
        de-AT: "In Großbritannien hat teilentrahmte Milch rund 1,8 % Fett und steckt in grüner Verpackung, Vollmilch dagegen in blauer."

- ingredient: buttermilk
  articles:
    en-GB: {title: "Buttermilk", revision: 1385989822}
    de-AT: {title: "Buttermilch", revision: 267143452}
  facts:
    - key: leftover
      source: en-GB
      text:
        en-GB: "Traditional buttermilk is the nearly fat-free liquid left after churning butter. Cream that has soured slightly churns more easily, because fat at lower pH clumps together more readily."
        de-AT: "Traditionelle Buttermilch ist die fast fettfreie Flüssigkeit, die beim Butterschlagen übrig bleibt. Leicht gesäuerter Rahm lässt sich leichter buttern, weil Fett bei niedrigerem pH-Wert besser zusammenklumpt."
    - key: soda-bread
      source: en-GB
      text:
        en-GB: "In soda bread, the acid in buttermilk reacts with baking soda to release the carbon dioxide that makes the loaf rise."
        de-AT: "Beim irischen Sodabrot reagiert die Säure der Buttermilch mit Natron und setzt das Kohlendioxid frei, das den Teig aufgehen lässt."

- ingredient: cream
  articles:
    en-GB: {title: "Whipped cream", revision: 1380746850}
    de-AT: {title: "Schlagsahne", revision: 262566612}
  facts:
    - key: milk-snow
      source: en-GB
      text:
        en-GB: "The earliest clear records of whipped cream date from the 16th century, when it was called milk snow or cream snow, neige de lait in French."
        de-AT: "Die ersten eindeutigen Belege für Schlagobers stammen aus dem 16. Jahrhundert. Damals hieß es Milch- oder Rahmschnee, auf Französisch neige de lait."
    - key: not-vatel
      source: en-GB
      text:
        en-GB: "Crème Chantilly is often credited to François Vatel at the Château de Chantilly, but there is no evidence. The château simply stood for refined food."
        de-AT: "Die Crème Chantilly wird oft François Vatel vom Schloss Chantilly zugeschrieben, Belege dafür gibt es aber keine. Das Schloss stand einfach für feine Küche."
    - key: fat-bubbles
      source: en-GB
      text:
        en-GB: "Cream needs around 30 to 36% fat to whip, because the fat globules hold the air bubbles in place."
        de-AT: "Damit sich Obers schlagen lässt, braucht es etwa 30 bis 36 % Fett, denn die Fettkügelchen halten die Luftbläschen fest."

- ingredient: single_cream
  articles:
    en-GB: {title: "Cream", revision: 1384596640}
    de-AT: {title: "Kaffeesahne", revision: 212492926}
  facts:
    - key: gravity-cream
      source: en-GB
      text:
        en-GB: "Left to stand, the lighter butterfat in milk rises to the top and can be skimmed off as gravity cream. Industry uses centrifugal separators instead."
        de-AT: "Lässt man Milch stehen, steigt das leichtere Milchfett nach oben und kann als Rahm abgeschöpft werden. In der Industrie übernehmen das Zentrifugen."
    - key: feathering
      source: en-GB
      text:
        en-GB: "Cream added to coffee can form oily little globules on the surface, a fault known as feathering."
        de-AT: "Kaffeeobers kann im Kaffee kleine ölige Tröpfchen an der Oberfläche bilden. Dieser Fehler heißt auf Englisch „feathering“."

- ingredient: sour_cream
  articles:
    en-GB: {title: "Sour cream", revision: 1382431235}
    de-AT: {title: "Schmand", revision: 270711404}
  facts:
    - key: souring
      source: en-GB
      text:
        en-GB: "Sour cream is cream fermented with lactic acid bacteria, which turn lactose into lactic acid. Commercially it ferments for about 18 hours."
        de-AT: "Sauerrahm ist Rahm, der mit Milchsäurebakterien vergoren wird. Die Bakterien verwandeln Milchzucker in Milchsäure, in der Molkerei dauert das etwa 18 Stunden."
    - key: fda-18
      source: en-GB
      text:
        en-GB: "Under US rules, sour cream must contain at least 18% milk fat before any bulking agents are added."
        de-AT: "Nach US-Vorschriften muss Sauerrahm mindestens 18 % Milchfett enthalten, bevor Füllstoffe dazukommen."

- ingredient: creme_fraiche
  articles:
    en-GB: {title: "Crème fraîche", revision: 1386040114}
    de-AT: {title: "Crème fraîche", revision: 256928092}
  facts:
    - key: isigny-aoc
      source: en-GB
      text:
        en-GB: "Crème fraîche from around Isigny-sur-Mer in Normandy was the only cream with an AOC protected designation as of 2018, awarded in 1986."
        de-AT: "Die Crème fraîche aus der Gegend um Isigny-sur-Mer in der Normandie war 2018 die einzige Sahne mit geschützter Ursprungsbezeichnung AOC, verliehen 1986."
    - key: no-curdling
      source: en-GB
      text:
        en-GB: "With more than 30% fat, crème fraîche does not curdle in hot sauces, unlike lower-fat sour cream."
        de-AT: "Mit über 30 % Fett flockt Crème fraîche in heißen Saucen nicht aus, anders als der magerere Sauerrahm."
    - key: fresh-cream
      source: en-GB
      text:
        en-GB: "In France, crème fraîche without a qualifier usually means liquid cream. The thick soured kind is called crème épaisse."
        de-AT: "In Frankreich meint man mit Crème fraîche ohne Zusatz meist flüssigen Rahm. Die dicke, gesäuerte Variante heißt dort crème épaisse."

- ingredient: butter
  articles:
    en-GB: {title: "Butter", revision: 1384583868}
    de-AT: {title: "Butter", revision: 271883929}
  facts:
    - key: bog-butter
      source: en-GB
      text:
        en-GB: "In medieval Ireland butter was buried in peat bogs, where it stayed edible for a long time. Such bog butter is a common archaeological find."
        de-AT: "Im mittelalterlichen Irland wurde Butter im Moor vergraben, wo sie lange genießbar blieb. Solche Moorbutter ist ein häufiger archäologischer Fund."
    - key: 80-percent
      source: en-GB
      text:
        en-GB: "Commercial butter is about 80% fat and 15% water, while traditionally made butter can be as little as 65% fat and 30% water."
        de-AT: "Handelsübliche Butter besteht zu etwa 80 % aus Fett und 15 % aus Wasser, traditionell hergestellte kann nur 65 % Fett und 30 % Wasser enthalten."

- ingredient: clarified_butter
  articles:
    en-GB: {title: "Clarified butter", revision: 1372106241}
    de-AT: {title: "Butterschmalz", revision: 263266986}
  facts:
    - key: smoke-point
      source: en-GB
      text:
        en-GB: "Removing the milk solids raises butter's smoke point from about 163 to 191 °C to around 252 °C, which is why clarified butter is better for frying."
        de-AT: "Ohne Milcheiweiß steigt der Rauchpunkt von Butter von etwa 163 bis 191 °C auf rund 252 °C. Deshalb eignet sich Butterschmalz besser zum Braten."
    - key: ghee
      source: en-GB
      text:
        en-GB: "Ghee is clarified butter cooked longer so that the milk solids caramelise before they are strained off, which gives it a nutty flavour."
        de-AT: "Ghee ist Butterschmalz, das länger gekocht wird, sodass das Milcheiweiß karamellisiert, bevor man es abseiht. Daher kommt sein nussiger Geschmack."

- ingredient: yogurt
  articles:
    en-GB: {title: "Yogurt", revision: 1387517316}
    de-AT: {title: "Joghurt", revision: 272168364}
  facts:
    - key: grigorov
      source: en-GB
      text:
        en-GB: "In 1905 the Bulgarian medical student Stamen Grigorov isolated the yogurt bacterium now called Lactobacillus delbrueckii subsp. bulgaricus from home-made yogurt from his village."
        de-AT: "1905 isolierte der bulgarische Medizinstudent Stamen Grigorow aus selbstgemachtem Joghurt seines Heimatdorfs das Bakterium, das heute Lactobacillus delbrueckii subsp. bulgaricus heißt."
    - key: ottoman-word
      source: en-GB
      text:
        en-GB: "The word yogurt comes from Ottoman Turkish, from a root meaning to condense or thicken."
        de-AT: "Das Wort Joghurt stammt aus dem Osmanisch-Türkischen, von einer Wurzel, die „verdicken“ bedeutet."
    - key: 6600-bce
      source: en-GB
      text:
        en-GB: "Milk fat residues on pottery from Barcın Höyük in north-western Turkey show farmers were processing dairy products by 6600 BCE."
        de-AT: "Milchfettspuren an Tonscherben aus Barcın Höyük im Nordwesten der Türkei zeigen, dass Bauern schon um 6600 v. Chr. Milchprodukte verarbeiteten."

- ingredient: greek_yogurt
  articles:
    en-GB: {title: "Strained yogurt", revision: 1386416970}
    de-AT: {title: "Abtropfjoghurt", revision: 250830057}
  facts:
    - key: uk-court
      source: en-GB
      text:
        en-GB: "Since a 2013 court case, only strained yoghurt made in Greece may be sold as Greek yoghurt in the UK. Everything else is Greek-style."
        de-AT: "Seit einem Gerichtsurteil von 2013 darf in Großbritannien nur in Griechenland hergestelltes Abtropfjoghurt „Greek yoghurt“ heißen. Alles andere ist „Greek-style“."
    - key: strained-whey
      source: en-GB
      text:
        en-GB: "Greek yoghurt is ordinary yoghurt strained to remove most of the whey, so it takes more milk to make. Labneh is strained even longer and salted."
        de-AT: "Griechisches Joghurt ist abgetropftes Joghurt, dem der Großteil der Molke entzogen wurde. Dafür braucht es mehr Milch. Labneh wird noch länger abgetropft und gesalzen."

- ingredient: quark
  articles:
    en-GB: {title: "Quark (dairy product)", revision: 1384382136}
    de-AT: {title: "Quark (Milchprodukt)", revision: 272495852}
  facts:
    - key: slavic-word
      source: en-GB
      text:
        en-GB: "The word Quark has been used in German since the 14th century and probably comes from West Slavic, like the Polish twaróg and Czech tvaroh."
        de-AT: "Das Wort Quark ist im Deutschen seit dem 14. Jahrhundert belegt und stammt wohl aus dem Westslawischen, wie das polnische twaróg und das tschechische tvaroh."
    - key: austrian-drier
      source: en-GB
      text:
        en-GB: "Austrian and other Central European quark usually contains less whey than German quark, so it is drier and firmer."
        de-AT: "Österreichischer Topfen enthält meist weniger Molke als deutscher Quark und ist deshalb trockener und fester."
    - key: tacitus
      source: en-GB
      text:
        en-GB: "Tacitus may have described quark in his Germania as lac concretum, thick milk eaten by the Germanic peoples."
        de-AT: "Möglicherweise beschrieb schon Tacitus in seiner „Germania“ den Topfen als lac concretum, „dicke Milch“, die die Germanen aßen."

- ingredient: cottage_cheese
  articles:
    en-GB: {title: "Cottage cheese", revision: 1385738941}
    de-AT: {title: "Hüttenkäse", revision: 272150444}
  facts:
    - key: name-1831
      source: en-GB
      text:
        en-GB: "The name cottage cheese was in use in Philadelphia by 1831, probably because Pennsylvania Dutch immigrants made it at home in their cottages."
        de-AT: "Der Name Cottage Cheese war 1831 in Philadelphia gebräuchlich, wohl weil deutschstämmige Einwanderer, die Pennsylvania Dutch, ihn daheim in ihren Häuschen machten."
    - key: washed-curds
      source: en-GB
      text:
        en-GB: "After the whey is drained, the curds are flooded with chilled water. Washing removes most of the remaining lactose."
        de-AT: "Nach dem Abtropfen der Molke wird der Bruch mit gekühltem Wasser gespült. Das Waschen entfernt den Großteil des verbliebenen Milchzuckers."

- ingredient: cream_cheese
  articles:
    en-GB: {title: "Cream cheese", revision: 1385990818}
    de-AT: {title: "Doppelrahmkäse", revision: 271967484}
  facts:
    - key: philadelphia-name
      source: en-GB
      text:
        en-GB: "Philadelphia cream cheese has nothing to do with Philadelphia: the New York distributor Alvah Reynolds chose the name in 1880 for cheese made in Chester, New York."
        de-AT: "„Philadelphia“-Frischkäse kommt gar nicht aus Philadelphia: Der New Yorker Händler Alvah Reynolds gab 1880 so Käse aus Chester im Staat New York seinen Namen."
    - key: chester-1873
      source: en-GB
      text:
        en-GB: "Around 1873 William A. Lawrence, a dairyman in Chester, New York, became the first to mass-produce cream cheese by adding cream to a Neufchâtel-style cheese."
        de-AT: "Um 1873 stellte der Milchbauer William A. Lawrence in Chester, New York, als Erster Frischkäse in großen Mengen her, indem er einem Käse nach Neufchâtel-Art Obers zusetzte."

- ingredient: mascarpone
  articles:
    en-GB: {title: "Mascarpone", revision: 1387689351}
    de-AT: {title: "Mascarpone", revision: 270594019}
  facts:
    - key: not-a-cheese
      source: en-GB
      text:
        en-GB: "Strictly speaking mascarpone is not a cheese: it is cream curdled by acid and heat, made without rennet and without true curd formation."
        de-AT: "Streng genommen ist Mascarpone kein Käse, sondern durch Säure und Hitze gestocktes Obers, ganz ohne Lab und ohne echte Bruchbildung."
    - key: wine-barrel-acid
      source: en-GB
      text:
        en-GB: "Mascarpone can be set with tartaric acid, even the residue left in wine barrels, and is then drained in cheesecloth and chilled for at least six hours."
        de-AT: "Mascarpone lässt sich mit Weinsäure dicken, sogar mit dem Rückstand aus Weinfässern; danach tropft er in einem Tuch ab und kühlt mindestens sechs Stunden."

- ingredient: ricotta
  articles:
    en-GB: {title: "Ricotta", revision: 1386619886}
    de-AT: {title: "Ricotta", revision: 272530422}
  facts:
    - key: recooked
      source: en-GB
      text:
        en-GB: "Ricotta means \"recooked\": the whey left over from other cheeses is heated again until its remaining proteins flocculate into fine curds."
        de-AT: "Ricotta heißt „wieder gekocht“: Die Molke, die bei anderen Käsesorten übrig bleibt, wird erneut erhitzt, bis die restlichen Eiweiße zu feinen Flocken gerinnen."
    - key: bronze-age
      source: en-GB
      text:
        en-GB: "Ricotta-making in Italy goes back to the Bronze Age, when ceramic milk boilers designed to stop milk boiling over appeared in the second millennium BC."
        de-AT: "In Italien reicht die Ricotta-Herstellung bis in die Bronzezeit zurück: Im 2. Jahrtausend v. Chr. tauchten dort Milchkocher aus Keramik auf, die das Überkochen verhinderten."

- ingredient: mozzarella
  articles:
    en-GB: {title: "Mozzarella", revision: 1387902284}
    de-AT: {title: "Mozzarella", revision: 270464329}
  facts:
    - key: name-cut
      source: en-GB
      text:
        en-GB: "Mozzarella comes from the Italian mozzare, \"to cut off\", after the way portions are pinched from the stretched curd; the word first appears in a 1570 cookbook by Bartolomeo Scappi."
        de-AT: "Mozzarella kommt vom italienischen „mozzare“, abschneiden, weil man Portionen vom gezogenen Bruch abtrennt; erstmals erwähnt wird das Wort 1570 in einem Kochbuch von Bartolomeo Scappi."
    - key: buffalo-india
      source: en-GB
      text:
        en-GB: "Buffalo mozzarella depends on water buffalo, which according to genetic research reached Italy from India in the 7th century AD."
        de-AT: "Büffelmozzarella braucht Wasserbüffel, und die kamen laut genetischen Untersuchungen im 7. Jahrhundert n. Chr. aus Indien nach Italien."

- ingredient: parmesan
  articles:
    en-GB: {title: "Parmesan", revision: 1387920836}
    de-AT: {title: "Parmesan", revision: 271291724}
  facts:
    - key: wheel-seals
      source: en-GB
      text:
        en-GB: "Every wheel of Parmigiano Reggiano carries seals with the dairy's number, the month and year it was made and a code identifying that single wheel."
        de-AT: "Jeder Laib Parmigiano Reggiano trägt Siegel mit der Nummer der Käserei, dem Monat und Jahr der Herstellung und einem Code für genau diesen Laib."
    - key: eu-court-2008
      source: en-GB
      text:
        en-GB: "In 2008 an EU court ruled that within Europe the name Parmesan refers only to Parmigiano Reggiano and cannot be used for imitations."
        de-AT: "2008 entschied ein EU-Gericht, dass „Parmesan“ in Europa ausschließlich Parmigiano Reggiano bezeichnet und für Nachahmungen tabu ist."
    - key: word-1414
      source: en-GB
      text:
        en-GB: "The word parmesan reached English through French, where it is first recorded as the name of the cheese in 1414; English followed in 1519."
        de-AT: "Das Wort Parmesan kam über das Französische ins Englische; im Französischen ist es als Käsename erstmals 1414 belegt, im Englischen 1519."

- ingredient: emmental
  articles:
    en-GB: {title: "Emmental cheese", revision: 1387287824}
    de-AT: {title: "Emmentaler", revision: 271958893}
  facts:
    - key: hay-dust
      source: en-GB
      text:
        en-GB: "Only in the 21st century did researchers find that Emmental's holes come from microscopic hay dust in the milk: bacteria grow around the particles and release gas."
        de-AT: "Erst im 21. Jahrhundert fand man heraus, dass die Löcher im Emmentaler von winzigem Heustaub in der Milch stammen: Bakterien wachsen um die Teilchen und bilden Gas."
    - key: holes-flaw
      source: en-GB
      text:
        en-GB: "The holes were once seen as a flaw that cheesemakers tried to avoid; today they count as a sign of maturity and are even assessed by acoustic analysis."
        de-AT: "Früher galten die Löcher als Fehler, den Käser vermeiden wollten; heute zeigen sie Reife und Qualität an und werden sogar per Schallanalyse geprüft."

- ingredient: gouda
  articles:
    en-GB: {title: "Gouda cheese", revision: 1375078555}
    de-AT: {title: "Gouda (Käse)", revision: 267962952}
  facts:
    - key: handjeklap
      source: en-GB
      text:
        en-GB: "At the cheese market in Gouda, prices were haggled out by handjeklap: buyer and seller clapped each other's hands while calling out figures."
        de-AT: "Am Käsemarkt von Gouda wurde per „Handjeklap“ gefeilscht: Käufer und Verkäufer klatschten einander in die Hände und riefen dabei Preise aus."
    - key: washed-curd
      source: en-GB
      text:
        en-GB: "Gouda is a washed-curd cheese: some of the whey is replaced with water, which rinses out lactose and makes the cheese sweeter."
        de-AT: "Gouda ist ein Käse mit gewaschenem Bruch: Ein Teil der Molke wird durch Wasser ersetzt, das spült Milchzucker aus und macht den Käse süßer."

- ingredient: cheddar
  articles:
    en-GB: {title: "Cheddar", revision: 1387829603}
    de-AT: {title: "Cheddar (Käse)", revision: 269701484}
  facts:
    - key: gorge-caves
      source: en-GB
      text:
        en-GB: "The caves of Cheddar Gorge in Somerset gave the cheese a steady temperature and humidity for maturing, and cheddar traditionally had to be made within 30 miles of Wells Cathedral."
        de-AT: "Die Höhlen der Cheddar-Schlucht in Somerset boten gleichmäßige Temperatur und Feuchte zum Reifen; traditionell musste Cheddar im Umkreis von 48 km um die Kathedrale von Wells entstehen."
    - key: government-cheddar
      source: en-GB
      text:
        en-GB: "During the Second World War and for nearly a decade after, most British milk went into one \"government cheddar\", which almost wiped out other British cheeses."
        de-AT: "Im Zweiten Weltkrieg und fast zehn Jahre danach wanderte die meiste britische Milch in einen einzigen „Regierungs-Cheddar“, andere Sorten verschwanden beinahe."

- ingredient: bergkaese
  articles:
    en-GB: {title: "Bergkäse", revision: 1312118232}
    de-AT: {title: "Bergkäse", revision: 271987744}
  facts:
    - key: alp-summer
      source: en-GB
      text:
        en-GB: "Mountain cheese was traditionally made up on the alp during a summer season of about 70 to 120 days, while the cows grazed herb-rich high pastures."
        de-AT: "Bergkäse entstand traditionell direkt auf der Alm, in einer Sommersaison von etwa 70 bis 120 Tagen, während die Kühe auf kräuterreichen Bergweiden grasten."
    - key: helicopter
      source: en-GB
      text:
        en-GB: "Wheels of alpine cheese used to travel down to the valley on sledges; today they are sometimes flown down by helicopter."
        de-AT: "Früher brachte man die Käselaibe auf Schlitten von der Alm ins Tal, heute werden sie manchmal mit dem Hubschrauber hinuntergeflogen."

- ingredient: feta
  articles:
    en-GB: {title: "Feta", revision: 1386204105}
    de-AT: {title: "Feta", revision: 270086729}
  facts:
    - key: fetta-slice
      source: en-GB
      text:
        en-GB: "Feta comes from the Italian fetta, \"slice\", and only became the cheese's usual name in the 19th century, probably because it was cut up to be packed into barrels."
        de-AT: "Feta kommt vom italienischen „fetta“, Scheibe, und wurde erst im 19. Jahrhundert zum gängigen Namen, wohl weil man den Käse zum Einlegen in Fässer zerteilte."
    - key: pdo-2002
      source: en-GB
      text:
        en-GB: "Since 2002 only cheese from mainland Greece and Lesbos may be sold as feta in the EU, made from sheep's milk with at most 30% goat's milk."
        de-AT: "Seit 2002 darf in der EU nur Käse vom griechischen Festland und von Lesbos Feta heißen, gemacht aus Schafmilch mit höchstens 30 % Ziegenmilch."

- ingredient: goat_cheese
  articles:
    en-GB: {title: "Goat cheese", revision: 1387282468}
    de-AT: {title: "Ziegenkäse", revision: 262834528}
  facts:
    - key: capra-acids
      source: en-GB
      text:
        en-GB: "The tang of goat's cheese comes from fatty acids such as caproic and caprylic acid, which are named after capra, the Latin word for goat."
        de-AT: "Den typischen Geschmack von Ziegenkäse liefern Fettsäuren wie Capron- und Caprylsäure, benannt nach „capra“, dem lateinischen Wort für Ziege."
    - key: since-5000-bc
      source: en-GB
      text:
        en-GB: "Goat's cheese has been made since at least 5,000 BC, and goats were among the first animals domesticated for milk, some 10,000 years ago."
        de-AT: "Ziegenkäse gibt es seit mindestens 5000 v. Chr., und Ziegen gehörten vor rund 10.000 Jahren zu den ersten Tieren, die man für Milch domestizierte."

- ingredient: blue_cheese
  articles:
    en-GB: {title: "Blue cheese", revision: 1388152828}
    de-AT: {title: "Blauschimmelkäse", revision: 263546153}
  facts:
    - key: hallstatt-miners
      source: en-GB
      text:
        en-GB: "Ancient faeces from the salt mines of Hallstatt in Austria show that miners there were eating blue cheese and drinking beer between 800 and 400 BC."
        de-AT: "Uralte Kotreste aus dem Salzbergwerk Hallstatt zeigen, dass die Bergleute dort schon zwischen 800 und 400 v. Chr. Blauschimmelkäse aßen und Bier tranken."
    - key: roquefort-legend
      source: en-GB
      text:
        en-GB: "Legend says Roquefort began when a boy left his bread and ewe's cheese in a cave after spotting a beautiful girl, and came back months later to mouldy, veined cheese."
        de-AT: "Der Legende nach entstand Roquefort, weil ein Bursch sein Brot und seinen Schafkäse in einer Höhle liegen ließ, als er ein schönes Mädchen sah, und Monate später verschimmelten Käse fand."

- ingredient: brie
  articles:
    en-GB: {title: "Brie", revision: 1375708115}
    de-AT: {title: "Brie (Käse)", revision: 270598020}
  facts:
    - key: gaulish-hill
      source: en-GB
      text:
        en-GB: "Brie is named after the French region it comes from, and the region's name goes back to the Gaulish word briga, meaning \"hill\" or \"height\"."
        de-AT: "Brie ist nach seiner französischen Herkunftsregion benannt, und deren Name geht auf das gallische „briga“ zurück, was Hügel oder Anhöhe bedeutet."
    - key: brie-noir
      source: en-GB
      text:
        en-GB: "Matured for several months up to a year, brie turns darker, drier and much stronger and is then called Brie noir, \"black brie\"."
        de-AT: "Reift Brie mehrere Monate bis zu einem Jahr, wird er dunkler, trockener und deutlich kräftiger und heißt dann Brie noir, „schwarzer Brie“."
    - key: two-certified
      source: en-GB
      text:
        en-GB: "Brie is made all over the world, from Somerset to Wisconsin, yet the French government officially certifies only two kinds: Brie de Meaux and Brie de Melun."
        de-AT: "Brie wird weltweit gemacht, von Somerset bis Wisconsin, doch Frankreich zertifiziert offiziell nur zwei Sorten: Brie de Meaux und Brie de Melun."

- ingredient: condensed_milk
  articles:
    en-GB: {title: "Condensed milk", revision: 1374749680}
    de-AT: {title: "Kondensmilch", revision: 267321577}
  facts:
    - key: borden-voyage
      source: en-GB
      text:
        en-GB: "Gail Borden Jr. set out to condense milk after several children died on his 1851 voyage home from England, apparently from bad milk given by cows kept on board."
        de-AT: "Gail Borden Jr. begann mit eingedickter Milch zu experimentieren, nachdem 1851 auf seiner Heimreise von England mehrere Kinder starben, offenbar an schlechter Milch von Kühen an Bord."
    - key: newton-sugar
      source: en-GB
      text:
        en-GB: "In 1835 the English engineer William Newton added sugar to condensed milk as an extra preservative; sealed tins of the sweetened kind keep for years without a fridge."
        de-AT: "1835 gab der englische Ingenieur William Newton der Kondensmilch Zucker als zusätzlichen Schutz bei; verschlossene Dosen der gezuckerten Sorte halten ohne Kühlung jahrelang."

- ingredient: evaporated_milk
  articles:
    en-GB: {title: "Evaporated milk", revision: 1385992060}
    de-AT: {title: "Kondensmilch", revision: 267321577}
  facts:
    - key: maillard
      source: en-GB
      text:
        en-GB: "Evaporated milk is sterilised at 116 to 118 °C for 15 minutes, and that heat sets off the Maillard reaction, giving it a faint caramel taste and a darker colour."
        de-AT: "Kondensmilch wird 15 Minuten lang bei 116 bis 118 °C sterilisiert; die Hitze löst die Maillard-Reaktion aus, daher der leichte Karamellgeschmack und die dunklere Farbe."
    - key: prohibition-brewery
      source: en-GB
      text:
        en-GB: "When Prohibition banned alcohol in the United States, the Christian Diehl Brewery turned to evaporated milk in 1922 and sold it as the Jerzee brand."
        de-AT: "Als die Prohibition in den USA Alkohol verbot, sattelte die Christian Diehl Brewery 1922 auf Kondensmilch um und verkaufte sie unter der Marke Jerzee."

- ingredient: oat_milk
  articles:
    en-GB: {title: "Oat milk", revision: 1386545009}
    de-AT: {title: "Hafermilch", revision: 271979753}
  facts:
    - key: lund-1990s
      source: en-GB
      text:
        en-GB: "Oat milk is young: it was developed in the 1990s by the Swedish food scientist Rickard Öste at Lund University together with Angeliki Triantafyllou, and their 1994 company was the forerunner of Oatly."
        de-AT: "Haferdrink ist jung: Der schwedische Lebensmittelforscher Rickard Öste entwickelte ihn in den 1990ern an der Universität Lund mit Angeliki Triantafyllou, ihre Firma von 1994 war der Vorläufer von Oatly."
    - key: shortage-2018
      source: en-GB
      text:
        en-GB: "Demand for oat milk grew so fast that in 2018 shops in Europe and North America saw repeated shortages."
        de-AT: "Die Nachfrage nach Haferdrink stieg so schnell, dass er 2018 in Europa und Nordamerika immer wieder ausverkauft war."

- ingredient: soy_milk
  articles:
    en-GB: {title: "Soy milk", revision: 1382757012}
    de-AT: {title: "Sojamilch", revision: 272299074}
  facts:
    - key: han-slab
      source: en-GB
      text:
        en-GB: "The oldest record of soy milk is a stone slab from China's Eastern Han dynasty, engraved with a description of how it was made in ancient kitchens."
        de-AT: "Der älteste Beleg für Sojamilch ist eine Steinplatte aus der Östlichen Han-Dynastie in China, in die eingraviert ist, wie man sie in alten Küchen zubereitete."
    - key: eu-court-2017
      source: en-GB
      text:
        en-GB: "In 2017 the EU Court of Justice ruled that purely plant-based products may not be called milk, even with a word like soy in front."
        de-AT: "2017 entschied der Europäische Gerichtshof, dass rein pflanzliche Produkte nicht „Milch“ heißen dürfen, auch nicht mit einem Zusatz wie „Soja“ davor."

- ingredient: almond_milk
  articles:
    en-GB: {title: "Almond milk", revision: 1375780927}
    de-AT: {title: "Mandelmilch", revision: 261320554}
  facts:
    - key: baghdad-1226
      source: en-GB
      text:
        en-GB: "The oldest known almond milk recipes are in the Kitab al-Tabikh, the Book of Dishes, written by Muhammad bin Hasan al-Baghdadi in 1226."
        de-AT: "Die ältesten bekannten Rezepte für Mandelmilch stehen im „Kitab al-Tabikh“, dem Buch der Speisen, das Muhammad bin Hasan al-Baghdadi 1226 schrieb."
    - key: fast-days
      source: en-GB
      text:
        en-GB: "In the Middle Ages almond milk replaced cow's milk on Catholic fast days, and medieval cookbooks treat it as a general but expensive substitute."
        de-AT: "Im Mittelalter ersetzte Mandelmilch an katholischen Fasttagen die Kuhmilch; mittelalterliche Kochbücher behandeln sie als gängigen, aber teuren Ersatz."

- ingredient: coconut_milk
  articles:
    en-GB: {title: "Coconut milk", revision: 1384521472}
  facts:
    - key: first-pressing
      source: en-GB
      text:
        en-GB: "Coconut cream is the first pressing of grated coconut flesh through cheesecloth; thin coconut milk comes from soaking the squeezed pulp in hot water and pressing it again."
        de-AT: "Kokoscreme ist die erste Pressung von geriebenem Kokosfleisch durch ein Tuch; dünne Kokosmilch entsteht, wenn man das ausgedrückte Fruchtfleisch in heißem Wasser einweicht und erneut presst."
    - key: emulsion
      source: en-GB
      text:
        en-GB: "Coconut milk is an oil-in-water emulsion: its own proteins act as emulsifiers, and its milky white colour comes from the high oil content."
        de-AT: "Kokosmilch ist eine Öl-in-Wasser-Emulsion, deren eigene Eiweiße als Emulgator wirken; die milchig weiße Farbe kommt vom hohen Ölanteil."

- ingredient: pecorino
  articles:
    en-GB: {title: "Pecorino", revision: 1381622444}
    de-AT: {title: "Pecorino (Käse)", revision: 272461907}
  facts:
    - key: romano-sardinia
      source: en-GB
      text:
        en-GB: "Pecorino takes its name from pecora, Italian for sheep, and despite its name most pecorino romano is made on the island of Sardinia."
        de-AT: "Pecorino heißt nach „pecora“, italienisch für Schaf, und trotz seines Namens wird der meiste Pecorino Romano auf Sardinien hergestellt."
    - key: rosso-tomato
      source: en-GB
      text:
        en-GB: "Sicily's red pecorino gets its colour from being coated again and again with olive oil and tomato sauce, which also forms a protective layer on the rind."
        de-AT: "Der rote Pecorino aus Sizilien wird immer wieder mit Olivenöl und Paradeissauce eingestrichen; das färbt ihn und schützt zugleich die Rinde."

- ingredient: gorgonzola
  articles:
    en-GB: {title: "Gorgonzola", revision: 1386446579}
    de-AT: {title: "Gorgonzola (Käse)", revision: 271739843}
  facts:
    - key: stracchino-verde
      source: en-GB
      text:
        en-GB: "Until the early 20th century gorgonzola was sold as stracchino verde, \"green stracchino\", after its blue-green veins."
        de-AT: "Bis ins frühe 20. Jahrhundert hieß Gorgonzola „Stracchino verde“, grüner Stracchino, nach seinen blaugrünen Adern."
    - key: lover-legend
      source: en-GB
      text:
        en-GB: "A Lombard legend says a cheesemaker rushing to meet his lover left curds in an open vat overnight, topped them up with fresh curds and months later found blue mould."
        de-AT: "Eine lombardische Legende erzählt von einem Käser, der auf dem Weg zu seiner Geliebten Bruch über Nacht offen stehen ließ, frischen nachgab und Monate später blauen Schimmel fand."

- ingredient: camembert
  articles:
    en-GB: {title: "Camembert", revision: 1378683130}
    de-AT: {title: "Camembert", revision: 270861932}
  facts:
    - key: marie-harel
      source: en-GB
      text:
        en-GB: "Camembert is said to have been first made in 1791 by Marie Harel, a Normandy farmer who refined an older cheese recipe from the Pays d'Auge."
        de-AT: "Camembert soll erstmals 1791 von Marie Harel gemacht worden sein, einer Bäuerin aus der Normandie, die ein älteres Käserezept aus dem Pays d'Auge verfeinerte."
    - key: ridel-box
      source: en-GB
      text:
        en-GB: "The round wooden camembert box was devised in 1890 by an engineer named Ridel, and it let the cheese travel much longer distances."
        de-AT: "Die runde Holzschachtel für Camembert erfand 1890 ein Ingenieur namens Ridel, und mit ihr konnte der Käse viel weitere Strecken reisen."

- ingredient: raclette_cheese
  articles:
    en-GB: {title: "Raclette", revision: 1377296465}
    de-AT: {title: "Raclette", revision: 267736549}
  facts:
    - key: convents-1291
      source: en-GB
      text:
        en-GB: "Dishes of melted cheese are mentioned in Swiss convent texts as early as 1291, and in German-speaking Switzerland the dish was once called Bratchäs, \"roasted cheese\"."
        de-AT: "Gerichte aus geschmolzenem Käse werden schon 1291 in Schweizer Klostertexten erwähnt; in der Deutschschweiz hieß das Ganze früher „Bratchäs“."
    - key: herders-fire
      source: en-GB
      text:
        en-GB: "Cow herders moving to or from the alpine pastures set their cheese beside the campfire in the evening and scraped the softened part onto bread."
        de-AT: "Kuhhirten auf dem Weg zur Alm oder zurück legten abends ihren Käse neben das Lagerfeuer und schabten die weich gewordene Schicht aufs Brot."

- ingredient: gruyere
  articles:
    en-GB: {title: "Gruyère", revision: 1388219491}
    de-AT: {title: "Greyerzer", revision: 271975263}
  facts:
    - key: few-holes
      source: en-GB
      text:
        en-GB: "Unlike Emmental, with which it is often confused, modern Gruyère has few or no holes, although in the 19th century that was not always the case."
        de-AT: "Anders als der oft verwechselte Emmentaler hat moderner Greyerzer kaum oder gar keine Löcher; im 19. Jahrhundert war das allerdings nicht immer so."
    - key: copper-vat
      source: en-GB
      text:
        en-GB: "Gruyère begins as raw cow's milk warmed to 34 °C in a copper vat, curdled with rennet and cut into pea-sized pieces of curd."
        de-AT: "Greyerzer beginnt mit roher Kuhmilch, die in einem Kupferkessel auf 34 °C erwärmt, mit Lab dickgelegt und zu erbsengroßem Bruch geschnitten wird."

- ingredient: halloumi
  articles:
    en-GB: {title: "Halloumi", revision: 1387000625}
    de-AT: {title: "Halloumi", revision: 267447493}
  facts:
    - key: squeak
      source: en-GB
      text:
        en-GB: "Halloumi squeaks because no acid-producing bacteria are used, so its casein stays intact in dense networks that cause stick-slip friction against tooth enamel."
        de-AT: "Halloumi quietscht, weil keine säurebildenden Bakterien im Spiel sind: Das Kasein bleibt in dichten Netzen erhalten und erzeugt am Zahnschmelz Haftgleitreibung."
    - key: coptic-name
      source: en-GB
      text:
        en-GB: "The name halloumi travelled via Egyptian Arabic from the Coptic halōm and probably goes back to a Demotic word for cheese recorded in 2nd-century Roman Egypt."
        de-AT: "Der Name Halloumi kam über das Ägyptisch-Arabische vom koptischen „halōm“ und geht wohl auf ein demotisches Wort für Käse aus dem römischen Ägypten des 2. Jahrhunderts zurück."
    - key: cyprus-exports
      source: en-GB
      text:
        en-GB: "Halloumi accounts for 13.4% of the Republic of Cyprus's exports, and the United Kingdom is its largest importer."
        de-AT: "Halloumi macht 13,4 % der Exporte der Republik Zypern aus, und Großbritannien ist der größte Abnehmer."

- ingredient: burrata
  articles:
    en-GB: {title: "Burrata", revision: 1363847040}
    de-AT: {title: "Burrata", revision: 271844594}
  facts:
    - key: filled-pouch
      source: en-GB
      text:
        en-GB: "Burrata is a pouch of still-hot mozzarella filled with leftover mozzarella scraps and fresh cream, a way of wasting less that dates from the early 20th century."
        de-AT: "Burrata ist ein Beutel aus noch heißem Mozzarella, gefüllt mit Mozzarella-Resten und frischem Obers; entstanden ist sie im frühen 20. Jahrhundert, um weniger wegzuwerfen."
    - key: asphodel
      source: en-GB
      text:
        en-GB: "Burrata was traditionally wrapped in asphodel leaves, and since November 2016 burrata di Andria from Puglia has been a protected geographical indication."
        de-AT: "Burrata wurde traditionell in Affodill-Blätter gewickelt, und seit November 2016 ist die Burrata di Andria aus Apulien eine geschützte geografische Angabe."

- ingredient: skyr
  articles:
    en-GB: {title: "Skyr", revision: 1387001239}
    de-AT: {title: "Skyr", revision: 271151943}
  facts:
    - key: sagas
      source: en-GB
      text:
        en-GB: "Skyr turns up in medieval Icelandic sources such as Egil's saga and Grettis saga, and it was originally made from sheep's milk rather than cow's milk."
        de-AT: "Skyr taucht schon in mittelalterlichen isländischen Quellen wie der Egils saga und der Grettis saga auf und wurde ursprünglich aus Schaf- statt Kuhmilch gemacht."
    - key: shear
      source: en-GB
      text:
        en-GB: "The word skyr is related to the English shear, \"to cut\", after the way the milk is split into liquid whey and thick skyr."
        de-AT: "Das Wort Skyr ist mit dem englischen „shear“, schneiden, verwandt und bezieht sich darauf, dass die Milch in flüssige Molke und dicken Skyr getrennt wird."

- ingredient: kefir
  articles:
    en-GB: {title: "Kefir", revision: 1387280004}
    de-AT: {title: "Kefir", revision: 272500282}
  facts:
    - key: xiaohe-graves
      source: en-GB
      text:
        en-GB: "Kefir has been found in Bronze Age graves at the Xiaohe Cemetery in China, dating back 3,600 years."
        de-AT: "In Gräbern der Bronzezeit auf dem Xiaohe-Friedhof in China wurde Kefir gefunden, der rund 3.600 Jahre alt ist."
    - key: doorway-bag
      source: en-GB
      text:
        en-GB: "Traditional kefir was made in goatskin bags hung by the door, and everyone walking past knocked the bag to keep the milk and grains mixed."
        de-AT: "Traditioneller Kefir reifte in Ziegenledersäcken neben der Tür, und wer vorbeiging, stieß den Sack an, damit sich Milch und Knollen gut vermischten."
    - key: kefiran
      source: en-GB
      text:
        en-GB: "Kefir grains look like tiny cauliflower florets; they are held together by kefiran, a sugar matrix made of equal parts glucose and galactose."
        de-AT: "Kefirknollen sehen aus wie winzige Karfiolröschen; zusammengehalten werden sie von Kefiran, einem Zuckergerüst aus gleich viel Glukose und Galaktose."

- ingredient: milk_powder
  articles:
    en-GB: {title: "Powdered milk", revision: 1386461138}
    de-AT: {title: "Milchpulver", revision: 268262533}
  facts:
    - key: krichevsky-1802
      source: en-GB
      text:
        en-GB: "The first modern process for drying milk was invented in 1802 by the Russian doctor Osip Krichevsky, and commercial production began in 1832."
        de-AT: "Das erste moderne Verfahren zum Trocknen von Milch erfand 1802 der russische Arzt Osip Krichevsky, die gewerbliche Herstellung begann 1832."
    - key: spray-drying
      source: en-GB
      text:
        en-GB: "Most milk powder is spray-dried: milk concentrated to about 50% solids is sprayed into a hot chamber, where the water evaporates almost instantly."
        de-AT: "Das meiste Milchpulver wird sprühgetrocknet: Auf rund 50 % Trockenmasse eingedickte Milch wird in eine heiße Kammer gesprüht, wo das Wasser fast sofort verdampft."

- ingredient: burger_bun
  articles:
    en-GB: {title: "Bun", revision: 1378415931}
    de-AT: {title: "Bun", revision: 271641264}
  facts:
    - key: sweet-or-savoury
      source: en-GB
      text:
        en-GB: "What a bun is depends on where you are: in England, Scotland and Wales it is traditionally a sweet, often fruited cake, while in the US it is a bread roll, typically one cut to hold a burger."
        de-AT: "Was ein „Bun“ ist, hängt vom Ort ab: In England, Schottland und Wales meist ein süßes Gebäck, oft mit Früchten, in den USA ein Brötchen, typischerweise aufgeschnitten für einen Burger."
    - key: bunne-1371
      source: en-GB
      text:
        en-GB: "The origin of the word bun is unclear; its earliest known use, spelt bunne, dates from 1371 in the medieval Assize of Bread and Ale."
        de-AT: "Woher das Wort „Bun“ kommt, ist unklar; der älteste bekannte Beleg stammt von 1371, geschrieben „bunne“, aus einem mittelalterlichen Gesetz über Brot und Bier."

- ingredient: hot_dog_bun
  articles:
    en-GB: {title: "Hot dog bun", revision: 1382136608}
    de-AT: {title: "Hotdog", revision: 269654346}
  facts:
    - key: frischmann-vienna-roll
      source: en-GB
      text:
        en-GB: "A 1904 obituary credited the Austrian immigrant baker Ignatz Frischmann with inventing the \"Vienna roll\" sold to Coney Island hot dog vendors, which made him a rich man."
        de-AT: "Ein Nachruf von 1904 schrieb dem aus Österreich eingewanderten Bäcker Ignatz Frischmann die „Vienna roll“ zu, die er an Hotdog-Stände auf Coney Island lieferte und die ihn reich machte."
    - key: gloves-story
      source: en-GB
      text:
        en-GB: "One story has Antoine Feuchtwanger lending customers gloves to hold his hot sausages at the 1904 St Louis fair; when too many went missing, his baker brother came up with the bun."
        de-AT: "Einer Geschichte nach lieh Antoine Feuchtwanger 1904 auf der Messe in St. Louis seinen Gästen Handschuhe für die heißen Würstel; als zu viele verschwanden, erfand sein Bruder, ein Bäcker, das Weckerl."
    - key: central-europe-spike
      source: en-GB
      text:
        en-GB: "In Austria and much of Central Europe a hot dog usually means a baguette with its end cut off, pushed onto a spike to hollow it out for the sausage."
        de-AT: "In Österreich und weiten Teilen Mitteleuropas ist ein Hotdog meist ein Baguette, dessen Ende abgeschnitten und das auf einen Dorn gesteckt wird, damit das Würstel hineinpasst."

- ingredient: brioche
  articles:
    en-GB: {title: "Brioche", revision: 1383763018}
    de-AT: {title: "Brioche", revision: 270556905}
  facts:
    - key: butter-ratios
      source: en-GB
      text:
        en-GB: "Brioche once came in several grades at the same time, from the \"rich man's brioche\" with three parts flour to two of butter to the cheaper pain brioché at four to one."
        de-AT: "Brioche gab es früher gleichzeitig in mehreren Stufen, von der „Brioche des reichen Mannes“ mit drei Teilen Mehl auf zwei Teile Butter bis zum billigeren Pain brioché mit vier zu eins."
    - key: tete
      source: en-GB
      text:
        en-GB: "The classic brioche à tête is baked in a fluted, flared tin: a large ball of dough is crowned with a smaller one that forms the \"head\"."
        de-AT: "Die klassische Brioche à tête wird in einer gerippten, ausladenden Form gebacken: Auf eine große Teigkugel kommt eine kleinere, der „Kopf“."

- ingredient: pita
  articles:
    en-GB: {title: "Pita", revision: 1376894618}
    de-AT: {title: "Pita", revision: 270158237}
  facts:
    - key: steam-pocket
      source: en-GB
      text:
        en-GB: "Pitta gets its pocket from a very hot oven: at 230 to 245 °C the water in the dough turns to steam and puffs the bread up into two layers."
        de-AT: "Seine Tasche verdankt das Pitabrot dem sehr heißen Ofen: Bei 230 bis 245 °C wird das Wasser im Teig zu Dampf und bläht das Brot in zwei Schichten auf."
    - key: balkan-pie
      source: en-GB
      text:
        en-GB: "The Greek word pita was borrowed into Turkish as pide, and in the languages of the former Yugoslavia pita simply means pie."
        de-AT: "Das griechische Wort Pita wanderte ins Türkische als „Pide“, und in den Sprachen des ehemaligen Jugoslawien bedeutet Pita ganz allgemein Pastete."

- ingredient: naan
  articles:
    en-GB: {title: "Naan", revision: 1387346323}
    de-AT: {title: "Naan (Lebensmittel)", revision: 270242196}
  facts:
    - key: persian-bread
      source: en-GB
      text:
        en-GB: "Naan comes from the Persian nân, a word for any kind of bread; it first appears in English in an 1803 travelogue by William Tooke, spelt nan."
        de-AT: "Naan kommt vom persischen „nân“, einem Wort für Brot jeder Art; auf Englisch taucht es erstmals 1803 in einem Reisebericht von William Tooke auf, damals „nan“ geschrieben."
    - key: tandoor-480
      source: en-GB
      text:
        en-GB: "In a tandoor the dough is slapped against the inner wall, which can reach 480 °C, so naan bakes in minutes and gets its typical browned spots."
        de-AT: "Im Tandur klebt man den Teig an die Innenwand, die bis zu 480 °C heiß werden kann; so ist Naan in wenigen Minuten fertig und bekommt seine typischen braunen Flecken."

- ingredient: rusk
  articles:
    en-GB: {title: "Rusk", revision: 1375329442}
    de-AT: {title: "Zwieback", revision: 268896278}
  facts:
    - key: butcher-rusk
      source: en-GB
      text:
        en-GB: "In Britain rusk is also a sausage ingredient: dry biscuit is broken into particles, sorted by size and sold to butchers as a binder."
        de-AT: "In Großbritannien steckt Zwieback auch in Würsten: Trockenes Gebäck wird zerkleinert, nach Korngröße sortiert und an Fleischer als Bindemittel verkauft."
    - key: farleys
      source: en-GB
      text:
        en-GB: "Farley's Rusks, a hard teething biscuit for babies sold in the UK, date from the 1880s and have been made by Heinz since 1994."
        de-AT: "Farley's Rusks, ein harter Zahnungskeks für Babys aus Großbritannien, gibt es seit den 1880er-Jahren; seit 1994 stellt ihn Heinz her."

- ingredient: croutons
  articles:
    en-GB: {title: "Crouton", revision: 1384163076}
    de-AT: {title: "Croûton", revision: 235976305}
  facts:
    - key: croute-crust
      source: en-GB
      text:
        en-GB: "Crouton comes from the French croûton, a diminutive of croûte, \"crust\"."
        de-AT: "Das Wort Crouton kommt vom französischen „croûton“, einer Verkleinerungsform von „croûte“, Kruste."
    - key: grenobloise
      source: en-GB
      text:
        en-GB: "A dish served à la grenobloise, in the Grenoble manner, comes with small croutons, brown butter, capers, parsley and lemon."
        de-AT: "Ein Gericht „à la grenobloise“, nach Art von Grenoble, bekommt kleine Croutons, braune Butter, Kapern, Petersilie und Zitrone dazu."

- ingredient: beef_mince
  articles:
    en-GB: {title: "Ground beef", revision: 1377720601}
    de-AT: {title: "Hackfleisch", revision: 271025958}
  facts:
    - key: tatar-fat
      source: en-GB
      text:
        en-GB: "In Germany ordinary beef mince may contain up to 15% fat, while the special Tatar meant for steak tartare must have less than 5%."
        de-AT: "In Deutschland darf normales Rinderfaschiertes bis zu 15 % Fett enthalten, das spezielle Tatar für Steak tartare dagegen weniger als 5 %."
    - key: hamburger-vs-ground
      source: en-GB
      text:
        en-GB: "US rules distinguish \"hamburger\" from \"ground beef\": beef fat may be added to the first but not the second, and neither may exceed 30% fat."
        de-AT: "In den USA wird zwischen „hamburger“ und „ground beef“ unterschieden: Nur Ersterem darf Rinderfett zugesetzt werden, und beide dürfen höchstens 30 % Fett haben."

- ingredient: mixed_mince
  articles:
    en-GB: {title: "Ground meat", revision: 1387974206}
    de-AT: {title: "Hackfleisch", revision: 271025958}
  facts:
    - key: apicius-isicia
      source: en-GB
      text:
        en-GB: "The Roman cookbook attributed to Apicius already had a chapter of minced dishes called isicia, including small patties wrapped in caul fat."
        de-AT: "Schon das römische Kochbuch, das Apicius zugeschrieben wird, hatte ein Kapitel mit Faschiertem namens „isicia“, darunter kleine Laibchen im Schweinsnetz."
    - key: drais-grinder
      source: en-GB
      text:
        en-GB: "The mechanical meat grinder is generally credited to Karl Drais, the German inventor better known for his early forerunner of the bicycle."
        de-AT: "Den mechanischen Fleischwolf schreibt man meist Karl Drais zu, dem deutschen Erfinder, der vor allem für seinen Vorläufer des Fahrrads bekannt ist."

- ingredient: pork_mince
  articles:
    en-GB: {title: "Ground meat", revision: 1387974206}
    de-AT: {title: "Mett", revision: 269946814}
  facts:
    - key: mett-meat
      source: de-AT
      text:
        en-GB: "The German word Mett comes from Middle Low German met, meaning pure chopped pork without bacon, and is related to the English word meat."
        de-AT: "Das Wort Mett kommt vom mittelniederdeutschen „met“ für reines gehacktes Schweinefleisch ohne Speck und ist mit dem englischen „meat“ verwandt."
    - key: same-day
      source: de-AT
      text:
        en-GB: "In Germany loose raw pork mince for eating as Mett may only be sold on the day it was made."
        de-AT: "In Deutschland darf unverpacktes Mett, also rohes Schweinefaschiertes zum Rohessen, nur am Tag der Herstellung verkauft werden."
    - key: mettigel
      source: de-AT
      text:
        en-GB: "On German cold platters and buffets raw Mett is sometimes served shaped like a hedgehog, the Mettigel, also called Hackepeter-Igel."
        de-AT: "Auf deutschen kalten Platten und Buffets wird rohes Mett manchmal als Igel serviert, als „Mettigel“, auch Hackepeter-Igel genannt."

- ingredient: beef_steak
  articles:
    en-GB: {title: "Sirloin steak", revision: 1380438603}
    de-AT: {title: "Sirloin-Steak", revision: 267294504}
  facts:
    - key: sir-loin-myth
      source: en-GB
      text:
        en-GB: "The tale of an English king knighting a loin of beef \"Sir Loin\" is fiction: the word comes from Old French surloigne, \"above the loin\", and predates every king named in the story."
        de-AT: "Dass ein englischer König ein Lendenstück zum „Sir Loin“ geschlagen habe, ist erfunden: Das Wort kommt vom altfranzösischen „surloigne“, über der Lende, und ist älter als jeder genannte König."
    - key: rump-in-britain
      source: en-GB
      text:
        en-GB: "The American sirloin steak is called rump steak in British butchery, where sirloin instead means cuts from the upper middle of the animal."
        de-AT: "Das amerikanische Sirloin-Steak heißt in Großbritannien Rumpsteak, während „sirloin“ dort Stücke aus der oberen Mitte des Rinds bezeichnet."

- ingredient: beef_fillet
  articles:
    en-GB: {title: "Beef tenderloin", revision: 1363250910}
    de-AT: {title: "Lendenbraten", revision: 254064253}
  facts:
    - key: psoas
      source: en-GB
      text:
        en-GB: "The fillet is the psoas major muscle, lying beside the backbone near the kidneys; it does very little work, which makes it the most tender part of the beef."
        de-AT: "Das Filet ist der große Lendenmuskel neben der Wirbelsäule nahe den Nieren; er muss kaum arbeiten und ist deshalb das zarteste Stück vom Rind."
    - key: three-cuts
      source: en-GB
      text:
        en-GB: "A whole fillet has three parts: the wide butt end suits carpaccio, the centre gives Chateaubriand and Beef Wellington, and the thin tail goes into tournedos."
        de-AT: "Ein ganzes Filet hat drei Teile: Das breite Ende eignet sich für Carpaccio, das Mittelstück für Chateaubriand und Beef Wellington, die dünne Spitze für Tournedos."
    - key: lungenbraten
      source: de-AT
      text:
        en-GB: "In Austria beef fillet is called Lungenbraten, while the braised Lendenbraten of Austrian and Bohemian cooking is usually made from sirloin."
        de-AT: "In Österreich heißt das Rinderfilet Lungenbraten, während der geschmorte Lendenbraten der österreichischen und böhmischen Küche meist aus dem Beiried gemacht wird."

- ingredient: beef_boiled
  articles:
    en-GB: {title: "Tafelspitz", revision: 1357846361}
    de-AT: {title: "Tafelspitz (Gericht)", revision: 271887265}
  facts:
    - key: franz-joseph
      source: en-GB
      text:
        en-GB: "Emperor Franz Joseph I adored Tafelspitz; the Austro-Hungarian official cookery textbook of 1912 noted that his private table was never without a fine piece of boiled beef."
        de-AT: "Kaiser Franz Joseph I. liebte Tafelspitz; das amtliche Kochlehrbuch der Monarchie von 1912 hielt fest, dass an seiner Tafel nie ein schönes Stück gekochtes Rindfleisch fehlte."
    - key: sixteen-cuts
      source: en-GB
      text:
        en-GB: "Austrian butchers gave almost every beef muscle its own name: the hind leg alone is divided into 16 cuts, among them Hüferscherzl, Gschnatter and Fledermaus."
        de-AT: "Österreichische Fleischhauer gaben fast jedem Rindermuskel einen eigenen Namen: Allein der Schlögel wird in 16 Teile zerlegt, darunter Hüferscherzl, Gschnatter und Fledermaus."
    - key: picanha
      source: en-GB
      text:
        en-GB: "The cut called Tafelspitz in Austria is the rump cap at the top of the hindquarter, where the tail begins; Brazilians prize essentially the same cut as picanha for grilling."
        de-AT: "Der Tafelspitz ist das Stück am oberen Ende der Hüfte, wo der Schwanz ansetzt; in Brasilien schätzt man im Grunde dasselbe Stück als Picanha zum Grillen."

- ingredient: beef_goulash
  articles:
    en-GB: {title: "Goulash", revision: 1382585393}
    de-AT: {title: "Gulasch", revision: 266929690}
  facts:
    - key: cattle-herder
      source: en-GB
      text:
        en-GB: "The Hungarian word gulya means a herd of cattle, and gulyás is the herdsman; the stew was named after the men who drove cattle across the Puszta to markets as far as Vienna."
        de-AT: "Das ungarische „gulya“ heißt Rinderherde, „gulyás“ ist der Hirte; benannt ist das Gericht nach den Männern, die Rinder über die Puszta bis auf die Märkte in Wien trieben."
    - key: sheep-stomach
      source: en-GB
      text:
        en-GB: "Hungarian shepherds as early as the 10th century sun-dried their cooked, seasoned meat and packed it into bags made from sheep's stomachs, needing only water to turn it into a meal."
        de-AT: "Schon im 10. Jahrhundert trockneten ungarische Hirten ihr gekochtes, gewürztes Fleisch in der Sonne und füllten es in Schafmägen; mit Wasser wurde daraus eine Mahlzeit."
    - key: soup-in-hungary
      source: en-GB
      text:
        en-GB: "In Hungary itself gulyás is a soup; the thick stew most of Central Europe calls goulash is closer to what Hungarians call pörkölt."
        de-AT: "In Ungarn selbst ist Gulyás eine Suppe; das dicke Gulasch, das man im restlichen Mitteleuropa kennt, entspricht eher dem ungarischen Pörkölt."

- ingredient: beef_roast
  articles:
    en-GB: {title: "Roast beef", revision: 1356292509}
    de-AT: {title: "Rinderbraten", revision: 249527235}
  facts:
    - key: les-rosbifs
      source: en-GB
      text:
        en-GB: "Roast beef is so tied to England that the French nickname the English les rosbifs, and the 1731 ballad \"The Roast Beef of Old England\" made it a national symbol."
        de-AT: "Roastbeef ist so eng mit England verbunden, dass die Franzosen die Engländer „les rosbifs“ nennen; die Ballade „The Roast Beef of Old England“ von 1731 machte es zum Nationalsymbol."
    - key: beef-on-weck
      source: en-GB
      text:
        en-GB: "In western New York, roast beef goes into beef on weck, a sandwich tradition dating back to the late 1800s."
        de-AT: "Im Westen des Staates New York wird Roastbeef zu „Beef on Weck“, einer Sandwich-Tradition aus dem späten 19. Jahrhundert."

- ingredient: veal
  articles:
    en-GB: {title: "Wiener schnitzel", revision: 1388109564}
    de-AT: {title: "Wiener Schnitzel", revision: 272471708}
  facts:
    - key: radetzky-myth
      source: en-GB
      text:
        en-GB: "The tale that Field Marshal Radetzky brought the recipe from Italy to Vienna in 1857 was dismissed as invented by the linguist Heinz-Dieter Pohl; the name already appears in an 1831 cookbook."
        de-AT: "Dass Feldmarschall Radetzky das Rezept 1857 aus Italien nach Wien brachte, ist laut dem Sprachwissenschaftler Heinz-Dieter Pohl erfunden; der Name steht schon in einem Kochbuch von 1831."
    - key: souffle-crumbs
      source: en-GB
      text:
        en-GB: "The breadcrumbs on a Wiener schnitzel must not be pressed on, so they stay dry and puff away from the meat; it is fried swimming in fat at 160 to 170 °C."
        de-AT: "Die Brösel beim Wiener Schnitzel dürfen nicht angedrückt werden, damit sie trocken bleiben und sich vom Fleisch heben; gebacken wird es schwimmend in Fett bei 160 bis 170 °C."
    - key: veal-by-law
      source: en-GB
      text:
        en-GB: "Austrian law requires a Wiener Schnitzel to be made of veal; a pork version must be sold as Wiener Schnitzel vom Schwein or Schnitzel Wiener Art."
        de-AT: "In Österreich muss ein Wiener Schnitzel laut Gesetz vom Kalb sein; die Variante aus Schweinefleisch heißt „Wiener Schnitzel vom Schwein“ oder „Schnitzel Wiener Art“."

- ingredient: pork_chop
  articles:
    en-GB: {title: "Pork chop", revision: 1386657110}
    de-AT: {title: "Kotelett", revision: 266477855}
  facts:
    - key: 14th-century
      source: en-GB
      text:
        en-GB: "English records the term pork chop only from about 1752, but the French côtelette de porc goes back to the 14th century."
        de-AT: "Im Englischen ist „pork chop“ erst ab etwa 1752 belegt, die französische „côtelette de porc“ reicht dagegen bis ins 14. Jahrhundert zurück."
    - key: glasse-beeton
      source: en-GB
      text:
        en-GB: "Pork chops only became popular in the 19th century: Hannah Glasse's 1747 cookbook ignores them, while Mrs Beeton gave two recipes in 1861."
        de-AT: "Populär wurde das Schweinskotelett erst im 19. Jahrhundert: Hannah Glasse erwähnt es 1747 noch gar nicht, Mrs Beeton bringt 1861 schon zwei Rezepte."

- ingredient: pork_escalope
  articles:
    en-GB: {title: "Escalope", revision: 1383391438}
    de-AT: {title: "Schnitzel", revision: 272510331}
  facts:
    - key: mallet
      source: en-GB
      text:
        en-GB: "Beating an escalope thin with a mallet breaks down the meat fibres, which makes it more tender, and the thin slice cooks quickly."
        de-AT: "Klopft man ein Schnitzel mit dem Fleischklopfer dünn, zerreißen die Muskelfasern; das macht es zarter, und die dünne Scheibe gart schnell."
    - key: nut-origin
      source: en-GB
      text:
        en-GB: "The word escalope first appeared in late 17th-century rural north-eastern France, originally meaning a shelled nut or mollusc, and back then an escalope was always veal."
        de-AT: "Das Wort „escalope“ tauchte im späten 17. Jahrhundert im ländlichen Nordosten Frankreichs auf, bedeutete ursprünglich geschälte Nuss oder Muschel, und gemeint war damals stets Kalb."

- ingredient: pork_fillet
  articles:
    en-GB: {title: "Pork tenderloin", revision: 1374733882}
    de-AT: {title: "Filet (Fleisch)", revision: 254123397}
  facts:
    - key: posture-muscle
      source: en-GB
      text:
        en-GB: "Pork fillet is the psoas major along the spine; it is the most tender part of the pig because the muscle is used for posture rather than for moving."
        de-AT: "Das Schweinsfilet ist der große Lendenmuskel an der Wirbelsäule; es ist das zarteste Stück vom Schwein, weil dieser Muskel der Haltung dient und nicht der Fortbewegung."
    - key: tenderloin-sandwich
      source: en-GB
      text:
        en-GB: "In the American Midwest a breaded pork tenderloin cutlet in a bun is a regional speciality known simply as a tenderloin."
        de-AT: "Im Mittleren Westen der USA ist ein paniertes Schweinsfilet-Schnitzel im Weckerl eine regionale Spezialität und heißt dort einfach „Tenderloin“."

- ingredient: pork_belly
  articles:
    en-GB: {title: "Pork belly", revision: 1387316021}
    de-AT: {title: "Schweinebauch", revision: 267776156}
  facts:
    - key: three-layers
      source: en-GB
      text:
        en-GB: "Korean samgyeop-sal literally means \"three-layered meat\" after the visible layers of pork belly; with the skin left on it becomes ogyeop-sal, five layers."
        de-AT: "Das koreanische Samgyeop-sal heißt wörtlich „dreischichtiges Fleisch“, nach den sichtbaren Lagen im Schweinebauch; mit Schwarte wird daraus Ogyeop-sal, fünf Schichten."
    - key: danish-national
      source: en-GB
      text:
        en-GB: "Fried slices of pork belly, stegt flæsk, are the national dish of Denmark, and a whole roasted belly with crackling is a traditional Danish Christmas dish."
        de-AT: "Gebratene Scheiben Schweinebauch, „stegt flæsk“, sind das Nationalgericht Dänemarks, und ein ganzer Bauch mit Krustenschwarte gehört dort traditionell zu Weihnachten."

- ingredient: pork_shoulder
  articles:
    en-GB: {title: "Cut of pork", revision: 1371855124}
    de-AT: {title: "Schweinebug", revision: 234833315}
  facts:
    - key: butt-is-shoulder
      source: en-GB
      text:
        en-GB: "Pork butt, despite its name, comes from the upper part of the shoulder; the American Boston butt, Mexican carnitas and Italian capocollo come from this area."
        de-AT: "Der „Pork butt“ kommt trotz seines Namens aus dem oberen Teil der Schulter; aus dieser Gegend stammen auch der amerikanische Boston Butt, mexikanische Carnitas und italienischer Capocollo."
    - key: pluma
      source: en-GB
      text:
        en-GB: "Iberian butchers cut the pluma, a thin feather-shaped piece of about 100 to 120 g, from where the shoulder meets the loin; the name means \"feather\"."
        de-AT: "Iberische Fleischhauer schneiden die „Pluma“, ein dünnes, federförmiges Stück von etwa 100 bis 120 g, aus dem Übergang von Schulter zu Rücken; der Name heißt „Feder“."

- ingredient: lamb
  articles:
    en-GB: {title: "Lamb and mutton", revision: 1387126408}
    de-AT: {title: "Lammfleisch", revision: 267491546}
  facts:
    - key: incisor-rule
      source: en-GB
      text:
        en-GB: "In Britain meat may be sold as lamb only if the sheep has no permanent incisor teeth in wear; Australia added an alternative \"under 12 months\" rule in 2019."
        de-AT: "In Großbritannien gilt Fleisch nur als Lamm, wenn das Schaf noch keinen bleibenden Schneidezahn im Einsatz hat; Australien ließ 2019 zusätzlich „unter 12 Monaten“ gelten."
    - key: mouton
      source: en-GB
      text:
        en-GB: "Mutton comes from the French mouton, \"sheep\", and between lamb and mutton sits hogget, meat from sheep in their second year."
        de-AT: "Das englische „mutton“ kommt vom französischen „mouton“, Schaf, und zwischen Lamm und Hammel liegt „hogget“, Fleisch von Schafen im zweiten Lebensjahr."

- ingredient: lamb_chop
  articles:
    en-GB: {title: "Lamb and mutton", revision: 1387126408}
    de-AT: {title: "Lammfleisch", revision: 267491546}
  facts:
    - key: abbacchio
      source: en-GB
      text:
        en-GB: "In Roman dialect a suckling or just-weaned lamb is abbacchio, while agnello is one almost a year old that has been shorn twice; abbacchio is a protected Easter and Christmas dish."
        de-AT: "Im römischen Dialekt heißt ein Milchlamm oder frisch entwöhntes Lamm „abbacchio“, ein fast einjähriges, zweimal geschorenes „agnello“; Abbacchio ist ein geschütztes Oster- und Weihnachtsessen."
    - key: darker-older
      source: en-GB
      text:
        en-GB: "As a rule, the darker sheep meat is, the older the animal; younger lambs are smaller and more tender, while mutton from sheep over two years is tougher."
        de-AT: "Als Faustregel gilt: Je dunkler das Schaffleisch, desto älter das Tier; junge Lämmer sind kleiner und zarter, Hammel von über zwei Jahre alten Schafen ist fester."

- ingredient: venison
  articles:
    en-GB: {title: "Venison", revision: 1377094967}
    de-AT: {title: "Hirschfleisch", revision: 227616051}
  facts:
    - key: venari
      source: en-GB
      text:
        en-GB: "Venison comes from the Latin venari, \"to hunt\", and reached English through Norman French venaison in the 11th century, after the Norman Conquest."
        de-AT: "Das englische „venison“ kommt vom lateinischen „venari“, jagen, und gelangte im 11. Jahrhundert nach der normannischen Eroberung über das Normannische ins Englische."
    - key: any-game
      source: en-GB
      text:
        en-GB: "Venison once meant any hunted game, including rabbits, hares, wild boar and ibex; in southern Africa, with no native deer, it still means antelope."
        de-AT: "Ursprünglich meinte „venison“ jedes erjagte Wild, auch Kaninchen, Hasen, Wildschwein und Steinbock; im südlichen Afrika ohne heimische Hirsche bedeutet es bis heute Antilope."
    - key: humble-pie
      source: en-GB
      text:
        en-GB: "Deer offal was traditionally called umbles, and a pie made from it is supposedly where the phrase \"humble pie\" comes from."
        de-AT: "Die Innereien vom Hirsch hießen im Englischen traditionell „umbles“, und eine Pastete daraus soll der Ursprung der Redewendung „humble pie“ sein."

- ingredient: chicken_breast
  articles:
    en-GB: {title: "Chicken as food", revision: 1386993854}
    de-AT: {title: "Geflügelfleisch", revision: 271931938}
  facts:
    - key: 19-billion
      source: en-GB
      text:
        en-GB: "The United Nations estimated there were 19 billion chickens on Earth in 2011, outnumbering humans by more than two to one."
        de-AT: "Die Vereinten Nationen schätzten 2011 rund 19 Milliarden Hühner auf der Erde, mehr als doppelt so viele wie Menschen."
    - key: europe-1996
      source: en-GB
      text:
        en-GB: "In Europe chicken overtook beef and veal in consumption in 1996, a shift linked to public awareness of mad cow disease."
        de-AT: "In Europa überholte Hühnerfleisch 1996 beim Verbrauch Rind und Kalb, ein Wandel, der mit der Angst vor dem Rinderwahnsinn zusammenhing."

- ingredient: chicken_thigh
  articles:
    en-GB: {title: "Chicken as food", revision: 1386993854}
    de-AT: {title: "Geflügelfleisch", revision: 271931938}
  facts:
    - key: oysters
      source: en-GB
      text:
        en-GB: "On the back of a chicken, close to the thigh, sit two small round pieces of dark meat called oysters, often considered a delicacy."
        de-AT: "Am Rücken des Huhns, gleich neben dem Oberschenkel, sitzen zwei kleine runde Stücke dunkles Fleisch, auf Englisch „oysters“ genannt und oft als Delikatesse geschätzt."
    - key: rich-mans-meat
      source: en-GB
      text:
        en-GB: "In the 19th-century United States chicken cost more than other meats and was sought by the rich as an uncommon dish; consumption only rose with the beef shortages of the Second World War."
        de-AT: "In den USA des 19. Jahrhunderts war Huhn teurer als anderes Fleisch und ein seltenes Essen der Reichen; mehr gegessen wurde es erst, als im Zweiten Weltkrieg Rind knapp wurde."

- ingredient: chicken_leg
  articles:
    en-GB: {title: "Backhendl", revision: 1358066335}
    de-AT: {title: "Wiener Backhendl", revision: 33708721}
  facts:
    - key: biedermeier
      source: de-AT
      text:
        en-GB: "In the Biedermeier era the Backhendl was the epitome of fine Viennese cooking, reserved for the aristocracy and the well-off middle classes."
        de-AT: "In der Biedermeierzeit war das Backhendl der Inbegriff der feinen Wiener Küche und blieb der Aristokratie und dem gehobenen Bürgertum vorbehalten."
    - key: boned-and-flattened
      source: de-AT
      text:
        en-GB: "Backhendl used to be made differently: the whole chicken was boned and pounded flat with a meat mallet so it could be fried in a pan."
        de-AT: "Früher wurde das Backhendl anders gemacht: Man löste das ganze Huhn aus und klopfte es mit dem Fleischhammer flach, damit es in der Pfanne Platz hatte."
    - key: giblets
      source: de-AT
      text:
        en-GB: "A traditional Wiener Backhendl also includes the liver, heart and gizzard, breaded and fried as well, and comes with fried sprigs of parsley."
        de-AT: "Zu einem klassischen Wiener Backhendl gehören auch Leber, Herz und Magen, ebenfalls paniert und gebacken, dazu frittierte Petersilie."

- ingredient: chicken_wings
  articles:
    en-GB: {title: "Buffalo wing", revision: 1388034662}
    de-AT: {title: "Chicken Wings", revision: 269712792}
  facts:
    - key: anchor-bar
      source: en-GB
      text:
        en-GB: "One claim says Buffalo wings were first made in 1964 at the Anchor Bar in Buffalo, New York, by Teressa Bellissimo, when wings were cheap and usually thrown away or used for stock."
        de-AT: "Einer Version nach machte Teressa Bellissimo 1964 in der Anchor Bar in Buffalo, New York, die ersten Buffalo Wings, als Flügerl billig waren und meist weggeworfen oder ausgekocht wurden."
    - key: not-the-animal
      source: en-GB
      text:
        en-GB: "Buffalo wings are named after the city of Buffalo, not the animal, and the name now covers other foods tossed in the same cayenne and butter sauce, even cauliflower."
        de-AT: "Buffalo Wings heißen nach der Stadt Buffalo, nicht nach dem Tier; inzwischen trägt alles den Namen, was in derselben Sauce aus Cayennepfeffer und Butter landet, sogar Karfiol."

- ingredient: whole_chicken
  articles:
    en-GB: {title: "Roast chicken", revision: 1388154899}
    de-AT: {title: "Brathähnchen", revision: 266649511}
  facts:
    - key: hendl
      source: en-GB
      text:
        en-GB: "Hendl is the Austro-Bavarian word for chicken, usually roasted as a Brathendl; in eastern Germany a roast chicken is often called a Broiler."
        de-AT: "„Hendl“ ist das bairisch-österreichische Wort für Huhn, meist gebraten als Brathendl; im Osten Deutschlands sagt man zum Brathuhn oft „Broiler“."
    - key: costco-60-million
      source: en-GB
      text:
        en-GB: "The wholesale club Costco sells around 60 million of its US$4.99 whole roast chickens every year."
        de-AT: "Die Großhandelskette Costco verkauft jedes Jahr rund 60 Millionen ganze Brathühner zum Preis von 4,99 US-Dollar."

- ingredient: turkey_breast
  articles:
    en-GB: {title: "Turkey as food", revision: 1384391254}
    de-AT: {title: "Pute", revision: 268381513}
  facts:
    - key: wild-dark-breast
      source: en-GB
      text:
        en-GB: "Wild turkeys are the same species as farmed ones, yet almost all their meat is dark, even the breast, and in late summer it tastes gamier from all the insects they eat."
        de-AT: "Wildtruthühner sind dieselbe Art wie Zuchtputen, doch fast ihr ganzes Fleisch ist dunkel, sogar die Brust, und im Spätsommer schmeckt es durch die vielen Insekten wildiger."
    - key: costly-eggs
      source: en-GB
      text:
        en-GB: "Turkey eggs are rarely sold as food because whole birds are in high demand and the hens lay few eggs; a single one costs about $2 to $3."
        de-AT: "Truthahneier kommen kaum in den Handel, weil ganze Puten gefragt sind und die Hennen wenig legen; ein einzelnes Ei kostet etwa 2 bis 3 Dollar."

- ingredient: turkey_mince
  articles:
    en-GB: {title: "Ground turkey", revision: 1360882554}
  facts:
    - key: thighs-not-breast
      source: en-GB
      text:
        en-GB: "Most turkey mince is made from surplus thighs and drumsticks rather than the dearer breast, minced together with skin and fat in their natural proportions."
        de-AT: "Das meiste Putenfaschierte wird aus überschüssigen Ober- und Unterschenkeln statt aus der teureren Brust gemacht, samt Haut und Fett in natürlichem Verhältnis."
    - key: natural-fat
      source: en-GB
      text:
        en-GB: "The USDA sets no fixed fat limit for ground turkey, but the fat may not exceed natural levels, which usually lie between 10% and 15%."
        de-AT: "Die US-Lebensmittelbehörde schreibt für Putenfaschiertes keine feste Fettgrenze vor, das Fett darf aber den natürlichen Anteil nicht übersteigen, meist 10 bis 15 %."

- ingredient: duck_breast
  articles:
    en-GB: {title: "Duck as food", revision: 1385002485}
    de-AT: {title: "Entenfleisch", revision: 270357494}
  facts:
    - key: walk-through-kitchen
      source: en-GB
      text:
        en-GB: "Wild duck is served rare, and an old saying holds that a mallard should walk through the kitchen, a wigeon run slowly through and a teal rush through."
        de-AT: "Wildente wird rosa serviert; ein altes Sprichwort sagt, eine Stockente solle durch die Küche gehen, eine Pfeifente langsam laufen und eine Krickente durcheilen."
    - key: mallard-ancestor
      source: en-GB
      text:
        en-GB: "Ducks were domesticated in China more than 2,000 years ago, and almost all domestic breeds in Europe and North America descend from the mallard."
        de-AT: "Enten wurden vor mehr als 2.000 Jahren in China domestiziert, und fast alle Hausentenrassen in Europa und Nordamerika stammen von der Stockente ab."

- ingredient: bacon
  articles:
    en-GB: {title: "Bacon", revision: 1387919294}
    de-AT: {title: "Bauchspeck", revision: 269299500}
  facts:
    - key: back-meat
      source: en-GB
      text:
        en-GB: "The word bacon goes back to the Proto-Germanic *bakkon, meaning \"back meat\"."
        de-AT: "Das englische Wort „bacon“ geht auf das urgermanische *bakkon zurück, was „Rückenfleisch“ bedeutet."
    - key: streaky-rashers
      source: en-GB
      text:
        en-GB: "Streaky bacon is side bacon from the pork belly, and a thin slice of any bacon is a rasher; about 70% of bacon is sold as rashers."
        de-AT: "„Streaky bacon“ ist Bauchspeck, und eine dünne Scheibe heißt auf Englisch „rasher“; rund 70 % des Bacons werden in solchen Scheiben verkauft."
    - key: same-barrel
      source: en-GB
      text:
        en-GB: "Ham and bacon were historically just different cuts cured the same way, often packed together in the same barrel; today ham brine contains more sugar."
        de-AT: "Schinken und Bacon waren früher nur verschiedene Teilstücke, gleich gepökelt und oft im selben Fass gelagert; heute enthält die Lake für Schinken mehr Zucker."

- ingredient: speck
  articles:
    en-GB: {title: "Speck", revision: 1342318811}
    de-AT: {title: "Speck", revision: 270971169}
  facts:
    - key: gailtal
      source: en-GB
      text:
        en-GB: "Gailtaler Speck from Carinthia's Gail Valley has been made since the 15th century and holds protected PGI status, as does Tyrolean speck."
        de-AT: "Gailtaler Speck aus dem Kärntner Gailtal wird seit dem 15. Jahrhundert hergestellt und ist, wie der Tiroler Speck, eine geschützte geografische Angabe."
    - key: bachen
      source: en-GB
      text:
        en-GB: "Speck only became the everyday word in the 18th century, replacing the older bachen, a relative of the English bacon."
        de-AT: "„Speck“ setzte sich erst im 18. Jahrhundert als gängiges Wort durch und verdrängte das ältere „Bachen“, einen Verwandten des englischen „bacon“."

- ingredient: beef_bacon
  articles:
    en-GB: {title: "Bacon", revision: 1387919294}
  facts:
    - key: other-animals
      source: en-GB
      text:
        en-GB: "Meat from beef, lamb, goat or poultry can be cut and cured to resemble bacon, a practice common where many people follow Jewish or Muslim dietary laws that forbid pork."
        de-AT: "Rind, Lamm, Ziege oder Geflügel lassen sich wie Bacon schneiden und pökeln, verbreitet vor allem dort, wo viele Menschen jüdischen oder muslimischen Speisegesetzen folgen, die Schwein verbieten."
    - key: substitutes
      source: en-GB
      text:
        en-GB: "Beef bacon is one of many stand-ins for pork bacon, alongside versions made from chicken, turkey, bison, soya and even coconut."
        de-AT: "Rinderspeck ist nur einer von vielen Ersatzspecks; es gibt auch Varianten aus Huhn, Pute, Bison, Soja und sogar Kokos."

- ingredient: ham
  articles:
    en-GB: {title: "Ham", revision: 1385589670}
    de-AT: {title: "Schinken", revision: 269258886}
  facts:
    - key: knee-bend
      source: en-GB
      text:
        en-GB: "The English word ham comes from Old English ham or hom, the hollow behind the knee, and only came to mean the pig's cured hind leg around the 15th century."
        de-AT: "Das englische „ham“ kommt vom altenglischen „ham“ oder „hom“, der Kniekehle, und bezeichnet erst seit etwa dem 15. Jahrhundert die gepökelte Hinterkeule des Schweins."
    - key: cato
      source: en-GB
      text:
        en-GB: "Cato the Elder wrote about salting hams around 160 BC, and the Etruscans were already curing ham in the 6th and 5th centuries BC."
        de-AT: "Cato der Ältere schrieb um 160 v. Chr. über das Einsalzen von Schinken, und schon die Etrusker pökelten im 6. und 5. Jahrhundert v. Chr. Schinken."
    - key: nitrite-colour
      source: en-GB
      text:
        en-GB: "Cured ham stays pink because nitrites react with the meat's myoglobin; the same salts also stop harmful bacteria from growing."
        de-AT: "Gepökelter Schinken bleibt rosa, weil Nitrit mit dem Muskelfarbstoff Myoglobin reagiert; dieselben Salze hemmen auch schädliche Bakterien."

- ingredient: prosciutto
  articles:
    en-GB: {title: "Prosciutto", revision: 1385483730}
    de-AT: {title: "Rohschinken", revision: 256718757}
  facts:
    - key: just-ham
      source: en-GB
      text:
        en-GB: "In Italian prosciutto simply means ham, so cooked ham is prosciutto cotto and the air-dried kind is prosciutto crudo."
        de-AT: "Auf Italienisch heißt Prosciutto einfach Schinken: Gekochter ist Prosciutto cotto, luftgetrockneter Prosciutto crudo."
    - key: asciutto
      source: en-GB
      text:
        en-GB: "Prosciutto probably comes from the Italian asciutto, \"dry\", or from Latin words meaning to suck the moisture out, and unlike South Tyrolean speck it is never smoked."
        de-AT: "Prosciutto kommt wohl vom italienischen „asciutto“, trocken, oder von lateinischen Wörtern für das Heraussaugen der Feuchtigkeit; anders als Südtiroler Speck wird er nicht geräuchert."

- ingredient: salami
  articles:
    en-GB: {title: "Salami", revision: 1387325204}
    de-AT: {title: "Salami", revision: 272495221}
  facts:
    - key: salt-collective
      source: en-GB
      text:
        en-GB: "Salami is the plural of the Italian salame, built from sale, \"salt\", plus the ending -ame that marks a collective noun."
        de-AT: "Salami ist die Mehrzahl des italienischen „salame“, gebildet aus „sale“, Salz, und der Endung „-ame“, die eine Sammelbezeichnung anzeigt."
    - key: dry-south-smoke-north
      source: en-GB
      text:
        en-GB: "Southern Europeans dried their sausages in long sunny days to lower water activity, while fermented sausages in the north needed smoking to keep."
        de-AT: "Im Süden Europas trocknete man Würste in langen, sonnigen Tagen, um ihnen Wasser zu entziehen, im Norden mussten fermentierte Würste zusätzlich geräuchert werden."

- ingredient: frankfurter
  articles:
    en-GB: {title: "Vienna sausage", revision: 1381264261}
    de-AT: {title: "Wiener Würstchen", revision: 266652169}
  facts:
    - key: name-swap
      source: en-GB
      text:
        en-GB: "In Germany this sausage is a Wiener, \"Viennese\", yet in Austria that name is uncommon: there it is a Frankfurter Würstel."
        de-AT: "In Deutschland heißt diese Wurst „Wiener“, in Österreich dagegen kaum: Hier ist sie das Frankfurter Würstel."
    - key: sheep-casing
      source: en-GB
      text:
        en-GB: "A traditional Vienna sausage is pork and beef in a sheep's intestine casing, parboiled and then smoked at a low temperature."
        de-AT: "Ein klassisches Frankfurter besteht aus Schweine- und Rindfleisch im Schafsaitling, wird gebrüht und dann bei niedriger Temperatur geräuchert."
    - key: lahner-1805
      source: de-AT
      text:
        en-GB: "The butcher Johann Georg Lahner, who had trained in Frankfurt, began selling his sausages in Vienna on 15 May 1805, with beef added to the recipe."
        de-AT: "Der in Frankfurt ausgebildete Fleischhauer Johann Georg Lahner verkaufte ab dem 15. Mai 1805 in Wien seine Würstel, mit Rindfleisch in der Rezeptur."

- ingredient: sausage
  articles:
    en-GB: {title: "Bratwurst", revision: 1387353033}
    de-AT: {title: "Bratwurst", revision: 272401755}
  facts:
    - key: braet
      source: en-GB
      text:
        en-GB: "Bratwurst comes from the Old High German Brätwurst, from brät, finely chopped meat, though today most people link it with braten, to fry."
        de-AT: "Bratwurst kommt vom althochdeutschen „Brätwurst“, von „Brät“, fein gehacktem Fleisch, auch wenn man heute meist an „braten“ denkt."
    - key: nuremberg-1313
      source: en-GB
      text:
        en-GB: "The earliest documented bratwurst in Germany dates from 1313 in Nuremberg, a city still famous for its grilling sausages."
        de-AT: "Der älteste Beleg für Bratwurst in Deutschland stammt von 1313 aus Nürnberg, das bis heute für seine Rostbratwürste berühmt ist."
    - key: coburg-pinecones
      source: en-GB
      text:
        en-GB: "The Coburger Bratwurst, documented since 1498, is bound with raw egg, contains at least 15% beef and is traditionally grilled over pine cones."
        de-AT: "Die Coburger Bratwurst, belegt seit 1498, wird mit rohem Ei gebunden, enthält mindestens 15 % Rind und wird traditionell über Kiefernzapfen gegrillt."

- ingredient: grammeln
  articles:
    en-GB: {title: "Cracklings", revision: 1364096265}
    de-AT: {title: "Grieben (Speck)", revision: 268397810}
  facts:
    - key: leftover-of-lard
      source: en-GB
      text:
        en-GB: "Cracklings are the solid bits left over when animal fat and skin are rendered into lard, tallow or schmaltz, most often from pork, goose or chicken."
        de-AT: "Grammeln sind die festen Reste, die beim Auslassen von Fett und Schwarte zu Schmalz oder Talg übrig bleiben, meist vom Schwein, von der Gans oder vom Huhn."
    - key: gribenes
      source: en-GB
      text:
        en-GB: "In Ashkenazi Jewish cooking chicken and goose cracklings are called gribenes, a word related to the German Griebe."
        de-AT: "In der aschkenasisch-jüdischen Küche heißen Hühner- und Gänsegrammeln „Gribenes“, verwandt mit dem deutschen Wort „Griebe“."
    - key: pogacsa
      source: en-GB
      text:
        en-GB: "Crackling is worked into doughs across Europe, from the French pompe aux grattons to Hungarian tepertős pogácsa, small crackling scones."
        de-AT: "Grammeln landen in ganz Europa im Teig, von der französischen „pompe aux grattons“ bis zur ungarischen „tepertős pogácsa“, den Grammelpogatscherln."

- ingredient: leberkaese
  articles:
    en-GB: {title: "Leberkäse", revision: 1352196635}
    de-AT: {title: "Fleischkäse", revision: 272335306}
  facts:
    - key: no-liver
      source: en-GB
      text:
        en-GB: "Despite its name, \"liver cheese\" traditionally needs neither liver nor cheese: it is beef, pork and bacon ground very fine and baked in a loaf tin until crusty."
        de-AT: "Trotz seines Namens braucht Leberkäse traditionell weder Leber noch Käse: Rind, Schwein und Speck werden sehr fein gekuttert und in der Form knusprig gebacken."
    - key: lkw
      source: en-GB
      text:
        en-GB: "In Swabia and Franconia a Leberkäse roll is a Leberkäsweckle, nicknamed LKW after the German abbreviation for a lorry."
        de-AT: "In Schwaben und Franken heißt die Leberkässemmel „Leberkäsweckle“, kurz LKW, in Anspielung auf den Lastkraftwagen."

- ingredient: smoked_pork
  articles:
    en-GB: {title: "Smoked meat", revision: 1382234876}
    de-AT: {title: "Rauchfleisch", revision: 260519891}
  facts:
    - key: phenols
      source: en-GB
      text:
        en-GB: "Cold smoking below 32 °C adds phenols that act against microbes and so preserves cured meat, while hot smoking above 71 °C mostly adds flavour and cooks it."
        de-AT: "Kaltes Selchen unter 32 °C bringt Phenole ins gepökelte Fleisch, die Keime hemmen und es haltbar machen; heißes Räuchern über 71 °C sorgt vor allem für Geschmack und gart."
    - key: hardwood
      source: en-GB
      text:
        en-GB: "Meat is smoked over hardwood because the resin in softwood produces far more polycyclic aromatic hydrocarbons."
        de-AT: "Geselcht wird über Hartholz, weil das Harz von Nadelholz deutlich mehr polyzyklische aromatische Kohlenwasserstoffe erzeugt."
    - key: selchfleisch
      source: de-AT
      text:
        en-GB: "In Bavaria and Austria smoked cured meat is also known as Selchfleisch, Geselchtes or Zankerl."
        de-AT: "In Bayern und Österreich heißt gepökeltes, geräuchertes Fleisch auch Selchfleisch, Geselchtes oder Zankerl."

- ingredient: black_pudding
  articles:
    en-GB: {title: "Black pudding", revision: 1386657224}
    de-AT: {title: "Blutwurst", revision: 271158303}
  facts:
    - key: porpoise
      source: en-GB
      text:
        en-GB: "Black pudding was not always made with pig's blood: one 15th-century English recipe, eaten only by the nobility, used the blood of a porpoise."
        de-AT: "Blutwurst war nicht immer vom Schwein: Ein englisches Rezept aus dem 15. Jahrhundert, das nur der Adel aß, verwendete das Blut eines Schweinswals."
    - key: martinmas
      source: en-GB
      text:
        en-GB: "Because blood spoils fast at slaughter, black pudding was historically tied to Martinmas, when the year's livestock was killed."
        de-AT: "Weil Blut beim Schlachten schnell verdirbt, gehörte die Blunzen früher zum Martinstag, an dem das Vieh fürs Jahr geschlachtet wurde."

- ingredient: beef_liver
  articles:
    en-GB: {title: "Liver as food", revision: 1378021587}
    de-AT: {title: "Leber (Lebensmittel)", revision: 253870175}
  facts:
    - key: b12-discovery
      source: en-GB
      text:
        en-GB: "Liver contains so much vitamin B12 that it was one of the factors that led to the vitamin's discovery."
        de-AT: "Leber enthält so viel Vitamin B12, dass sie mit zur Entdeckung dieses Vitamins führte."
    - key: sticky-root
      source: en-GB
      text:
        en-GB: "The words liver and Leber share a Proto-Germanic ancestor, *librō, traced to an Indo-European root meaning to smear or stick."
        de-AT: "„Leber“ und das englische „liver“ stammen vom urgermanischen *librō ab, das auf eine indogermanische Wurzel für schmieren oder kleben zurückgeführt wird."

- ingredient: calf_liver
  articles:
    en-GB: {title: "Liver as food", revision: 1378021587}
    de-AT: {title: "Leber (Lebensmittel)", revision: 253870175}
  facts:
    - key: ficatum-figs
      source: en-GB
      text:
        en-GB: "The French foie, Italian fegato and Spanish hígado come from Latin ficatum, \"stuffed with figs\", after geese fattened on figs."
        de-AT: "Das französische „foie“, das italienische „fegato“ und das spanische „hígado“ stammen vom lateinischen „ficatum“, mit Feigen gestopft, nach den Feigen-gemästeten Gänsen."
    - key: liver-and-bacon
      source: en-GB
      text:
        en-GB: "Calf's liver and bacon is a traditional British dish, the pan juices turning into a rich gravy."
        de-AT: "Kalbsleber mit Speck ist ein britischer Klassiker, bei dem der Bratensaft zu einer kräftigen Sauce wird."

- ingredient: veal_shank
  articles:
    en-GB: {title: "Ossobuco", revision: 1325393708}
    de-AT: {title: "Kalbshachse", revision: 245556399}
  facts:
    - key: bone-with-hole
      source: en-GB
      text:
        en-GB: "Ossobuco is Italian for \"bone with a hole\", after the marrow-filled hole in the cross-cut veal shank, and that prized marrow is what defines the dish."
        de-AT: "Ossobuco heißt „Knochen mit Loch“, nach dem Markloch in der quer geschnittenen Kalbsstelze; das begehrte Mark macht das Gericht aus."
    - key: in-bianco
      source: en-GB
      text:
        en-GB: "The original ossobuco has no tomatoes: ossobuco in bianco is flavoured with cinnamon, bay leaf and gremolada, and the tomato version is the modern one."
        de-AT: "Das ursprüngliche Ossobuco kommt ohne Paradeiser aus: Ossobuco in bianco wird mit Zimt, Lorbeer und Gremolata gewürzt, die Variante mit Paradeisern ist die jüngere."

- ingredient: goose
  articles:
    en-GB: {title: "Goose as food", revision: 1388221190}
    de-AT: {title: "Hausgans", revision: 265324434}
  facts:
    - key: egypt-2500bc
      source: en-GB
      text:
        en-GB: "Geese were deliberately fattened in Egypt as early as 2500 BC, and Egyptian wall paintings show them being force-fed."
        de-AT: "Schon um 2500 v. Chr. wurden in Ägypten Gänse gezielt gemästet, und ägyptische Wandmalereien zeigen, wie man sie stopfte."
    - key: slow-hatching
      source: en-GB
      text:
        en-GB: "Geese were domesticated later than many animals because they take 30 days to hatch and longer to rear, too slow for nomadic peoples."
        de-AT: "Gänse wurden später domestiziert als viele andere Tiere, denn sie brüten 30 Tage und brauchen danach lange zum Aufziehen, zu lange für Nomadenvölker."
    - key: st-martin
      source: en-GB
      text:
        en-GB: "In many European countries roast goose is a holiday dish for Christmas and St Martin's Day; in Croatia the Martinmas goose is stuffed with chestnuts."
        de-AT: "In vielen Ländern Europas ist Gänsebraten ein Festessen zu Weihnachten und zum Martinstag; in Kroatien wird die Martinigans mit Maroni gefüllt."

- ingredient: rabbit
  articles:
    en-GB: {title: "Rabbit", revision: 1386255592}
    de-AT: {title: "Kaninchenfleisch", revision: 233859773}
  facts:
    - key: roman-livestock
      source: en-GB
      text:
        en-GB: "Rabbits have been kept as livestock since at least the 1st century BC in ancient Rome, and raising them is called cuniculture."
        de-AT: "Kaninchen werden spätestens seit dem 1. Jahrhundert v. Chr. im alten Rom als Nutztiere gehalten; ihre Zucht nennt man Kunikultur."
    - key: malta
      source: en-GB
      text:
        en-GB: "In 1994 Malta ate the most rabbit per person in the world, 8.89 kg a year, ahead of Italy with 5.71 kg."
        de-AT: "1994 aß Malta pro Kopf am meisten Kaninchen weltweit, 8,89 kg im Jahr, vor Italien mit 5,71 kg."

- ingredient: wild_boar
  articles:
    en-GB: {title: "Wild boar", revision: 1387267059}
    de-AT: {title: "Wildschwein", revision: 271520092}
  facts:
    - key: goebekli-tepe
      source: en-GB
      text:
        en-GB: "Neolithic hunter-gatherers carved fierce wild boars on the temple pillars of Göbekli Tepe some 11,600 years ago."
        de-AT: "Jungsteinzeitliche Jäger und Sammler meißelten vor rund 11.600 Jahren wilde Keiler in die Tempelpfeiler von Göbekli Tepe."
    - key: gone-by-1900
      source: en-GB
      text:
        en-GB: "Hunting had made wild boar disappear from large parts of Germany, Austria and Italy by 1900; Denmark shot its last one in the early 19th century."
        de-AT: "Durch die Jagd war das Wildschwein um 1900 aus weiten Teilen Deutschlands, Österreichs und Italiens verschwunden; in Dänemark fiel der letzte Keiler Anfang des 19. Jahrhunderts."

- ingredient: salmon
  articles:
    en-GB: {title: "Salmon as food", revision: 1384100545}
    de-AT: {title: "Lachse", revision: 272245615}
  facts:
    - key: astaxanthin
      source: en-GB
      text:
        en-GB: "Salmon flesh is pink thanks to carotenoids such as astaxanthin that wild fish get from krill; farmers aim for a value of 16 on the Roche colour card."
        de-AT: "Lachs ist rosa dank Carotinoiden wie Astaxanthin, die Wildlachse über Krill aufnehmen; Züchter peilen auf der Roche-Farbskala den Wert 16 an."
    - key: norway-half
      source: en-GB
      text:
        en-GB: "Norway alone accounts for more than half of the world's salmon production, farmed and wild."
        de-AT: "Norwegen allein liefert mehr als die Hälfte der weltweiten Lachsproduktion, gezüchtet und wild."

- ingredient: smoked_salmon
  articles:
    en-GB: {title: "Smoked salmon", revision: 1385359633}
  facts:
    - key: lox
      source: en-GB
      text:
        en-GB: "Lox is not strictly smoked salmon: the word properly means salmon brined in salt, which may or may not be smoked afterwards."
        de-AT: "Lox ist streng genommen kein Räucherlachs: Das Wort meint in Salzlake eingelegten Lachs, der danach geräuchert sein kann, aber nicht muss."
    - key: potassium-salt
      source: en-GB
      text:
        en-GB: "Studies found that up to a third of the table salt used to cure smoked salmon can be replaced with potassium chloride without changing its taste."
        de-AT: "Studien zeigten, dass sich bis zu ein Drittel des Kochsalzes beim Räucherlachs durch Kaliumchlorid ersetzen lässt, ohne dass sich der Geschmack ändert."

- ingredient: trout
  articles:
    en-GB: {title: "Rainbow trout", revision: 1382397319}
    de-AT: {title: "Regenbogenforelle", revision: 263734009}
  facts:
    - key: pacific-native
      source: en-GB
      text:
        en-GB: "The rainbow trout is native to Pacific rivers of North America and Asia, yet it has been introduced to at least 45 countries on every continent except Antarctica."
        de-AT: "Die Regenbogenforelle stammt aus Pazifikzuflüssen Nordamerikas und Asiens, wurde aber in mindestens 45 Ländern auf allen Kontinenten außer der Antarktis eingesetzt."
    - key: steelhead
      source: en-GB
      text:
        en-GB: "The steelhead is a rainbow trout that goes to sea: it usually lives two to three years in the ocean before returning to fresh water to spawn."
        de-AT: "Die Steelhead ist eine Regenbogenforelle, die ins Meer zieht: Meist lebt sie zwei bis drei Jahre im Ozean, bevor sie zum Laichen ins Süßwasser zurückkehrt."

- ingredient: cod
  articles:
    en-GB: {title: "Atlantic cod", revision: 1387131270}
    de-AT: {title: "Atlantischer Kabeljau", revision: 272023772}
  facts:
    - key: collapse-1992
      source: en-GB
      text:
        en-GB: "Canada banned cod fishing in 1992, and several Atlantic cod stocks that collapsed in the 1990s by more than 95% have not fully recovered even without fishing."
        de-AT: "Kanada verbot 1992 den Kabeljaufang; mehrere Bestände, die in den 1990ern um mehr als 95 % einbrachen, haben sich selbst ohne Fischerei nicht ganz erholt."
    - key: giants
      source: en-GB
      text:
        en-GB: "Atlantic cod can live up to 25 years, and while most grow to 100 to 140 cm, fish over 180 cm and 50 kg have been caught."
        de-AT: "Kabeljau kann bis zu 25 Jahre alt werden; meist wird er 100 bis 140 cm lang, gefangen wurden aber schon Tiere mit über 180 cm und 50 kg."

- ingredient: pollock
  articles:
    en-GB: {title: "Pollachius virens", revision: 1387165887}
    de-AT: {title: "Köhler (Fisch)", revision: 268235115}
  facts:
    - key: not-a-salmon
      source: en-GB
      text:
        en-GB: "In Germany this fish is sold as Seelachs, \"sea salmon\", although it belongs to the cod family and is not closely related to any salmon."
        de-AT: "In Deutschland wird dieser Fisch als Seelachs verkauft, dabei gehört er zur Familie des Kabeljaus und ist mit keinem Lachs näher verwandt."
    - key: coalfish
      source: en-GB
      text:
        en-GB: "In Britain it is called coalfish, coley or saithe, a name owed to its very dark green back, and young fish are known as podleys or cuddies."
        de-AT: "In Großbritannien heißt er „coalfish“, „coley“ oder „saithe“, nach seinem sehr dunklen, grünen Rücken; junge Fische nennt man dort „podleys“ oder „cuddies“."

- ingredient: zander
  articles:
    en-GB: {title: "Zander", revision: 1387546904}
    de-AT: {title: "Zander", revision: 270674516}
  facts:
    - key: nest-guarding
      source: en-GB
      text:
        en-GB: "Zander fathers build nests: the females spawn into them, and the males then guard the eggs and the young fish."
        de-AT: "Beim Zander bauen die Männchen Nester; die Weibchen laichen hinein, und danach bewachen die Männchen Eier und Jungfische."
    - key: woburn-1878
      source: en-GB
      text:
        en-GB: "Zander reached Britain in 1878, when the 9th Duke of Bedford released them into the lakes of his Woburn Abbey estate."
        de-AT: "Nach Großbritannien kam der Zander 1878, als der 9. Herzog von Bedford ihn in die Seen seines Anwesens Woburn Abbey setzte."

- ingredient: carp
  articles:
    en-GB: {title: "Common carp", revision: 1387132438}
    de-AT: {title: "Karpfen", revision: 272319025}
  facts:
    - key: danube-delta
      source: en-GB
      text:
        en-GB: "The original common carp lived in the inland delta of the Danube about 2,000 years ago, a torpedo-shaped, golden-yellow fish the Romans later kept in special ponds."
        de-AT: "Der ursprüngliche Karpfen lebte vor rund 2.000 Jahren im Binnendelta der Donau, torpedoförmig und goldgelb; die Römer hielten ihn später in eigens angelegten Teichen."
    - key: monks
      source: en-GB
      text:
        en-GB: "Monks spread carp farming across Europe between the 13th and 16th centuries, and the mirror carp with its few large scales arose in Germany."
        de-AT: "Mönche verbreiteten die Karpfenzucht zwischen dem 13. und 16. Jahrhundert in ganz Europa, und der Spiegelkarpfen mit seinen wenigen großen Schuppen entstand in Deutschland."
    - key: christmas-carp
      source: de-AT
      text:
        en-GB: "Carp is a favourite at Christmas and New Year's Eve in Germany and Austria, and Austria's main carp ponds lie in the Waldviertel, southern Styria and southern Burgenland."
        de-AT: "Karpfen ist in Deutschland und Österreich vor allem zu Weihnachten und Silvester beliebt; Österreichs wichtigste Karpfenteiche liegen im Waldviertel, in der Südsteiermark und im Südburgenland."

- ingredient: tuna_fresh
  articles:
    en-GB: {title: "Tuna", revision: 1387960589}
    de-AT: {title: "Thunfische", revision: 267130200}
  facts:
    - key: warm-blooded
      source: en-GB
      text:
        en-GB: "Unusually for fish, tuna keep their swimming muscles, eyes and brain warmer than the surrounding water by conserving the heat their metabolism produces."
        de-AT: "Ungewöhnlich für Fische: Thunfische halten Muskeln, Augen und Gehirn wärmer als das umgebende Wasser, indem sie die Wärme ihres Stoffwechsels speichern."
    - key: record-bluefin
      source: en-GB
      text:
        en-GB: "The record price at Tokyo's opening-day fish auctions is 333.6 million yen, about US$3.1 million, for a single 278 kg bluefin."
        de-AT: "Der Rekordpreis bei den Eröffnungsauktionen des Tokioter Fischmarkts liegt bei 333,6 Millionen Yen, rund 3,1 Millionen US-Dollar, für einen einzigen Blauflossen-Thun von 278 kg."
    - key: thynnos
      source: en-GB
      text:
        en-GB: "The name tuna goes back to the Ancient Greek thýnnos, from a verb meaning \"to rush, dart along\"."
        de-AT: "Der Name Thunfisch geht auf das altgriechische „thýnnos“ zurück, abgeleitet von einem Verb für „stürmen, dahinschießen“."

- ingredient: sea_bass
  articles:
    en-GB: {title: "European seabass", revision: 1387133016}
    de-AT: {title: "Europäischer Wolfsbarsch", revision: 269715952}
  facts:
    - key: many-names
      source: en-GB
      text:
        en-GB: "European sea bass is sold under dozens of names, among them branzino in Italy and North America, loup de mer in France and lavraki in Greece."
        de-AT: "Der Wolfsbarsch wird unter Dutzenden Namen verkauft, darunter Branzino in Italien und Nordamerika, Loup de mer in Frankreich und Lavraki in Griechenland."
    - key: first-farmed
      source: en-GB
      text:
        en-GB: "Sea bass was one of the first fish farmed commercially in Europe and is now the most important farmed fish of the Mediterranean."
        de-AT: "Der Wolfsbarsch war einer der ersten Fische, die in Europa kommerziell gezüchtet wurden, und ist heute der wichtigste Zuchtfisch des Mittelmeers."

- ingredient: mackerel
  articles:
    en-GB: {title: "Atlantic mackerel", revision: 1387133944}
    de-AT: {title: "Makrele", revision: 268346292}
  facts:
    - key: no-swim-bladder
      source: en-GB
      text:
        en-GB: "Unlike its close relatives, the Atlantic mackerel has no swim bladder."
        de-AT: "Anders als ihre nahen Verwandten hat die Atlantische Makrele keine Schwimmblase."
    - key: tow-nets
      source: en-GB
      text:
        en-GB: "When feeding on plankton, mackerel swim in tightly packed schools with their mouths wide open, working like a row of tiny tow nets."
        de-AT: "Beim Fressen von Plankton schwimmen Makrelen dicht gedrängt mit weit geöffnetem Maul und wirken so wie eine Reihe winziger Schleppnetze."

- ingredient: herring
  articles:
    en-GB: {title: "Herring", revision: 1384625970}
    de-AT: {title: "Atlantischer Hering", revision: 271385908}
  facts:
    - key: matjes
      source: de-AT
      text:
        en-GB: "Matjes is herring that has fattened up in spring but has not yet developed roe or milt; at its best it holds about 18 per cent fat."
        de-AT: "Matjes ist Hering, der im Frühjahr Fett angesetzt hat, aber noch keinen Rogen und keine Milch trägt; bestenfalls hat er rund 18 % Fett."
    - key: silver-darlings
      source: en-GB
      text:
        en-GB: "In the United Kingdom herring were once nicknamed \"silver darlings\"."
        de-AT: "In Großbritannien nannte man Heringe früher liebevoll „silver darlings“, also silberne Lieblinge."
    - key: name-host
      source: en-GB
      text:
        en-GB: "The word herring may come from the same root as Old High German heri, \"host\" or \"multitude\", a nod to the huge schools the fish form."
        de-AT: "Das Wort Hering geht vielleicht auf dieselbe Wurzel zurück wie althochdeutsch heri, „Heer“ oder „Menge“, passend zu den riesigen Schwärmen."

- ingredient: sardine
  articles:
    en-GB: {title: "Sardine", revision: 1385509008}
    de-AT: {title: "Sardine", revision: 262289528}
  facts:
    - key: sardinia
      source: en-GB
      text:
        en-GB: "The word sardine reached English in the 15th century via French and Latin and probably goes back to the Greek name for Sardinia."
        de-AT: "Das Wort Sardine kam über das Französische und Lateinische ins Englische und geht wohl auf den griechischen Namen Sardiniens zurück."
    - key: 21-species
      source: en-GB
      text:
        en-GB: "There is no single sardine species: the international Codex standard for canned sardines lists 21 species that may be sold under that name."
        de-AT: "Eine einzige Sardinenart gibt es nicht: Der internationale Codex-Standard für Sardinenkonserven nennt 21 Arten, die so heißen dürfen."

- ingredient: anchovy
  articles:
    en-GB: {title: "Anchovy", revision: 1374373403}
    de-AT: {title: "Sardellen", revision: 266206789}
  facts:
    - key: grey-cure
      source: en-GB
      text:
        en-GB: "The strong taste of anchovies comes from curing in salt, which also turns the flesh deep grey. Pickled in vinegar, as Spanish boquerones, they stay white and mild."
        de-AT: "Der kräftige Geschmack von Sardellen entsteht beim Einsalzen, das Fleisch wird dabei dunkelgrau. In Essig eingelegt, als spanische Boquerones, bleibt es weiß und mild."
    - key: worcestershire
      source: en-GB
      text:
        en-GB: "Anchovies are a hidden ingredient in Worcestershire sauce, Caesar dressing and the British paste Gentleman's Relish."
        de-AT: "Sardellen stecken unsichtbar in Worcestershiresauce, im Caesar-Dressing und in der britischen Paste Gentleman’s Relish."
    - key: sabre-tooth
      source: en-GB
      text:
        en-GB: "Some early relatives of the anchovy from the Eocene were large predators with fangs, earning them the nickname \"sabre-toothed anchovies\"."
        de-AT: "Manche frühe Verwandte der Sardelle aus dem Eozän waren große Raubfische mit Fangzähnen, daher der Spitzname „Säbelzahn-Sardellen“."

- ingredient: tuna_can
  articles:
    en-GB: {title: "Canned fish", revision: 1369089426}
    de-AT: {title: "Thunfische", revision: 267130200}
  facts:
    - key: appert-prize
      source: en-GB
      text:
        en-GB: "Canning goes back to Nicolas Appert, who won a 12,000 franc prize from the French government in 1810 for a way to preserve food for the army."
        de-AT: "Die Konserve geht auf Nicolas Appert zurück, der 1810 einen Preis der französischen Regierung über 12.000 Franc für eine Methode gewann, Essen für die Armee haltbar zu machen."
    - key: precooked
      source: en-GB
      text:
        en-GB: "Tuna for tins is gutted by hand and precooked for 45 minutes to three hours before filleting; the dark blood meat often goes into pet food."
        de-AT: "Thunfisch für die Dose wird von Hand ausgenommen und 45 Minuten bis drei Stunden vorgegart; das dunkle Blutfleisch landet oft im Tierfutter."

- ingredient: prawns
  articles:
    en-GB: {title: "Prawn", revision: 1388095196}
    de-AT: {title: "Gambas (Lebensmittel)", revision: 271108930}
  facts:
    - key: no-definition
      source: en-GB
      text:
        en-GB: "Neither \"prawn\" nor \"shrimp\" is a scientific term; neither name matches any real taxonomic group, and today they are used almost interchangeably."
        de-AT: "„Garnele“, „Prawn“ und „Shrimp“ sind keine wissenschaftlichen Begriffe; keiner deckt sich mit einer echten Tiergruppe, die Namen werden fast beliebig verwendet."
    - key: uk-usage
      source: en-GB
      text:
        en-GB: "Prawn is the usual word in Britain, Ireland and the Commonwealth, while most North Americans keep it for large or freshwater shrimp."
        de-AT: "In Großbritannien, Irland und dem Commonwealth sagt man meist „prawn“, in Nordamerika fast nur für große oder Süßwassergarnelen."

- ingredient: crab
  articles:
    en-GB: {title: "Crab meat", revision: 1373622841}
    de-AT: {title: "Krabben", revision: 271032702}
  facts:
    - key: declawing
      source: en-GB
      text:
        en-GB: "Some fisheries remove only the claws and return the live crab to the sea; many species can regrow a lost claw at the next moult, about a year later."
        de-AT: "Manche Fischereien nehmen nur die Scheren und setzen die Krabbe lebend zurück; viele Arten bilden die Schere bei der nächsten Häutung etwa ein Jahr später neu."
    - key: white-brown
      source: en-GB
      text:
        en-GB: "Crab meat is graded as white or brown meat depending on which part of the body it comes from and its colour."
        de-AT: "Krabbenfleisch wird je nach Körperteil und Farbe in weißes und braunes Fleisch eingeteilt."

- ingredient: mussels
  articles:
    en-GB: {title: "Blue mussel", revision: 1387319907}
    de-AT: {title: "Gemeine Miesmuschel", revision: 268669426}
  facts:
    - key: byssus
      source: en-GB
      text:
        en-GB: "Mussels anchor themselves to rocks and to each other with byssal threads, tough and slightly elastic strands of collagen-like protein made by a gland in the foot."
        de-AT: "Miesmuscheln heften sich mit Byssusfäden an Felsen und aneinander, zähen, leicht dehnbaren Eiweißfäden aus einer Drüse im Fuß."
    - key: complex
      source: en-GB
      text:
        en-GB: "What is sold as blue mussel is really a group of at least three closely related species that can hybridise where they meet."
        de-AT: "Hinter der „Miesmuschel“ steckt eigentlich eine Gruppe aus mindestens drei eng verwandten Arten, die sich kreuzen, wo sie aufeinandertreffen."

- ingredient: squid
  articles:
    en-GB: {title: "Squid as food", revision: 1385417047}
    de-AT: {title: "Tintenfisch (Lebensmittel)", revision: 252324465}
  facts:
    - key: beak-pen
      source: en-GB
      text:
        en-GB: "Almost all of a squid is edible, including the ink; only the hard beak and the gladius, a stiff internal \"pen\", are discarded."
        de-AT: "Vom Tintenfisch ist fast alles essbar, auch die Tinte; nur der harte Schnabel und der Gladius, eine steife innere „Feder“, bleiben übrig."
    - key: two-minutes
      source: en-GB
      text:
        en-GB: "Italian calamari fritti are deep-fried for less than two minutes, because longer cooking makes squid tough."
        de-AT: "Italienische Calamari fritti werden kürzer als zwei Minuten frittiert, weil Tintenfisch bei längerem Garen zäh wird."

- ingredient: scallops
  articles:
    en-GB: {title: "Scallop", revision: 1386578773}
    de-AT: {title: "Kammmuscheln", revision: 260164866}
  facts:
    - key: eyes
      source: en-GB
      text:
        en-GB: "A scallop has up to 200 tiny eyes along the edge of its mantle, each focusing light with a curved mirror of guanine crystals instead of a lens."
        de-AT: "Eine Jakobsmuschel hat bis zu 200 winzige Augen am Mantelrand; sie bündeln Licht mit einem gewölbten Spiegel aus Guaninkristallen statt mit einer Linse."
    - key: swimming
      source: en-GB
      text:
        en-GB: "Unlike most bivalves, scallops can swim, escaping starfish by clapping their shells together to push out jets of water."
        de-AT: "Anders als die meisten Muscheln können Jakobsmuscheln schwimmen: Mit zusammenklappenden Schalen flüchten sie per Rückstoß vor Seesternen."
    - key: adductor
      source: en-GB
      text:
        en-GB: "The round white scallop meat sold as seafood is the adductor muscle, the muscle that snaps the two shells shut."
        de-AT: "Das runde weiße Muschelfleisch ist der Schließmuskel, der die beiden Schalen zusammenzieht."

- ingredient: flour
  articles:
    en-GB: {title: "Flour", revision: 1386865438}
    de-AT: {title: "Mehl", revision: 267872586}
  facts:
    - key: w480
      source: de-AT
      text:
        en-GB: "Austrian flour types such as W 480 follow the Austrian Food Codex, not German DIN rules: W means wheat and the number reflects the mineral content."
        de-AT: "Österreichische Mehltypen wie W 480 folgen dem Lebensmittelbuch, nicht der deutschen DIN: W steht für Weizen, die Zahl für den Mineralstoffgehalt."
    - key: flower
      source: en-GB
      text:
        en-GB: "Flour and flower were once the same word, from Old French flour for \"blossom\" or \"the finest part\"; the spellings only split in the early 19th century."
        de-AT: "Im Englischen waren flour (Mehl) und flower (Blüte) einst dasselbe Wort, vom altfranzösischen flour für „Blüte“ oder „das Feinste“; getrennt wurde erst im frühen 19. Jahrhundert."

- ingredient: flour_coarse
  articles:
    en-GB: {title: "Flour", revision: 1386865438}
    de-AT: {title: "Dunst (Mahlprodukt)", revision: 262754200}
  facts:
    - key: griffig-feel
      source: de-AT
      text:
        en-GB: "Austrian \"griffig\" flour is coarser than smooth plain flour; the word means \"grippy\", because you can feel the particles between your fingers."
        de-AT: "Griffiges Mehl ist gröber als glattes; das Wort sagt, dass man die einzelnen Mehlteilchen zwischen den Fingern spürt."
    - key: doppelgriffig
      source: de-AT
      text:
        en-GB: "One step coarser still is doppelgriffig flour, which German millers call Dunst: particles of 150 to 300 micrometres, between flour and semolina."
        de-AT: "Noch gröber ist doppelgriffiges Mehl, in Deutschland Dunst genannt: Teilchen von 150 bis 300 Mikrometern, zwischen Mehl und Grieß."

- ingredient: wholemeal_flour
  articles:
    en-GB: {title: "Wheat flour", revision: 1378092886}
    de-AT: {title: "Vollkorn", revision: 272013779}
  facts:
    - key: reintroduced
      source: en-GB
      text:
        en-GB: "Modern roller mills separate bran and germ from the endosperm, so for wholemeal flour these are ground finely on a separate mill and mixed back in."
        de-AT: "Moderne Walzenmühlen trennen Kleie und Keim vom Mehlkörper; für Vollkornmehl werden sie extra fein gemahlen und wieder zugemischt."
    - key: rancid
      source: en-GB
      text:
        en-GB: "Wheat germ contains fat that can go rancid, which is why Canadian whole wheat flour may have most of the germ removed."
        de-AT: "Der Weizenkeim enthält Fett, das ranzig werden kann; deshalb darf in Kanada aus Vollkornmehl ein Großteil des Keims entfernt werden."

- ingredient: spelt_flour
  articles:
    en-GB: {title: "Spelt", revision: 1387952358}
    de-AT: {title: "Dinkel", revision: 270135124}
  facts:
    - key: gruenkern
      source: en-GB
      text:
        en-GB: "Spelt harvested unripe and then dried is eaten as Grünkern, \"green grain\"."
        de-AT: "Unreif geernteter und getrockneter Dinkel kommt als Grünkern in den Handel."
    - key: husk
      source: en-GB
      text:
        en-GB: "Unlike bread wheat, each spelt grain stays tightly enclosed in its husk after threshing, so it needs an extra dehulling step."
        de-AT: "Anders als bei Weizen bleibt jedes Dinkelkorn nach dem Dreschen fest im Spelz eingeschlossen und muss eigens entspelzt werden."

- ingredient: rye_flour
  articles:
    en-GB: {title: "Rye", revision: 1386824371}
    de-AT: {title: "Roggen", revision: 271927430}
  facts:
    - key: weed-crop
      source: en-GB
      text:
        en-GB: "Rye probably first spread west as a weed hidden among wheat, mimicking it so well that it was harvested along, before being grown in its own right."
        de-AT: "Roggen kam vermutlich als Unkraut im Weizen nach Westen, das dem Weizen so ähnlich sah, dass es mitgeerntet wurde, bevor man ihn eigens anbaute."
    - key: ergot
      source: en-GB
      text:
        en-GB: "Rye is very prone to ergot, a fungus whose toxins caused periodic epidemics of ergotism with hallucinations and convulsions in rye-eating regions."
        de-AT: "Roggen wird leicht vom Mutterkornpilz befallen; dessen Gifte lösten in Roggengegenden immer wieder Epidemien mit Halluzinationen und Krämpfen aus."

- ingredient: cornflour
  articles:
    en-GB: {title: "Corn starch", revision: 1384866620}
    de-AT: {title: "Stärke", revision: 271058690}
  facts:
    - key: oobleck
      source: en-GB
      text:
        en-GB: "Stirred into water, cornflour becomes oobleck, a non-Newtonian fluid; stirred into oil, it becomes an electrorheological fluid that responds to electric fields."
        de-AT: "In Wasser gerührt wird Maisstärke zu einer nicht-newtonschen Flüssigkeit, in Öl gerührt zu einer elektrorheologischen, die auf elektrische Felder reagiert."
    - key: translucent
      source: en-GB
      text:
        en-GB: "Cooks often prefer cornflour to wheat flour for thickening because it gives a clear, translucent sauce rather than a cloudy one."
        de-AT: "Zum Binden nimmt man gern Maisstärke statt Mehl, weil die Sauce damit klar und durchscheinend bleibt statt trüb."
    - key: birds-custard
      source: en-GB
      text:
        en-GB: "Bird's Custard, the British custard powder made from cornflour, was invented in 1837."
        de-AT: "Bird’s Custard, das britische Puddingpulver aus Maisstärke, wurde 1837 erfunden."

- ingredient: potato_starch
  articles:
    en-GB: {title: "Potato starch", revision: 1381083523}
    de-AT: {title: "Kartoffelstärke", revision: 271876764}
  facts:
    - key: big-granules
      source: en-GB
      text:
        en-GB: "Potato starch has unusually large oval granules, from 5 to 100 micrometres across, released by crushing the tubers and letting the starch settle out."
        de-AT: "Kartoffelstärke hat ungewöhnlich große ovale Körner von 5 bis 100 Mikrometern; man gewinnt sie, indem man Erdäpfel zerkleinert und die Stärke absetzen lässt."
    - key: phosphate
      source: en-GB
      text:
        en-GB: "About 800 ppm of phosphate bound to potato starch lets it gelatinise at a low 60 °C and gives it a very high swelling power."
        de-AT: "Rund 800 ppm gebundenes Phosphat lassen Kartoffelstärke schon bei etwa 60 °C verkleistern und besonders stark quellen."

- ingredient: semolina
  articles:
    en-GB: {title: "Semolina", revision: 1379338479}
    de-AT: {title: "Grieß", revision: 250389045}
  facts:
    - key: sieve
      source: en-GB
      text:
        en-GB: "The Codex Alimentarius defines durum semolina by coarseness: no more than 79 per cent may pass through a 315-micron sieve."
        de-AT: "Der Codex Alimentarius legt Hartweizengrieß über die Körnung fest: Höchstens 79 % dürfen durch ein Sieb mit 315 Mikrometern fallen."
    - key: semitic
      source: en-GB
      text:
        en-GB: "Semolina comes from Italian semolino, from Latin simila for fine flour, a word that ultimately has Semitic roots meaning \"to grind into groats\"."
        de-AT: "Das Wort Semolina kommt vom italienischen semolino und dem lateinischen simila für feines Mehl, das letztlich auf eine semitische Wurzel für „zu Grütze mahlen“ zurückgeht."

- ingredient: polenta
  articles:
    en-GB: {title: "Polenta", revision: 1387669239}
    de-AT: {title: "Polenta", revision: 270821252}
  facts:
    - key: pollen
      source: en-GB
      text:
        en-GB: "Polenta comes from Latin pollen, \"fine flour\", which shares a root with pulvis, \"dust\". Originally it meant any hulled and crushed grain, especially barley."
        de-AT: "Polenta kommt vom lateinischen pollen, „feines Mehl“, verwandt mit pulvis, „Staub“. Ursprünglich hieß so jedes geschälte, zerstoßene Getreide, vor allem Gerste."
    - key: before-maize
      source: en-GB
      text:
        en-GB: "Polenta is older than maize in Europe: it was historically made from other grains, and buckwheat versions are still cooked today."
        de-AT: "Polenta ist in Europa älter als der Mais: Früher wurde sie aus anderen Getreiden gekocht, Varianten aus Buchweizen gibt es bis heute."

- ingredient: buckwheat
  articles:
    en-GB: {title: "Buckwheat", revision: 1384222416}
    de-AT: {title: "Echter Buchweizen", revision: 266226728}
  facts:
    - key: not-wheat
      source: en-GB
      text:
        en-GB: "Despite its name, buckwheat is not a grass or a cereal at all; it belongs to the knotweed family and is related to sorrel and rhubarb."
        de-AT: "Trotz des Namens ist Buchweizen gar kein Getreide, sondern ein Knöterichgewächs und mit Sauerampfer und Rhabarber verwandt."
    - key: beech
      source: en-GB
      text:
        en-GB: "The name comes from its three-sided seeds, which look like tiny beechnuts, probably via Middle Dutch boecweite, \"beech wheat\"."
        de-AT: "Der Name kommt von den dreikantigen Samen, die an winzige Bucheckern erinnern, wohl über mittelniederländisch boecweite, „Buchenweizen“."
    - key: yunnan
      source: en-GB
      text:
        en-GB: "Buckwheat was first cultivated around the 6th millennium BC in what is now Yunnan province in south-western China."
        de-AT: "Buchweizen wurde erstmals um das 6. Jahrtausend v. Chr. im heutigen Yunnan im Südwesten Chinas angebaut."

- ingredient: millet
  articles:
    en-GB: {title: "Proso millet", revision: 1368849885}
    de-AT: {title: "Rispenhirse", revision: 260693543}
  facts:
    - key: 60-days
      source: en-GB
      text:
        en-GB: "Proso millet has one of the shortest life cycles of any grain crop: some varieties yield grain only 60 days after sowing."
        de-AT: "Rispenhirse hat einen der kürzesten Lebenszyklen aller Getreide: Manche Sorten liefern schon 60 Tage nach der Aussaat Körner."
    - key: china
      source: en-GB
      text:
        en-GB: "Archaeobotanical finds suggest proso millet was first domesticated in northern China about 10,000 years ago."
        de-AT: "Archäobotanische Funde deuten darauf hin, dass Rispenhirse vor etwa 10.000 Jahren im Norden Chinas domestiziert wurde."

- ingredient: quinoa
  articles:
    en-GB: {title: "Quinoa", revision: 1384413071}
    de-AT: {title: "Quinoa", revision: 272209415}
  facts:
    - key: saponins
      source: en-GB
      text:
        en-GB: "Raw quinoa seeds carry a bitter coating of saponins that keeps birds away in the field; most quinoa sold has had it removed."
        de-AT: "Rohe Quinoasamen tragen eine bittere Schicht aus Saponinen, die Vögel auf dem Feld fernhält; im Handel ist sie meist schon entfernt."
    - key: spinach
      source: en-GB
      text:
        en-GB: "Quinoa is not a grass but a pseudocereal in the amaranth family, botanically related to spinach; its name comes from Quechua kinwa."
        de-AT: "Quinoa ist kein Gras, sondern ein Pseudogetreide aus der Familie der Fuchsschwanzgewächse und mit Spinat verwandt; der Name kommt aus dem Quechua kinwa."
    - key: price-boom
      source: en-GB
      text:
        en-GB: "Rising demand in North America, Europe and Australasia tripled quinoa prices between 2006 and 2014, before they crashed from early 2015."
        de-AT: "Die wachsende Nachfrage in Nordamerika, Europa und Ozeanien verdreifachte die Quinoapreise zwischen 2006 und 2014, ab Anfang 2015 brachen sie ein."

- ingredient: couscous
  articles:
    en-GB: {title: "Couscous", revision: 1381586698}
    de-AT: {title: "Couscous", revision: 271738380}
  facts:
    - key: unesco
      source: en-GB
      text:
        en-GB: "In 2020 couscous was added to UNESCO's list of Intangible Cultural Heritage."
        de-AT: "Seit 2020 steht Couscous auf der UNESCO-Liste des immateriellen Kulturerbes."
    - key: pound
      source: en-GB
      text:
        en-GB: "The word reached French in the early 17th century from Arabic kuskus, from kaskasa \"to pound\", and is probably of Berber origin."
        de-AT: "Das Wort kam im frühen 17. Jahrhundert ins Französische, vom arabischen kuskus zu kaskasa „zerstoßen“, und stammt wohl aus dem Berberischen."

- ingredient: bulgur
  articles:
    en-GB: {title: "Bulgur", revision: 1383035909}
    de-AT: {title: "Bulgur", revision: 267248702}
  facts:
    - key: parboiled
      source: en-GB
      text:
        en-GB: "Bulgur is not simply cracked wheat: the grain is parboiled first, then dehulled, dried and cracked, which is why it cooks so quickly."
        de-AT: "Bulgur ist nicht bloß geschroteter Weizen: Das Korn wird vorgegart, dann entspelzt, getrocknet und gebrochen, deshalb ist es so schnell fertig."
    - key: 4000-bc
      source: en-GB
      text:
        en-GB: "Food historian Gil Marks dated bulgur to around 4000 BC in the ancient Middle East, making it one of the first processed foods."
        de-AT: "Der Food-Historiker Gil Marks datiert Bulgur auf etwa 4000 v. Chr. im alten Nahen Osten, damit zählt es zu den ersten verarbeiteten Lebensmitteln."

- ingredient: oats
  articles:
    en-GB: {title: "Rolled oats", revision: 1379170305}
    de-AT: {title: "Haferflocken", revision: 266235547}
  facts:
    - key: steam-toast
      source: en-GB
      text:
        en-GB: "Rolled oats are dehusked groats that are steamed, pressed flat under heavy rollers and then lightly toasted to keep them stable."
        de-AT: "Haferflocken sind entspelzte Haferkörner, die gedämpft, zwischen schweren Walzen flach gepresst und dann leicht geröstet werden, damit sie haltbar bleiben."
    - key: quick-oats
      source: en-GB
      text:
        en-GB: "Quick or instant oats are simply rolled thinner and steamed longer in the factory, so they break up but soak up water faster."
        de-AT: "Schmelzflocken werden einfach dünner gewalzt und länger gedämpft; sie zerfallen leichter, nehmen aber schneller Wasser auf."

- ingredient: muesli
  articles:
    en-GB: {title: "Muesli", revision: 1385241565}
    de-AT: {title: "Müsli", revision: 268499110}
  facts:
    - key: bircher
      source: en-GB
      text:
        en-GB: "Muesli was developed around 1900 by the Swiss physician Maximilian Bircher-Benner for patients at his hospital."
        de-AT: "Das Müsli entwickelte um 1900 der Schweizer Arzt Maximilian Bircher-Benner für die Patienten seiner Klinik."
    - key: overnight
      source: en-GB
      text:
        en-GB: "The original recipe soaked oats in water overnight and served them with fresh apple, nuts, lemon juice and sweetened condensed milk."
        de-AT: "Im Originalrezept wurden Haferflocken über Nacht in Wasser eingeweicht und mit frischem Apfel, Nüssen, Zitronensaft und gezuckerter Kondensmilch gegessen."

- ingredient: pearl_barley
  articles:
    en-GB: {title: "Pearl barley", revision: 1282249390}
    de-AT: {title: "Graupen", revision: 261999103}
  facts:
    - key: polished
      source: en-GB
      text:
        en-GB: "Pearl barley has its tough outer hull removed and is then polished to take off some or all of the bran, which makes it cook faster and less chewy."
        de-AT: "Für Rollgerste wird die harte Spelze entfernt und das Korn poliert, bis die Kleie ganz oder teilweise weg ist; so wird es schneller weich."
    - key: cholent
      source: en-GB
      text:
        en-GB: "Pearl barley is the base of the Italian orzotto and a main ingredient of the Jewish stew cholent and the Polish soup krupnik."
        de-AT: "Rollgerste ist die Basis des italienischen Orzotto und eine Hauptzutat des jüdischen Eintopfs Tscholent und der polnischen Suppe Krupnik."

- ingredient: rice
  articles:
    en-GB: {title: "Rice", revision: 1387512126}
    de-AT: {title: "Reis", revision: 271471394}
  facts:
    - key: two-domestications
      source: en-GB
      text:
        en-GB: "Rice was domesticated twice: Asian rice in what is now China roughly 13,500 to 8,200 years ago, and African rice independently in West Africa about 3,000 years ago."
        de-AT: "Reis wurde zweimal domestiziert: Asiatischer Reis vor etwa 13.500 bis 8.200 Jahren im heutigen China, Afrikanischer Reis unabhängig davon vor rund 3.000 Jahren in Westafrika."
    - key: 8-percent
      source: en-GB
      text:
        en-GB: "Although rice feeds over half the world, only about 8 per cent of the harvest is traded internationally; most is eaten where it is grown."
        de-AT: "Reis ernährt mehr als die Hälfte der Menschheit, doch nur rund 8 % der Ernte werden international gehandelt; der Großteil bleibt im Anbauland."
    - key: long-grain
      source: en-GB
      text:
        en-GB: "Long-grain rice stays separate and fluffy because of its starch mix: the balance of amylose and amylopectin decides whether grains stay dry or turn sticky."
        de-AT: "Langkornreis bleibt locker und körnig wegen seiner Stärke: Das Verhältnis von Amylose zu Amylopektin entscheidet, ob Reis trocken bleibt oder klebt."

- ingredient: basmati
  articles:
    en-GB: {title: "Basmati", revision: 1387138866}
    de-AT: {title: "Reis", revision: 271471394}
  facts:
    - key: fragrance
      source: en-GB
      text:
        en-GB: "The name basmati comes from Sanskrit roots meaning \"fragrance\" and \"ingrained\", so it is roughly \"the fragrant one\"."
        de-AT: "Der Name Basmati geht auf Sanskrit-Wurzeln für „Duft“ und „innewohnend“ zurück, bedeutet also etwa „der Duftende“."
    - key: 6-61-mm
      source: en-GB
      text:
        en-GB: "Under Indian export rules a rice may only be called basmati if its milled grains average at least 6.61 mm long and no more than 2 mm wide, among other criteria."
        de-AT: "Nach indischen Exportregeln darf Reis nur Basmati heißen, wenn die geschliffenen Körner im Schnitt mindestens 6,61 mm lang und höchstens 2 mm breit sind."

- ingredient: risotto_rice
  articles:
    en-GB: {title: "Arborio rice", revision: 1277743784}
    de-AT: {title: "Arborio (Reis)", revision: 272136150}
  facts:
    - key: arborio-town
      source: en-GB
      text:
        en-GB: "Arborio rice is named after the small municipality of Arborio in the Po Valley in Piedmont."
        de-AT: "Arborio-Reis ist nach der kleinen Gemeinde Arborio in der Poebene im Piemont benannt."
    - key: amylopectin
      source: en-GB
      text:
        en-GB: "Risotto rice turns creamy yet stays firm because its rounded grains are high in amylopectin, the branched form of starch."
        de-AT: "Risottoreis wird cremig und bleibt trotzdem bissfest, weil seine runden Körner viel Amylopektin enthalten, die verzweigte Form der Stärke."

- ingredient: brown_rice
  articles:
    en-GB: {title: "Brown rice", revision: 1386424260}
    de-AT: {title: "Reis", revision: 271471394}
  facts:
    - key: only-hull
      source: en-GB
      text:
        en-GB: "Brown rice is the same grain as white rice with only the inedible hull removed; the bran and germ left on give it its colour."
        de-AT: "Naturreis ist dasselbe Korn wie weißer Reis, nur ohne die ungenießbare Spelze; Kleie und Keim bleiben dran und geben ihm die Farbe."
    - key: six-months
      source: en-GB
      text:
        en-GB: "Because the bran is left on, brown rice keeps for only about six months, though airtight storage, chilling or freezing extend that considerably."
        de-AT: "Weil die Kleie erhalten bleibt, hält Naturreis nur etwa sechs Monate; luftdicht, gekühlt oder eingefroren deutlich länger."

- ingredient: sushi_rice
  articles:
    en-GB: {title: "Japanese rice", revision: 1313432782}
    de-AT: {title: "Sushi", revision: 269939990}
  facts:
    - key: uruchimai
      source: en-GB
      text:
        en-GB: "What is sold abroad as sushi rice is ordinary Japanese uruchimai, a short-grain japonica rice sticky enough to pick up with chopsticks."
        de-AT: "Was bei uns als Sushireis verkauft wird, ist gewöhnlicher japanischer Uruchimai, ein Rundkornreis, der so klebt, dass man ihn mit Stäbchen essen kann."
    - key: koshihikari
      source: en-GB
      text:
        en-GB: "Koshihikari is one of the most esteemed and widely grown rice cultivars in Japan, while Yamada Nishiki is the most famous rice grown for sake."
        de-AT: "Koshihikari gehört zu den geschätztesten und verbreitetsten Reissorten Japans; Yamada Nishiki ist die bekannteste Sorte für Sake."

- ingredient: pasta
  articles:
    en-GB: {title: "Pasta", revision: 1387135351}
    de-AT: {title: "Pasta", revision: 271394839}
  facts:
    - key: sicily-1154
      source: en-GB
      text:
        en-GB: "In 1154 the geographer al-Idrisi, writing for King Roger II of Sicily, described mills near Palermo producing itriyya, a string pasta, for export."
        de-AT: "1154 beschrieb der Geograf al-Idrisi für König Roger II. von Sizilien Mühlen bei Palermo, die Itriyya, eine Fadennudel, für den Export herstellten."
    - key: horace-lagana
      source: en-GB
      text:
        en-GB: "Already in the 1st century the Roman poet Horace mentions lagana, fine sheets of fried dough eaten every day."
        de-AT: "Schon im 1. Jahrhundert erwähnt der römische Dichter Horaz Lagana, dünne Blätter aus frittiertem Teig, die man alltäglich aß."
    - key: itrium
      source: en-GB
      text:
        en-GB: "The Jerusalem Talmud records that itrium, a kind of boiled dough, was common in Palestine from the 3rd to the 5th century."
        de-AT: "Laut Jerusalemer Talmud war Itrium, eine Art gekochter Teig, vom 3. bis 5. Jahrhundert in Palästina verbreitet."

- ingredient: spaghetti
  articles:
    en-GB: {title: "Spaghetti", revision: 1386269527}
    de-AT: {title: "Spaghetti", revision: 272327824}
  facts:
    - key: little-strings
      source: en-GB
      text:
        en-GB: "Spaghetti means \"little strings\", a diminutive plural of Italian spago, \"string\"; a single strand is a spaghetto."
        de-AT: "Spaghetti heißt „Schnürchen“, eine Verkleinerung des italienischen spago, „Schnur“; ein einzelner Faden ist ein Spaghetto."
    - key: bbc-hoax
      source: en-GB
      text:
        en-GB: "On April Fools' Day 1957 the BBC programme Panorama aired a hoax report about a spaghetti harvest in Switzerland."
        de-AT: "Am 1. April 1957 zeigte die BBC-Sendung Panorama einen Scherzbericht über die Spaghetti-Ernte in der Schweiz."

- ingredient: egg_noodles
  articles:
    en-GB: {title: "Noodles", revision: 1381390731}
    de-AT: {title: "Nudel (Lebensmittel)", revision: 265519281}
  facts:
    - key: nudel
      source: en-GB
      text:
        en-GB: "English borrowed the word noodle from German Nudel in the 18th century; the German word probably comes from Knödel and once meant any wheat dumpling."
        de-AT: "Das englische noodle wurde im 18. Jahrhundert aus dem deutschen Nudel entlehnt, das wohl auf Knödel zurückgeht und einst jeden Teigkloß meinte."
    - key: lajia
      source: en-GB
      text:
        en-GB: "The oldest known noodles, about 4,000 years old, were found in 2005 in an earthenware bowl at the Lajia site in China."
        de-AT: "Die ältesten bekannten Nudeln, rund 4.000 Jahre alt, fanden Archäologen 2005 in einer Tonschüssel an der Fundstätte Lajia in China."

- ingredient: wholewheat_pasta
  articles:
    en-GB: {title: "Pasta", revision: 1387135351}
    de-AT: {title: "Teigwaren", revision: 267860128}
  facts:
    - key: italian-law
      source: en-GB
      text:
        en-GB: "Italian law recognises durum wholemeal pasta as its own category of dried pasta, made only from durum wholemeal semolina and water."
        de-AT: "Das italienische Recht kennt Vollkornpasta als eigene Kategorie, die nur aus Hartweizen-Vollkorngrieß und Wasser bestehen darf."
    - key: soft-wheat
      source: en-GB
      text:
        en-GB: "Even Italian dried pasta labelled as pure durum may contain up to 3 per cent soft wheat flour."
        de-AT: "Selbst italienische Trockenpasta aus Hartweizen darf bis zu 3 % Weichweizenmehl enthalten."

- ingredient: lasagne_sheets
  articles:
    en-GB: {title: "Lasagna", revision: 1384659530}
    de-AT: {title: "Lasagne", revision: 264439234}
  facts:
    - key: laganon
      source: en-GB
      text:
        en-GB: "One theory traces lasagne to Greek laganon, a flat sheet of dough cut into strips; Greeks still bake a flatbread called lagana for Clean Monday."
        de-AT: "Eine Theorie führt Lasagne auf das griechische laganon zurück, ein flaches Teigblatt; in Griechenland bäckt man bis heute ein Fladenbrot namens Lagana zum „Reinen Montag“."
    - key: lasanum-pot
      source: en-GB
      text:
        en-GB: "The Roman cookbook of Apicius describes a layered dish called lasana or lasanum, Latin for \"container\" or \"pot\"."
        de-AT: "Im römischen Kochbuch des Apicius findet sich ein Schichtgericht namens lasana oder lasanum, lateinisch für „Behälter“ oder „Topf“."

- ingredient: rice_noodles
  articles:
    en-GB: {title: "Rice noodles", revision: 1379234753}
    de-AT: {title: "Reisnudeln", revision: 271388586}
  facts:
    - key: qin
      source: en-GB
      text:
        en-GB: "Rice noodles are said to date back to the Qin dynasty, when northern Chinese settlers in the rice-growing south tried to make their familiar wheat noodles from rice."
        de-AT: "Reisnudeln sollen auf die Qin-Dynastie zurückgehen, als Siedler aus Nordchina im Reisland des Südens ihre gewohnten Weizennudeln aus Reis nachmachten."
    - key: tapioca
      source: en-GB
      text:
        en-GB: "Tapioca or cornflour is sometimes added to rice noodles to make them more transparent or more chewy and gelatinous."
        de-AT: "Manchmal kommt Tapioka- oder Maisstärke in Reisnudeln, damit sie durchscheinender oder zäher und glasiger werden."

- ingredient: glass_noodles
  articles:
    en-GB: {title: "Glass noodles", revision: 1385085031}
    de-AT: {title: "Glasnudeln", revision: 248638327}
  facts:
    - key: starch
      source: en-GB
      text:
        en-GB: "Glass noodles contain no flour at all: they are made from starch, such as mung bean, potato or sweet potato starch, and water."
        de-AT: "Glasnudeln enthalten gar kein Mehl, sondern bestehen aus Stärke, etwa aus Mungbohnen, Erdäpfeln oder Süßkartoffeln, und Wasser."
    - key: fensi
      source: en-GB
      text:
        en-GB: "In Chinese they are called fensi, \"flour thread\", and they turn glass-clear when cooked, unlike rice vermicelli, which stays white."
        de-AT: "Auf Chinesisch heißen sie Fensi, „Mehlfaden“; gekocht werden sie glasklar, während Reisvermicelli weiß bleiben."

- ingredient: gnocchi
  articles:
    en-GB: {title: "Gnocchi", revision: 1381905128}
    de-AT: {title: "Nocken (Gericht)", revision: 263762367}
  facts:
    - key: knot
      source: en-GB
      text:
        en-GB: "The word gnocchi may come from Italian nocchio, \"a knot in wood\", or nocca, \"knuckle\"."
        de-AT: "Das Wort Gnocchi kommt vielleicht vom italienischen nocchio, „Astknoten“, oder nocca, „Fingerknöchel“."
    - key: roman
      source: en-GB
      text:
        en-GB: "Gnocchi have been made since Roman times; one ancient Roman version was a semolina porridge dough mixed with eggs, the ancestor of gnocchi alla romana."
        de-AT: "Gnocchi gibt es schon seit der Römerzeit; eine altrömische Variante war ein Grießbrei-Teig mit Eiern, Vorläufer der Gnocchi alla romana."

- ingredient: tortellini
  articles:
    en-GB: {title: "Tortellini", revision: 1387772821}
    de-AT: {title: "Tortellini", revision: 257878675}
  facts:
    - key: venus-navel
      source: en-GB
      text:
        en-GB: "A 19th-century legend from Castelfranco Emilia says an innkeeper glimpsed Venus's navel through a keyhole and shaped the pasta after it."
        de-AT: "Eine Legende aus dem 19. Jahrhundert erzählt, ein Wirt in Castelfranco Emilia habe durchs Schlüsselloch den Nabel der Venus gesehen und die Nudel danach geformt."
    - key: capon-broth
      source: en-GB
      text:
        en-GB: "Traditional tortellini from Bologna and Modena are filled with pork loin, prosciutto, mortadella, Parmesan, egg and nutmeg and served in capon broth."
        de-AT: "Klassische Tortellini aus Bologna und Modena sind mit Schweinskarree, Prosciutto, Mortadella, Parmesan, Ei und Muskat gefüllt und schwimmen in Kapaunbrühe."

- ingredient: penne
  articles:
    en-GB: {title: "Penne", revision: 1386425765}
    de-AT: {title: "Penne (Teigware)", revision: 267976555}
  facts:
    - key: patent-1865
      source: en-GB
      text:
        en-GB: "Penne have an exact birthday: in 1865 the Genoese pasta maker Giovanni Battista Capurro patented a machine that cut pasta diagonally without crushing it."
        de-AT: "Penne haben ein genaues Geburtsjahr: 1865 ließ der Genueser Nudelmacher Giovanni Battista Capurro eine Maschine patentieren, die Teig schräg schneidet, ohne ihn zu quetschen."
    - key: quill
      source: en-GB
      text:
        en-GB: "Penne is the plural of Italian penna, \"feather\" or \"pen\", after the slanted ends that resemble the nib of a quill."
        de-AT: "Penne ist die Mehrzahl von penna, italienisch für „Feder“; die schrägen Enden erinnern an eine Schreibfeder."

- ingredient: tagliatelle
  articles:
    en-GB: {title: "Tagliatelle", revision: 1385800996}
    de-AT: {title: "Tagliatelle", revision: 265794759}
  facts:
    - key: gold-replica
      source: en-GB
      text:
        en-GB: "The Bologna chamber of commerce keeps a solid gold tagliatella in a glass case, showing the correct cooked width of 8 mm."
        de-AT: "In der Handelskammer von Bologna liegt in einer Vitrine eine Tagliatella aus massivem Gold; sie zeigt die korrekte Breite von 8 mm im gekochten Zustand."
    - key: one-egg
      source: en-GB
      text:
        en-GB: "Tagliatelle are an egg pasta, and the traditional ratio is one egg to every 100 grams of flour."
        de-AT: "Tagliatelle sind Eiernudeln; traditionell kommt auf 100 Gramm Mehl ein Ei."

- ingredient: orzo
  articles:
    en-GB: {title: "Orzo", revision: 1380652761}
    de-AT: {title: "Kritharaki", revision: 253994263}
  facts:
    - key: barley
      source: en-GB
      text:
        en-GB: "Orzo is Italian for \"barley\", from Latin hordeum; in Italy the rice-shaped pasta is more often called risoni, \"big rice\"."
        de-AT: "Orzo heißt auf Italienisch „Gerste“, vom lateinischen hordeum; in Italien nennt man die reisförmige Pasta eher Risoni, „großer Reis“."
    - key: bird-tongue
      source: en-GB
      text:
        en-GB: "The same pasta is kritharaki, \"little barley\", in Greece, arpa şehriye, \"barley noodle\", in Turkey and lisan al-asfour, \"bird tongue\", in Egypt."
        de-AT: "Dieselbe Pasta heißt in Griechenland Kritharaki, „kleine Gerste“, in der Türkei Arpa şehriye, „Gerstennudel“, und in Ägypten Lisan al-asfour, „Vogelzunge“."

- ingredient: ravioli
  articles:
    en-GB: {title: "Ravioli", revision: 1381637341}
    de-AT: {title: "Ravioli", revision: 271851574}
  facts:
    - key: forme-of-cury
      source: en-GB
      text:
        en-GB: "Ravioli already appear as \"rauioles\" in The Forme of Cury, a 14th-century English cookbook."
        de-AT: "Ravioli tauchen schon als „rauioles“ in The Forme of Cury auf, einem englischen Kochbuch aus dem 14. Jahrhundert."
    - key: turnip
      source: en-GB
      text:
        en-GB: "The name is sometimes linked to northern Italian rava, \"turnip\", but the earliest recipes contain no turnips, so its origin remains uncertain."
        de-AT: "Der Name wird manchmal mit norditalienisch rava, „Rübe“, verbunden, doch die ältesten Rezepte enthalten keine Rüben; die Herkunft bleibt unklar."

- ingredient: udon
  articles:
    en-GB: {title: "Udon", revision: 1387229064}
    de-AT: {title: "Udon", revision: 270256529}
  facts:
    - key: soy-divide
      source: en-GB
      text:
        en-GB: "Udon broth splits Japan: the north uses dark koikuchi soy sauce, the south light usukuchi, and instant udon is often sold in both versions."
        de-AT: "Die Udon-Brühe teilt Japan: Im Norden nimmt man dunkle Koikuchi-Sojasauce, im Süden helle Usukuchi; Instant-Udon gibt es oft in beiden Varianten."
    - key: kawahaba
      source: en-GB
      text:
        en-GB: "Kōnosu kawahaba udon from Saitama are flat noodles as wide as eight centimetres."
        de-AT: "Kōnosu kawahaba udon aus Saitama sind flache Nudeln, die bis zu acht Zentimeter breit sind."

- ingredient: soba
  articles:
    en-GB: {title: "Soba", revision: 1387243074}
    de-AT: {title: "Soba (Teigware)", revision: 271887240}
  facts:
    - key: toshikoshi
      source: en-GB
      text:
        en-GB: "In most of Japan soba is eaten on New Year's Eve as toshikoshi soba, \"year-crossing soba\"."
        de-AT: "In weiten Teilen Japans isst man zu Silvester Toshikoshi-Soba, „Jahresübergangs-Soba“."
    - key: first-record-1574
      source: en-GB
      text:
        en-GB: "The first specific record of buckwheat noodles, called soba-kiri, dates from 1574 and is kept at the Jōshō-ji temple."
        de-AT: "Die erste konkrete Erwähnung von Buchweizennudeln, soba-kiri genannt, stammt aus dem Jahr 1574 und liegt im Tempel Jōshō-ji."

- ingredient: jasmine_rice
  articles:
    en-GB: {title: "Jasmine rice", revision: 1373673958}
    de-AT: {title: "Reis", revision: 271471394}
  facts:
    - key: popcorn-aroma
      source: en-GB
      text:
        en-GB: "The pandan and popcorn scent of jasmine rice comes mainly from 2-acetyl-1-pyrroline, an aroma compound the plant makes itself."
        de-AT: "Der Duft von Jasminreis nach Pandan und Popcorn stammt vor allem von 2-Acetyl-1-pyrrolin, einem Aromastoff, den die Pflanze selbst bildet."
    - key: new-rice
      source: en-GB
      text:
        en-GB: "Because its aroma fades quickly, many Southeast Asian connoisseurs prefer each year's freshly harvested \"new rice\"."
        de-AT: "Weil das Aroma rasch verfliegt, bevorzugen viele Kenner in Südostasien den frisch geernteten „neuen Reis“ des Jahres."

- ingredient: wild_rice
  articles:
    en-GB: {title: "Wild rice", revision: 1383397919}
    de-AT: {title: "Wasserreis", revision: 261478523}
  facts:
    - key: not-rice
      source: en-GB
      text:
        en-GB: "Wild rice is not rice: it is the grain of four species of Zizania, a grass genus in the same tribe as rice."
        de-AT: "Wildreis ist kein Reis, sondern das Korn von vier Arten der Gattung Zizania, Gräsern aus derselben Tribus wie Reis."
    - key: manoomin
      source: en-GB
      text:
        en-GB: "Its Ojibwe name manoomin means \"harvesting grain\", often translated as \"good grain\"."
        de-AT: "Sein Name in der Sprache der Ojibwe, manoomin, bedeutet „Erntekorn“, oft übersetzt als „gutes Korn“."

- ingredient: rice_flour
  articles:
    en-GB: {title: "Rice flour", revision: 1383578771}
    de-AT: {title: "Reismehl", revision: 246197165}
  facts:
    - key: frozen-sauces
      source: en-GB
      text:
        en-GB: "Rice flour is used to thicken sauces that will be chilled or frozen, because it stops liquid separating out."
        de-AT: "Reismehl bindet Saucen, die gekühlt oder eingefroren werden, weil es verhindert, dass sich Flüssigkeit absetzt."
    - key: not-starch
      source: en-GB
      text:
        en-GB: "Rice flour is simply milled rice and differs from rice starch, which is usually made by steeping rice in lye."
        de-AT: "Reismehl ist einfach gemahlener Reis; Reisstärke dagegen wird meist gewonnen, indem man Reis in Lauge einweicht."

- ingredient: chickpea_flour
  articles:
    en-GB: {title: "Gram flour", revision: 1372805838}
  facts:
    - key: farinata
      source: en-GB
      text:
        en-GB: "Baked as a thin pancake, chickpea flour becomes a street food called farinata in Italy, fainâ in Genoa and socca in France."
        de-AT: "Als dünner Fladen gebacken wird Kichererbsenmehl zum Streetfood: Farinata in Italien, Fainâ in Genua und Socca in Frankreich."
    - key: chana-dal
      source: en-GB
      text:
        en-GB: "Besan, or gram flour, is made from chana dal, split Bengal gram, and is a staple across the Indian subcontinent."
        de-AT: "Besan wird aus Chana Dal gemahlen, halbierten Kichererbsen der Sorte Bengal Gram, und ist auf dem ganzen indischen Subkontinent eine Grundzutat."

- ingredient: amaranth
  articles:
    en-GB: {title: "Grain amaranths", revision: 1386005308}
    de-AT: {title: "Amarant", revision: 266207955}
  facts:
    - key: 8000-years
      source: en-GB
      text:
        en-GB: "Amaranth has been grown for its grain for about 8,000 years, and its yields are comparable to those of rice or maize."
        de-AT: "Amaranth wird seit rund 8.000 Jahren als Körnerfrucht angebaut, und sein Ertrag kann mit Reis oder Mais mithalten."
    - key: aztec-ban
      source: en-GB
      text:
        en-GB: "Amaranth was a staple of the Aztecs and part of their religious ceremonies; the conquistadors banned its cultivation, but it survived as a weed."
        de-AT: "Amaranth war Grundnahrungsmittel der Azteken und Teil ihrer Rituale; die Konquistadoren verboten den Anbau, doch er überlebte als Unkraut."

- ingredient: rice_paper
  articles:
    en-GB: {title: "Bánh tráng", revision: 1384457005}
  facts:
    - key: sun-dried
      source: en-GB
      text:
        en-GB: "Vietnamese rice paper, bánh tráng, is made from a steamed rice batter that is traditionally dried in the sun; machines now make thinner sheets for export."
        de-AT: "Vietnamesisches Reispapier, Bánh tráng, entsteht aus gedämpftem Reisteig, der traditionell in der Sonne trocknet; Maschinen machen heute dünnere Blätter für den Export."
    - key: tapioca
      source: en-GB
      text:
        en-GB: "Rice paper is often a misnomer: many wrappers mix tapioca into the rice flour, and some thin sheets are pure tapioca starch."
        de-AT: "Reispapier ist oft gar nicht nur aus Reis: Viele Blätter enthalten Tapiokamehl, manche dünnen bestehen ganz aus Tapiokastärke."

- ingredient: pork_knuckle
  articles:
    en-GB: {title: "Ham hock", revision: 1377098129}
    de-AT: {title: "Hachse", revision: 231553257}
  facts:
    - key: names
      source: en-GB
      text:
        en-GB: "The roasted pork knuckle is called Eisbein in northern Germany, Schweinshaxe in Bavaria, Stelze in Austria and Wädli in Switzerland."
        de-AT: "Die gebratene Schweinshaxe heißt in Norddeutschland Eisbein, in Bayern Schweinshaxe, in der Schweiz Wädli und bei uns in Österreich Stelze."
    - key: anatomy
      source: en-GB
      text:
        en-GB: "The knuckle or hock is the joint between the shin bones and the foot, the far end of the leg that is neither ham nor trotter."
        de-AT: "Die Stelze sitzt zwischen Unterschenkel und Fuß, am äußersten Ende des Beins, das weder zum Schinken noch zum Fuß gehört."

- ingredient: pork_ribs
  articles:
    en-GB: {title: "Pork ribs", revision: 1378676391}
  facts:
    - key: rippspeer
      source: en-GB
      text:
        en-GB: "Spare ribs have nothing to do with spare: the term is an Early Modern English corruption of Low German rippspeer, racks of ribs roasted on a turning spit."
        de-AT: "Die englischen spare ribs sind nicht „übrig“: Der Name ist eine Verballhornung des niederdeutschen Rippspeer, Rippen, die am Drehspieß gebraten wurden."
    - key: back-ribs
      source: en-GB
      text:
        en-GB: "Baby back ribs come from the top of the rib cage below the loin; the rack is shorter at one end because a pig's rib cage tapers."
        de-AT: "Baby Back Ribs stammen vom oberen Teil des Brustkorbs unter dem Karree; ein Ende ist kürzer, weil sich der Brustkorb des Schweins verjüngt."

- ingredient: pork_loin
  articles:
    en-GB: {title: "Pork loin", revision: 1346004652}
    de-AT: {title: "Kotelett", revision: 266477855}
  facts:
    - key: back-bacon
      source: en-GB
      text:
        en-GB: "Cut together with the belly and cured, pork loin becomes back bacon, the usual bacon in the United Kingdom and popular in Canada."
        de-AT: "Mit dem Bauch zusammen geschnitten und gepökelt wird Schweinskarree zu Back Bacon, dem üblichen Frühstücksspeck in Großbritannien und Kanada."
    - key: lonzino
      source: en-GB
      text:
        en-GB: "In Italy the cured loin is made into lonzino, a type of salume."
        de-AT: "In Italien wird das gepökelte Karree zu Lonzino verarbeitet, einer Art Salume."

- ingredient: pork_neck
  articles:
    en-GB: {title: "Boston butt", revision: 1382706060}
    de-AT: {title: "Schweinekamm", revision: 235536586}
  facts:
    - key: butt-barrels
      source: en-GB
      text:
        en-GB: "The American name for this shoulder and neck cut, Boston butt, comes from the barrels called butts that colonial New England butchers packed pork in."
        de-AT: "Der amerikanische Name für dieses Stück aus Schulter und Nacken, Boston butt, kommt von den Fässern („butts“), in die Fleischer im kolonialen Neuengland Schweinefleisch packten."
    - key: surschopf
      source: de-AT
      text:
        en-GB: "Pork neck is marbled with about 10 to 15 per cent fat, which keeps it juicy. Cured it becomes Surschopf in Austria, and smoked as well, Selchschopf."
        de-AT: "Der Schweinsschopf ist mit etwa 10 bis 15 % Fett durchwachsen und bleibt daher saftig. Gepökelt wird er bei uns zum Surschopf, zusätzlich geräuchert zum Selchschopf."

- ingredient: beef_tongue
  articles:
    en-GB: {title: "Beef tongue", revision: 1378023087}
    de-AT: {title: "Zunge (Lebensmittel)", revision: 271411311}
  facts:
    - key: sauces
      source: en-GB
      text:
        en-GB: "Beef tongue is served with Madeira sauce in France, with chrain in Ashkenazi cooking, and in German-speaking kitchens with a sour caper sauce or horseradish cream."
        de-AT: "Rindszunge kommt in Frankreich mit Madeirasauce, in der aschkenasischen Küche mit Chrain und im deutschsprachigen Raum mit saurer Kapernsauce oder Krensauce auf den Tisch."
    - key: alberta
      source: en-GB
      text:
        en-GB: "Canada, and the province of Alberta in particular, exports large quantities of beef tongue."
        de-AT: "Kanada, allen voran die Provinz Alberta, exportiert große Mengen Rindszunge."

- ingredient: beef_cheek
  articles:
    en-GB: {title: "Beef cheek", revision: 1378020701}
  facts:
    - key: masseter
      source: en-GB
      text:
        en-GB: "Beef cheek is the masseter, the chewing muscle; the Italian word for cheek, guancia, also gave guanciale, cured pork jowl, its name."
        de-AT: "Rindsbackerl ist der Kaumuskel; vom italienischen Wort für Backe, guancia, hat auch der Guanciale, die gepökelte Schweinsbacke, seinen Namen."
    - key: fall-apart
      source: en-GB
      text:
        en-GB: "Beef cheeks need slow braising and tend to fall apart when done, which makes them hard for chefs to plate neatly."
        de-AT: "Rindsbackerl brauchen langes Schmoren und zerfallen dann gern, was das schöne Anrichten schwierig macht."

- ingredient: oxtail
  articles:
    en-GB: {title: "Oxtail", revision: 1383018074}
    de-AT: {title: "Ochsenschwanz", revision: 239589888}
  facts:
    - key: 3-5-kg
      source: en-GB
      text:
        en-GB: "A whole oxtail typically weighs around 3.5 kilograms and is skinned and cut into short pieces for sale."
        de-AT: "Ein ganzer Ochsenschwanz wiegt meist rund 3,5 Kilogramm und wird für den Verkauf gehäutet und in kurze Stücke geschnitten."
    - key: coda-vaccinara
      source: en-GB
      text:
        en-GB: "Oxtail is the star of coda alla vaccinara, a classic of Roman cuisine, and a favourite flavour for instant and tinned soups in Britain and Ireland."
        de-AT: "Ochsenschwanz ist die Hauptzutat der Coda alla vaccinara, eines römischen Klassikers, und in Großbritannien und Irland eine beliebte Sorte für Instant- und Dosensuppen."

- ingredient: chicken_liver
  articles:
    en-GB: {title: "Liver as food", revision: 1378021587}
    de-AT: {title: "Leber (Lebensmittel)", revision: 253870175}
  facts:
    - key: ficatum
      source: en-GB
      text:
        en-GB: "French foie and Italian fegato come not from Latin jecur but from ficatum, \"stuffed with figs\", after geese fattened on figs."
        de-AT: "Französisch foie und italienisch fegato kommen nicht vom lateinischen jecur, sondern von ficatum, „mit Feigen gestopft“, nach mit Feigen gemästeten Gänsen."
    - key: chopped-liver
      source: en-GB
      text:
        en-GB: "Liver spreads go by many names, from pâté and chopped liver to liverwurst and Braunschweiger; Italy adds liver sausages such as mazzafegato."
        de-AT: "Leberaufstriche haben viele Namen, von Pastete über Chopped Liver bis Braunschweiger; in Italien gibt es Leberwürste wie Mazzafegato."

- ingredient: extrawurst
  articles:
    en-GB: {title: "Extrawurst", revision: 1385872121}
    de-AT: {title: "Extrawurst", revision: 269063199}
  facts:
    - key: most-popular
      source: en-GB
      text:
        en-GB: "Extrawurst, a finely spiced mix of beef, pork and bacon fat, is the most popular cold cut in Austria; it is related to German Lyoner and American bologna."
        de-AT: "Die Extrawurst aus fein gewürztem Rind, Schwein und Speck ist Österreichs beliebteste Aufschnittwurst, verwandt mit Lyoner und amerikanischer Bologna."
    - key: idiom
      source: en-GB
      text:
        en-GB: "Someone who wants special treatment in German-speaking countries \"wants an Extrawurst fried for them\"."
        de-AT: "Wer eine Sonderbehandlung will, „will immer eine Extrawurst gebraten haben“."
    - key: gurkerl
      source: en-GB
      text:
        en-GB: "Variants include Pikantwurst with chopped red or green peppers and Gurkerlextra with small pieces of pickled cucumber."
        de-AT: "Zu den Varianten zählen die Pikantwurst mit Paprikastückchen und die Gurkerlextra mit kleinen Stücken Essiggurkerl."

- ingredient: kaesekrainer
  articles:
    en-GB: {title: "Käsekrainer", revision: 1357626087}
    de-AT: {title: "Käsekrainer", revision: 258939110}
  facts:
    - key: 1960s
      source: en-GB
      text:
        en-GB: "The Käsekrainer was invented in the late 1960s by two Upper Austrians, chef Herbert Schuch from Buchkirchen and Franz Thalhammer; it holds 10 to 20 per cent cheese."
        de-AT: "Die Käsekrainer erfanden Ende der 1960er-Jahre zwei Oberösterreicher, der Koch Herbert Schuch aus Buchkirchen und Franz Thalhammer; sie enthält 10 bis 20 % Käse."
    - key: krainer-dispute
      source: en-GB
      text:
        en-GB: "In 2012 Slovenia sought EU protection for the name \"Krainer\", after Carniola; a compromise in June 2012 let Austria keep using the name."
        de-AT: "2012 wollte Slowenien den Namen „Krainer“, nach der Region Krain, EU-weit schützen lassen; ein Kompromiss im Juni 2012 ließ ihn Österreich trotzdem."
    - key: eitrige
      source: en-GB
      text:
        en-GB: "Viennese legend has it that a Käsekrainer is ordered at the Würstelstand as an \"Eitrige\", although the phrase is rarer in real life than its fame suggests."
        de-AT: "Der Legende nach bestellt man die Käsekrainer am Würstelstand als „Eitrige“; im echten Wiener Alltag hört man das seltener, als sein Ruhm vermuten lässt."

- ingredient: weisswurst
  articles:
    en-GB: {title: "Weißwurst", revision: 1381260186}
    de-AT: {title: "Weißwurst", revision: 266707478}
  facts:
    - key: noon-bells
      source: en-GB
      text:
        en-GB: "Weisswurst is unsmoked and contains no nitrite, so it spoils fast; tradition says it must not hear the church bells ring noon."
        de-AT: "Weißwurst ist ungeräuchert und ohne Pökelsalz, daher rasch verderblich; der Tradition nach darf sie das Mittagsläuten nicht hören."
    - key: zuzeln
      source: en-GB
      text:
        en-GB: "The traditional way to eat it is zuzeln, Bavarian for sucking: an end is cut or bitten open and the filling sucked from the skin."
        de-AT: "Traditionell wird sie gezuzelt: Ein Ende wird auf- oder abgebissen und das Brät aus der Haut gesaugt."
    - key: equator
      source: en-GB
      text:
        en-GB: "The sausage gave its name to the Weißwurstäquator, the jokey \"white sausage equator\" that marks off southern Germany culturally."
        de-AT: "Die Wurst gab dem Weißwurstäquator seinen Namen, der scherzhaften Kulturgrenze, die Süddeutschland vom Rest abtrennt."

- ingredient: kabanos
  articles:
    en-GB: {title: "Kabanos", revision: 1377098801}
    de-AT: {title: "Cabanossi", revision: 265126460}
  facts:
    - key: kaban
      source: en-GB
      text:
        en-GB: "Kabanos is named after kaban, an old eastern Polish word for a young boar fattened on potatoes; the word came from Turkic languages."
        de-AT: "Kabanos ist nach kaban benannt, einem alten ostpolnischen Wort für einen mit Erdäpfeln gemästeten jungen Eber; das Wort stammt aus Turksprachen."
    - key: necklace
      source: en-GB
      text:
        en-GB: "Some historians say horsemen wore kabanosy around the neck like a necklace so they could eat without stopping."
        de-AT: "Manche Historiker meinen, Reiter hätten Kabanos wie eine Halskette getragen, um ohne Rast essen zu können."
    - key: 3-2-ratio
      source: en-GB
      text:
        en-GB: "Making 100 grams of kabanos takes at least 150 grams of pork, because so much water evaporates during the long smoking."
        de-AT: "Für 100 Gramm Kabanos braucht es mindestens 150 Gramm Schweinefleisch, weil beim langen Räuchern so viel Wasser verdunstet."

- ingredient: chorizo
  articles:
    en-GB: {title: "Chorizo", revision: 1381970777}
    de-AT: {title: "Chorizo", revision: 254342962}
  facts:
    - key: pimenton
      source: en-GB
      text:
        en-GB: "Spanish chorizo gets both its smokiness and its deep red colour from pimentón, dried and smoked red peppers; whether it is picante or dulce depends on the pimentón."
        de-AT: "Spanische Chorizo bekommt Rauchnote und tiefrote Farbe von Pimentón, getrocknetem, geräuchertem Paprika; ob sie picante oder dulce ist, hängt vom Pimentón ab."
    - key: mexico
      source: en-GB
      text:
        en-GB: "Mexican chorizo is based on the fresh, uncooked Spanish chorizo fresco and is seasoned with chilli peppers instead of paprika."
        de-AT: "Mexikanische Chorizo geht auf die frische, rohe spanische Chorizo fresco zurück und wird mit Chili statt Paprika gewürzt."

- ingredient: pancetta
  articles:
    en-GB: {title: "Pancetta", revision: 1378690846}
    de-AT: {title: "Pancetta", revision: 256831115}
  facts:
    - key: rolled-flat
      source: en-GB
      text:
        en-GB: "Rolled pancetta is typical of northern Italy, while the flat kind is typical of central and southern Italy."
        de-AT: "Gerollte Pancetta ist typisch für Norditalien, flache für Mittel- und Süditalien."
    - key: rolling
      source: en-GB
      text:
        en-GB: "For rolled pancetta the cured belly is rolled with fat on the outside around a meaty core, then packed tightly in netting to stop the surface hardening."
        de-AT: "Für gerollte Pancetta wird der gepökelte Bauch mit dem Fett nach außen um einen mageren Kern gewickelt und fest in ein Netz gepackt, damit die Oberfläche nicht verhärtet."

- ingredient: mortadella
  articles:
    en-GB: {title: "Mortadella", revision: 1384261065}
    de-AT: {title: "Mortadella", revision: 267456992}
  facts:
    - key: mortarium
      source: en-GB
      text:
        en-GB: "One theory derives mortadella from Latin mortarium, the mortar once used to pound the meat."
        de-AT: "Eine Theorie leitet Mortadella vom lateinischen mortarium ab, dem Mörser, in dem man früher das Fleisch zerstieß."
    - key: neck-fat
      source: en-GB
      text:
        en-GB: "Mortadella must contain at least 15 per cent small cubes of pork fat, mainly the hard fat from the pig's neck."
        de-AT: "Mortadella enthält mindestens 15 % kleine Speckwürfel, vor allem aus dem festen Nackenspeck des Schweins."

- ingredient: lamb_mince
  articles:
    en-GB: {title: "Lamb and mutton", revision: 1387126408}
    de-AT: {title: "Hackfleisch", revision: 271025958}
  facts:
    - key: hogget
      source: en-GB
      text:
        en-GB: "Sheep meat has three names by age: lamb in the first year, hogget in the second and mutton after that."
        de-AT: "Schaffleisch hat im Englischen drei Namen nach Alter: lamb im ersten Jahr, hogget im zweiten und danach mutton."
    - key: mouton
      source: en-GB
      text:
        en-GB: "The word mutton comes from French mouton, \"sheep\"; the stronger-tasting meat is now hard to find in Britain despite a Mutton Renaissance Campaign."
        de-AT: "Das englische mutton kommt vom französischen mouton, „Schaf“; das kräftigere Fleisch älterer Tiere ist in Großbritannien trotz einer eigenen Kampagne selten geworden."

- ingredient: turkey_leg
  articles:
    en-GB: {title: "Turkey as food", revision: 1384391254}
    de-AT: {title: "Pute", revision: 268381513}
  facts:
    - key: myoglobin
      source: en-GB
      text:
        en-GB: "Turkey legs are dark meat rich in myoglobin, which needs a higher temperature to cook through than the pale breast; that is why whole birds dry out easily."
        de-AT: "Putenkeulen sind dunkles Fleisch mit viel Myoglobin, das eine höhere Temperatur zum Durchgaren braucht als die helle Brust; deshalb wird ein ganzer Vogel leicht trocken."
    - key: booties
      source: en-GB
      text:
        en-GB: "Roast turkeys are sometimes decorated with paper frills or \"booties\" placed on the ends of the drumsticks."
        de-AT: "Gebratene Puten werden manchmal mit Papiermanschetten verziert, die man über die Enden der Keulen stülpt."

- ingredient: whole_duck
  articles:
    en-GB: {title: "Duck as food", revision: 1385002485}
    de-AT: {title: "Entenfleisch", revision: 270357494}
  facts:
    - key: pekin-1870s
      source: en-GB
      text:
        en-GB: "The American Pekin, the most widely sold duck in the United States, descends from white Peking ducks imported from China in the 1870s."
        de-AT: "Die Amerikanische Pekingente, die meistverkaufte Ente der USA, stammt von weißen Pekingenten ab, die in den 1870er-Jahren aus China eingeführt wurden."
    - key: domesticated
      source: en-GB
      text:
        en-GB: "Ducks have been hunted for thousands of years and bred as domestic birds for more than two thousand."
        de-AT: "Enten werden seit Jahrtausenden gejagt und seit mehr als zweitausend Jahren als Hausgeflügel gezüchtet."

- ingredient: lentils_red
  articles:
    en-GB: {title: "Lentil", revision: 1386422216}
    de-AT: {title: "Linse (Botanik)", revision: 272462349}
  facts:
    - key: cotyledon
      source: en-GB
      text:
        en-GB: "Red lentils are defined by the orange-red colour of their cotyledon, the inside of the seed, and tend to be smaller than green lentils."
        de-AT: "Rote Linsen sind durch die orangerote Farbe ihres Keimblatts, des Samenkerns, definiert und meist kleiner als grüne Linsen."
    - key: australia
      source: en-GB
      text:
        en-GB: "Australia is the world's largest producer of red lentils."
        de-AT: "Australien ist der weltgrößte Produzent roter Linsen."

- ingredient: lentils
  articles:
    en-GB: {title: "Lentil", revision: 1386422216}
    de-AT: {title: "Linse (Botanik)", revision: 272462349}
  facts:
    - key: optical-lens
      source: en-GB
      text:
        en-GB: "Optical lenses are named after the lentil, Latin lens, because a classic lens has the same shape as the seed."
        de-AT: "Die optische Linse ist nach der Hülsenfrucht benannt, lateinisch lens, weil eine klassische Linse genauso geformt ist wie der Samen."
    - key: lentulus
      source: en-GB
      text:
        en-GB: "Lentils may have given Rome the family name Lentulus, just as the chickpea gave the name Cicero and the broad bean the name Fabius."
        de-AT: "Die Linse gab Rom vielleicht den Familiennamen Lentulus, so wie die Kichererbse den Namen Cicero und die Ackerbohne den Namen Fabius."
    - key: canada
      source: en-GB
      text:
        en-GB: "Canada is the largest producer of green lentils; in North America some lentils are still sold under the names of historic cultivars such as Eston."
        de-AT: "Kanada ist der größte Produzent grüner Linsen; in Nordamerika werden manche Linsen noch nach historischen Sorten wie Eston benannt."

- ingredient: chickpeas_dry
  articles:
    en-GB: {title: "Chickpea", revision: 1387928459}
    de-AT: {title: "Kichererbse", revision: 271637194}
  facts:
    - key: india-75
      source: en-GB
      text:
        en-GB: "In 2023 India grew 75 per cent of the world's chickpeas."
        de-AT: "2023 stammten 75 % der weltweiten Kichererbsenernte aus Indien."
    - key: desi-kabuli
      source: en-GB
      text:
        en-GB: "There are two main types: small, dark, rough-coated desi chickpeas, common in South Asia, and the larger, smooth, tan kabuli, which reached India from Afghanistan in the 18th century."
        de-AT: "Es gibt zwei Haupttypen: kleine, dunkle, raue Desi-Kichererbsen, verbreitet in Südasien, und die größeren, glatten, hellbraunen Kabuli, die im 18. Jahrhundert aus Afghanistan nach Indien kamen."

- ingredient: chickpeas
  articles:
    en-GB: {title: "Chickpea", revision: 1387928459}
    de-AT: {title: "Kichererbse", revision: 271637194}
  facts:
    - key: syria
      source: en-GB
      text:
        en-GB: "The chickpea is one of the earliest cultivated legumes; the oldest archaeological evidence of it was found in Syria."
        de-AT: "Die Kichererbse zählt zu den ältesten Kulturhülsenfrüchten; die frühesten archäologischen Nachweise stammen aus Syrien."
    - key: cicer
      source: en-GB
      text:
        en-GB: "English chickpea goes back to Latin cicer via French pois chiche; it has nothing to do with chicks."
        de-AT: "Das englische chickpea geht über französisch pois chiche auf lateinisch cicer zurück und hat mit Küken nichts zu tun."

- ingredient: kidney_beans
  articles:
    en-GB: {title: "Kidney bean", revision: 1374237625}
    de-AT: {title: "Kidneybohne", revision: 264242269}
  facts:
    - key: lectin
      source: en-GB
      text:
        en-GB: "Raw red kidney beans contain a lot of phytohaemagglutinin; slow cookers at 80 °C do not destroy it, so they must be boiled properly, 30 minutes per US FDA advice."
        de-AT: "Rohe Kidneybohnen enthalten viel Phytohämagglutinin; im Slow Cooker bei 80 °C wird es nicht zerstört, sie müssen richtig kochen, laut US-Behörde FDA 30 Minuten."
    - key: name
      source: en-GB
      text:
        en-GB: "The kidney bean is a variety of the common bean, named for its resemblance to a human kidney."
        de-AT: "Die Kidneybohne ist eine Sorte der Gartenbohne und nach ihrer Ähnlichkeit mit einer menschlichen Niere benannt."

- ingredient: white_beans
  articles:
    en-GB: {title: "Navy bean", revision: 1387845024}
    de-AT: {title: "Perlbohne", revision: 271605045}
  facts:
    - key: us-navy
      source: en-GB
      text:
        en-GB: "Navy beans are named after the US Navy, which has fed them to its sailors as a staple since the mid-1800s."
        de-AT: "Die englische Bezeichnung navy bean kommt von der US-Marine, die ihren Matrosen die weißen Bohnen seit Mitte des 19. Jahrhunderts als Grundnahrung serviert."
    - key: baked-beans
      source: en-GB
      text:
        en-GB: "Navy beans, also called haricot beans, are the beans in tinned baked beans and in the US Senate bean soup."
        de-AT: "Diese weißen Bohnen, auch Haricot-Bohnen genannt, stecken in Baked Beans aus der Dose und in der Bohnensuppe des US-Senats."

- ingredient: black_beans
  articles:
    en-GB: {title: "Black turtle bean", revision: 1371278202}
    de-AT: {title: "Gartenbohne", revision: 271599534}
  facts:
    - key: shell
      source: en-GB
      text:
        en-GB: "The black turtle bean owes its name to its hard, shell-like outer skin."
        de-AT: "Die schwarze Bohne heißt im Englischen „Schildkrötenbohne“, wegen ihrer harten, panzerartigen Schale."
    - key: feijoada
      source: en-GB
      text:
        en-GB: "Black beans are the base of Brazil's national dish feijoada and of Cuba's Moros y Cristianos; their dark cooking water is even served as soup."
        de-AT: "Schwarze Bohnen sind die Basis von Brasiliens Nationalgericht Feijoada und von Kubas Moros y Cristianos; ihr dunkles Kochwasser wird sogar als Suppe gegessen."

- ingredient: dried_beans
  articles:
    en-GB: {title: "Phaseolus vulgaris", revision: 1381249768}
    de-AT: {title: "Gartenbohne", revision: 271599534}
  facts:
    - key: 8000-years
      source: en-GB
      text:
        en-GB: "The common bean was domesticated about 8,000 years ago in Mexico, Central America and the southern Andes, and is now the most eaten bean in the world."
        de-AT: "Die Gartenbohne wurde vor rund 8.000 Jahren in Mexiko, Mittelamerika und den südlichen Anden domestiziert und ist heute die meistgegessene Bohne der Welt."
    - key: old-world
      source: en-GB
      text:
        en-GB: "The beans grown in Europe before Columbus were Asian species unrelated to Phaseolus; every true Phaseolus bean comes from the Americas."
        de-AT: "Die Bohnen, die Europa vor Kolumbus kannte, waren asiatische Arten ohne Verwandtschaft mit Phaseolus; alle echten Phaseolus-Bohnen stammen aus Amerika."

- ingredient: split_peas
  articles:
    en-GB: {title: "Split pea", revision: 1322943771}
    de-AT: {title: "Erbse", revision: 272091617}
  facts:
    - key: mendel
      source: en-GB
      text:
        en-GB: "Yellow and green split peas tell a genetics story: Gregor Mendel found that green seed colour in peas is recessive to yellow."
        de-AT: "Gelbe und grüne Schälerbsen erzählen Genetikgeschichte: Gregor Mendel fand heraus, dass grüne Samenfarbe bei Erbsen rezessiv gegenüber gelber ist."
    - key: natural-split
      source: en-GB
      text:
        en-GB: "To make split peas, dried peas are skinned and then halved along the natural split between their two cotyledons."
        de-AT: "Für Schälerbsen werden getrocknete Erbsen geschält und dann an der natürlichen Naht zwischen den beiden Keimblättern halbiert."

- ingredient: broad_beans
  articles:
    en-GB: {title: "Vicia faba", revision: 1382938587}
    de-AT: {title: "Ackerbohne", revision: 272418101}
  facts:
    - key: 8250-bce
      source: en-GB
      text:
        en-GB: "Radiocarbon dating of charred beans from Neolithic sites in Israel's Lower Galilee suggests broad beans may have been domesticated as early as 8250 BCE."
        de-AT: "Radiokarbondaten verkohlter Bohnen aus jungsteinzeitlichen Fundstätten in Galiläa deuten darauf hin, dass die Saubohne schon um 8250 v. Chr. domestiziert wurde."
    - key: favism
      source: en-GB
      text:
        en-GB: "People with the enzyme disorder G6PD deficiency can react to broad beans with favism, a breakdown of red blood cells."
        de-AT: "Menschen mit dem Enzymdefekt G6PD-Mangel können auf Saubohnen mit Favismus reagieren, einem Zerfall der roten Blutkörperchen."
    - key: salt-soil
      source: en-GB
      text:
        en-GB: "Unlike most legumes, broad beans tolerate salty and clay soils and withstand harsh, cold climates."
        de-AT: "Anders als die meisten Hülsenfrüchte verträgt die Saubohne salzige und lehmige Böden und hält rauem, kaltem Klima stand."

- ingredient: edamame
  articles:
    en-GB: {title: "Edamame", revision: 1386549995}
    de-AT: {title: "Edamame", revision: 260055973}
  facts:
    - key: stem-beans
      source: en-GB
      text:
        en-GB: "Edamame means \"stem beans\" in Japanese, because the young soybeans were often sold still attached to the stem."
        de-AT: "Edamame heißt auf Japanisch „Zweigbohnen“, weil die jungen Sojabohnen oft noch am Stängel verkauft wurden."
    - key: fur-peas
      source: en-GB
      text:
        en-GB: "In Chinese the same dish is called maodou, which literally means \"fur peas\"."
        de-AT: "Auf Chinesisch heißt dasselbe Gericht Maodou, wörtlich „Fellerbsen“."

- ingredient: tofu
  articles:
    en-GB: {title: "Tofu", revision: 1387325521}
    de-AT: {title: "Tofu", revision: 272443249}
  facts:
    - key: liu-an
      source: en-GB
      text:
        en-GB: "Chinese legend credits Prince Liu An (179 to 122 BC) with inventing tofu; it was first recorded during the Han dynasty."
        de-AT: "Der chinesischen Legende nach erfand Prinz Liu An (179 bis 122 v. Chr.) den Tofu; erstmals belegt ist er in der Han-Dynastie."
    - key: japan-965
      source: en-GB
      text:
        en-GB: "Tofu probably reached Japan in the Nara period, but the first written record there dates only from AD 965."
        de-AT: "Nach Japan kam Tofu wohl in der Nara-Zeit, schriftlich belegt ist er dort aber erst im Jahr 965."

- ingredient: tempeh
  articles:
    en-GB: {title: "Tempeh", revision: 1386437753}
    de-AT: {title: "Tempeh", revision: 272183086}
  facts:
    - key: bayat
      source: en-GB
      text:
        en-GB: "Tempeh comes from Java: historical evidence points to Bayat in Central Java as its birthplace, and it was commonly eaten there around 1700."
        de-AT: "Tempeh stammt aus Java: Historische Belege nennen Bayat in Zentraljava als Ursprungsort, um 1700 war es dort verbreitet."
    - key: hibiscus-leaves
      source: en-GB
      text:
        en-GB: "The fermenting fungus grows naturally on teak and sea hibiscus leaves, which Javanese cooks used as food wrappers; traditional makers still start tempeh with such a leaf."
        de-AT: "Der Gärpilz wächst von Natur aus auf Teak- und Hibiskusblättern, in die man auf Java Speisen wickelte; traditionell startet man Tempeh bis heute mit so einem Blatt."
    - key: whole-bean
      source: en-GB
      text:
        en-GB: "Unlike tofu, tempeh keeps the whole soybean, bound into a firm cake by the mould Rhizopus, and its earthy flavour grows stronger as it ages."
        de-AT: "Anders als Tofu enthält Tempeh die ganze Sojabohne, die der Schimmelpilz Rhizopus zu einem festen Block verbindet; mit dem Alter wird sein erdiger Geschmack kräftiger."

- ingredient: almonds
  articles:
    en-GB: {title: "Almond", revision: 1387291498}
    de-AT: {title: "Mandelbaum", revision: 267301932}
  facts:
    - key: drupe
      source: en-GB
      text:
        en-GB: "An almond is not a true nut: the fruit is a drupe like a plum or cherry, but its flesh is a thin, leathery grey-green coat instead of juicy pulp."
        de-AT: "Die Mandel ist keine echte Nuss, sondern eine Steinfrucht wie Zwetschke oder Kirsche; ihr Fruchtfleisch ist nur eine dünne, ledrige graugrüne Hülle."
    - key: california
      source: en-GB
      text:
        en-GB: "California produces about 80 per cent of the world's almonds, a scale that droughts and heavy water demand have made hard to sustain."
        de-AT: "Kalifornien liefert rund 80 % der weltweiten Mandeln, ein Ausmaß, das Dürren und hoher Wasserbedarf zunehmend in Frage stellen."
    - key: bitter-gene
      source: en-GB
      text:
        en-GB: "Sweetness in almonds hinges on a single gene, and bitterness is recessive, which made the tree easier to domesticate from seed."
        de-AT: "Ob eine Mandel süß ist, hängt an einem einzigen Gen, und Bitterkeit ist rezessiv; das machte es leichter, den Baum aus Samen zu domestizieren."

- ingredient: ground_almonds
  articles:
    en-GB: {title: "Almond meal", revision: 1362570708}
    de-AT: {title: "Mandelbaum", revision: 267301932}
  facts:
    - key: sachertorte
      source: en-GB
      text:
        en-GB: "Ground almonds go into macarons, French frangipane for the galette des Rois and the Austrian Sachertorte, and they are one of the two main ingredients of marzipan."
        de-AT: "Geriebene Mandeln stecken in Macarons, in der französischen Frangipane für die Galette des Rois und in der Sachertorte; im Marzipan sind sie eine der zwei Hauptzutaten."
    - key: oxidise
      source: en-GB
      text:
        en-GB: "Whole almonds protect their fats with skin and vitamin E; grinding breaks that barrier and multiplies the surface, so ground almonds go stale much faster."
        de-AT: "Ganze Mandeln schützen ihr Fett mit Haut und Vitamin E; beim Reiben bricht dieser Schutz auf und die Oberfläche wächst enorm, daher werden geriebene Mandeln schneller ranzig."

- ingredient: flaked_almonds
  articles:
    en-GB: {title: "Almond", revision: 1387291498}
    de-AT: {title: "Mandelbaum", revision: 267301932}
  facts:
    - key: blanching
      source: en-GB
      text:
        en-GB: "Blanched almonds are treated with hot water to soften the brown skin, which is then removed to reveal the white kernel inside."
        de-AT: "Für blanchierte Mandeln weicht heißes Wasser die braune Haut auf, die man dann abzieht, bis der weiße Kern zum Vorschein kommt."
    - key: bitter-almonds
      source: en-GB
      text:
        en-GB: "Bitter almonds may yield 4 to 9 milligrams of hydrogen cyanide each; their typical flavour comes from benzaldehyde, released along with the cyanide."
        de-AT: "Bittermandeln können je 4 bis 9 Milligramm Blausäure freisetzen; ihr typisches Aroma stammt von Benzaldehyd, das dabei mit entsteht."

- ingredient: hazelnuts
  articles:
    en-GB: {title: "Hazelnut", revision: 1383231108}
    de-AT: {title: "Gemeine Hasel", revision: 271525784}
  facts:
    - key: colonsay
      source: en-GB
      text:
        en-GB: "On the Scottish island of Colonsay archaeologists found a pit with hundreds of thousands of burnt hazelnut shells, evidence of nut roasting some 8,000 years ago."
        de-AT: "Auf der schottischen Insel Colonsay fanden Archäologen eine Grube mit Hunderttausenden verkohlten Haselnussschalen, Spuren von Nussverarbeitung vor rund 8.000 Jahren."
    - key: turkey
      source: en-GB
      text:
        en-GB: "In 2023 Turkey grew 57.7 per cent of the world's hazelnuts."
        de-AT: "2023 stammten 57,7 % der weltweiten Haselnussernte aus der Türkei."

- ingredient: ground_hazelnuts
  articles:
    en-GB: {title: "Hazelnut", revision: 1383231108}
    de-AT: {title: "Gemeine Hasel", revision: 271525784}
  facts:
    - key: cob-filbert
      source: en-GB
      text:
        en-GB: "A round hazelnut is called a cob in English, while the elongated filbert is about twice as long as it is wide."
        de-AT: "Im Englischen heißt die runde Haselnuss cob, die längliche filbert ist etwa doppelt so lang wie breit."
    - key: praline
      source: en-GB
      text:
        en-GB: "Ground hazelnuts combined with chocolate, a pairing developed around Turin, are known as gianduja."
        de-AT: "Gemahlene Haselnüsse mit Schokolade, eine Mischung aus der Gegend um Turin, heißen Gianduja."

- ingredient: walnuts
  articles:
    en-GB: {title: "Walnut", revision: 1383754658}
    de-AT: {title: "Echte Walnuss", revision: 271876656}
  facts:
    - key: ink
      source: en-GB
      text:
        en-GB: "Walnut husks make a durable brown ink that is thought to have been used by Leonardo da Vinci and Rembrandt; Romans used the pigment to dye hair."
        de-AT: "Aus Walnussschalen lässt sich eine haltbare braune Tinte machen, die wohl schon Leonardo da Vinci und Rembrandt verwendeten; die Römer färbten damit Haare."
    - key: china-35
      source: en-GB
      text:
        en-GB: "The world harvested about four million tonnes of walnuts in shell in 2023, 35 per cent of them in China."
        de-AT: "2023 wurden weltweit rund vier Millionen Tonnen Walnüsse mit Schale geerntet, 35 % davon in China."
    - key: not-drupe
      source: en-GB
      text:
        en-GB: "Botanically the walnut is a drupe-like nut rather than a true drupe, because its green outer husk is not part of the carpel."
        de-AT: "Botanisch ist die Walnuss keine echte Steinfrucht, sondern eine steinfruchtartige Nuss, weil die grüne Außenschale nicht aus dem Fruchtblatt entsteht."

- ingredient: cashews
  articles:
    en-GB: {title: "Cashew", revision: 1387937575}
    de-AT: {title: "Cashewbaum", revision: 271609964}
  facts:
    - key: portuguese-spread
      source: en-GB
      text:
        en-GB: "Cashews are native to tropical South America. Portuguese explorers came across them in the 16th century and carried them to India and other tropical regions."
        de-AT: "Cashews stammen aus dem tropischen Südamerika. Portugiesische Seefahrer lernten sie im 16. Jahrhundert kennen und brachten sie nach Indien und in andere Tropengebiete."
    - key: toxic-shell
      source: en-GB
      text:
        en-GB: "The shell and the raw seed of the cashew are toxic, so the nuts only become edible after shelling and roasting or steaming."
        de-AT: "Schale und roher Samen der Cashew sind giftig. Essbar wird der Kern erst, wenn er geschält und geröstet oder gedämpft ist."
    - key: kidney-tree
      source: de-AT
      text:
        en-GB: "The word cashew comes via Portuguese caju from the Tupi word acaju, \"kidney tree\", probably after the shape of the kernels."
        de-AT: "Das Wort Cashew kommt über das portugiesische Caju vom Tupi-Wort Acaju, „Nierenbaum“, vermutlich wegen der Form der Kerne."

- ingredient: pistachios
  articles:
    en-GB: {title: "Pistachio", revision: 1387450685}
    de-AT: {title: "Pistazie", revision: 271876360}
  facts:
    - key: three-countries
      source: en-GB
      text:
        en-GB: "In 2024 the world harvested 1.4 million tonnes of pistachios, and the United States, Iran and Turkey together grew 87 per cent of them."
        de-AT: "2024 wurden weltweit 1,4 Millionen Tonnen Pistazien geerntet. Die USA, der Iran und die Türkei lieferten zusammen 87 Prozent davon."
    - key: cashew-family
      source: en-GB
      text:
        en-GB: "The pistachio tree belongs to the cashew family, which makes pistachios and cashews botanical relatives."
        de-AT: "Der Pistazienbaum gehört zu den Sumachgewächsen und ist damit botanisch ein Verwandter des Cashewbaums."

- ingredient: pine_nuts
  articles:
    en-GB: {title: "Pine nut", revision: 1381314567}
    de-AT: {title: "Pinienkern", revision: 271206149}
  facts:
    - key: naked-seed
      source: en-GB
      text:
        en-GB: "Pine nuts are not true nuts. Pines are gymnosperms, Greek for \"naked seed\", because their seeds are not enclosed in a fruit."
        de-AT: "Pinienkerne sind keine echten Nüsse. Kiefern sind Nacktsamer, ihre Samen liegen also nicht in einer Frucht eingeschlossen."
    - key: 29-species
      source: en-GB
      text:
        en-GB: "According to the FAO only 29 pine species give edible nuts worth harvesting, and 20 of them are traded locally or internationally."
        de-AT: "Laut FAO liefern nur 29 Kiefernarten Kerne, deren Ernte sich lohnt, und 20 davon werden lokal oder international gehandelt."
    - key: pignolie
      source: de-AT
      text:
        en-GB: "In Austria pine nuts are often called Pignolien, and another German name for them is Zirbelnuss."
        de-AT: "In Österreich heißen Pinienkerne besonders oft Pignolien, ein weiterer deutscher Name ist Zirbelnuss."

- ingredient: peanuts
  articles:
    en-GB: {title: "Peanut", revision: 1385789763}
    de-AT: {title: "Erdnuss", revision: 271686512}
  facts:
    - key: hypogaea
      source: en-GB
      text:
        en-GB: "Peanut pods ripen underground, which is unusual for a legume. That is why Linnaeus named the species hypogaea, Greek for \"under the earth\"."
        de-AT: "Die Hülsen der Erdnuss reifen unter der Erde, was für Hülsenfrüchtler ungewöhnlich ist. Daher nannte Linné die Art hypogaea, griechisch für „unter der Erde“."
    - key: aschanti
      source: de-AT
      text:
        en-GB: "In Austria the peanut is also known as Aschantinuss, while the Swiss call it Spanisches Nüssli."
        de-AT: "In Österreich kennt man die Erdnuss auch als Aschantinuss, in der Schweiz heißt sie Spanisches Nüssli."
    - key: legume
      source: de-AT
      text:
        en-GB: "Botanically the peanut is a legume and belongs to the same subfamily as peas and beans, which the English name \"pea-nut\" hints at."
        de-AT: "Botanisch ist die Erdnuss eine Hülsenfrucht aus derselben Unterfamilie wie Erbse und Bohne, worauf schon der englische Name „peanut“ anspielt."

- ingredient: peanut_butter
  articles:
    en-GB: {title: "Peanut butter", revision: 1388221625}
    de-AT: {title: "Erdnussbutter", revision: 266815865}
  facts:
    - key: edson-1884
      source: en-GB
      text:
        en-GB: "The first patent for making peanut butter from roasted peanuts went to Marcellus Gilmore Edson of Montreal in 1884."
        de-AT: "Das erste Patent auf Erdnussbutter aus gerösteten Erdnüssen erhielt 1884 Marcellus Gilmore Edson aus Montreal."
    - key: not-carver
      source: en-GB
      text:
        en-GB: "George Washington Carver is often named as its inventor, but by his 1916 peanut booklet many ways of making peanut butter had already been developed or patented."
        de-AT: "Oft gilt George Washington Carver als Erfinder, doch als er 1916 seine Erdnuss-Broschüre veröffentlichte, waren viele Herstellungsverfahren längst entwickelt oder patentiert."
    - key: pindakaas
      source: de-AT
      text:
        en-GB: "In Dutch peanut butter is called pindakaas, \"peanut cheese\", because Dutch law only allowed products containing real butter to use the word."
        de-AT: "Auf Niederländisch heißt Erdnussbutter pindakaas, also „Erdnusskäse“, weil dort nur Produkte mit echter Butter das Wort Butter tragen durften."

- ingredient: desiccated_coconut
  articles:
    en-GB: {title: "Coconut", revision: 1383275266}
    de-AT: {title: "Kokospalme", revision: 272232379}
  facts:
    - key: copra
      source: en-GB
      text:
        en-GB: "Dried coconut flesh is called copra, and the oil and milk made from it end up in cooking as well as in soaps and cosmetics."
        de-AT: "Getrocknetes Kokosfruchtfleisch heißt Kopra. Öl und Milch daraus landen in der Küche, aber auch in Seifen und Kosmetik."
    - key: only-species
      source: en-GB
      text:
        en-GB: "The coconut palm is the only living species of its genus, Cocos."
        de-AT: "Die Kokospalme ist die einzige noch lebende Art ihrer Gattung Cocos."
    - key: oil-share
      source: de-AT
      text:
        en-GB: "In 1971 the coconut palm supplied about 8 per cent of the world's vegetable oil, but by 2011 only about 2 per cent, even though output had nearly doubled."
        de-AT: "1971 deckte die Kokospalme noch rund 8 Prozent des weltweiten Pflanzenölbedarfs, 2011 nur noch etwa 2 Prozent, obwohl sich die Produktion fast verdoppelt hatte."

- ingredient: sunflower_seeds
  articles:
    en-GB: {title: "Sunflower seed", revision: 1383744353}
    de-AT: {title: "Sonnenblume", revision: 271091106}
  facts:
    - key: cypsela
      source: en-GB
      text:
        en-GB: "Strictly speaking a sunflower seed in its hull is a fruit, a so-called cypsela. Only the kernel inside, also called the heart, is the seed."
        de-AT: "Streng genommen ist ein Sonnenblumenkern in der Schale eine Frucht, eine sogenannte Achäne. Der eigentliche Samen ist erst der Kern darin."
    - key: black-or-striped
      source: en-GB
      text:
        en-GB: "Solid black sunflower seeds are mostly pressed for oil, while striped ones are sold for snacking and are known as confectionery sunflower seeds."
        de-AT: "Ganz schwarze Sonnenblumenkerne werden meist zu Öl gepresst, gestreifte dagegen als Knabberkerne verkauft."

- ingredient: pumpkin_seeds
  articles:
    en-GB: {title: "Pumpkin seed", revision: 1380344956}
  facts:
    - key: pepita
      source: en-GB
      text:
        en-GB: "The Mexican Spanish name pepita is short for pepita de calabaza, \"little seed of squash\"."
        de-AT: "Der mexikanisch-spanische Name Pepita ist kurz für pepita de calabaza, „kleiner Kürbissamen“."
    - key: huskless
      source: en-GB
      text:
        en-GB: "Some pumpkin varieties produce seeds without a husk and are grown purely for those edible seeds."
        de-AT: "Manche Kürbissorten bilden Kerne ganz ohne Schale und werden nur wegen dieser essbaren Kerne angebaut."

- ingredient: sesame
  articles:
    en-GB: {title: "Sesame", revision: 1383737693}
    de-AT: {title: "Sesam", revision: 272096967}
  facts:
    - key: oldest-oilseed
      source: en-GB
      text:
        en-GB: "Sesame is one of the oldest known oilseed crops and was domesticated well over 3,000 years ago."
        de-AT: "Sesam gehört zu den ältesten bekannten Ölpflanzen und wurde vor weit mehr als 3.000 Jahren domestiziert."
    - key: drought
      source: en-GB
      text:
        en-GB: "Sesame copes well with drought and grows where other crops fail. In 2024 the world harvested 6.7 million tonnes, led by India, Myanmar and Sudan."
        de-AT: "Sesam verträgt Trockenheit und gedeiht, wo andere Pflanzen versagen. 2024 wurden weltweit 6,7 Millionen Tonnen geerntet, vor allem in Indien, Myanmar und im Sudan."

- ingredient: tahini
  articles:
    en-GB: {title: "Tahini", revision: 1387161087}
    de-AT: {title: "Tahina", revision: 267051012}
  facts:
    - key: rashi
      source: en-GB
      text:
        en-GB: "The name tahini comes from Arabic tahina, but in Iraq the sesame paste goes by the name rashi."
        de-AT: "Der Name kommt vom arabischen Tahina, im Irak heißt die Sesampaste dagegen Raschi."
    - key: hulled
      source: en-GB
      text:
        en-GB: "Most tahini is made from hulled, usually roasted sesame. Paste from unhulled seeds tastes slightly bitter."
        de-AT: "Meist wird Tahini aus geschältem, oft geröstetem Sesam gemacht. Paste aus ungeschälten Samen schmeckt leicht bitter."

- ingredient: linseed
  articles:
    en-GB: {title: "Flax", revision: 1386548230}
    de-AT: {title: "Leinsamen", revision: 270067329}
  facts:
    - key: linen
      source: en-GB
      text:
        en-GB: "Linseed and linen come from the same plant: flax fibres are woven into linen, and its seeds and their oil give linseed and linseed oil."
        de-AT: "Leinsamen und Leinen stammen von derselben Pflanze: Aus den Fasern des Flachses wird Leinen, aus seinen Samen Leinsamen und Leinöl."
    - key: domesticated-once
      source: en-GB
      text:
        en-GB: "Flax is known only as a cultivated plant and seems to have been domesticated just once, from the wild pale flax, Linum bienne."
        de-AT: "Flachs kennt man nur als Kulturpflanze. Er wurde offenbar ein einziges Mal domestiziert, aus der Wildart Linum bienne."

- ingredient: chia
  articles:
    en-GB: {title: "Chia seed", revision: 1387857584}
    de-AT: {title: "Mexikanische Chia", revision: 270686549}
  facts:
    - key: twelve-times
      source: en-GB
      text:
        en-GB: "Chia seeds can soak up to 12 times their own weight in liquid and develop a slimy coating, which gives chia puddings their gel texture."
        de-AT: "Chiasamen nehmen bis zum Zwölffachen ihres Gewichts an Flüssigkeit auf und bilden eine schleimige Hülle, die Chiapudding seine gelartige Konsistenz gibt."
    - key: aztecs
      source: en-GB
      text:
        en-GB: "Chia belongs to the mint family. The Aztecs appear to have grown it widely, and it was a staple food in Mesoamerica before Columbus."
        de-AT: "Chia gehört zur Familie der Lippenblütler. Die Azteken bauten sie offenbar in großem Stil an, in Mesoamerika war sie ein Grundnahrungsmittel."

- ingredient: poppy_seeds
  articles:
    en-GB: {title: "Poppy seed", revision: 1380520331}
    de-AT: {title: "Schlafmohn", revision: 269412962}
  facts:
    - key: graumohn
      source: de-AT
      text:
        en-GB: "A grey-seeded variety, Waldviertler Graumohn, is popular in Austria and its name is a protected designation of origin."
        de-AT: "Eine Sorte mit grauen Samen, der Waldviertler Graumohn, ist in Österreich beliebt, und seine Herkunftsbezeichnung ist geschützt."
    - key: opium-name
      source: de-AT
      text:
        en-GB: "Poppy seeds come from the opium poppy. The word opium is Greek and means roughly \"little juice\", after the latex of the unripe capsules."
        de-AT: "Mohnsamen stammen vom Schlafmohn. Das Wort Opium kommt aus dem Griechischen und bedeutet etwa „Säftchen“, gemeint ist der Milchsaft der unreifen Kapseln."
    - key: central-europe
      source: en-GB
      text:
        en-GB: "Poppy seeds are used above all in Central Europe and South Asia, mostly whole or ground in pastry and bread."
        de-AT: "Mohn wird vor allem in Mitteleuropa und Südasien verwendet, meist ganz oder gemahlen in Gebäck und Brot."

- ingredient: chestnuts
  articles:
    en-GB: {title: "Sweet chestnut", revision: 1379513300}
    de-AT: {title: "Edelkastanie", revision: 271917961}
  facts:
    - key: giant-trees
      source: en-GB
      text:
        en-GB: "Sweet chestnut trees can grow up to 35 m tall with trunks more than 4 m wide, and they can live for hundreds of years."
        de-AT: "Edelkastanien werden bis zu 35 m hoch, ihre Stämme mehr als 4 m dick, und sie können mehrere hundert Jahre alt werden."
    - key: only-european
      source: de-AT
      text:
        en-GB: "The sweet chestnut is the only European species of the chestnut genus, and it was named Tree of the Year 2018."
        de-AT: "Die Edelkastanie ist die einzige europäische Art der Gattung Kastanien und wurde zum Baum des Jahres 2018 gewählt."

- ingredient: pecans
  articles:
    en-GB: {title: "Pecan", revision: 1369467020}
    de-AT: {title: "Pekannuss", revision: 271256436}
  facts:
    - key: state-nut
      source: en-GB
      text:
        en-GB: "The pecan is the state nut of five US states, among them Texas, where it is also the state tree."
        de-AT: "Die Pekannuss ist die offizielle Nuss von fünf US-Bundesstaaten, darunter Texas, wo der Pekannussbaum zugleich Staatsbaum ist."
    - key: hickory
      source: de-AT
      text:
        en-GB: "The pecan tree is a hickory and belongs to the walnut family, native to North America."
        de-AT: "Der Pekannussbaum ist ein Hickory aus der Familie der Walnussgewächse und in Nordamerika beheimatet."

- ingredient: macadamias
  articles:
    en-GB: {title: "Macadamia", revision: 1385568206}
    de-AT: {title: "Macadamia", revision: 272453037}
  facts:
    - key: only-australian
      source: en-GB
      text:
        en-GB: "The macadamia is the only widely grown food plant that is native to Australia."
        de-AT: "Die Macadamia ist die einzige weit verbreitete Nutzpflanze, die ursprünglich aus Australien stammt."
    - key: hawaii
      source: en-GB
      text:
        en-GB: "Australian seeds reached Hawaii in the 1880s, and Hawaii was the largest producer for over a century. Since the 2010s South Africa has led."
        de-AT: "In den 1880er-Jahren kamen australische Samen nach Hawaii, das über ein Jahrhundert lang größter Produzent war. Seit den 2010er-Jahren führt Südafrika."

- ingredient: olive_oil
  articles:
    en-GB: {title: "Olive oil", revision: 1388129764}
    de-AT: {title: "Olivenöl", revision: 272332824}
  facts:
    - key: 8th-millennium
      source: en-GB
      text:
        en-GB: "Olive trees have been cultivated around the Mediterranean since the 8th millennium BC, and the olive is one of its three core food plants with wheat and grapes."
        de-AT: "Ölbäume werden rund ums Mittelmeer seit dem 8. Jahrtausend v. Chr. kultiviert. Mit Weizen und Wein zählt die Olive zu den drei Grundpflanzen der Mittelmeerküche."
    - key: spain
      source: en-GB
      text:
        en-GB: "In 2022 Spain made 24 per cent of the world's olive oil, more than any other country."
        de-AT: "2022 stammten 24 Prozent des weltweiten Olivenöls aus Spanien, mehr als aus jedem anderen Land."
    - key: baumoel
      source: de-AT
      text:
        en-GB: "An old German name for olive oil is Baumöl, \"tree oil\", which goes back to Middle High German boumöl."
        de-AT: "Ein alter deutscher Name für Olivenöl ist Baumöl, er geht auf das mittelhochdeutsche boumöl zurück."

- ingredient: sunflower_oil
  articles:
    en-GB: {title: "Sunflower oil", revision: 1383744202}
    de-AT: {title: "Sonnenblumenöl", revision: 268264564}
  facts:
    - key: fourth
      source: de-AT
      text:
        en-GB: "Sunflower oil is the vegetable oil with the fourth-largest production volume in the world."
        de-AT: "Sonnenblumenöl ist das Pflanzenöl mit der vierthöchsten Produktionsmenge weltweit."
    - key: bred-ratios
      source: en-GB
      text:
        en-GB: "Sunflower oil is mainly linoleic and oleic acid, and through selective breeding growers produce oils with quite different ratios of the two."
        de-AT: "Sonnenblumenöl besteht vor allem aus Linol- und Ölsäure. Durch gezielte Züchtung entstehen Öle mit ganz unterschiedlichem Verhältnis der beiden."

- ingredient: rapeseed_oil
  articles:
    en-GB: {title: "Rapeseed oil", revision: 1383734371}
    de-AT: {title: "Rapsöl", revision: 272336659}
  facts:
    - key: lamp-oil
      source: de-AT
      text:
        en-GB: "Old rapeseed oil was bitter and high in erucic acid, so it served mainly as lamp oil, lubricant and soap base before new varieties were bred."
        de-AT: "Früher war Rapsöl bitter und reich an Erucasäure. Es diente daher vor allem als Lampenöl, Schmiermittel und für Seife, bis neue Sorten gezüchtet wurden."
    - key: canola
      source: en-GB
      text:
        en-GB: "Canola is a rapeseed cultivar developed by Canadian researchers in the mid 1970s, and edible varieties must contain less than 2 per cent erucic acid."
        de-AT: "Canola ist eine Rapssorte, die kanadische Forscher Mitte der 1970er-Jahre entwickelten. Speisesorten dürfen weniger als 2 Prozent Erucasäure enthalten."

- ingredient: pumpkin_seed_oil
  articles:
    en-GB: {title: "Pumpkin seed oil", revision: 1365339273}
    de-AT: {title: "Kürbiskernöl", revision: 272276558}
  facts:
    - key: 35-pumpkins
      source: de-AT
      text:
        en-GB: "One litre of pumpkin seed oil takes about three kilograms of seeds, or roughly 35 pumpkins."
        de-AT: "Für einen Liter Kürbiskernöl braucht man drei Kilogramm Kerne oder rund 35 Kürbisse."
    - key: hull-less-mutation
      source: de-AT
      text:
        en-GB: "The oil was first made from thick-shelled seeds in 1735. A hull-less variety bred from a mutation spread across Styria between 1870 and 1880."
        de-AT: "Anfangs, ab 1735, presste man Kernöl aus dickschaligen Samen. Eine aus einer Mutation gezüchtete schalenlose Sorte verbreitete sich zwischen 1870 und 1880 in der Steiermark."
    - key: ice-cream
      source: en-GB
      text:
        en-GB: "The classic Styrian dressing is pumpkin seed oil with cider vinegar, and a few drops also give plain vanilla ice cream a nutty taste."
        de-AT: "Das klassische steirische Dressing ist Kernöl mit Apfelessig, und ein paar Tropfen geben auch einfachem Vanilleeis einen nussigen Geschmack."

- ingredient: sesame_oil
  articles:
    en-GB: {title: "Sesame oil", revision: 1383737028}
    de-AT: {title: "Sesamöl", revision: 247878537}
  facts:
    - key: earliest-oil
      source: en-GB
      text:
        en-GB: "Sesame oil is one of the earliest known crop-based oils, yet mass production stays limited because sesame still needs inefficient manual harvesting."
        de-AT: "Sesamöl gehört zu den ältesten bekannten Pflanzenölen. Großproduktion bleibt dennoch schwierig, weil Sesam aufwendig von Hand geerntet wird."
    - key: dark-oil
      source: de-AT
      text:
        en-GB: "Dark sesame oil is pressed from roasted seeds. It is not meant for cooking but is added to dishes in small amounts for its roasted nut aroma."
        de-AT: "Dunkles Sesamöl wird aus gerösteten Samen gepresst. Zum Kochen ist es nicht gedacht, sondern wird Gerichten in kleinen Mengen wegen seines Röstaromas beigegeben."

- ingredient: coconut_oil
  articles:
    en-GB: {title: "Coconut oil", revision: 1374368042}
    de-AT: {title: "Kokosöl", revision: 270370874}
  facts:
    - key: 25-degrees
      source: en-GB
      text:
        en-GB: "Coconut oil is a white solid fat below about 25 °C and turns into a clear, thin liquid above that."
        de-AT: "Kokosöl ist unter etwa 25 °C ein weißes, festes Fett und wird darüber zu einem klaren, dünnflüssigen Öl."
    - key: copra
      source: de-AT
      text:
        en-GB: "Coconut oil is extracted from copra, the dried nutritive tissue of the coconut."
        de-AT: "Kokosöl wird aus Kopra gewonnen, dem getrockneten Nährgewebe der Kokosnuss."

- ingredient: walnut_oil
  articles:
    en-GB: {title: "Walnut oil", revision: 1348513087}
    de-AT: {title: "Walnussöl", revision: 266816366}
  facts:
    - key: oil-paint
      source: en-GB
      text:
        en-GB: "Walnut oil is a drying oil: in air it polymerises into a strong, flexible film, which is why painters have used it in oil paints and varnishes."
        de-AT: "Walnussöl ist ein trocknendes Öl. An der Luft bildet es einen festen, elastischen Film, weshalb es in Ölfarben und Firnissen verwendet wird."
    - key: california
      source: en-GB
      text:
        en-GB: "More than 99 per cent of the walnut oil sold in the United States is produced in California."
        de-AT: "Mehr als 99 Prozent des in den USA verkauften Walnussöls werden in Kalifornien hergestellt."

- ingredient: lard
  articles:
    en-GB: {title: "Lard", revision: 1384371826}
    de-AT: {title: "Schmalz", revision: 271473559}
  facts:
    - key: schmelzen
      source: de-AT
      text:
        en-GB: "The German word Schmalz goes back to Middle High German smalz and is related to schmelzen, \"to melt\"."
        de-AT: "Das Wort Schmalz geht auf mittelhochdeutsch smalz zurück und ist mit „schmelzen“ verwandt."
    - key: tallow
      source: en-GB
      text:
        en-GB: "Lard is rendered from pig fat, while the similar fat from cattle or sheep is called tallow. In pastry lard is prized for the flakiness it gives."
        de-AT: "Schmalz wird aus Schweinefett ausgelassen, das ähnliche Fett von Rind oder Schaf heißt Talg. In Teigen sorgt Schmalz für Mürbe und Blättrigkeit."

- ingredient: margarine
  articles:
    en-GB: {title: "Margarine", revision: 1386920431}
    de-AT: {title: "Margarine", revision: 272390147}
  facts:
    - key: napoleon
      source: de-AT
      text:
        en-GB: "Margarine was invented because Napoleon III wanted a durable butter substitute for his troops. Hippolyte Mège-Mouriès succeeded in 1869."
        de-AT: "Die Margarine geht auf Napoleon III. zurück, der einen haltbaren Butterersatz für seine Truppen suchte. 1869 gelang dem Chemiker Hippolyte Mège-Mouriès die Erfindung."
    - key: pearl
      source: en-GB
      text:
        en-GB: "The spread was first called oleomargarine, from Latin oleum and Greek margarite, \"pearl\", a nod to its lustre."
        de-AT: "Ursprünglich hieß der Aufstrich Oleomargarin, von lateinisch oleum und griechisch margarites, „Perle“, wegen seines Glanzes."

- ingredient: fat
  articles:
    en-GB: {title: "Lard", revision: 1384371826}
    de-AT: {title: "Schmalz", revision: 271473559}
  facts:
    - key: leaf-lard
      source: en-GB
      text:
        en-GB: "The finest lard, leaf lard, comes from the fat around a pig's kidneys. It tastes so little of pork that bakers prize it for flaky pastry."
        de-AT: "Das feinste Schmalz stammt aus dem Fett rund um die Nieren des Schweins, dem Flomen. Es schmeckt kaum nach Schwein und macht Teig besonders mürb und blättrig."
    - key: fire-1783
      source: de-AT
      text:
        en-GB: "A fire safety ordinance of 1783 in the Electorate of Trier already warned never to pour water on burning lard, but to smother it with ash."
        de-AT: "Schon eine Brandschutzverordnung von 1783 im Kurfürstentum Trier warnte, brennendes Schmalz nie mit Wasser zu löschen, sondern Asche darüberzustreuen."
    - key: wartime-butter
      source: en-GB
      text:
        en-GB: "In the early 20th century lard was about as popular as butter, and during the Second World War it was widely used in its place."
        de-AT: "Anfang des 20. Jahrhunderts war Schmalz etwa so beliebt wie Butter, und im Zweiten Weltkrieg wurde es vielerorts an ihrer Stelle verwendet."

- ingredient: sugar
  articles:
    en-GB: {title: "Sugar", revision: 1387203355}
    de-AT: {title: "Zucker", revision: 270935160}
  facts:
    - key: marggraf
      source: de-AT
      text:
        en-GB: "In 1747 the chemist Andreas Sigismund Marggraf showed that beet juice contains sugar, the start of the European beet sugar industry."
        de-AT: "1747 wies der Chemiker Andreas Sigismund Marggraf nach, dass Rübensaft Zucker enthält, der Beginn der europäischen Rübenzuckerindustrie."
    - key: cunern
      source: de-AT
      text:
        en-GB: "The world's first beet sugar factory was set up in 1801 in Cunern in Silesia, based on the work of Franz Carl Achard."
        de-AT: "Die erste Rübenzuckerfabrik der Welt entstand 1801 in Cunern in Schlesien, auf Grundlage der Arbeiten von Franz Carl Achard."
    - key: cane-share
      source: de-AT
      text:
        en-GB: "About 80 per cent of the world's sugar comes from sugar cane and about 20 per cent from sugar beet, which grows in temperate regions such as Central Europe."
        de-AT: "Rund 80 Prozent des Zuckers weltweit stammen aus Zuckerrohr, etwa 20 Prozent aus der Zuckerrübe, die in gemäßigten Zonen wie Mitteleuropa wächst."

- ingredient: icing_sugar
  articles:
    en-GB: {title: "Powdered sugar", revision: 1387121948}
    de-AT: {title: "Puderzucker", revision: 268642195}
  facts:
    - key: staubzucker
      source: de-AT
      text:
        en-GB: "Germans say Puderzucker, but in Austrian German it is Staubzucker, a word also heard in parts of Bavaria."
        de-AT: "In Deutschland sagt man Puderzucker, im österreichischen Deutsch heißt er Staubzucker, regional auch in Bayern."
    - key: anti-caking
      source: en-GB
      text:
        en-GB: "Shop-bought icing sugar usually contains 2 to 5 per cent of an anti-caking agent such as cornflour, which keeps it from clumping."
        de-AT: "Gekaufter Staubzucker enthält meist 2 bis 5 Prozent Trennmittel wie Maisstärke, damit er nicht verklumpt."
    - key: 1555-plates
      source: de-AT
      text:
        en-GB: "As early as 1555 Alessio Piemontese described how to make plates from icing sugar and tragacanth that could be broken up and eaten after the meal."
        de-AT: "Schon 1555 beschrieb Alessio Piemontese, wie man aus Staubzucker und Tragant Teller herstellt, die man nach dem Essen zerbrechen und aufessen konnte."

- ingredient: brown_sugar
  articles:
    en-GB: {title: "Brown sugar", revision: 1377839280}
  facts:
    - key: molasses-added
      source: en-GB
      text:
        en-GB: "Most brown sugar is white sugar with cane molasses added back. Washing it can rinse the molasses off and reveal the white crystals underneath."
        de-AT: "Meist ist brauner Zucker weißer Zucker, dem wieder Melasse zugesetzt wurde. Wäscht man ihn, kommt darunter der weiße Kristallzucker zum Vorschein."
    - key: light-dark
      source: en-GB
      text:
        en-GB: "Commercial brown sugar contains from 3.5 per cent molasses in light brown sugar to 6.5 per cent in dark brown sugar, measured by volume."
        de-AT: "Handelsüblicher brauner Zucker enthält, nach Volumen gerechnet, von 3,5 Prozent Melasse beim hellen bis 6,5 Prozent beim dunklen."

- ingredient: vanilla_sugar
  articles:
    en-GB: {title: "Vanilla sugar", revision: 1318330367}
    de-AT: {title: "Vanillin", revision: 270425413}
  facts:
    - key: vanillin-sugar
      source: en-GB
      text:
        en-GB: "Real vanilla sugar is sugar infused with vanilla pods, but cheaper versions are made only from sugar and vanillin."
        de-AT: "Echter Vanillezucker ist Zucker, der mit Vanilleschoten aromatisiert wurde. Billigere Varianten bestehen nur aus Zucker und Vanillin."
    - key: wood-lignin
      source: de-AT
      text:
        en-GB: "Vanillin was first synthesised in 1874. Today it is made cheaply from guaiacol or obtained from lignin, a component of wood."
        de-AT: "Vanillin wurde 1874 erstmals synthetisiert. Heute stellt man es günstig aus Guajacol her oder gewinnt es aus Lignin, einem Bestandteil von Holz."

- ingredient: honey
  articles:
    en-GB: {title: "Honey", revision: 1384928704}
    de-AT: {title: "Honig", revision: 271721244}
  facts:
    - key: rock-painting
      source: en-GB
      text:
        en-GB: "A rock painting in a cave in Valencia, Spain,, at least 8,000 years old, shows two people collecting honey from a wild bees' nest."
        de-AT: "Eine mindestens 8.000 Jahre alte Felsmalerei in einer Höhle in Valencia zeigt zwei Menschen beim Honigsammeln an einem wilden Bienennest."
    - key: solon
      source: en-GB
      text:
        en-GB: "Beekeeping around Athens was so common by 594 BC that Solon passed a law requiring new hives to stand 300 feet from existing ones."
        de-AT: "Um 594 v. Chr. war die Imkerei rund um Athen so verbreitet, dass Solon ein Gesetz erließ: Neue Bienenstöcke mussten 300 Fuß von bestehenden entfernt stehen."
    - key: no-tomb-honey
      source: en-GB
      text:
        en-GB: "Contrary to a popular story, no edible honey has been found in Egyptian tombs; such finds turned out to be other substances or mere chemical traces."
        de-AT: "Anders als oft erzählt wurde in ägyptischen Gräbern kein essbarer Honig gefunden. Solche Funde erwiesen sich als andere Stoffe oder bloße chemische Spuren."

- ingredient: maple_syrup
  articles:
    en-GB: {title: "Maple syrup", revision: 1387229445}
    de-AT: {title: "Ahornsirup", revision: 272166123}
  facts:
    - key: starch-to-sugar
      source: en-GB
      text:
        en-GB: "Maple trees store starch in their trunks and roots before winter. In late winter it turns into sugar that rises in the sap, which is then tapped."
        de-AT: "Ahornbäume speichern vor dem Winter Stärke in Stamm und Wurzeln. Im Spätwinter wird sie zu Zucker, der im Saft aufsteigt, und dann wird gezapft."
    - key: quebec
      source: de-AT
      text:
        en-GB: "According to the Canadian government, 75 per cent of the world's maple syrup in 2025 came from Canada, and 90 per cent of that from Québec."
        de-AT: "Laut kanadischer Regierung stammten 2025 rund 75 Prozent des weltweiten Ahornsirups aus Kanada, davon 90 Prozent aus Québec."

- ingredient: jam
  articles:
    en-GB: {title: "Fruit preserves", revision: 1384485158}
    de-AT: {title: "Marmelade", revision: 271139251}
  facts:
    - key: quince
      source: de-AT
      text:
        en-GB: "Marmelade comes from Portuguese marmelo, \"quince\", which goes back to Greek melimelon, a compound of \"honey\" and \"apple\"."
        de-AT: "Marmelade kommt vom portugiesischen marmelo, „Quitte“, das auf griechisch melimelon zurückgeht, zusammengesetzt aus „Honig“ und „Apfel“."
    - key: eu-citrus
      source: de-AT
      text:
        en-GB: "For decades EU rules reserved the trade name Marmelade for citrus spreads, a nod to British orange marmalade. Since 2026 it may be used for many fruits again."
        de-AT: "Jahrzehntelang war der Handelsname Marmelade in der EU Zitrusfrüchten vorbehalten, wegen der britischen Orangenmarmelade. Seit 2026 darf er wieder für viele Früchte verwendet werden."

- ingredient: apricot_jam
  articles:
    en-GB: {title: "Apricot", revision: 1382740667}
    de-AT: {title: "Aprikose", revision: 269809364}
  facts:
    - key: central-asia
      source: en-GB
      text:
        en-GB: "The apricot was domesticated in ancient times in Central Asia and China and from there spread across Eurasia to North Africa and Japan."
        de-AT: "Die Marille wurde schon in der Antike in Zentralasien und China kultiviert und verbreitete sich von dort über Eurasien bis Nordafrika und Japan."
    - key: wachau
      source: de-AT
      text:
        en-GB: "Apricots are also grown on a large scale further north, for example in the Wachau in Lower Austria, and Krems an der Donau holds a Marillenfest every year."
        de-AT: "Marillen werden auch weiter nördlich in größerem Stil angebaut, etwa in der Wachau, und in Krems an der Donau feiert man jedes Jahr das Marillenfest."

- ingredient: nutella
  articles:
    en-GB: {title: "Nutella", revision: 1388078779}
    de-AT: {title: "Nutella", revision: 271924510}
  facts:
    - key: cocoa-shortage
      source: en-GB
      text:
        en-GB: "Nutella was developed in Piedmont because post-war rationing had made cocoa beans scarce. It grew out of gianduja, a local mix of hazelnut paste and chocolate."
        de-AT: "Nutella entstand im Piemont, weil Kakaobohnen nach dem Krieg rationiert und knapp waren. Vorbild war Gianduja, eine Mischung aus Haselnusspaste und Schokolade."
    - key: first-jar-1964
      source: en-GB
      text:
        en-GB: "Pietro Ferrero sold a first 300 kg batch of Pasta Giandujot in 1946. The first jar called Nutella left the factory in Alba on 20 April 1964."
        de-AT: "Pietro Ferrero verkaufte 1946 eine erste Charge von 300 kg Pasta Giandujot. Das erste Glas namens Nutella verließ die Fabrik in Alba am 20. April 1964."

- ingredient: baking_powder
  articles:
    en-GB: {title: "Baking powder", revision: 1384883341}
    de-AT: {title: "Backpulver", revision: 270606333}
  facts:
    - key: borwick
      source: en-GB
      text:
        en-GB: "The first baking powder sold commercially was Borwick's, launched in England in 1842 as a yeast substitute for home baking."
        de-AT: "Das erste kommerziell verkaufte Backpulver war Borwick's Baking Powder, 1842 in England als Hefeersatz fürs Backen zu Hause eingeführt."
    - key: horsford-liebig
      source: de-AT
      text:
        en-GB: "Eben Norton Horsford, a student of Justus von Liebig, worked on baking powder from calcium phosphate and bicarbonate and first sold it as \"yeast powder\"."
        de-AT: "Eben Norton Horsford, ein Schüler Justus von Liebigs, entwickelte Backpulver aus Calciumphosphat und Natron und verkaufte es zuerst als „yeast powder“, also Hefepulver."
    - key: desiccant
      source: en-GB
      text:
        en-GB: "Baking powder holds a base and an acid side by side; a dry filler such as cornflour keeps them apart until water starts the reaction that releases carbon dioxide."
        de-AT: "Backpulver enthält eine Base und eine Säure. Ein Trennmittel wie Maisstärke hält sie trocken auseinander, bis Wasser die Reaktion startet und Kohlendioxid frei wird."

- ingredient: baking_soda
  articles:
    en-GB: {title: "Sodium bicarbonate", revision: 1385890638}
    de-AT: {title: "Natriumhydrogencarbonat", revision: 271808919}
  facts:
    - key: nahcolite
      source: en-GB
      text:
        en-GB: "Bicarbonate of soda also occurs naturally as the mineral nahcolite, though it is more often found as part of the mineral trona."
        de-AT: "Natron kommt auch in der Natur vor, als Mineral Nahcolith, häufiger aber als Bestandteil des Minerals Trona."
    - key: kaiser-natron
      source: de-AT
      text:
        en-GB: "In German-speaking shops sodium bicarbonate is sold as Speisenatron or Backsoda and under brand names such as Kaiser-Natron and Bullrich-Salz."
        de-AT: "Im Handel gibt es Natriumhydrogencarbonat als Speisenatron oder Backsoda und unter Markennamen wie Kaiser-Natron und Bullrich-Salz."

- ingredient: dry_yeast
  articles:
    en-GB: {title: "Baker's yeast", revision: 1377064438}
    de-AT: {title: "Backhefe", revision: 271664793}
  facts:
    - key: ww2-fleischmann
      source: en-GB
      text:
        en-GB: "During the Second World War Fleischmann's developed granulated active dry yeast for the US armed forces because it needed no refrigeration."
        de-AT: "Im Zweiten Weltkrieg entwickelte Fleischmann's für die US-Armee körnige Trockenhefe, weil sie keine Kühlung brauchte."
    - key: instant-1973
      source: en-GB
      text:
        en-GB: "Instant yeast was created by Lesaffre in 1973. It rises faster than active dry yeast and can go straight into the dough."
        de-AT: "Instanthefe brachte Lesaffre 1973 auf den Markt. Instanthefe treibt schneller als klassische Trockenhefe und kommt direkt in den Teig."

- ingredient: fresh_yeast
  articles:
    en-GB: {title: "Baker's yeast", revision: 1377064438}
    de-AT: {title: "Backhefe", revision: 271664793}
  facts:
    - key: germ
      source: de-AT
      text:
        en-GB: "Baker's yeast is called Hefe in Germany and Switzerland but Germ in Austrian German. In northern dialects it is also known as Gest or Bärme."
        de-AT: "Backhefe heißt in Deutschland und der Schweiz Hefe, im österreichischen Deutsch Germ. Mundartlich kennt man sie im Norden auch als Gest oder Bärme."
    - key: microbe-of-year
      source: de-AT
      text:
        en-GB: "Germany's Association for General and Applied Microbiology named baker's yeast Microbe of the Year 2022."
        de-AT: "Die Vereinigung für Allgemeine und Angewandte Mikrobiologie kürte die Backhefe zur Mikrobe des Jahres 2022."
    - key: salt-sugar
      source: en-GB
      text:
        en-GB: "Both salt and sugar slow yeast down, salt more strongly than sugar, and too much sugar actually dehydrates the yeast cells."
        de-AT: "Salz und Zucker bremsen beide die Germ, Salz stärker als Zucker, und zu viel Zucker entzieht den Hefezellen sogar Wasser."

- ingredient: gelatin
  articles:
    en-GB: {title: "Gelatin", revision: 1387322504}
    de-AT: {title: "Gelatine", revision: 266894645}
  facts:
    - key: gelatus
      source: en-GB
      text:
        en-GB: "The word gelatine comes from Latin gelatus, \"stiff, frozen\". It is made by partly breaking down collagen from animal parts."
        de-AT: "Das Wort Gelatine kommt vom lateinischen gelatus, „steif, gefroren“. Gewonnen wird sie durch teilweisen Abbau von Kollagen aus tierischem Bindegewebe."
    - key: peter-cooper
      source: en-GB
      text:
        en-GB: "In the mid 19th century the American inventor Peter Cooper patented a gelatine dessert powder called \"Portable Gelatin\" that only needed water."
        de-AT: "Mitte des 19. Jahrhunderts ließ sich der amerikanische Erfinder Peter Cooper ein Gelatine-Dessertpulver namens „Portable Gelatin“ patentieren, das man nur mit Wasser anrührte."

- ingredient: cocoa
  articles:
    en-GB: {title: "Cocoa bean", revision: 1388220117}
    de-AT: {title: "Kakaopulver", revision: 271296996}
  facts:
    - key: equator-belt
      source: en-GB
      text:
        en-GB: "Cacao trees only grow in a narrow belt about 20 degrees north and south of the Equator, and in 2024 Ivory Coast alone produced 38 per cent of all cocoa beans."
        de-AT: "Kakaobäume wachsen nur in einem schmalen Gürtel rund 20 Grad nördlich und südlich des Äquators. 2024 lieferte allein die Elfenbeinküste 38 Prozent aller Kakaobohnen."
    - key: black-cocoa
      source: de-AT
      text:
        en-GB: "Treating cocoa powder with potash or soda makes it more soluble, and strongly alkalised \"black cocoa\" can turn baked goods deep black without any colouring."
        de-AT: "Wird Kakaopulver mit Pottasche oder Soda alkalisiert, löst es sich besser. Stark alkalisierter „Schwarzer Kakao“ färbt Gebäck ohne Farbstoff tiefschwarz."

- ingredient: dark_chocolate
  articles:
    en-GB: {title: "Dark chocolate", revision: 1387799957}
    de-AT: {title: "Bitterschokolade", revision: 269801660}
  facts:
    - key: french-palate
      source: en-GB
      text:
        en-GB: "Dark chocolate owes much of its prestige to French chocolatiers, who in the late 20th century worked to make it the preferred chocolate in France."
        de-AT: "Ihren guten Ruf verdankt die Bitterschokolade vor allem französischen Chocolatiers, die sie im späten 20. Jahrhundert in Frankreich zur bevorzugten Sorte machten."
    - key: herrenschokolade
      source: de-AT
      text:
        en-GB: "In German dark chocolate has many names, including Zartbitter, Edelbitter, Feinherb and Herrenschokolade. Its minimum cocoa content is not legally fixed."
        de-AT: "Bitterschokolade hat viele Namen, etwa Zartbitter, Edelbitter, Feinherb oder Herrenschokolade. Einen gesetzlichen Mindestkakaoanteil gibt es für sie nicht."

- ingredient: milk_chocolate
  articles:
    en-GB: {title: "Milk chocolate", revision: 1386630192}
    de-AT: {title: "Milchschokolade", revision: 270150734}
  facts:
    - key: donkey-milk
      source: de-AT
      text:
        en-GB: "The first milk chocolate was made in Dresden in 1839 by Jordan & Timaeus using donkey milk, which was then cheaper than cow's milk in much of Germany."
        de-AT: "Die erste Milchschokolade entstand 1839 in Dresden bei Jordan & Timaeus, und zwar mit Eselsmilch, die damals vielerorts billiger war als Kuhmilch."
    - key: daniel-peter
      source: de-AT
      text:
        en-GB: "The Swiss Daniel Peter achieved his breakthrough in 1875 with condensed cow's milk, which improved texture and taste and made production cheaper."
        de-AT: "Der Schweizer Daniel Peter schaffte 1875 mit Kondensmilch aus Kuhmilch den Durchbruch, was Schmelz und Geschmack verbesserte und die Herstellung verbilligte."
    - key: four-fifths
      source: en-GB
      text:
        en-GB: "Milk chocolate is the most eaten kind of chocolate, and four fifths of it is sold in the United States and Europe."
        de-AT: "Milchschokolade ist die meistgegessene Schokoladensorte, und vier Fünftel davon werden in den USA und Europa verkauft."

- ingredient: white_chocolate
  articles:
    en-GB: {title: "White chocolate", revision: 1388104766}
    de-AT: {title: "Weiße Schokolade", revision: 256965575}
  facts:
    - key: no-cocoa-solids
      source: en-GB
      text:
        en-GB: "White chocolate is ivory because it contains cocoa butter but none of the non-fat cocoa solids that colour other chocolate."
        de-AT: "Weiße Schokolade ist elfenbeinfarben, weil sie zwar Kakaobutter enthält, aber keine fettfreie Kakaomasse, die andere Schokolade dunkel färbt."
    - key: foil
      source: en-GB
      text:
        en-GB: "White chocolate keeps less well than milk or dark chocolate and spoils quickly in light, so it is often wrapped in foil."
        de-AT: "Weiße Schokolade hält sich kürzer als Milch- oder Bitterschokolade und verdirbt schnell im Licht, daher wird sie oft in Folie verpackt."

- ingredient: marzipan
  articles:
    en-GB: {title: "Marzipan", revision: 1381769747}
    de-AT: {title: "Marzipan", revision: 270176233}
  facts:
    - key: three-cities
      source: de-AT
      text:
        en-GB: "The world-famous marzipans are Lübecker Marzipan, Mazapán de Toledo from Spain and Königsberger Marzipan."
        de-AT: "Weltbekannt sind das Lübecker Marzipan, das Mazapán de Toledo aus Spanien und das Königsberger Marzipan."
    - key: kernels
      source: en-GB
      text:
        en-GB: "Marzipan is not always made from almonds: some versions use other nuts or even apricot or peach kernels."
        de-AT: "Marzipan wird nicht immer aus Mandeln gemacht. Manche Varianten verwenden andere Nüsse oder sogar Marillen- oder Pfirsichkerne."

- ingredient: vanilla_pod
  articles:
    en-GB: {title: "Vanilla", revision: 1388155274}
    de-AT: {title: "Vanille (Gewürz)", revision: 269710884}
  facts:
    - key: edmond-albius
      source: en-GB
      text:
        en-GB: "In 1841 Edmond Albius, a 12-year-old enslaved boy on Réunion, found a way to pollinate vanilla by hand, which made worldwide cultivation possible."
        de-AT: "1841 entdeckte Edmond Albius, ein zwölfjähriger versklavter Bub auf Réunion, wie man Vanille von Hand bestäubt. Erst das machte den weltweiten Anbau möglich."
    - key: little-pod
      source: de-AT
      text:
        en-GB: "Vanilla comes from the fermented pods of an orchid. Its name goes back via French to Spanish vainilla, \"little pod\"."
        de-AT: "Vanille stammt aus den fermentierten Schoten einer Orchidee. Der Name kommt über das Französische vom spanischen vainilla, „kleine Hülse“."

- ingredient: vanilla_extract
  articles:
    en-GB: {title: "Vanilla extract", revision: 1384718468}
  facts:
    - key: hundreds-compounds
      source: en-GB
      text:
        en-GB: "Vanillin is the main flavour in vanilla extract, but real extract contains several hundred other flavour compounds, while artificial vanilla is usually just vanillin."
        de-AT: "Vanillin ist der Hauptaromastoff im Vanilleextrakt, doch echter Extrakt enthält mehrere hundert weitere Aromastoffe. Künstliches Vanillearoma ist meist reines Vanillin."
    - key: bourbon
      source: en-GB
      text:
        en-GB: "The name \"Bourbon vanilla\" refers to where the beans come from, the former Bourbon Islands, mostly Madagascar but also Mauritius and Réunion."
        de-AT: "Der Name „Bourbon-Vanille“ verrät die Herkunft der Schoten: die früheren Bourbon-Inseln, vor allem Madagaskar, aber auch Mauritius und Réunion."

- ingredient: pudding_powder
  articles:
    en-GB: {title: "Custard powder", revision: 1370804329}
    de-AT: {title: "Pudding", revision: 272466846}
  facts:
    - key: bird-1837
      source: en-GB
      text:
        en-GB: "Custard powder was invented in 1837 by Alfred Bird for his wife, who loved custard but was allergic to eggs. It thickens with cornflour instead."
        de-AT: "Puddingpulver erfand Alfred Bird 1837 für seine Frau, die Vanillesauce liebte, aber keine Eier vertrug. Statt Ei bindet Maisstärke."
    - key: flammeri
      source: de-AT
      text:
        en-GB: "Strictly speaking a starch-thickened cold dessert is a Flammeri. The food industry has called it Pudding since the 1930s, and the old name has faded."
        de-AT: "Streng genommen ist eine mit Stärke gebundene, kalt servierte Süßspeise ein Flammeri. Die Lebensmittelindustrie nennt sie seit den 1930er-Jahren Pudding."

- ingredient: gelling_sugar
  articles:
    en-GB: {title: "Gelling sugar", revision: 1382199848}
    de-AT: {title: "Gelierzucker", revision: 271662690}
  facts:
    - key: first-1965
      source: de-AT
      text:
        en-GB: "The first gelling sugar, a 1:1 variety, was launched in 1965 by Pfeifer & Langen and was later produced under licence at home and abroad."
        de-AT: "Den ersten Gelierzucker, die Sorte 1:1, brachte Pfeifer & Langen 1965 auf den Markt. Später stellten ihn Lizenznehmer im In- und Ausland her."
    - key: ratios
      source: en-GB
      text:
        en-GB: "The labels 1:1, 2:1 and 3:1 tell you how much fruit to use per part of sugar, so 3:1 gives the least sweet result."
        de-AT: "Die Angaben 1:1, 2:1 und 3:1 sagen, wie viel Obst auf einen Teil Zucker kommt. Mit 3:1 wird die Marmelade am wenigsten süß."

- ingredient: pearl_sugar
  articles:
    en-GB: {title: "Nib sugar", revision: 1340096365}
  facts:
    - key: does-not-melt
      source: en-GB
      text:
        en-GB: "Pearl sugar is very coarse, hard and opaque and does not melt at normal baking temperatures, which is why it stays visible on buns."
        de-AT: "Hagelzucker ist grob, hart und undurchsichtig und schmilzt bei üblichen Backtemperaturen nicht. Darum bleibt er auf Gebäck sichtbar."
    - key: liege-waffles
      source: en-GB
      text:
        en-GB: "Pearl sugar is made by crushing blocks of white sugar and sieving them. In Belgium it is a characteristic ingredient of Liège waffles."
        de-AT: "Hagelzucker entsteht, indem man Blöcke aus weißem Zucker zerbricht und siebt. In Belgien gehört er unbedingt in Lütticher Waffeln."

- ingredient: baking_wafers
  articles:
    en-GB: {title: "Wafer paper", revision: 1313653189}
    de-AT: {title: "Oblate", revision: 257719536}
  facts:
    - key: oblata
      source: de-AT
      text:
        en-GB: "The word Oblate comes from Medieval Latin oblata, \"offered\", and wafers are baked between hot irons from nothing but water, flour and starch."
        de-AT: "Das Wort Oblate kommt vom mittellateinischen oblata, „dargebracht“. Gebacken werden Oblaten zwischen heißen Eisen aus nichts als Wasser, Mehl und Stärke."
    - key: lebkuchen
      source: en-GB
      text:
        en-GB: "Wafer paper evolved from wafers and was used in Germany as an edible non-stick baking paper, particularly for Lebkuchen."
        de-AT: "Oblaten dienten in Deutschland als essbares Backpapier, auf dem nichts anklebt, vor allem für Lebkuchen."

- ingredient: candied_orange_peel
  articles:
    en-GB: {title: "Candied fruit", revision: 1364351794}
    de-AT: {title: "Orangeat", revision: 267816565}
  facts:
    - key: aranzini
      source: de-AT
      text:
        en-GB: "Candied orange peel is called Orangeat in Germany and Aranzini in Austria. It is made from bitter oranges, whose peel is much thicker than that of other oranges."
        de-AT: "Orangeat heißt in Österreich Aranzini. Es wird aus den Schalen von Bitterorangen gemacht, die deutlich dicker sind als die anderer Orangen."
    - key: 14th-century
      source: en-GB
      text:
        en-GB: "Candying, steeping fruit in ever stronger sugar syrup, has been used since the 14th century and keeps fruit edible for up to a year."
        de-AT: "Kandieren, also das Einlegen von Früchten in immer stärkeren Zuckersirup, kennt man seit dem 14. Jahrhundert. So bleibt Obst bis zu einem Jahr genießbar."

- ingredient: candied_lemon_peel
  articles:
    en-GB: {title: "Succade", revision: 1385979899}
    de-AT: {title: "Zitronat", revision: 267816574}
  facts:
    - key: citron
      source: en-GB
      text:
        en-GB: "Candied citron peel is made from the citron, whose peel is extra thick and whose inner rind is less bitter than that of other citrus fruits."
        de-AT: "Zitronat wird aus der Zitronatzitrone gemacht, deren Schale besonders dick ist und deren weiße Innenschicht weniger bitter schmeckt als bei anderen Zitrusfrüchten."
    - key: kandinat-t
      source: de-AT
      text:
        en-GB: "Because imported citrus was expensive, East Germany developed a substitute for candied citron peel made from green tomatoes, called Kandinat T."
        de-AT: "Weil Zitrusimporte teuer waren, entwickelte man in der DDR einen Zitronat-Ersatz aus grünen Paradeisern namens Kandinat T."

- ingredient: agar
  articles:
    en-GB: {title: "Agar", revision: 1379370944}
    de-AT: {title: "Agar", revision: 267289264}
  facts:
    - key: malay-name
      source: en-GB
      text:
        en-GB: "The word agar comes from agar-agar, the Malay name for the red algae the jelly is made from. In Japan it is known as kanten."
        de-AT: "Das Wort Agar kommt von Agar-Agar, dem malaiischen Namen für die Rotalgen, aus denen das Geliermittel gewonnen wird. In Japan heißt es Kanten."
    - key: 1658-innkeeper
      source: en-GB
      text:
        en-GB: "Legend has it that agar production in Japan was discovered in 1658 by Mino Tarozaemon, an innkeeper in what is now Kyoto."
        de-AT: "Der Legende nach entdeckte 1658 der Gastwirt Mino Tarozaemon im heutigen Kyoto, wie man Agar herstellt."

- ingredient: pectin
  articles:
    en-GB: {title: "Pectin", revision: 1380818205}
    de-AT: {title: "Pektine", revision: 271516925}
  facts:
    - key: congealed
      source: en-GB
      text:
        en-GB: "Pectin takes its name from Greek pektikos, \"congealed\" or \"curdled\". It is a structural polymer in the cell walls of land plants."
        de-AT: "Pektin hat seinen Namen vom griechischen pektikos, „geronnen, erstarrt“. Es ist ein Gerüststoff in den Zellwänden von Landpflanzen."
    - key: citrus
      source: en-GB
      text:
        en-GB: "Commercial pectin is a white to light brown powder made mostly from citrus fruits and used to set jams and jellies."
        de-AT: "Handelsübliches Pektin ist ein weißes bis hellbraunes Pulver, das meist aus Zitrusfrüchten gewonnen wird und Marmeladen fest werden lässt."

- ingredient: cream_of_tartar
  articles:
    en-GB: {title: "Potassium bitartrate", revision: 1388048140}
    de-AT: {title: "Kaliumhydrogentartrat", revision: 263605370}
  facts:
    - key: wine-stone
      source: en-GB
      text:
        en-GB: "Cream of tartar is a by-product of winemaking: it crystallises out of grape must as tartar, or wine stone, on the inside of barrels."
        de-AT: "Weinstein ist ein Nebenprodukt der Weinherstellung. Er kristallisiert aus dem Traubenmost aus und lagert sich in den Fässern ab."
    - key: meringue
      source: en-GB
      text:
        en-GB: "Cream of tartar stabilises beaten egg whites for meringues and soufflés and stops sugar syrups from crystallising."
        de-AT: "Weinstein stabilisiert geschlagenes Eiklar für Baiser und Soufflé und verhindert, dass Zuckersirup auskristallisiert."

- ingredient: salt
  articles:
    en-GB: {title: "Salt", revision: 1382702697}
    de-AT: {title: "Speisesalz", revision: 272014467}
  facts:
    - key: hallstatt
      source: en-GB
      text:
        en-GB: "Hallstatt in Austria was the site of the world's first salt mine. Nearby Salzburg means \"salt castle\" and the Salzach is the \"salt river\"."
        de-AT: "In Hallstatt lag das erste Salzbergwerk der Welt. Auch Salzburg und die Salzach tragen das Salz im Namen, die Salzach ist wörtlich der „Salzfluss“."
    - key: romania-6000bc
      source: en-GB
      text:
        en-GB: "Some of the earliest evidence of salt making dates from around 6000 BC, when people in present-day Romania boiled spring water to extract salt."
        de-AT: "Zu den frühesten Spuren der Salzgewinnung zählt Rumänien um 6000 v. Chr.: Man kochte dort Quellwasser ein, um Salz zu gewinnen."
    - key: salary-myth
      source: en-GB
      text:
        en-GB: "The word salary comes from Latin for salt, but the popular claim that Roman legions were paid in salt is baseless. Salad simply means \"salted\"."
        de-AT: "Das englische Wort salary kommt vom lateinischen Wort für Salz, doch dass römische Legionäre in Salz bezahlt wurden, ist ein Mythos. Salat bedeutet einfach „gesalzen“."

- ingredient: sea_salt
  articles:
    en-GB: {title: "Sea salt", revision: 1385026209}
    de-AT: {title: "Meersalz", revision: 270639572}
  facts:
    - key: salt-lakes
      source: de-AT
      text:
        en-GB: "Despite its name, sea salt does not always come from the sea; it can also be won from the water of naturally salty inland lakes."
        de-AT: "Meersalz stammt trotz seines Namens nicht immer aus dem Meer. Es kann auch aus dem Wasser natürlich salziger Binnenseen gewonnen werden."
    - key: rock-salt-old-sea
      source: de-AT
      text:
        en-GB: "Rock salt is really ancient sea salt, left behind millions of years ago when whole inland seas or cut-off arms of the sea evaporated."
        de-AT: "Steinsalz ist eigentlich uraltes Meersalz. Es entstand vor Millionen von Jahren, als ganze Binnenmeere oder abgeschnürte Meeresarme verdunsteten."

- ingredient: black_pepper
  articles:
    en-GB: {title: "Black pepper", revision: 1387670743}
    de-AT: {title: "Pfeffer", revision: 271227050}
  facts:
    - key: malabar
      source: en-GB
      text:
        en-GB: "Black pepper is native to the Malabar Coast of south-western India, which as the ancient world's only source exported this \"black gold\" to the Middle East and Rome."
        de-AT: "Pfeffer stammt von der Malabarküste im Südwesten Indiens. Als einzige Quelle der antiken Welt lieferte sie das „schwarze Gold“ in den Nahen Osten und nach Rom."
    - key: piperine
      source: de-AT
      text:
        en-GB: "The heat of pepper comes from the alkaloid piperine. Peppercorns are the fruits of the pepper plant, Piper nigrum."
        de-AT: "Die Schärfe des Pfeffers kommt vom Alkaloid Piperin. Die Pfefferkörner sind die Früchte des Pfefferstrauchs, Piper nigrum."

- ingredient: white_pepper
  articles:
    en-GB: {title: "Black pepper", revision: 1387670743}
    de-AT: {title: "Pfeffer", revision: 271227050}
  facts:
    - key: retting
      source: en-GB
      text:
        en-GB: "White pepper is the bare seed of ripe peppercorns: the red berries are soaked in water for about a week until the flesh rots and can be rubbed off."
        de-AT: "Weißer Pfeffer ist der nackte Samen reifer Pfefferbeeren. Die roten Beeren liegen etwa eine Woche im Wasser, bis das Fruchtfleisch weich wird und abgerieben werden kann."
    - key: pliny-prices
      source: en-GB
      text:
        en-GB: "Around 77 AD Pliny the Elder noted Roman prices of 15 denarii per pound for long pepper, seven for white and four for black."
        de-AT: "Um 77 n. Chr. notierte Plinius der Ältere die römischen Preise: 15 Denare pro Pfund für Langpfeffer, sieben für weißen und vier für schwarzen."
    - key: same-plant
      source: de-AT
      text:
        en-GB: "Green, black, white and red pepper all come from the same plant. Only the time of harvest and the processing decide the colour."
        de-AT: "Grüner, schwarzer, weißer und roter Pfeffer stammen alle von derselben Pflanze. Nur Erntezeitpunkt und Verarbeitung entscheiden über die Farbe."

- ingredient: paprika
  articles:
    en-GB: {title: "Paprika", revision: 1387294701}
  facts:
    - key: word-origin
      source: en-GB
      text:
        en-GB: "The word paprika is Hungarian, a diminutive of Serbo-Croatian papar, \"pepper\", which in turn comes from Latin piper."
        de-AT: "Das Wort Paprika ist ungarisch, eine Verkleinerung des serbokroatischen papar, „Pfeffer“, das seinerseits vom lateinischen piper stammt."
    - key: ottoman-route
      source: en-GB
      text:
        en-GB: "Peppers reached Western Europe through Spain and Portugal in the 16th century, and paprika came to the Balkans via the Ottoman Empire."
        de-AT: "Paprika kam im 16. Jahrhundert über Spanien und Portugal nach Westeuropa und über das Osmanische Reich auf den Balkan und nach Mitteleuropa."

- ingredient: smoked_paprika
  articles:
    en-GB: {title: "Paprika", revision: 1387294701}
    de-AT: {title: "Pimentón de la Vera", revision: 266288085}
  facts:
    - key: oak-smoke
      source: en-GB
      text:
        en-GB: "The best-known Spanish paprika, pimentón de la Vera, gets its smoky taste and smell from being dried over smoke, typically from oak wood."
        de-AT: "Der bekannteste spanische Paprika, Pimentón de la Vera, bekommt seinen rauchigen Geschmack, weil die Schoten über Rauch getrocknet werden, meist von Eichenholz."
    - key: protected-origin
      source: de-AT
      text:
        en-GB: "Pimentón de la Vera is a protected designation of origin for smoked paprika made in the province of Cáceres in Extremadura."
        de-AT: "Pimentón de la Vera ist eine geschützte Ursprungsbezeichnung für geräucherten Paprika aus der Provinz Cáceres in der Extremadura."

- ingredient: hot_paprika
  articles:
    en-GB: {title: "Paprika", revision: 1387294701}
  facts:
    - key: five-grades
      source: en-GB
      text:
        en-GB: "Hungary sorts its paprika into five commercial grades, from különleges (\"exquisite\") through rózsa (\"rose\") to erős, the hot one."
        de-AT: "Ungarn teilt Paprika in fünf Handelsklassen ein, von különleges („exquisit“) über rózsa („Rose“) bis erős, dem scharfen."
    - key: seeds-stalks
      source: en-GB
      text:
        en-GB: "Sweet paprika is mostly the fruit wall with over half the seeds removed, while hot paprika also contains seeds, stalks and calyces."
        de-AT: "Edelsüßer Paprika besteht vor allem aus der Fruchtwand, mehr als die Hälfte der Samen wird entfernt. Scharfer Paprika enthält auch Samen, Stiele und Kelche."
    - key: szeged-kalocsa
      source: en-GB
      text:
        en-GB: "Hungary's two main paprika regions lie in the south of the country, around Szeged and around Kalocsa on the Danube."
        de-AT: "Ungarns zwei wichtigste Paprikagebiete liegen im Süden des Landes, rund um Szeged und um Kalocsa an der Donau."

- ingredient: cayenne
  articles:
    en-GB: {title: "Cayenne pepper", revision: 1382213486}
    de-AT: {title: "Cayennepfeffer", revision: 271374494}
  facts:
    - key: tupi-name
      source: en-GB
      text:
        en-GB: "The name cayenne probably comes from kyynha, Old Tupi for \"capsicum\". The capital of French Guiana shares the name."
        de-AT: "Der Name Cayenne geht vermutlich auf kyynha zurück, das alte Tupi-Wort für Paprika. Die Hauptstadt Französisch-Guayanas trägt denselben Namen."
    - key: not-pepper
      source: de-AT
      text:
        en-GB: "Despite its name, cayenne pepper has nothing to do with the pepper plant. It is ground chilli with a heat of 30,000 to 50,000 Scoville units."
        de-AT: "Cayennepfeffer hat trotz des Namens nichts mit Pfeffer zu tun. Er besteht aus gemahlenen Chilis mit einer Schärfe von 30.000 bis 50.000 Scoville."

- ingredient: chili_flakes
  articles:
    en-GB: {title: "Crushed red pepper", revision: 1362792466}
    de-AT: {title: "Pul Biber", revision: 268526684}
  facts:
    - key: seeds-myth
      source: en-GB
      text:
        en-GB: "Chilli flakes often contain lots of seeds, which many people wrongly believe hold most of the heat."
        de-AT: "Chiliflocken enthalten oft viele Samen, von denen viele fälschlich glauben, sie trügen die meiste Schärfe."
    - key: pul-biber-salt
      source: de-AT
      text:
        en-GB: "Turkish pul biber is often a seasoning mix with about one fifth salt, and it rates only 5,000 to 10,000 on the Scoville scale."
        de-AT: "Türkisches Pul Biber ist oft eine Würzmischung mit etwa einem Fünftel Salz und liegt bei nur 5.000 bis 10.000 Scoville."

- ingredient: cumin
  articles:
    en-GB: {title: "Cumin", revision: 1380358322}
    de-AT: {title: "Kreuzkümmel", revision: 266926757}
  facts:
    - key: atlit-yam
      source: en-GB
      text:
        en-GB: "Seeds of wild cumin were found in Atlit-Yam, a settlement now under the sea that dates to the early 6th millennium BC."
        de-AT: "Samen von wildem Kreuzkümmel fand man in Atlit-Yam, einer heute vom Meer überfluteten Siedlung aus dem frühen 6. Jahrtausend v. Chr."
    - key: india-70
      source: en-GB
      text:
        en-GB: "India grows about 70 per cent of the world's cumin, followed by Syria with 13 per cent."
        de-AT: "Indien erzeugt rund 70 Prozent des weltweiten Kreuzkümmels, gefolgt von Syrien mit 13 Prozent."
    - key: cross-name
      source: de-AT
      text:
        en-GB: "The German name Kreuzkümmel refers to the cross-shaped arrangement of the leaves and the caraway-like look of the dried fruits."
        de-AT: "Der Name Kreuzkümmel kommt von der kreuzförmigen Blattstellung und dem kümmelähnlichen Aussehen der getrockneten Früchte."

- ingredient: caraway
  articles:
    en-GB: {title: "Caraway", revision: 1386439222}
    de-AT: {title: "Echter Kümmel", revision: 272336605}
  facts:
    - key: not-seeds
      source: en-GB
      text:
        en-GB: "Caraway \"seeds\" are really small crescent-shaped fruits with five pale ridges, which give off their smell when crushed."
        de-AT: "Kümmel„samen“ sind eigentlich kleine, sichelförmige Früchte mit fünf hellen Rippen, die beim Zerdrücken ihren Duft freigeben."
    - key: apicius
      source: en-GB
      text:
        en-GB: "Caraway appears as a recipe ingredient in the Roman cookbook Apicius, and the English word caraway dates back to at least 1440."
        de-AT: "Kümmel taucht schon im römischen Kochbuch des Apicius als Zutat auf, und das englische Wort caraway ist seit mindestens 1440 belegt."

- ingredient: coriander_seed
  articles:
    en-GB: {title: "Coriander", revision: 1388132118}
    de-AT: {title: "Echter Koriander", revision: 271004346}
  facts:
    - key: soap-gene
      source: en-GB
      text:
        en-GB: "Because of variations in the gene OR6A2, some people find coriander tastes of soap rather than fresh citrus."
        de-AT: "Wegen Varianten im Gen OR6A2 schmeckt Koriander für manche Menschen nach Seife statt frisch und zitronig."
    - key: all-edible
      source: en-GB
      text:
        en-GB: "Every part of the coriander plant is edible, but cooks mostly use the fresh leaves and the dried seeds."
        de-AT: "Alle Teile der Korianderpflanze sind essbar. In der Küche verwendet man aber meist die frischen Blätter und die getrockneten Samen."

- ingredient: turmeric
  articles:
    en-GB: {title: "Turmeric", revision: 1383649109}
    de-AT: {title: "Kurkuma", revision: 270673389}
  facts:
    - key: ginger-family
      source: en-GB
      text:
        en-GB: "Turmeric is a relative of ginger. Its rhizomes are boiled, dried and ground into the orange-yellow powder that colours curry powder."
        de-AT: "Kurkuma ist mit dem Ingwer verwandt. Die Wurzelstöcke werden gekocht, getrocknet und zu dem orangegelben Pulver gemahlen, das Currypulver färbt."
    - key: gelbwurz
      source: de-AT
      text:
        en-GB: "In German turmeric has many nicknames, such as Gelber Ingwer, Safranwurz and Gelbwurz, all pointing to its intensely yellow rhizome."
        de-AT: "Kurkuma hat viele Beinamen wie Gelber Ingwer, Safranwurz oder Gelbwurz, die alle auf den intensiv gelben Wurzelstock anspielen."

- ingredient: curry
  articles:
    en-GB: {title: "Curry powder", revision: 1388142966}
    de-AT: {title: "Curry (Gewürz)", revision: 264181176}
  facts:
    - key: sorlie-1784
      source: en-GB
      text:
        en-GB: "The first commercial curry powder was sold by Sorlie's Perfumery in London in 1784."
        de-AT: "Das erste kommerzielle Currypulver verkaufte 1784 Sorlie's Perfumery in London."
    - key: not-indian
      source: de-AT
      text:
        en-GB: "Curry powder was created in 19th-century Britain, modelled on Indian curries, and is hardly used in Indian cooking itself."
        de-AT: "Currypulver entstand im 19. Jahrhundert in Großbritannien nach dem Vorbild indischer Gerichte. In der indischen Küche selbst ist es kaum gebräuchlich."

- ingredient: cinnamon
  articles:
    en-GB: {title: "Cinnamon", revision: 1387931047}
    de-AT: {title: "Zimt", revision: 268365341}
  facts:
    - key: cassia
      source: en-GB
      text:
        en-GB: "Only Ceylon cinnamon counts as \"true cinnamon\"; most cinnamon in international trade is really cassia from four other Cinnamomum species."
        de-AT: "Nur Ceylon-Zimt gilt als „echter Zimt“. Der meiste Zimt im Welthandel ist eigentlich Cassia von vier anderen Zimtbaumarten."
    - key: cinnamaldehyde
      source: en-GB
      text:
        en-GB: "Cinnamon is the inner bark of trees of the laurel family, and its typical aroma comes mainly from an essential oil compound called cinnamaldehyde."
        de-AT: "Zimt ist die innere Rinde von Bäumen aus der Familie der Lorbeergewächse. Sein typisches Aroma stammt vor allem aus dem ätherischen Öl Zimtaldehyd."

- ingredient: cinnamon_stick
  articles:
    en-GB: {title: "Cinnamomum verum", revision: 1380696488}
    de-AT: {title: "Ceylon-Zimtbaum", revision: 270615630}
  facts:
    - key: bush-harvest
      source: en-GB
      text:
        en-GB: "Cultivated cinnamon trees are kept as bushes of at most 3 m. They are first cut at three years old and keep producing well for 40 to 50 years."
        de-AT: "Im Anbau hält man Zimtbäume als Büsche von höchstens 3 m. Mit drei Jahren werden die Bäume erstmals geschnitten und liefern dann 40 bis 50 Jahre lang gut."
    - key: quill-grades
      source: en-GB
      text:
        en-GB: "Sri Lanka grades cinnamon sticks, called quills, by diameter and number per kilogram; pieces shorter than 106 mm are sold as quillings."
        de-AT: "Sri Lanka sortiert Zimtstangen nach Durchmesser und Anzahl pro Kilogramm. Stücke unter 106 mm Länge werden als Bruchware verkauft."

- ingredient: nutmeg
  articles:
    en-GB: {title: "Nutmeg", revision: 1385504495}
    de-AT: {title: "Muskatnussbaum", revision: 272393707}
  facts:
    - key: mace
      source: en-GB
      text:
        en-GB: "One fruit gives two spices: nutmeg is the seed, and mace is the lacy covering around it."
        de-AT: "Eine Frucht liefert zwei Gewürze: Die Muskatnuss ist der Samen, die Macis (Muskatblüte) der Samenmantel darum herum."
    - key: banda
      source: en-GB
      text:
        en-GB: "The true nutmeg tree is native to the Banda Islands in Indonesia, which are still the main producer of nutmeg and mace."
        de-AT: "Der echte Muskatnussbaum stammt von den Banda-Inseln in Indonesien, die bis heute Hauptproduzent von Muskat und Macis sind."
    - key: musk-nut
      source: de-AT
      text:
        en-GB: "The name nutmeg, Muskatnuss in German, goes back to Medieval Latin nux muscata, \"nut smelling of musk\"."
        de-AT: "Der Name Muskatnuss geht über altfranzösisch noix muscat auf mittellateinisch nux muscata zurück, „nach Moschus duftende Nuss“."

- ingredient: cloves
  articles:
    en-GB: {title: "Clove", revision: 1386942024}
    de-AT: {title: "Gewürznelkenbaum", revision: 268526721}
  facts:
    - key: flower-buds
      source: en-GB
      text:
        en-GB: "Cloves are the dried flower buds of a tree of the myrtle family, native to the Maluku Islands of Indonesia."
        de-AT: "Gewürznelken sind die getrockneten Blütenknospen eines Baums aus der Familie der Myrtengewächse, der von den Molukken in Indonesien stammt."
    - key: little-nails
      source: de-AT
      text:
        en-GB: "The German Nelke comes from Middle High German negelein, \"little nail\", after the nail-like shape of the stalked bud, just like French clou de girofle."
        de-AT: "Das Wort Nelke kommt von mittelhochdeutsch negelein, „Nägelchen“, wegen der nagelartigen Form der Knospe. Auch im Französischen heißt sie clou, Nagel."

- ingredient: allspice
  articles:
    en-GB: {title: "Allspice", revision: 1383349909}
    de-AT: {title: "Piment", revision: 264994758}
  facts:
    - key: 1621-name
      source: en-GB
      text:
        en-GB: "The English coined the name allspice as early as 1621 because it seemed to combine cinnamon, nutmeg and clove. It is a single berry, not a spice mix."
        de-AT: "Die Engländer prägten den Namen allspice schon 1621, weil es nach Zimt, Muskat und Nelke zugleich schmeckt. Es ist aber eine einzelne Beere, keine Mischung."
    - key: neugewuerz
      source: de-AT
      text:
        en-GB: "In German allspice is also called Neugewürz, \"new spice\", because it came from the New World, as well as Nelkenpfeffer and Jamaikapfeffer."
        de-AT: "Piment heißt auch Neugewürz, weil es aus der Neuen Welt kam, außerdem Nelkenpfeffer oder Jamaikapfeffer."

- ingredient: cardamom
  articles:
    en-GB: {title: "Cardamom", revision: 1387947029}
    de-AT: {title: "Kardamom", revision: 269396554}
  facts:
    - key: sumer
      source: en-GB
      text:
        en-GB: "The earliest references to cardamom are found in Sumer and in Ayurveda. Today it is grown mainly in India, Indonesia and Guatemala."
        de-AT: "Die frühesten Erwähnungen von Kardamom stammen aus Sumer und dem Ayurveda. Heute wird er vor allem in Indien, Indonesien und Guatemala angebaut."
    - key: nordic-baking
      source: en-GB
      text:
        en-GB: "Green cardamom is one of the most expensive spices by weight, and it is a fixture of Nordic baking, from Swedish cardamom buns to Finnish pulla."
        de-AT: "Grüner Kardamom zählt nach Gewicht zu den teuersten Gewürzen und gehört fix zum nordischen Backen, von schwedischen Kardamomschnecken bis zum finnischen Pulla."

- ingredient: ginger_ground
  articles:
    en-GB: {title: "Ginger", revision: 1375500055}
    de-AT: {title: "Ingwer", revision: 271935940}
  facts:
    - key: austronesian
      source: en-GB
      text:
        en-GB: "Ginger came from Maritime Southeast Asia and was probably first domesticated by Austronesian peoples, who carried it across the Indo-Pacific as far as Hawaii."
        de-AT: "Ingwer stammt aus dem maritimen Südostasien und wurde wohl zuerst von austronesischen Völkern kultiviert, die ihn über den Indopazifik bis Hawaii brachten."
    - key: early-export
      source: en-GB
      text:
        en-GB: "Ginger was one of the first spices exported from Asia and was already used by the ancient Greeks and Romans."
        de-AT: "Ingwer war eines der ersten Gewürze, die aus Asien exportiert wurden, und schon die alten Griechen und Römer verwendeten ihn."

- ingredient: garlic_powder
  articles:
    en-GB: {title: "Garlic powder", revision: 1337502774}
  facts:
    - key: dehydration
      source: en-GB
      text:
        en-GB: "To make garlic powder, sliced cloves are usually heated to 150 to 160 °C until only about 6.5 per cent moisture is left, then milled."
        de-AT: "Für Knoblauchpulver werden die Zehen in Scheiben meist auf 150 bis 160 °C erhitzt, bis nur noch etwa 6,5 Prozent Feuchtigkeit übrig sind, und dann gemahlen."
    - key: seasoned-salt
      source: en-GB
      text:
        en-GB: "Garlic powder is a standard part of many spice mixes and of seasoned salt."
        de-AT: "Knoblauchpulver steckt in vielen Gewürzmischungen und in Würzsalz."

- ingredient: onion_powder
  articles:
    en-GB: {title: "Onion powder", revision: 1378755506}
    de-AT: {title: "Zwiebel", revision: 271890166}
  facts:
    - key: toasted
      source: en-GB
      text:
        en-GB: "Onion powder can be made from white, yellow or red onions, and some varieties are made from toasted onion."
        de-AT: "Zwiebelpulver kann aus weißen, gelben oder roten Zwiebeln bestehen, manche Sorten werden aus gerösteten Zwiebeln gemacht."
    - key: der-zwiebel
      source: de-AT
      text:
        en-GB: "The onion is one of the oldest cultivated plants. In Austria, Bavaria and Swabia people may also say der Zwiebel instead of die Zwiebel."
        de-AT: "Die Zwiebel ist eine der ältesten Kulturpflanzen. In Österreich, Bayern und Schwaben sagt man auch der Zwiebel statt die Zwiebel."

- ingredient: dried_basil
  articles:
    en-GB: {title: "Basil", revision: 1375753314}
    de-AT: {title: "Basilikum", revision: 272121653}
  facts:
    - key: royal-plant
      source: en-GB
      text:
        en-GB: "Basil comes from Greek basilikon phyton, \"royal plant\", perhaps because it was thought to be used in royal perfumes."
        de-AT: "Basilikum kommt vom griechischen basilikon phyton, „königliche Pflanze“, vielleicht weil man es für königliche Duftöle verwendet haben soll."
    - key: tropical-asia
      source: en-GB
      text:
        en-GB: "Basil is native to tropical Asia and Australasia, from India to northern Australia, and in temperate climates it is grown as an annual."
        de-AT: "Basilikum stammt aus dem tropischen Asien und Australasien, von Indien bis Nordaustralien. In gemäßigten Breiten zieht man es als einjährige Pflanze."

- ingredient: dried_thyme
  articles:
    en-GB: {title: "Thymus vulgaris", revision: 1386524232}
    de-AT: {title: "Echter Thymian", revision: 261537713}
  facts:
    - key: vulgaris
      source: en-GB
      text:
        en-GB: "The species name vulgaris means \"common\" in the sense of widespread. Garden thyme is native to southern Europe, from the western Mediterranean to southern Italy."
        de-AT: "Der Artname vulgaris bedeutet „gewöhnlich“ im Sinne von weit verbreitet. Echter Thymian stammt aus Südeuropa, vom westlichen Mittelmeer bis Süditalien."
    - key: kuttelkraut
      source: de-AT
      text:
        en-GB: "Old German names for thyme include Römischer Quendel and Kuttelkraut, \"tripe herb\"."
        de-AT: "Alte deutsche Namen für Thymian sind Römischer Quendel und Kuttelkraut."

- ingredient: dried_rosemary
  articles:
    en-GB: {title: "Rosemary", revision: 1388091849}
    de-AT: {title: "Rosmarin", revision: 271444995}
  facts:
    - key: now-salvia
      source: en-GB
      text:
        en-GB: "Botanists now place rosemary in the sage genus as Salvia rosmarinus; its old name Rosmarinus officinalis is a synonym."
        de-AT: "Botanisch gehört Rosmarin heute zur Gattung Salbei und heißt Salvia rosmarinus, der alte Name Rosmarinus officinalis gilt nur noch als Synonym."
    - key: mediterranean
      source: en-GB
      text:
        en-GB: "Rosemary is an evergreen shrub from the Mediterranean with needle-like leaves and purple, sometimes white, pink or blue flowers."
        de-AT: "Rosmarin ist ein immergrüner Strauch aus dem Mittelmeerraum mit nadelartigen Blättern und violetten, manchmal weißen, rosa oder blauen Blüten."

- ingredient: dried_oregano
  articles:
    en-GB: {title: "Oregano", revision: 1387896742}
    de-AT: {title: "Oregano", revision: 271179153}
  facts:
    - key: wild-marjoram
      source: en-GB
      text:
        en-GB: "Oregano is sometimes called wild marjoram and is a close relative of sweet marjoram, both in the genus Origanum."
        de-AT: "Oregano heißt auch Wilder Majoran und ist ein enger Verwandter des Majorans, beide gehören zur Gattung Dost."
    - key: dost
      source: de-AT
      text:
        en-GB: "The German name for oregano is Echter Dost, and folk names include Wohlgemut and Müllerkraut."
        de-AT: "Der deutsche Name für Oregano ist Echter Dost, volkstümlich heißt er auch Wohlgemut oder Müllerkraut."

- ingredient: saffron
  articles:
    en-GB: {title: "Saffron", revision: 1387121727}
    de-AT: {title: "Safran", revision: 272313783}
  facts:
    - key: 150-flowers
      source: en-GB
      text:
        en-GB: "Roughly 150 crocus flowers give just one gram of dried saffron threads, which is why the spice is so expensive."
        de-AT: "Rund 150 Krokusblüten ergeben gerade einmal ein Gramm getrocknete Safranfäden, daher ist das Gewürz so teuer."
    - key: nuremberg
      source: en-GB
      text:
        en-GB: "Saffron fraud was first documented in medieval Europe: in Nuremberg people caught selling adulterated saffron were executed under the Safranschou code."
        de-AT: "Safranfälschung ist seit dem Mittelalter belegt. In Nürnberg wurden Händler, die gestreckten Safran verkauften, nach der Safranschau hingerichtet."
    - key: sterile-triploid
      source: de-AT
      text:
        en-GB: "The saffron crocus is a sterile triploid mutant of a wild Aegean crocus, so it sets no seed and can only be propagated by dividing its corms."
        de-AT: "Der Safrankrokus ist eine unfruchtbare triploide Mutante eines Krokus der Ägäis. Er bildet keine Samen und lässt sich nur über Knollenteilung vermehren."

- ingredient: stock_cube
  articles:
    en-GB: {title: "Bouillon cube", revision: 1385192643}
    de-AT: {title: "Brühwürfel", revision: 257811146}
  facts:
    - key: maggi-oxo-knorr
      source: en-GB
      text:
        en-GB: "Industrial stock cubes were launched by Maggi in 1908, Oxo in 1910 and Knorr in 1912, and by 1913 at least ten brands were on sale."
        de-AT: "Industrielle Suppenwürfel brachten Maggi 1908, Oxo 1910 und Knorr 1912 heraus, und 1913 gab es bereits mindestens zehn Marken."
    - key: portable-soup
      source: en-GB
      text:
        en-GB: "The stock cube's ancestor was portable soup, a dried soup that seafarers and explorers carried in the 18th and 19th centuries because it kept for months."
        de-AT: "Vorläufer des Suppenwürfels war die „Portable Soup“, eine getrocknete Suppe, die Seefahrer und Entdecker im 18. und 19. Jahrhundert mitnahmen, weil sie monatelang hielt."
    - key: suppenwuerfel
      source: de-AT
      text:
        en-GB: "The cube has many names: Brühwürfel, Suppenwürfel in Germany and Austria, Bouillonwürfel in Switzerland, or simply Maggiwürfel."
        de-AT: "Der Würfel hat viele Namen: Brühwürfel, in Österreich und Deutschland Suppenwürfel, in der Schweiz Bouillonwürfel, oder einfach Maggiwürfel."

- ingredient: vegetable_stock
  articles:
    en-GB: {title: "Stock (food)", revision: 1379635072}
    de-AT: {title: "Brühe", revision: 268492993}
  facts:
    - key: mirepoix-scraps
      source: en-GB
      text:
        en-GB: "Stock is a good use for vegetable scraps such as carrot peel and celery cores, because all the solids are strained out at the end."
        de-AT: "Für Suppe eignen sich auch Gemüsereste wie Karottenschalen oder Selleriestrünke, weil am Ende ohnehin alles abgeseiht wird."
    - key: brueeje
      source: de-AT
      text:
        en-GB: "The German word Brühe comes from Middle High German brüeje, \"hot liquid\", and an older word for it is Sud."
        de-AT: "Das Wort Brühe kommt vom mittelhochdeutschen brüeje, „heiße Flüssigkeit“. Ein anderes Wort dafür ist Sud."

- ingredient: chicken_stock
  articles:
    en-GB: {title: "Chicken soup", revision: 1387593751}
    de-AT: {title: "Hühnersuppe", revision: 272001468}
  facts:
    - key: jewish-penicillin
      source: en-GB
      text:
        en-GB: "Chicken soup is a traditional dish of the European Jewish kitchen and is nicknamed \"Jewish penicillin\"."
        de-AT: "Hühnersuppe ist ein traditionelles Gericht der europäisch-jüdischen Küche und trägt den Spitznamen „jüdisches Penicillin“."
    - key: bones
      source: en-GB
      text:
        en-GB: "Russian and Polish Jewish communities make their chicken soup with a high share of stock cooked mostly from the bones."
        de-AT: "Russische und polnische jüdische Gemeinden kochen ihre Hühnersuppe mit viel Fond, der vor allem aus den Knochen gezogen wird."

- ingredient: beef_stock
  articles:
    en-GB: {title: "Broth", revision: 1380387116}
    de-AT: {title: "Brühe", revision: 268492993}
  facts:
    - key: james-beard
      source: en-GB
      text:
        en-GB: "Cooks disagree on the difference between stock and broth. In 1974 the American cook James Beard declared that stock, broth and bouillon \"are all the same thing\"."
        de-AT: "Über den Unterschied zwischen Fond und Brühe streiten Köche. Der Amerikaner James Beard erklärte 1974, Fond, Brühe und Bouillon seien „alles dasselbe“."
    - key: bouillon-meat
      source: de-AT
      text:
        en-GB: "In Germany and Austria the word Bouillon is used only for broth cooked from meat and bones of beef, veal, lamb or poultry."
        de-AT: "In Deutschland und Österreich nennt man nur eine aus Fleisch und Knochen von Rind, Kalb, Lamm oder Geflügel gekochte Brühe Bouillon."

- ingredient: soy_sauce
  articles:
    en-GB: {title: "Soy sauce", revision: 1387321797}
    de-AT: {title: "Sojasauce", revision: 272095521}
  facts:
    - key: western-han
      source: en-GB
      text:
        en-GB: "Soy sauce in its current form was created about 2,200 years ago during the Western Han dynasty in China."
        de-AT: "Sojasauce in ihrer heutigen Form entstand vor etwa 2.200 Jahren während der Westlichen Han-Dynastie in China."
    - key: dutch-barrels
      source: en-GB
      text:
        en-GB: "In 1737 the Dutch East India Company shipped 75 large barrels of soy sauce from Dejima in Japan to Batavia, and 35 of them went on to the Netherlands."
        de-AT: "1737 verschiffte die Niederländische Ostindien-Kompanie 75 große Fässer Sojasauce von Dejima in Japan nach Batavia, 35 davon gingen weiter in die Niederlande."
    - key: buddhism
      source: en-GB
      text:
        en-GB: "Soy sauce reached Japan in the 7th century with Buddhist practitioners from China, who also brought vegetarianism. There it became shoyu."
        de-AT: "Nach Japan kam Sojasauce im 7. Jahrhundert mit Buddhisten aus China, die auch den Vegetarismus mitbrachten. Dort heißt sie Shoyu."

- ingredient: fish_sauce
  articles:
    en-GB: {title: "Fish sauce", revision: 1386942554}
    de-AT: {title: "Fischsauce", revision: 266957796}
  facts:
    - key: two-years
      source: en-GB
      text:
        en-GB: "Fish sauce is made by coating fish or krill in salt and letting them ferment, sometimes for as long as two years."
        de-AT: "Für Fischsauce werden Fische oder Krill eingesalzen und fermentiert, manchmal bis zu zwei Jahre lang."
    - key: ancient-china
      source: en-GB
      text:
        en-GB: "Sauces of fermented fish mixed with meat and soybeans were already recorded in China about 2,300 years ago."
        de-AT: "Schon vor rund 2.300 Jahren sind in China Saucen aus fermentiertem Fisch mit Fleisch und Sojabohnen belegt."

- ingredient: oyster_sauce
  articles:
    en-GB: {title: "Oyster sauce", revision: 1370096377}
    de-AT: {title: "Austernsauce (Würzsauce)", revision: 255585955}
  facts:
    - key: 1870s-basins
      source: en-GB
      text:
        en-GB: "Oyster sauce was being made in China by the mid-1870s: oysters were boiled in iron basins and the cooking water was reduced to a blackish sauce."
        de-AT: "Austernsauce wurde in China spätestens Mitte der 1870er hergestellt: Man kochte Austern in Eisenbecken und dickte das Kochwasser zu einer schwärzlichen Sauce ein."
    - key: caramelised
      source: en-GB
      text:
        en-GB: "Original oyster sauce got its thickness from caramelising unrefined sugar, while most modern versions are thickened with corn starch."
        de-AT: "Ursprünglich wurde Austernsauce durch karamellisierten Rohzucker dick, die meisten heutigen Sorten bindet man mit Maisstärke."

- ingredient: worcestershire
  articles:
    en-GB: {title: "Worcestershire sauce", revision: 1386426932}
    de-AT: {title: "Worcestershiresauce", revision: 270765379}
  facts:
    - key: forgotten-barrel
      source: en-GB
      text:
        en-GB: "According to company lore, the first batch of Lea & Perrins sauce was so strong it was left in the cellar; tasted some 18 months later, it had mellowed."
        de-AT: "Der Firmenlegende nach war die erste Mischung von Lea & Perrins so scharf, dass das Fass im Keller vergessen wurde. Rund 18 Monate später schmeckte die Sauce plötzlich mild."
    - key: generic-1876
      source: en-GB
      text:
        en-GB: "Worcestershire sauce has been a generic name since 1876, when the High Court ruled that Lea & Perrins held no trademark on the word Worcestershire."
        de-AT: "Seit 1876 darf jeder seine Sauce Worcestershiresauce nennen: Damals entschied der High Court, dass Lea & Perrins keine Markenrechte am Namen besitzt."

- ingredient: sriracha
  articles:
    en-GB: {title: "Sriracha", revision: 1388133651}
    de-AT: {title: "Sriracha-Sauce", revision: 261875300}
  facts:
    - key: si-racha-1932
      source: en-GB
      text:
        en-GB: "Sriracha is named after the Thai town of Si Racha, where commercial production of the sauce began in 1932."
        de-AT: "Sriracha ist nach der thailändischen Stadt Si Racha benannt, wo die Sauce 1932 erstmals gewerblich hergestellt wurde."
    - key: rooster-sauce
      source: en-GB
      text:
        en-GB: "In the US sriracha usually means the jalapeño sauce from Huy Fong Foods, first made in the early 1980s for pho restaurants and nicknamed rooster sauce."
        de-AT: "In den USA meint man mit Sriracha meist die Jalapeño-Sauce von Huy Fong Foods, Anfang der 1980er für Pho-Lokale entwickelt und nach dem Etikett „Rooster Sauce“ genannt."

- ingredient: ketchup
  articles:
    en-GB: {title: "Ketchup", revision: 1382238274}
    de-AT: {title: "Ketchup", revision: 271999197}
  facts:
    - key: mease-1812
      source: en-GB
      text:
        en-GB: "The first known recipe for tomato ketchup was published by James Mease in 1812; earlier ketchups were made from mushrooms, oysters, mussels or walnuts."
        de-AT: "Das erste bekannte Rezept für Paradeiserketchup veröffentlichte James Mease 1812. Frühere Ketchups machte man aus Pilzen, Austern, Muscheln oder Walnüssen."
    - key: ripe-tomatoes
      source: en-GB
      text:
        en-GB: "Before Heinz, commercial ketchups were thin and watery, partly because they were made from unripe tomatoes that contain little pectin."
        de-AT: "Vor Heinz waren Ketchups aus dem Handel dünn und wässrig, auch weil sie aus unreifen Paradeisern mit wenig Pektin gemacht wurden."

- ingredient: mustard
  articles:
    en-GB: {title: "Mustard (condiment)", revision: 1383632101}
    de-AT: {title: "Senf", revision: 272407208}
  facts:
    - key: cold-water-hot
      source: en-GB
      text:
        en-GB: "Mustard mixed with cold water turns out hotter than mustard made with hot water, and the heat of a prepared mustard fades over time."
        de-AT: "Mit kaltem Wasser angerührter Senf wird schärfer als mit heißem Wasser angerührter, und die Schärfe eines fertigen Senfs lässt mit der Zeit nach."
    - key: mustum
      source: en-GB
      text:
        en-GB: "The word mustard goes back to Latin mustum, grape must, which the Romans mixed with ground mustard seeds into a paste."
        de-AT: "Das englische Wort „mustard“ geht auf das lateinische „mustum“ zurück, den Traubenmost, den die Römer mit gemahlenen Senfkörnern zu einer Paste mischten."

- ingredient: dijon
  articles:
    en-GB: {title: "Dijon mustard", revision: 1381203343}
    de-AT: {title: "Dijon-Senf", revision: 266475821}
  facts:
    - key: verjuice-1856
      source: en-GB
      text:
        en-GB: "Dijon mustard got its modern form in 1856, when Jean Naigeon of Dijon swapped the usual vinegar for verjuice, the sour juice of unripe grapes."
        de-AT: "Seine heutige Form bekam der Dijonsenf 1856, als Jean Naigeon aus Dijon den üblichen Essig durch Verjus ersetzte, den sauren Saft unreifer Trauben."
    - key: canadian-seed
      source: en-GB
      text:
        en-GB: "Making Dijon mustard in France takes about 35,000 tonnes of mustard seed, and 80 per cent of it is imported from Canada."
        de-AT: "Für Dijonsenf braucht Frankreich rund 35.000 Tonnen Senfsaat, und 80 Prozent davon werden aus Kanada eingeführt."

- ingredient: mayonnaise
  articles:
    en-GB: {title: "Mayonnaise", revision: 1383937711}
    de-AT: {title: "Mayonnaise", revision: 271927391}
  facts:
    - key: mahon-1756
      source: en-GB
      text:
        en-GB: "A popular theory links mayonnaise to Mahón on Menorca, taken by the Duke of Richelieu in 1756, and some authors still spell it mahonnaise."
        de-AT: "Eine verbreitete Theorie führt die Mayonnaise auf Mahón auf Menorca zurück, das der Herzog von Richelieu 1756 eroberte. Manche schreiben deshalb noch „Mahonnaise“."
    - key: emulsion
      source: en-GB
      text:
        en-GB: "Mayonnaise is an emulsion of oil, egg yolk and an acid such as vinegar or lemon juice, and the name first appears in French in 1806."
        de-AT: "Mayonnaise ist eine Emulsion aus Öl, Eidotter und Säure wie Essig oder Zitronensaft. Der Name taucht im Französischen erstmals 1806 auf."

- ingredient: spirit_vinegar
  articles:
    en-GB: {title: "Vinegar", revision: 1383909103}
    de-AT: {title: "Essig", revision: 268898971}
  facts:
    - key: misnomer
      source: en-GB
      text:
        en-GB: "Distilled vinegar is not made by distilling vinegar: it is made by fermenting distilled alcohol with acetic acid bacteria."
        de-AT: "Branntweinessig entsteht nicht durch Destillieren von Essig, sondern indem man destillierten Alkohol mit Essigsäurebakterien vergärt."
    - key: babylon
      source: en-GB
      text:
        en-GB: "The first documented evidence of making and using vinegar comes from the ancient Babylonians, around 3000 BC."
        de-AT: "Die ältesten Belege für die Herstellung und Verwendung von Essig stammen von den Babyloniern um 3000 v. Chr."

- ingredient: malt_vinegar
  articles:
    en-GB: {title: "Vinegar", revision: 1383909103}
    de-AT: {title: "Essig", revision: 268898971}
  facts:
    - key: alegar
      source: en-GB
      text:
        en-GB: "Malt vinegar developed in late medieval England, where it was first known as alegar, since it is made by letting a brewed ale turn sour."
        de-AT: "Malzessig entstand im spätmittelalterlichen England und hieß dort zuerst „alegar“, denn man lässt dafür ein gebrautes Ale sauer werden."
    - key: fish-and-chips
      source: en-GB
      text:
        en-GB: "Malt vinegar, together with salt, is the traditional seasoning for fish and chips in Britain."
        de-AT: "Malzessig ist in Großbritannien zusammen mit Salz die klassische Würze für Fish and Chips."

- ingredient: vinegar
  articles:
    en-GB: {title: "Vinegar", revision: 1383909103}
    de-AT: {title: "Essig", revision: 268898971}
  facts:
    - key: sour-wine
      source: en-GB
      text:
        en-GB: "The word vinegar comes from Old French vyn egre, meaning sour wine, from Latin vinum, wine, and acer, sour."
        de-AT: "Das englische Wort „vinegar“ kommt vom altfranzösischen „vyn egre“, saurer Wein, aus lateinisch „vinum“ für Wein und „acer“ für sauer."
    - key: orleans
      source: en-GB
      text:
        en-GB: "In the late Middle Ages the French city of Orléans became famous for its wine vinegar, and its slow method of fermenting and ageing is still called the Orléans process."
        de-AT: "Im Spätmittelalter wurde die französische Stadt Orléans für ihren Weinessig berühmt. Das dortige langsame Gär- und Reifeverfahren heißt bis heute Orléans-Verfahren."

- ingredient: apple_vinegar
  articles:
    en-GB: {title: "Apple cider vinegar", revision: 1385183535}
    de-AT: {title: "Apfelessig", revision: 261013032}
  facts:
    - key: two-fermentations
      source: en-GB
      text:
        en-GB: "Cider vinegar takes two fermentations: yeast first turns the apple juice sugars into alcohol, then Acetobacter bacteria turn that alcohol into acetic acid."
        de-AT: "Apfelessig entsteht in zwei Gärungen: Zuerst macht Hefe aus dem Zucker im Apfelsaft Alkohol, dann verwandeln Acetobacter-Bakterien den Alkohol in Essigsäure."
    - key: cookbook-1810
      source: en-GB
      text:
        en-GB: "A cookbook from 1810 already gives recipes for apple cider vinegar alongside gooseberry and raisin vinegar."
        de-AT: "Ein Kochbuch von 1810 enthält bereits Rezepte für Apfelessig, dazu Essig aus Stachelbeeren und aus Rosinen."

- ingredient: balsamic
  articles:
    en-GB: {title: "Balsamic vinegar", revision: 1379915431}
    de-AT: {title: "Aceto balsamico", revision: 268807325}
  facts:
    - key: labels
      source: en-GB
      text:
        en-GB: "Traditional balsamic vinegar from Reggio Emilia is graded by label colour: red for at least 12 years of ageing, silver for 18 and gold for 25 or more."
        de-AT: "Traditioneller Aceto balsamico aus Reggio Emilia trägt je nach Reifezeit ein farbiges Etikett: rot ab 12 Jahren, silber ab 18 und gold ab 25 Jahren."
    - key: barrel-battery
      source: en-GB
      text:
        en-GB: "Traditional balsamic vinegar is aged in a row of ever smaller barrels made from different woods, such as chestnut, cherry, oak, mulberry, ash and juniper."
        de-AT: "Traditioneller Aceto balsamico reift in einer Reihe immer kleinerer Fässer aus verschiedenen Hölzern, etwa Kastanie, Kirsche, Eiche, Maulbeere, Esche und Wacholder."

- ingredient: red_wine_vinegar
  articles:
    en-GB: {title: "Vinegar", revision: 1383909103}
    de-AT: {title: "Essig", revision: 268898971}
  facts:
    - key: central-europe
      source: en-GB
      text:
        en-GB: "Wine vinegar, made from red or white wine, is the most commonly used vinegar in Southern and Central Europe."
        de-AT: "Weinessig aus Rot- oder Weißwein ist in Süd- und Mitteleuropa der am häufigsten verwendete Essig."
    - key: wood-shavings
      source: de-AT
      text:
        en-GB: "Sebastian Karl Schüzenbach introduced the quick vinegar method, in which the bacteria settle on floating carriers, usually wood shavings, to get more air."
        de-AT: "Sebastian Karl Schüzenbach führte das Schnellessigverfahren ein: Die Essigbakterien siedeln sich dabei auf einem schwimmenden Trägermaterial an, meist Holzspänen, und bekommen so mehr Luft."

- ingredient: pesto
  articles:
    en-GB: {title: "Pesto", revision: 1387714525}
    de-AT: {title: "Pesto", revision: 270129179}
  facts:
    - key: to-pound
      source: en-GB
      text:
        en-GB: "The name pesto comes from the Genoese verb pestâ, to pound or crush, because the ingredients are ground in a marble mortar with a wooden pestle."
        de-AT: "Der Name Pesto kommt vom genuesischen Verb „pestâ“, zerstoßen, denn die Zutaten werden im Marmormörser mit einem Holzstößel zerrieben."
    - key: basil-1850s
      source: en-GB
      text:
        en-GB: "Basil, the main ingredient of modern pesto, is only documented in the sauce from the 1850s; medieval Genoa preferred agliata, a mash of garlic and walnuts."
        de-AT: "Basilikum ist im Pesto erst ab den 1850er-Jahren belegt. Im mittelalterlichen Genua aß man lieber Agliata, eine Paste aus Knoblauch und Walnüssen."

- ingredient: miso
  articles:
    en-GB: {title: "Miso", revision: 1387470153}
    de-AT: {title: "Miso", revision: 269940320}
  facts:
    - key: muromachi-monks
      source: en-GB
      text:
        en-GB: "Until the Muromachi period (1337 to 1573), miso was made from unground soybeans; Buddhist monks then found the beans could be ground into a paste."
        de-AT: "Bis in die Muromachi-Zeit (1337 bis 1573) machte man Miso aus ungemahlenen Sojabohnen. Dann entdeckten buddhistische Mönche, dass man sie zu einer Paste mahlen kann."
    - key: red-miso
      source: en-GB
      text:
        en-GB: "Red miso is aged, sometimes for more than a year, and the Maillard reaction slowly turns it from white to red or even black."
        de-AT: "Rotes Miso reift lange, manchmal über ein Jahr. Durch die Maillard-Reaktion färbt es sich dabei langsam von weiß über rot bis schwarz."

- ingredient: juniper_berries
  articles:
    en-GB: {title: "Juniper berry", revision: 1372093728}
    de-AT: {title: "Gemeiner Wacholder", revision: 271443512}
  facts:
    - key: not-a-berry
      source: en-GB
      text:
        en-GB: "A juniper berry is not a berry at all but a female seed cone whose scales stay fleshy and fuse together, making it one of the few spices from a conifer."
        de-AT: "Die Wacholderbeere ist gar keine Beere, sondern ein weiblicher Zapfen, dessen Schuppen fleischig bleiben und verwachsen. Damit ist sie eines der wenigen Gewürze von einem Nadelbaum."
    - key: 18-months
      source: en-GB
      text:
        en-GB: "Common juniper berries take about 18 months to ripen from green to purple-black; gin uses the unripe green ones, the kitchen mostly the dark ripe ones."
        de-AT: "Wacholderbeeren brauchen etwa 18 Monate, um von grün zu schwarzviolett zu reifen. Für Gin nimmt man die unreifen grünen, in der Küche meist die dunklen reifen."

- ingredient: star_anise
  articles:
    en-GB: {title: "Illicium verum", revision: 1380486495}
    de-AT: {title: "Echter Sternanis", revision: 270339634}
  facts:
    - key: tamiflu
      source: en-GB
      text:
        en-GB: "Until 2012 the drug maker Roche used up to 90 per cent of the world's star anise harvest to make the flu medicine Tamiflu via shikimic acid."
        de-AT: "Bis 2012 verbrauchte der Pharmakonzern Roche bis zu 90 Prozent der weltweiten Sternanisernte, um über Shikimisäure das Grippemittel Tamiflu herzustellen."
    - key: eight-horns
      source: en-GB
      text:
        en-GB: "The alternative name badian probably comes, through French badiane, from the Chinese name bajiao, meaning eight horns, after the star-shaped fruit."
        de-AT: "Der andere Name Badian kommt vermutlich über das französische „badiane“ vom chinesischen „bajiao“, acht Hörner, nach der sternförmigen Frucht."

- ingredient: mace
  articles:
    en-GB: {title: "Nutmeg", revision: 1385504495}
    de-AT: {title: "Macis", revision: 267233668}
  facts:
    - key: aril
      source: en-GB
      text:
        en-GB: "Mace is the crimson covering, or aril, around the nutmeg seed; it is peeled off, flattened and dried for 10 to 14 days."
        de-AT: "Muskatblüte ist der karminrote Samenmantel um die Muskatnuss. Man löst ihn ab, drückt ihn flach und trocknet ihn 10 bis 14 Tage lang."
    - key: banda-islands
      source: en-GB
      text:
        en-GB: "The true nutmeg tree, source of both nutmeg and mace, is native to the Banda Islands in Indonesia, which are still the main producer of both."
        de-AT: "Der Muskatnussbaum, von dem Muskatnuss und Muskatblüte stammen, ist auf den Banda-Inseln in Indonesien heimisch. Die Inseln sind bis heute der Hauptlieferant."

- ingredient: fennel_seed
  articles:
    en-GB: {title: "Fennel", revision: 1381053442}
    de-AT: {title: "Fenchel", revision: 269375366}
  facts:
    - key: anethole
      source: en-GB
      text:
        en-GB: "Fennel seeds taste of liquorice because of anethole, the same aromatic compound found in anise and star anise."
        de-AT: "Fenchelsamen schmecken nach Lakritze, weil sie Anethol enthalten, denselben Aromastoff wie Anis und Sternanis."
    - key: absinthe
      source: en-GB
      text:
        en-GB: "Fennel, together with the similar-tasting anise, is one of the main ingredients of absinthe."
        de-AT: "Fenchel ist zusammen mit dem ähnlich schmeckenden Anis eine der Hauptzutaten von Absinth."

- ingredient: mustard_seed
  articles:
    en-GB: {title: "Mustard seed", revision: 1385794084}
    de-AT: {title: "Senfkorn", revision: 264509921}
  facts:
    - key: three-plants
      source: en-GB
      text:
        en-GB: "Mustard seeds come from three different plants, black, brown and white mustard, and are usually just 1 to 2 millimetres across."
        de-AT: "Senfkörner stammen von drei verschiedenen Pflanzen, Schwarzem, Braunem und Weißem Senf, und sind meist nur 1 bis 2 Millimeter groß."
    - key: nepal-2021
      source: en-GB
      text:
        en-GB: "In 2021 Nepal was the world's top producer of mustard seed, ahead of Russia and Canada."
        de-AT: "2021 war Nepal der größte Senfsaatproduzent der Welt, vor Russland und Kanada."

- ingredient: fenugreek
  articles:
    en-GB: {title: "Fenugreek", revision: 1383305685}
    de-AT: {title: "Bockshornklee", revision: 267909974}
  facts:
    - key: greek-hay
      source: en-GB
      text:
        en-GB: "The name fenugreek comes from the Latin faenum Graecum, meaning Greek hay, and Cato the Elder listed it as a crop for feeding cattle."
        de-AT: "Der Name „fenugreek“ kommt vom lateinischen „faenum Graecum“, griechisches Heu. Cato der Ältere führte ihn als Viehfutter an."
    - key: tutankhamun
      source: en-GB
      text:
        en-GB: "Charred fenugreek seeds from Tell Halal in Iraq are dated to 4000 BC, and dried seeds were found in the tomb of Tutankhamun."
        de-AT: "Verkohlte Bockshornkleesamen aus Tell Halal im Irak werden auf 4000 v. Chr. datiert, getrocknete Samen fand man im Grab des Tutanchamun."

- ingredient: sumac
  articles:
    en-GB: {title: "Sumac", revision: 1386305443}
    de-AT: {title: "Gerber-Sumach", revision: 257218111}
  facts:
    - key: lemony-drupes
      source: en-GB
      text:
        en-GB: "Sumac spice is the ground reddish-purple fruit of Rhus coriaria; it adds a tart, lemony taste and is part of the Levantine blend za'atar."
        de-AT: "Sumach ist die gemahlene rötlich-violette Frucht von Rhus coriaria. Er schmeckt säuerlich nach Zitrone und gehört in die levantinische Mischung Za'atar."
    - key: tanning
      source: en-GB
      text:
        en-GB: "The leaves and bark of most sumac species are rich in tannins and have been used to tan leather in many cultures."
        de-AT: "Blätter und Rinde der meisten Sumach-Arten sind reich an Gerbstoffen und wurden in vielen Kulturen zum Gerben von Leder verwendet."

- ingredient: garam_masala
  articles:
    en-GB: {title: "Garam masala", revision: 1386890952}
    de-AT: {title: "Garam Masala", revision: 269147744}
  facts:
    - key: warm-spices
      source: en-GB
      text:
        en-GB: "Garam masala means hot or warm spices in Hindustani, and the blend has no single authentic recipe: every region and household mixes it differently."
        de-AT: "Garam Masala heißt auf Hindustani „heiße“ oder „wärmende Gewürze“. Ein einzig echtes Rezept gibt es nicht, jede Region und jede Familie mischt anders."
    - key: roasted-then-ground
      source: en-GB
      text:
        en-GB: "The spices for garam masala are roasted first and then ground, and the mix is often added just before the cooking is finished."
        de-AT: "Die Gewürze für Garam Masala werden zuerst geröstet und dann gemahlen. Oft kommt die Mischung erst kurz vor Ende der Garzeit ins Gericht."

- ingredient: curry_paste
  articles:
    en-GB: {title: "Curry paste", revision: 1359833198}
    de-AT: {title: "Currypaste", revision: 200601325}
  facts:
    - key: royal-courts
      source: en-GB
      text:
        en-GB: "Curry pastes are thought to have reached Southeast Asia from southern India through the kitchens of royal courts, where cooks adapted them to local spices."
        de-AT: "Currypasten kamen vermutlich über die Küchen königlicher Höfe aus Südindien nach Südostasien, wo man sie an die heimischen Gewürze anpasste."
    - key: lemongrass
      source: en-GB
      text:
        en-GB: "Cambodian and Thai cooks added lemongrass and galangal to the paste, while Burmese cooks added turmeric to chillies, garlic, ginger and onions."
        de-AT: "In Kambodscha und Thailand kamen Zitronengras und Galgant in die Paste, in Burma wurde Kurkuma zu Chili, Knoblauch, Ingwer und Zwiebeln gegeben."

- ingredient: harissa
  articles:
    en-GB: {title: "Harissa", revision: 1367654890}
    de-AT: {title: "Harissa (Würzmittel)", revision: 269186583}
  facts:
    - key: cap-bon
      source: en-GB
      text:
        en-GB: "Harissa comes from Tunisia's Cap Bon peninsula, where the country's first peppers were grown, and UNESCO lists it as Tunisian intangible cultural heritage."
        de-AT: "Harissa stammt von der tunesischen Halbinsel Cap Bon, wo die ersten Paprikapflanzen des Landes wuchsen. Die UNESCO führt sie als immaterielles Kulturerbe Tunesiens."
    - key: to-pound
      source: en-GB
      text:
        en-GB: "The name harissa comes from the Arabic root harasa, meaning to pound or break into pieces, after the way the chillies are crushed."
        de-AT: "Der Name Harissa geht auf die arabische Wurzel „harasa“ zurück, zerstoßen oder zerkleinern, so wie die Chilis zerdrückt werden."

- ingredient: mirin
  articles:
    en-GB: {title: "Mirin", revision: 1374938596}
    de-AT: {title: "Mirin (Reiswein)", revision: 263911582}
  facts:
    - key: no-added-sugar
      source: en-GB
      text:
        en-GB: "The sweetness of mirin is not added: it forms as kōji enzymes break down the starch of steamed glutinous rice during a 40 to 60 day mash."
        de-AT: "Die Süße von Mirin wird nicht zugesetzt, sondern entsteht, wenn Koji-Enzyme in einer 40 bis 60 Tage langen Maische die Stärke von gedämpftem Klebreis abbauen."
    - key: hon-mirin
      source: en-GB
      text:
        en-GB: "Hon mirin, literally true mirin, contains about 14 per cent alcohol, and much of it cooks off when the liquid is heated."
        de-AT: "Hon Mirin, wörtlich „echter Mirin“, enthält etwa 14 Prozent Alkohol, von dem beim Erhitzen ein großer Teil verdampft."

- ingredient: rice_vinegar
  articles:
    en-GB: {title: "Rice vinegar", revision: 1376785530}
    de-AT: {title: "Reisessig", revision: 264641204}
  facts:
    - key: akazu
      source: en-GB
      text:
        en-GB: "Traditional Edomae sushi was seasoned with akazu, a red rice vinegar made from sake lees aged in wooden boxes for up to 20 years."
        de-AT: "Traditionelles Edomae-Sushi würzte man mit Akazu, einem roten Reisessig aus Sake-Trester, der bis zu 20 Jahre in Holzkisten reifte."
    - key: milder
      source: en-GB
      text:
        en-GB: "Most Asian rice vinegars are milder, sweeter and less acidic than Western distilled vinegars, with black vinegar a notable exception."
        de-AT: "Die meisten asiatischen Reisessige sind milder, süßer und weniger sauer als westlicher Branntweinessig, eine Ausnahme ist schwarzer Essig."

- ingredient: hoisin
  articles:
    en-GB: {title: "Hoisin sauce", revision: 1381177415}
    de-AT: {title: "Hoisin-Sauce", revision: 256550327}
  facts:
    - key: seafood-name
      source: en-GB
      text:
        en-GB: "Hoisin comes from the Cantonese word for seafood, even though the sauce contains no seafood and is rarely eaten with it."
        de-AT: "Hoisin kommt vom kantonesischen Wort für Meeresfrüchte, obwohl die Sauce keine enthält und selten dazu gegessen wird."
    - key: soybean-base
      source: en-GB
      text:
        en-GB: "The key ingredient of hoisin sauce is fermented soybean paste, traditionally made from toasted mashed soybeans."
        de-AT: "Die wichtigste Zutat der Hoisinsauce ist fermentierte Sojabohnenpaste, traditionell aus gerösteten, zerdrückten Sojabohnen."

- ingredient: gochujang
  articles:
    en-GB: {title: "Gochujang", revision: 1387063491}
    de-AT: {title: "Gochujang", revision: 272442511}
  facts:
    - key: jangdok
      source: en-GB
      text:
        en-GB: "Gochujang was traditionally left to ferment for years in earthenware jars on a raised stone platform in the backyard, called a jangdokdae."
        de-AT: "Gochujang gärte früher jahrelang in Tontöpfen auf einem erhöhten Steinpodest im Hof, dem Jangdokdae."
    - key: before-chillies
      source: en-GB
      text:
        en-GB: "Korean pepper paste is recorded as early as the 9th century, long before chillies from the Americas reached Korea with Portuguese traders in the 16th century."
        de-AT: "Koreanische Pfefferpaste ist schon im 9. Jahrhundert belegt, lange bevor Chilis aus Amerika im 16. Jahrhundert mit portugiesischen Händlern nach Korea kamen."

- ingredient: sambal_oelek
  articles:
    en-GB: {title: "Sambal", revision: 1379517310}
    de-AT: {title: "Sambal", revision: 256857229}
  facts:
    - key: dutch-favourite
      source: en-GB
      text:
        en-GB: "Thanks to historical links with Indonesia, sambal is common in the Netherlands, where plain chilli paste sambal oelek is the most popular jarred kind."
        de-AT: "Wegen der historischen Verbindung zu Indonesien ist Sambal in den Niederlanden weit verbreitet. Am beliebtesten im Glas ist dort die schlichte Chilipaste Sambal Oelek."
    - key: before-chillies
      source: en-GB
      text:
        en-GB: "Before chillies arrived from the Americas in the 16th century, cooks in maritime Southeast Asia pounded relishes from long pepper, ginger and galangal."
        de-AT: "Bevor im 16. Jahrhundert Chilis aus Amerika kamen, stampfte man in Südostasien scharfe Würzpasten aus Langpfeffer, Ingwer und Galgant."

- ingredient: tamari
  articles:
    en-GB: {title: "Soy sauce", revision: 1387321797}
    de-AT: {title: "Sojasauce", revision: 272095521}
  facts:
    - key: miso-runoff
      source: en-GB
      text:
        en-GB: "Tamari comes from the Japanese verb tamaru, to accumulate, because it was originally the liquid that collected as miso matured."
        de-AT: "Tamari kommt vom japanischen Verb „tamaru“, sich ansammeln, denn ursprünglich war es die Flüssigkeit, die sich beim Reifen von Miso sammelte."
    - key: little-wheat
      source: en-GB
      text:
        en-GB: "Tamari contains little or no wheat, is darker and thicker than ordinary Japanese soy sauce, and makes up only 1.5 per cent of Japan's soy sauce output."
        de-AT: "Tamari enthält kaum oder gar keinen Weizen, ist dunkler und dickflüssiger als gewöhnliche japanische Sojasauce und macht nur 1,5 Prozent der Sojasaucenproduktion Japans aus."

- ingredient: chopped_tomatoes
  articles:
    en-GB: {title: "Canned tomato", revision: 1334154603}
    de-AT: {title: "Tomate", revision: 270762773}
  facts:
    - key: calcium-chloride
      source: en-GB
      text:
        en-GB: "Some producers add calcium chloride to diced and whole tinned tomatoes so the pieces keep their shape; crushed tomatoes and purée usually go without."
        de-AT: "Manche Hersteller geben gehackten und ganzen Dosenparadeisern Calciumchlorid bei, damit die Stücke ihre Form behalten. Pürierte Ware kommt meist ohne aus."
    - key: paradeiser-name
      source: de-AT
      text:
        en-GB: "In Austria and South Tyrol the tomato is called Paradeiser; in older German it was also known as Liebesapfel, Paradiesapfel or Goldapfel."
        de-AT: "In Österreich und Südtirol heißt die Tomate Paradeiser. Früher nannte man sie im Deutschen auch Liebesapfel, Paradiesapfel oder Goldapfel."

- ingredient: peeled_tomatoes
  articles:
    en-GB: {title: "Canned tomato", revision: 1334154603}
    de-AT: {title: "Tomate", revision: 270762773}
  facts:
    - key: usually-peeled
      source: en-GB
      text:
        en-GB: "Tinned tomatoes are usually peeled before being sealed into the can and heat-processed, and they are a staple traded worldwide."
        de-AT: "Paradeiser für die Dose werden meist geschält, bevor man sie einschließt und erhitzt. Dosenparadeiser sind weltweit ein gehandeltes Grundnahrungsmittel."
    - key: vienna-1900
      source: de-AT
      text:
        en-GB: "The first tomatoes appeared on the markets of Vienna only around 1900."
        de-AT: "Erst um 1900 gab es die ersten Paradeiser auf den Wiener Märkten."

- ingredient: passata
  articles:
    en-GB: {title: "Tomato purée", revision: 1326497987}
  facts:
    - key: to-go-through
      source: en-GB
      text:
        en-GB: "Passata is an uncooked tomato purée strained of seeds and skins, and its name comes from the Italian passare, to go through."
        de-AT: "Passata ist ein ungekochtes Paradeiserpüree ohne Kerne und Schalen. Der Name kommt vom italienischen „passare“, durchgehen."

- ingredient: tomato_juice
  articles:
    en-GB: {title: "Tomato juice", revision: 1351092297}
    de-AT: {title: "Tomatensaft", revision: 263336079}
  facts:
    - key: french-lick-1917
      source: en-GB
      text:
        en-GB: "Tomato juice was reportedly first served as a drink in 1917 by Louis Perrin at the French Lick Springs Hotel in Indiana."
        de-AT: "Paradeisersaft soll erstmals 1917 von Louis Perrin im French Lick Springs Hotel in Indiana als Getränk serviert worden sein."
    - key: from-paste
      source: en-GB
      text:
        en-GB: "In the United States most tomato juice is actually made from tomato paste, and the rules forbid adding sweeteners."
        de-AT: "In den USA wird der meiste Paradeisersaft eigentlich aus Paradeismark hergestellt, und Süßungsmittel dürfen nicht zugesetzt werden."

- ingredient: tomato_paste
  articles:
    en-GB: {title: "Tomato paste", revision: 1386000785}
    de-AT: {title: "Tomatenmark", revision: 271254892}
  facts:
    - key: sun-dried-boards
      source: en-GB
      text:
        en-GB: "In northern Italy, tomato paste was traditionally made by spreading reduced tomato sauce on wooden boards in the hot sun until it was thick enough to scrape up."
        de-AT: "In Norditalien strich man eingekochte Paradeisersauce früher auf Holzbretter und ließ sie in der Sonne trocknen, bis man das dicke Mark abschaben konnte."
    - key: 24-percent
      source: en-GB
      text:
        en-GB: "Fresh tomatoes contain only 3.5 to 5.5 per cent soluble solids; in the US a product needs at least 24 per cent to count as paste rather than purée."
        de-AT: "Frische Paradeiser enthalten nur 3,5 bis 5,5 Prozent lösliche Trockenmasse. In den USA braucht Paradeismark mindestens 24 Prozent, sonst gilt es als Püree."

- ingredient: sundried_tomatoes
  articles:
    en-GB: {title: "Sun-dried tomato", revision: 1387857832}
  facts:
    - key: 8-to-14-kilos
      source: en-GB
      text:
        en-GB: "It takes 8 to 14 kilograms of fresh tomatoes to make a single kilogram of sun-dried tomatoes, as large ones lose up to 98 per cent of their weight."
        de-AT: "Für ein Kilo getrocknete Paradeiser braucht es 8 bis 14 Kilo frische, denn große Früchte verlieren bis zu 98 Prozent ihres Gewichts."
    - key: days-in-sun
      source: en-GB
      text:
        en-GB: "Tomatoes spend 4 to 11 days in the sun to dry, usually after a treatment with salt or sulphur dioxide to keep their colour."
        de-AT: "Paradeiser liegen zum Trocknen 4 bis 11 Tage in der Sonne, meist nach einer Behandlung mit Salz oder Schwefeldioxid, damit sie ihre Farbe behalten."

- ingredient: sweetcorn_can
  articles:
    en-GB: {title: "Sweet corn", revision: 1386864528}
    de-AT: {title: "Zuckermais", revision: 271263949}
  facts:
    - key: recessive-mutation
      source: en-GB
      text:
        en-GB: "Sweet corn is the result of a natural recessive mutation that slows the conversion of sugar to starch in the kernel, which is why it is picked immature."
        de-AT: "Zuckermais beruht auf einer natürlichen rezessiven Mutation, die die Umwandlung von Zucker in Stärke im Korn bremst. Deshalb erntet man ihn unreif."
    - key: papoon-1779
      source: en-GB
      text:
        en-GB: "The first recorded sweet corn grown for European settlers came from the Iroquois in 1779, a variety called Papoon."
        de-AT: "Den ersten belegten Zuckermais für europäische Siedler bauten 1779 die Irokesen an, eine Sorte namens „Papoon“."

- ingredient: peas_can
  articles:
    en-GB: {title: "Pea", revision: 1387252718}
    de-AT: {title: "Erbse", revision: 272091617}
  facts:
    - key: pods-are-fruit
      source: en-GB
      text:
        en-GB: "Botanically a pea pod is a fruit, because it develops from the ovary of the pea flower and holds the seeds, which are the peas."
        de-AT: "Botanisch ist die Erbsenschote eine Frucht, denn sie entwickelt sich aus dem Fruchtknoten der Blüte und enthält die Samen, also die Erbsen."
    - key: linnaeus-1753
      source: en-GB
      text:
        en-GB: "Carl Linnaeus named the pea Pisum sativum, meaning cultivated pea, in 1753."
        de-AT: "Carl von Linné gab der Erbse 1753 den Namen Pisum sativum, „angebaute Erbse“."

- ingredient: olives_black
  articles:
    en-GB: {title: "Olive", revision: 1387402250}
    de-AT: {title: "Olivenbaum", revision: 272332631}
  facts:
    - key: fully-ripe
      source: en-GB
      text:
        en-GB: "Black olives are simply olives left on the tree until fully ripe, when their skin has turned purple, brown or black."
        de-AT: "Schwarze Oliven sind einfach Oliven, die bis zur vollen Reife am Baum bleiben, bis ihre Haut violett, braun oder schwarz ist."
    - key: first-fruit-trees
      source: en-GB
      text:
        en-GB: "The olive was one of the first fruit trees to be domesticated, first grown in the eastern Mediterranean between 6,000 and 4,000 BC."
        de-AT: "Der Ölbaum gehört zu den ersten kultivierten Obstbäumen. Angebaut wurde er zuerst im östlichen Mittelmeerraum zwischen 6000 und 4000 v. Chr."

- ingredient: olives_green
  articles:
    en-GB: {title: "Olive", revision: 1387402250}
    de-AT: {title: "Olivenbaum", revision: 272332631}
  facts:
    - key: unripe-bitter
      source: en-GB
      text:
        en-GB: "Green olives are picked full-sized but unripe and are far too bitter to eat raw, because of a compound called oleuropein."
        de-AT: "Grüne Oliven werden ausgewachsen, aber unreif geerntet. Roh sind sie wegen des Bitterstoffs Oleuropein viel zu bitter zum Essen."
    - key: curing-time
      source: en-GB
      text:
        en-GB: "Curing removes the bitterness from olives and can take just a few days with lye or several months in brine or packed in salt."
        de-AT: "Das Entbittern von Oliven dauert mit Lauge nur wenige Tage, in Salzlake oder in Salz eingelegt dagegen mehrere Monate."

- ingredient: capers
  articles:
    en-GB: {title: "Caper", revision: 1378670969}
    de-AT: {title: "Echter Kapernstrauch", revision: 269098902}
  facts:
    - key: flower-buds
      source: en-GB
      text:
        en-GB: "Capers are the unopened flower buds of the caper bush; its fruits, sold as caper berries, are pickled too."
        de-AT: "Kapern sind die ungeöffneten Blütenknospen des Kapernstrauchs. Seine Früchte kommen als Kapernäpfel ebenfalls eingelegt in den Handel."
    - key: daily-picking
      source: en-GB
      text:
        en-GB: "Caper buds are picked by hand in the morning, often every day, because the smallest and youngest buds fetch the highest prices."
        de-AT: "Kapernknospen werden morgens von Hand gepflückt, oft täglich, denn die kleinsten und jüngsten Knospen erzielen die höchsten Preise."

- ingredient: gherkins
  articles:
    en-GB: {title: "Pickled cucumber", revision: 1383114547}
    de-AT: {title: "Gewürzgurke", revision: 271493162}
  facts:
    - key: tigris-2030bc
      source: en-GB
      text:
        en-GB: "One theory holds that cucumbers were first pickled as early as 2030 BC in the Tigris Valley of Mesopotamia, using cucumbers from India."
        de-AT: "Einer Theorie nach wurden Gurken schon um 2030 v. Chr. im Tigristal in Mesopotamien eingelegt, mit Gurken, die aus Indien stammten."
    - key: half-sour
      source: en-GB
      text:
        en-GB: "New York pickle makers call a fully fermented cucumber full-sour, while a half-sour spends less time in the brine and stays crisp and bright green."
        de-AT: "In New York heißt ein ganz durchgegorenes Gurkerl „full-sour“. Ein „half-sour“ bleibt kürzer in der Lake und ist noch knackig und hellgrün."

- ingredient: sauerkraut
  articles:
    en-GB: {title: "Sauerkraut", revision: 1387928488}
    de-AT: {title: "Sauerkraut", revision: 272377918}
  facts:
    - key: captain-cook
      source: en-GB
      text:
        en-GB: "James Cook took sauerkraut on his first and second Pacific voyages as a way to prevent scurvy among his crew."
        de-AT: "James Cook nahm auf seine erste und zweite Pazifikreise Sauerkraut mit, um Skorbut bei der Mannschaft vorzubeugen."
    - key: lactic-acid
      source: en-GB
      text:
        en-GB: "Sauerkraut owes both its sour taste and its long shelf life to lactic acid, which bacteria produce as they ferment the sugars in the cabbage."
        de-AT: "Sauerkraut verdankt seinen sauren Geschmack und seine lange Haltbarkeit der Milchsäure, die Bakterien beim Vergären des Zuckers im Kraut bilden."

- ingredient: roasted_peppers
  articles:
    en-GB: {title: "Bell pepper", revision: 1387588130}
    de-AT: {title: "Spanischer Pfeffer", revision: 263923305}
  facts:
    - key: red-is-ripe
      source: en-GB
      text:
        en-GB: "A red pepper is simply a green one left to ripen; only the variety Permagreen stays green when fully ripe."
        de-AT: "Rote Paprika sind einfach ausgereifte grüne. Nur die Sorte „Permagreen“ bleibt auch reif noch grün."
    - key: spain-1493
      source: en-GB
      text:
        en-GB: "Peppers come from Mexico, Central America and northern South America, and their seeds reached Spain in 1493 before spreading across Europe."
        de-AT: "Paprika stammt aus Mexiko, Mittelamerika und dem Norden Südamerikas. Die Samen kamen 1493 nach Spanien und verbreiteten sich von dort in ganz Europa."

- ingredient: mushrooms_can
  articles:
    en-GB: {title: "Agaricus bisporus", revision: 1381073283}
    de-AT: {title: "Zucht-Champignon", revision: 269145087}
  facts:
    - key: tournefort-1707
      source: en-GB
      text:
        en-GB: "The first scientific description of growing button mushrooms commercially was written by the French botanist Joseph Pitton de Tournefort in 1707."
        de-AT: "Die erste wissenschaftliche Beschreibung des Champignonanbaus stammt vom französischen Botaniker Joseph Pitton de Tournefort aus dem Jahr 1707."
    - key: pasteur-spawn
      source: en-GB
      text:
        en-GB: "In 1893 the Pasteur Institute in Paris produced sterile pure-culture spawn, letting growers raise mushrooms reliably on composted horse manure."
        de-AT: "1893 stellte das Institut Pasteur in Paris sterile Reinkultur-Brut her, mit der sich Champignons zuverlässig auf kompostiertem Pferdemist ziehen ließen."

- ingredient: peaches_can
  articles:
    en-GB: {title: "Peach", revision: 1385624404}
    de-AT: {title: "Pfirsich", revision: 272472193}
  facts:
    - key: persica
      source: en-GB
      text:
        en-GB: "Peaches were first domesticated in Neolithic China; the species name persica refers to Persia, from where the fruit reached Europe."
        de-AT: "Pfirsiche wurden in der Jungsteinzeit in China kultiviert. Der Artname „persica“ verweist auf Persien, von wo die Frucht nach Europa kam."
    - key: china-65
      source: en-GB
      text:
        en-GB: "In 2023 China grew 65 per cent of the world's peaches and nectarines, which botanically belong to one species."
        de-AT: "2023 stammten 65 Prozent aller Pfirsiche und Nektarinen weltweit aus China. Botanisch gehören beide zur selben Art."

- ingredient: apple_sauce
  articles:
    en-GB: {title: "Apple sauce", revision: 1388115475}
    de-AT: {title: "Apfelmus", revision: 268256344}
  facts:
    - key: kaiserschmarrn
      source: en-GB
      text:
        en-GB: "Apple sauce is a classic partner for Austrian Kaiserschmarrn and Central European Palatschinken, and in the Rhineland it comes with potato pancakes."
        de-AT: "Apfelmus ist der klassische Begleiter zum Kaiserschmarrn und zu Palatschinken, im Rheinland kommt es zu Reibekuchen auf den Tisch."
    - key: bramley
      source: en-GB
      text:
        en-GB: "The more acidic the apple, the finer the purée: the very sour Bramley apple cooks down into an especially smooth sauce."
        de-AT: "Je saurer der Apfel, desto feiner das Mus: Die sehr säuerliche Sorte Bramley zerfällt beim Kochen besonders glatt."

- ingredient: coconut_cream
  articles:
    en-GB: {title: "Coconut cream", revision: 1380433373}
    de-AT: {title: "Kokosnusscreme", revision: 272423108}
  facts:
    - key: four-to-one
      source: en-GB
      text:
        en-GB: "Coconut cream is basically coconut milk with much less water, at a ratio of roughly four parts coconut to one part water."
        de-AT: "Kokoscreme ist im Grunde Kokosmilch mit viel weniger Wasser, etwa im Verhältnis vier Teile Kokos zu einem Teil Wasser."
    - key: cream-of-coconut
      source: en-GB
      text:
        en-GB: "Coconut cream is unsweetened; the sweetened version, called cream of coconut, is what goes into a piña colada."
        de-AT: "Kokoscreme ist ungesüßt. Die gesüßte Variante, „Cream of Coconut“ genannt, gehört in eine Piña Colada."

- ingredient: lingonberry_jam
  articles:
    en-GB: {title: "Vaccinium vitis-idaea", revision: 1385072266}
    de-AT: {title: "Preiselbeere", revision: 271526728}
  facts:
    - key: granten
      source: de-AT
      text:
        en-GB: "Lingonberries have many regional names: in Bavaria and Austria they are called Granten, in Styria Schöckelbeere and in Tyrol Kreuzbeer."
        de-AT: "Preiselbeeren haben viele regionale Namen: In Bayern und Österreich heißen sie Granten, in der Steiermark Schöckelbeere und in Tirol Kreuzbeer."
    - key: swedish-meatballs
      source: en-GB
      text:
        en-GB: "In Sweden lingonberry jam is the classic partner for meatballs with potatoes and gravy, and in the Nordic countries it is served with reindeer and elk."
        de-AT: "In Schweden gehört Preiselbeerkompott zu Köttbullar mit Erdäpfeln und Sauce, im Norden auch zu Rentier und Elch."

- ingredient: hirschhornsalz
  articles:
    en-GB: {title: "Ammonium carbonate", revision: 1380035486}
    de-AT: {title: "Hirschhornsalz", revision: 251581834}
  facts:
    - key: deer-horn
      source: en-GB
      text:
        en-GB: "Baker's ammonia was originally made from ground deer antler, which is why it was called salt of hartshorn and is still Hirschhornsalz in German."
        de-AT: "Hirschhornsalz wurde ursprünglich aus gemahlenem Hirschgeweih gewonnen, daher der Name, der im Englischen als „salt of hartshorn“ überlebt hat."
    - key: flat-biscuits
      source: de-AT
      text:
        en-GB: "Hirschhornsalz is only used for flat bakes such as Lebkuchen, Spekulatius and Springerle, because in tall cakes the ammonia it releases would stay trapped."
        de-AT: "Hirschhornsalz nimmt man nur für flaches Gebäck wie Lebkuchen, Spekulatius und Springerle, denn in hohen Kuchen bliebe das freigesetzte Ammoniak gefangen."

- ingredient: dark_couverture
  articles:
    en-GB: {title: "Couverture chocolate", revision: 1381778892}
    de-AT: {title: "Kuvertüre", revision: 256248426}
  facts:
    - key: cocoa-butter
      source: en-GB
      text:
        en-GB: "Couverture contains more cocoa butter than ordinary chocolate, 32 to 39 per cent, which with proper tempering gives it its gloss and crisp snap."
        de-AT: "Kuvertüre enthält mit 32 bis 39 Prozent mehr Kakaobutter als gewöhnliche Schokolade. Richtig temperiert bekommt sie dadurch Glanz und einen knackigen Bruch."
    - key: covering
      source: en-GB
      text:
        en-GB: "Couverture is French for covering, and in the EU dark couverture must legally contain at least 35 per cent cocoa solids, including at least 31 per cent cocoa butter."
        de-AT: "„Couverture“ heißt auf Französisch Überzug. In der EU muss dunkle Kuvertüre mindestens 35 Prozent Kakaotrockenmasse enthalten, davon mindestens 31 Prozent Kakaobutter."

- ingredient: milk_couverture
  articles:
    en-GB: {title: "Milk chocolate", revision: 1386630192}
    de-AT: {title: "Milchschokolade", revision: 270150734}
  facts:
    - key: daniel-peter
      source: en-GB
      text:
        en-GB: "The milk chocolate bar was born in 1875, when the Swiss inventor Daniel Peter managed to combine cocoa with condensed milk."
        de-AT: "Die Milchschokoladentafel entstand 1875, als es dem Schweizer Daniel Peter gelang, Kakao mit Kondensmilch zu verbinden."
    - key: jamaica-1687
      source: en-GB
      text:
        en-GB: "The term milk chocolate was first used for a drink brought to London from Jamaica in 1687, almost two centuries before the bar."
        de-AT: "Der Begriff Milchschokolade bezeichnete zuerst ein Getränk, das 1687 aus Jamaika nach London kam, fast zwei Jahrhunderte vor der Tafel."

- ingredient: chocolate_chips
  articles:
    en-GB: {title: "Chocolate chip", revision: 1365496301}
  facts:
    - key: toll-house
      source: en-GB
      text:
        en-GB: "Chocolate chips began in 1938, when Ruth Wakefield of the Toll House Inn in Massachusetts stirred chopped Nestlé chocolate into a cookie dough."
        de-AT: "Schokotropfen gehen auf 1938 zurück, als Ruth Wakefield vom Toll House Inn in Massachusetts gehackte Nestlé-Schokolade in einen Keksteig rührte."
    - key: lifetime-supply
      source: en-GB
      text:
        en-GB: "Wakefield let Nestlé print her recipe on its wrappers in exchange for a lifetime supply of chocolate, and from 1941 Nestlé sold ready-made chips."
        de-AT: "Wakefield ließ Nestlé ihr Rezept auf die Verpackung drucken und bekam dafür lebenslang Schokolade. Ab 1941 verkaufte Nestlé fertige Tropfen."

- ingredient: nougat
  articles:
    en-GB: {title: "Gianduja (chocolate)", revision: 1380767560}
    de-AT: {title: "Nougat", revision: 271490838}
  facts:
    - key: napoleon-turin
      source: en-GB
      text:
        en-GB: "Gianduja, chocolate blended with about 30 per cent hazelnut paste, was invented in Turin under Napoleon, when his blockade of British goods made cocoa scarce."
        de-AT: "Gianduja, Schokolade mit rund 30 Prozent Haselnussmark, entstand in Turin unter Napoleon, als seine Kontinentalsperre den Kakao knapp machte."
    - key: soft-bar
      source: en-GB
      text:
        en-GB: "Hazelnut chocolate is softer than plain chocolate because hazelnut oil, unlike cocoa butter, stays liquid at room temperature."
        de-AT: "Nougat ist weicher als reine Schokolade, weil Haselnussöl anders als Kakaobutter bei Zimmertemperatur flüssig bleibt."

- ingredient: krokant
  articles:
    en-GB: {title: "Brittle (food)", revision: 1378643282}
    de-AT: {title: "Krokant", revision: 266816107}
  facts:
    - key: many-names
      source: en-GB
      text:
        en-GB: "Nut brittle exists all over the world, from pasteli in Greece and croccante in Italy to chikki in India and pé-de-moleque in Brazil."
        de-AT: "Krokant gibt es auf der ganzen Welt, von Pasteli in Griechenland und Croccante in Italien bis Chikki in Indien und Pé-de-moleque in Brasilien."
    - key: word-1892
      source: en-GB
      text:
        en-GB: "The English word brittle for the sweet first appeared in print in 1892, although the candy itself is much older."
        de-AT: "Das englische Wort „brittle“ für Krokant taucht erst 1892 gedruckt auf, die Süßigkeit selbst ist aber viel älter."

- ingredient: tortenguss
  articles:
    de-AT: {title: "Tortenguss", revision: 212208919}
  facts:
    - key: 5900-tonnes
      source: de-AT
      text:
        en-GB: "German bakeries alone use about 5,900 tonnes of cake glaze every year."
        de-AT: "Allein im deutschen Bäckerhandwerk werden jährlich rund 5.900 Tonnen Tortenguss verbraucht."
    - key: carrageenan
      source: de-AT
      text:
        en-GB: "Cake glaze is usually set with carrageenan or agar, so heating it to 70 to 80 °C is enough, while long boiling above 100 °C ruins its structure."
        de-AT: "Tortenguss geliert meist mit Carrageen oder Agar-Agar. Erhitzen auf 70 bis 80 °C reicht, längeres Kochen über 100 °C zerstört die Struktur."

- ingredient: cream_stabiliser
  articles:
    en-GB: {title: "Whipped cream", revision: 1380746850}
    de-AT: {title: "Sahnestandmittel", revision: 188670074}
  facts:
    - key: since-1967
      source: de-AT
      text:
        en-GB: "Cream stabiliser has been sold in German-speaking shops under the name Sahnesteif since 1967; it usually relies on cold-setting gelatine or modified starch."
        de-AT: "Obersteif gibt es unter dem deutschen Namen „Sahnesteif“ seit 1967 zu kaufen. Meist wirkt darin kaltlösliche Gelatine oder modifizierte Stärke."
    - key: fat-globules
      source: en-GB
      text:
        en-GB: "Cream for whipping usually has 30 to 36 per cent fat, because the fat globules are what hold the air bubbles stable."
        de-AT: "Schlagobers hat meist 30 bis 36 Prozent Fett, denn die Fettkügelchen halten die Luftbläschen stabil."

- ingredient: rum_flavouring
  articles:
    de-AT: {title: "Backaroma", revision: 192161793}
  facts:
    - key: no-alcohol
      source: de-AT
      text:
        en-GB: "Rum flavouring is made from esters such as ethyl formate in water and propylene glycol; it contains no alcohol yet smells like dark rum."
        de-AT: "Rumaroma besteht aus Estern wie Ameisensäureethylester in Wasser und Propylenglycol. Es enthält keinen Alkohol, riecht aber nach braunem Rum."
    - key: drop-by-drop
      source: de-AT
      text:
        en-GB: "Baking flavourings are so concentrated that home bakers use them in tiny amounts, often by the drop, which is why they come in small resealable vials."
        de-AT: "Backaromen sind so intensiv, dass man sie zu Hause nur in kleinsten Mengen verwendet, oft tropfenweise. Deshalb gibt es sie in kleinen Fläschchen."

- ingredient: bitter_almond_flavouring
  articles:
    en-GB: {title: "Benzaldehyde", revision: 1380095270}
    de-AT: {title: "Benzaldehyd", revision: 269349329}
  facts:
    - key: benzaldehyde
      source: en-GB
      text:
        en-GB: "The aroma of bitter almond comes mainly from benzaldehyde, one of the simplest aromatic aldehydes, which also gives cherry sodas their taste."
        de-AT: "Der Duft von Bittermandel stammt vor allem von Benzaldehyd, einem der einfachsten aromatischen Aldehyde. Er steckt auch in Kirschlimonaden."
    - key: woehler-liebig
      source: en-GB
      text:
        en-GB: "Benzaldehyde was first extracted in 1803 by the French pharmacist Martrès, and Friedrich Wöhler and Justus von Liebig first synthesised it in 1832."
        de-AT: "Benzaldehyd wurde 1803 vom französischen Apotheker Martrès erstmals gewonnen, 1832 gelang Friedrich Wöhler und Justus von Liebig die erste Synthese."

- ingredient: sprinkles
  articles:
    en-GB: {title: "Sprinkles", revision: 1373943449}
  facts:
    - key: hagelslag-1913
      source: en-GB
      text:
        en-GB: "Chocolate sprinkles, the Dutch hagelslag, were invented in 1913, and in the Netherlands they are eaten on buttered bread so they do not fall off."
        de-AT: "Schokostreusel, in den Niederlanden „Hagelslag“, wurden 1913 erfunden. Dort isst man sie auf Butterbrot, damit sie nicht herunterfallen."
    - key: hundreds-and-thousands
      source: en-GB
      text:
        en-GB: "In Britain, Australia and South Africa coloured sprinkles are known as hundreds and thousands, while in New England chocolate ones are called jimmies."
        de-AT: "In Großbritannien, Australien und Südafrika heißen bunte Streusel „hundreds and thousands“, in Neuengland nennt man Schokostreusel „jimmies“."

- ingredient: glucose_syrup
  articles:
    en-GB: {title: "Glucose syrup", revision: 1346813150}
    de-AT: {title: "Glucosesirup", revision: 272300632}
  facts:
    - key: kirchhoff-1811
      source: en-GB
      text:
        en-GB: "Glucose syrup was first made in Russia in 1811 by Gottlieb Kirchhoff, who broke down starch using heat and sulphuric acid."
        de-AT: "Glukosesirup stellte Gottlieb Kirchhoff 1811 in Russland erstmals her, indem er Stärke mit Hitze und Schwefelsäure aufspaltete."
    - key: many-starches
      source: en-GB
      text:
        en-GB: "Glucose syrup can be made from the starch of maize, potatoes or wheat, and less often from barley, rice or cassava; in the US it is simply called corn syrup."
        de-AT: "Glukosesirup lässt sich aus der Stärke von Mais, Erdäpfeln oder Weizen gewinnen, seltener aus Gerste, Reis oder Maniok. In den USA heißt er schlicht „corn syrup“."

- ingredient: dextrose
  articles:
    en-GB: {title: "Glucose", revision: 1385106738}
    de-AT: {title: "Glucose", revision: 271015266}
  facts:
    - key: turns-right
      source: en-GB
      text:
        en-GB: "The name dextrose comes from the Latin dexter, right, because a glucose solution rotates polarised light to the right."
        de-AT: "Der Name Dextrose kommt vom lateinischen „dexter“, rechts, denn eine Traubenzuckerlösung dreht polarisiertes Licht nach rechts."
    - key: raisins-1747
      source: en-GB
      text:
        en-GB: "Glucose was first isolated in 1747 by the German chemist Andreas Marggraf, who extracted it from raisins."
        de-AT: "Traubenzucker wurde 1747 vom deutschen Chemiker Andreas Marggraf erstmals isoliert, und zwar aus Rosinen."

- ingredient: rock_sugar
  articles:
    en-GB: {title: "Rock candy", revision: 1381839000}
    de-AT: {title: "Kandis", revision: 266782094}
  facts:
    - key: east-frisia
      source: en-GB
      text:
        en-GB: "In East Frisian tea culture a lump of rock sugar, called Kandis, is placed in the cup first, and in Iran tea is usually drunk with rock candy called nabat."
        de-AT: "In der ostfriesischen Teekultur kommt zuerst ein Stück Kandis in die Tasse, und im Iran trinkt man Tee meist mit Kandiszucker, der dort Nabat heißt."
    - key: six-days
      source: en-GB
      text:
        en-GB: "Rock candy grows from a supersaturated sugar solution onto a string or stick, and the crystals take six to seven days to form."
        de-AT: "Kandis wächst aus einer übersättigten Zuckerlösung an einem Faden oder Stab. Bis sich die Kristalle bilden, dauert es sechs bis sieben Tage."

- ingredient: golden_syrup
  articles:
    en-GB: {title: "Golden syrup", revision: 1384596439}
  facts:
    - key: lion-and-bees
      source: en-GB
      text:
        en-GB: "The golden syrup tin shows a dead lion with a swarm of bees and the motto Out of the strong came forth sweetness, from Samson's riddle in the Book of Judges."
        de-AT: "Auf der Golden-Syrup-Dose sind ein toter Löwe mit einem Bienenschwarm und der Spruch „Out of the strong came forth sweetness“ zu sehen, nach Samsons Rätsel im Buch der Richter."
    - key: pig-food
      source: en-GB
      text:
        en-GB: "Abram Lyle noticed that a syrup left over from sugar refining was sold off cheaply as pig feed; his refinery first sold it in tins in 1885."
        de-AT: "Abram Lyle bemerkte, dass ein Sirup aus der Zuckerraffination billig als Schweinefutter verkauft wurde. Seine Raffinerie brachte ihn 1885 erstmals in Dosen heraus."

- ingredient: molasses
  articles:
    en-GB: {title: "Molasses", revision: 1387780883}
    de-AT: {title: "Melasse", revision: 263475974}
  facts:
    - key: three-boilings
      source: en-GB
      text:
        en-GB: "Molasses gets darker with each boiling of the cane syrup: first molasses is the sweetest, and the third boiling gives thick, robust blackstrap."
        de-AT: "Melasse wird mit jedem Einkochen des Zuckerrohrsirups dunkler. Die erste ist am süßesten, das dritte Kochen ergibt die dicke, kräftige Blackstrap-Melasse."
    - key: stroop
      source: en-GB
      text:
        en-GB: "The strap in blackstrap molasses may come from stroop, the Dutch word for syrup."
        de-AT: "Das „strap“ in Blackstrap-Melasse kommt vielleicht vom niederländischen Wort „stroop“ für Sirup."

- ingredient: frozen_peas
  articles:
    en-GB: {title: "Frozen food", revision: 1350337675}
    de-AT: {title: "Tiefkühlkost", revision: 268535813}
  facts:
    - key: birdseye-labrador
      source: en-GB
      text:
        en-GB: "Clarence Birdseye got the idea for quick freezing on fur-trapping trips to Labrador in 1912 and 1916, watching local people preserve food in the cold."
        de-AT: "Clarence Birdseye kam auf das Schockfrosten bei Pelzjagdreisen nach Labrador 1912 und 1916, wo er sah, wie die Einheimischen Lebensmittel in der Kälte haltbar machten."
    - key: small-crystals
      source: en-GB
      text:
        en-GB: "The faster food freezes, the smaller its ice crystals, so cell structure survives better; liquid nitrogen at minus 196 °C is the quickest method."
        de-AT: "Je schneller etwas gefriert, desto kleiner die Eiskristalle und desto besser bleiben die Zellen erhalten. Am schnellsten geht es mit flüssigem Stickstoff bei minus 196 °C."

- ingredient: frozen_spinach
  articles:
    en-GB: {title: "Spinach", revision: 1388152521}
    de-AT: {title: "Spinat", revision: 270356574}
  facts:
    - key: china-92
      source: en-GB
      text:
        en-GB: "In 2024 the world produced 31 million tonnes of spinach, and China alone grew 92 per cent of it."
        de-AT: "2024 wurden weltweit 31 Millionen Tonnen Spinat geerntet, davon allein 92 Prozent in China."
    - key: persian-name
      source: en-GB
      text:
        en-GB: "The word spinach travelled from Persian aspānāḵ through Andalusian Arabic isbinakh into medieval Latin spinagium."
        de-AT: "Das Wort Spinat wanderte vom persischen „aspānāḵ“ über das andalusisch-arabische „isbinakh“ ins mittelalterliche Latein „spinagium“."

- ingredient: frozen_berries
  articles:
    en-GB: {title: "Individual quick freezing", revision: 1386641768}
    de-AT: {title: "Tiefkühlkost", revision: 268535813}
  facts:
    - key: iqf-minutes
      source: en-GB
      text:
        en-GB: "Frozen berries are usually individually quick frozen: each piece freezes within minutes, so large ice crystals cannot tear the cells apart."
        de-AT: "TK-Beeren werden meist einzeln schockgefrostet. Jedes Stück gefriert in wenigen Minuten, so können keine großen Eiskristalle die Zellen zerreißen."
    - key: free-flowing
      source: en-GB
      text:
        en-GB: "Because each berry freezes separately rather than in a block, you can pour out exactly the amount you need and leave the rest frozen."
        de-AT: "Weil jede Beere einzeln und nicht im Block gefriert, lässt sich genau die benötigte Menge entnehmen, der Rest bleibt gefroren."

- ingredient: frozen_chips
  articles:
    en-GB: {title: "French fries", revision: 1388140420}
    de-AT: {title: "Pommes frites", revision: 272438456}
  facts:
    - key: meuse-legend
      source: en-GB
      text:
        en-GB: "A Belgian story claims that people in the Meuse valley fried potatoes before 1680 when the frozen rivers stopped them catching fish to fry."
        de-AT: "Einer belgischen Überlieferung nach frittierte man im Maastal schon vor 1680 Erdäpfel, wenn die Flüsse zugefroren waren und es keinen Fisch zum Backen gab."
    - key: krieger-1844
      source: en-GB
      text:
        en-GB: "Frédéric Krieger, a Bavarian musician, learnt to make fries in Paris in 1842 and in 1844 started selling Paris-style fried potatoes in Belgium."
        de-AT: "Der bayerische Musiker Frédéric Krieger lernte 1842 in Paris das Frittieren von Erdäpfeln und verkaufte ab 1844 in Belgien Pommes nach Pariser Art."

- ingredient: ice_cream
  articles:
    en-GB: {title: "Vanilla ice cream", revision: 1387500991}
    de-AT: {title: "Vanilleeis", revision: 256464129}
  facts:
    - key: jefferson
      source: en-GB
      text:
        en-GB: "In the 1780s Thomas Jefferson wrote down a recipe for vanilla ice cream, the first such recipe recorded by an American."
        de-AT: "In den 1780er-Jahren notierte Thomas Jefferson ein Rezept für Vanilleeis, das erste, das ein Amerikaner festhielt."
    - key: 200-compounds
      source: en-GB
      text:
        en-GB: "Natural vanilla extract contains almost 200 different compounds, while cheaper vanilla ice cream is often flavoured with vanillin alone."
        de-AT: "Natürlicher Vanilleextrakt enthält fast 200 verschiedene Aromastoffe, günstigeres Vanilleeis wird oft nur mit Vanillin aromatisiert."

- ingredient: frozen_veg
  articles:
    en-GB: {title: "Frozen vegetables", revision: 1363297200}
    de-AT: {title: "Tiefkühlkost", revision: 268535813}
  facts:
    - key: liao-pear
      source: en-GB
      text:
        en-GB: "Frozen produce goes back at least to the Liao dynasty in China, where the frozen pear was a delicacy of the Khitan people."
        de-AT: "Gefrorenes Obst gab es schon in der Liao-Dynastie in China: Die gefrorene Birne war eine Delikatesse der Kitan."
    - key: no-salt-needed
      source: en-GB
      text:
        en-GB: "Unlike tinned vegetables, frozen ones often need little or no added salt, because the cold alone stops bacteria from growing."
        de-AT: "Anders als Dosengemüse kommt Tiefkühlgemüse oft ohne zugesetztes Salz aus, weil schon die Kälte das Wachstum von Bakterien stoppt."

- ingredient: fish_fingers
  articles:
    en-GB: {title: "Fish finger", revision: 1372714520}
    de-AT: {title: "Fischstäbchen", revision: 263579969}
  facts:
    - key: battered-cod-pieces
      source: en-GB
      text:
        en-GB: "When Birds Eye launched them in Britain, the product was nearly called Battered Cod Pieces until a staff poll chose the name Fish Fingers."
        de-AT: "Als Birds Eye sie in Großbritannien einführte, hätten Fischstäbchen fast „Battered Cod Pieces“ geheißen, bis eine Umfrage unter Mitarbeitern „Fish Fingers“ wählte."
    - key: herring-savouries
      source: en-GB
      text:
        en-GB: "Because Britain had plenty of herring after the Second World War, Clarence Birdseye first test-marketed fish fingers made of herring as herring savouries."
        de-AT: "Weil es nach dem Zweiten Weltkrieg in Großbritannien Hering im Überfluss gab, testete Clarence Birdseye zuerst Stäbchen aus Hering unter dem Namen „herring savouries“."

- ingredient: water
  articles:
    en-GB: {title: "Water", revision: 1387861398}
    de-AT: {title: "Wasser", revision: 272521291}
  facts:
    - key: ice-expands
      source: en-GB
      text:
        en-GB: "Water expands by about 9 per cent when it freezes, which is why ice floats and why freezing water can burst pipes and crack rocks."
        de-AT: "Wasser dehnt sich beim Gefrieren um etwa 9 Prozent aus. Deshalb schwimmt Eis, und gefrierendes Wasser kann Rohre sprengen und Felsen spalten."
    - key: densest-4c
      source: en-GB
      text:
        en-GB: "Liquid water is densest at about 4 °C and expands again as it cools further towards freezing, which no other natural liquid is known to do."
        de-AT: "Flüssiges Wasser ist bei etwa 4 °C am dichtesten und dehnt sich beim weiteren Abkühlen wieder aus. Kein anderer natürlicher Stoff tut das im flüssigen Zustand."

- ingredient: white_wine
  articles:
    en-GB: {title: "White wine", revision: 1374076469}
    de-AT: {title: "Weißwein", revision: 271818654}
  facts:
    - key: no-maceration
      source: en-GB
      text:
        en-GB: "White wine is fermented without prolonged contact with the skins, so it can even be made from dark grapes; champagne often uses Pinot Noir."
        de-AT: "Weißwein gärt ohne längeren Kontakt mit den Schalen. Deshalb lässt er sich sogar aus dunklen Trauben keltern, für Champagner nimmt man oft Pinot Noir."
    - key: 4000-years
      source: en-GB
      text:
        en-GB: "White wine has been made for at least 4,000 years."
        de-AT: "Weißwein wird seit mindestens 4.000 Jahren hergestellt."

- ingredient: red_wine
  articles:
    en-GB: {title: "Red wine", revision: 1387132910}
    de-AT: {title: "Rotwein", revision: 272429455}
  facts:
    - key: colourless-juice
      source: en-GB
      text:
        en-GB: "The juice of most dark grapes is greenish-white; red wine gets its colour from anthocyanin pigments in the skins."
        de-AT: "Der Saft der meisten dunklen Trauben ist grünlich weiß. Seine Farbe bekommt der Rotwein von Anthocyanen aus den Beerenhäuten."
    - key: press-late
      source: en-GB
      text:
        en-GB: "Unlike white wine, red wine is usually pressed only near the end of fermentation, so the skins can leach colour and tannins into the juice."
        de-AT: "Anders als beim Weißwein wird beim Rotwein meist erst gegen Ende der Gärung gepresst, damit die Schalen Farbe und Gerbstoffe an den Saft abgeben."

- ingredient: sparkling_wine
  articles:
    en-GB: {title: "Sparkling wine", revision: 1384447241}
    de-AT: {title: "Sekt", revision: 264021500}
  facts:
    - key: devrient-1825
      source: de-AT
      text:
        en-GB: "The modern meaning of Sekt is credited to the actor Ludwig Devrient, who in 1825 ordered his champagne in Berlin with a Shakespeare line asking for Sekt, then the word for sherry."
        de-AT: "Die heutige Bedeutung von Sekt geht angeblich auf den Schauspieler Ludwig Devrient zurück, der 1825 in Berlin seinen Champagner mit einem Shakespeare-Zitat bestellte. Mit Sekt war damals Sherry gemeint."
    - key: hauersekt
      source: de-AT
      text:
        en-GB: "Bottle-fermented sparkling wine made by the winegrowers themselves is called Winzersekt in Germany and officially Hauersekt in Austria."
        de-AT: "Von Winzern selbst in Flaschengärung erzeugter Sekt heißt in Deutschland Winzersekt, in Österreich offiziell Hauersekt."

- ingredient: beer
  articles:
    en-GB: {title: "Beer", revision: 1386059060}
    de-AT: {title: "Bier", revision: 272433650}
  facts:
    - key: godin-tepe
      source: en-GB
      text:
        en-GB: "The earliest clear chemical evidence of barley beer, from about 3500 to 3100 BC, was found at Godin Tepe in the Zagros Mountains of western Iran."
        de-AT: "Der älteste eindeutige chemische Nachweis von Gerstenbier stammt aus der Zeit um 3500 bis 3100 v. Chr. aus Godin Tepe im Zagrosgebirge im Westen Irans."
    - key: uruk-wages
      source: en-GB
      text:
        en-GB: "About 5,000 years ago, workers in the Mesopotamian city of Uruk were paid by their employers in beer."
        de-AT: "Vor rund 5.000 Jahren wurden Arbeiter in der mesopotamischen Stadt Uruk mit Bier entlohnt."

- ingredient: rum
  articles:
    en-GB: {title: "Rum", revision: 1387150773}
    de-AT: {title: "Rum", revision: 272074310}
  facts:
    - key: black-tot
      source: en-GB
      text:
        en-GB: "The Royal Navy gave its sailors a daily rum ration, the tot, until it was abolished on 31 July 1970."
        de-AT: "Die Royal Navy teilte ihren Matrosen täglich eine Rumration aus, den „tot“, bis sie am 31. Juli 1970 abgeschafft wurde."
    - key: rumbullion
      source: en-GB
      text:
        en-GB: "The word rum most likely relates to rumbullion, a drink of boiled sugar cane stalks, both words appearing in English in the early 1650s."
        de-AT: "Das Wort Rum hängt wahrscheinlich mit „rumbullion“ zusammen, einem Getränk aus gekochtem Zuckerrohr. Beide Wörter tauchen Anfang der 1650er im Englischen auf."

- ingredient: brandy
  articles:
    en-GB: {title: "Brandy", revision: 1385900048}
    de-AT: {title: "Weinbrand", revision: 267263768}
  facts:
    - key: burned-wine
      source: en-GB
      text:
        en-GB: "The word brandy comes from the Dutch brandewijn, from gebrande wijn, which literally means burned wine."
        de-AT: "Das englische Wort „brandy“ kommt vom niederländischen „brandewijn“, abgeleitet von „gebrande wijn“, wörtlich gebrannter Wein."
    - key: triangle-trade
      source: en-GB
      text:
        en-GB: "In the early 16th century French brandy took over from Portuguese fortified wine in the Atlantic trade, because it was stronger and easier to ship."
        de-AT: "Im frühen 16. Jahrhundert verdrängte französischer Weinbrand im Atlantikhandel den portugiesischen Likörwein, weil er stärker und leichter zu verschiffen war."
    - key: cognac-weinbrand
      source: de-AT
      text:
        en-GB: "In 19th-century Germany all wine brandy was usually just called Cognac, and in 1900 a chemists' association proposed the name Cognac-Weinbrand for it."
        de-AT: "Im 19. Jahrhundert nannte man im deutschen Sprachraum jeden Weinbrand meist einfach Cognac. 1900 schlug ein Chemikerverband dafür den Namen „Cognac-Weinbrand“ vor."

- ingredient: apple_juice
  articles:
    en-GB: {title: "Apple juice", revision: 1379027661}
    de-AT: {title: "Apfelsaft", revision: 271681129}
  facts:
    - key: top-producers
      source: en-GB
      text:
        en-GB: "World apple juice production is led by China, followed by Poland, the United States and Germany."
        de-AT: "Bei der weltweiten Apfelsaftproduktion liegt China vorn, gefolgt von Polen, den USA und Deutschland."
    - key: two-apples
      source: en-GB
      text:
        en-GB: "Two medium McIntosh apples, a common juicing variety, give roughly 200 millilitres of juice."
        de-AT: "Zwei mittelgroße Äpfel der Sorte McIntosh, die gern für Saft verwendet wird, ergeben etwa 200 Milliliter Saft."

- ingredient: orange_juice
  articles:
    en-GB: {title: "Orange juice", revision: 1387704584}
    de-AT: {title: "Orangensaft", revision: 271692507}
  facts:
    - key: flavour-pack
      source: en-GB
      text:
        en-GB: "Long-life orange juice loses much of its taste when it is pasteurised and stripped of oxygen, so producers later add a flavour pack made from orange products."
        de-AT: "Haltbarer Orangensaft verliert beim Pasteurisieren und Entziehen des Sauerstoffs viel Aroma. Deshalb setzen Hersteller danach ein Aromapaket aus Orangenbestandteilen zu."
    - key: florida-concentrate
      source: en-GB
      text:
        en-GB: "Frozen orange juice concentrate was developed in 1948 at the University of Florida, and by 1949 Florida plants were making over 10 million gallons of it."
        de-AT: "Orangensaftkonzentrat wurde 1948 an der Universität von Florida entwickelt. Schon 1949 stellten Fabriken in Florida über 10 Millionen Gallonen davon her."

- ingredient: coffee
  articles:
    en-GB: {title: "Coffee", revision: 1386713577}
    de-AT: {title: "Kaffee", revision: 272518568}
  facts:
    - key: yemen-sufis
      source: en-GB
      text:
        en-GB: "The earliest reports of coffee drinking come from Sufis in Yemen in the middle of the 15th century, and until the late 17th century most coffee came from Yemen."
        de-AT: "Die ältesten Berichte übers Kaffeetrinken stammen von Sufis im Jemen um die Mitte des 15. Jahrhunderts. Bis ins späte 17. Jahrhundert kam der meiste Kaffee von dort."
    - key: vienna-1683
      source: en-GB
      text:
        en-GB: "Coffee reached Austria after the Battle of Vienna in 1683, when stocks of it were captured from the supplies of the defeated Ottoman army."
        de-AT: "Nach Österreich kam der Kaffee nach der Schlacht am Kahlenberg 1683, als man Vorräte aus dem Tross des geschlagenen osmanischen Heeres erbeutete."
    - key: brazil-share
      source: en-GB
      text:
        en-GB: "In 2023 Brazil grew 31 per cent of the world's coffee, more than any other country, with Vietnam in second place."
        de-AT: "2023 baute Brasilien 31 Prozent des weltweiten Kaffees an, mehr als jedes andere Land. Auf Platz zwei lag Vietnam."

- ingredient: black_tea
  articles:
    en-GB: {title: "Black tea", revision: 1382087801}
    de-AT: {title: "Schwarzer Tee", revision: 271739144}
  facts:
    - key: brick-currency
      source: en-GB
      text:
        en-GB: "Because black tea keeps its flavour for years, compressed bricks of it served as a kind of currency in Mongolia, Tibet and Siberia into the 19th century."
        de-AT: "Weil Schwarztee sein Aroma jahrelang hält, dienten gepresste Teeziegel in der Mongolei, in Tibet und Sibirien bis ins 19. Jahrhundert als Zahlungsmittel."
    - key: red-tea
      source: en-GB
      text:
        en-GB: "In China black tea is called hong cha, meaning red tea, after the colour of its oxidised leaves."
        de-AT: "In China heißt Schwarztee „hong cha“, also roter Tee, nach der Farbe der oxidierten Blätter."

- ingredient: elderflower_syrup
  articles:
    en-GB: {title: "Elderflower cordial", revision: 1365378685}
    de-AT: {title: "Schwarzer Holunder", revision: 270307934}
  facts:
    - key: roman-roots
      source: en-GB
      text:
        en-GB: "Elderflower cordial is associated with Victorian Britain, but versions of the recipe can be traced back to Roman times."
        de-AT: "Holundersirup gilt in Großbritannien als viktorianisches Getränk, Vorläufer des Rezepts lassen sich aber bis in die Römerzeit zurückverfolgen."
    - key: hollerstrauben
      source: de-AT
      text:
        en-GB: "In Bavaria and Austria the elder is called Holler, and its flowers fried in batter are known in Austria as Hollerstrauben."
        de-AT: "In Bayern und Österreich heißt der Holunder Holler, und seine in Teig herausgebackenen Blüten kennt man in Österreich als Hollerstrauben."

- ingredient: sparkling_water
  articles:
    en-GB: {title: "Mineral water", revision: 1385883728}
    de-AT: {title: "Mineralwasser", revision: 270306945}
  facts:
    - key: eu-no-disinfection
      source: en-GB
      text:
        en-GB: "In the EU, mineral water must be bottled at the spring with minimal treatment, and no disinfection or added antibacterial agents are allowed."
        de-AT: "In der EU muss Mineralwasser an der Quelle abgefüllt werden und darf kaum behandelt werden. Desinfektion und keimhemmende Zusätze sind verboten."
    - key: 4000-brands
      source: en-GB
      text:
        en-GB: "People once travelled to springs to take the waters at spas, but today mineral water is bottled at the source, and there are more than 4,000 brands worldwide."
        de-AT: "Früher reiste man zu den Quellen, um in Kurbädern das Wasser zu trinken. Heute wird es an der Quelle abgefüllt, weltweit gibt es über 4.000 Marken."

- ingredient: espresso
  articles:
    en-GB: {title: "Espresso", revision: 1385651996}
    de-AT: {title: "Espresso", revision: 271199431}
  facts:
    - key: 45-seconds
      source: en-GB
      text:
        en-GB: "The first espresso machines by Bezzera and Pavoni in 1906 needed 45 seconds to make a single cup, made expressly for one customer."
        de-AT: "Die ersten Espressomaschinen von Bezzera und Pavoni brauchten 1906 für eine einzelne Tasse 45 Sekunden, eigens für einen Gast gebrüht."
    - key: crema-caffe
      source: en-GB
      text:
        en-GB: "Modern espresso with hot water forced through under pressure was pioneered by Gaggia in the 1940s and was first sold as crema caffè, after its foam."
        de-AT: "Den modernen Espresso, bei dem heißes Wasser mit Druck durchgepresst wird, entwickelte Gaggia in den 1940ern. Wegen des Schaums hieß er anfangs „crema caffè“."

- ingredient: green_tea
  articles:
    en-GB: {title: "Green tea", revision: 1386631330}
    de-AT: {title: "Grüner Tee", revision: 272417255}
  facts:
    - key: unoxidised
      source: en-GB
      text:
        en-GB: "Green and black tea come from the same plant, Camellia sinensis; green tea simply skips the withering and oxidation that turn the leaves dark."
        de-AT: "Grüner und schwarzer Tee stammen von derselben Pflanze, Camellia sinensis. Beim Grüntee fallen nur das Welken und die Oxidation weg, die die Blätter dunkel machen."
    - key: steamed-vs-panfired
      source: en-GB
      text:
        en-GB: "Chinese green tea was originally steamed, as it still is in Japan, but since the early Ming dynasty it has usually been pan-fired in a dry wok."
        de-AT: "Chinesischer Grüntee wurde ursprünglich gedämpft, wie in Japan bis heute. Seit der frühen Ming-Zeit röstet man ihn meist in einem trockenen Wok."
    - key: china-share
      source: en-GB
      text:
        en-GB: "As of 2015 China supplied 80 per cent of the world's green tea market and exported 325,000 tonnes in that year."
        de-AT: "2015 lieferte China 80 Prozent des Weltmarkts für grünen Tee und exportierte in diesem Jahr 325.000 Tonnen."

- ingredient: vodka
  articles:
    en-GB: {title: "Vodka", revision: 1383167842}
    de-AT: {title: "Wodka", revision: 272224500}
  facts:
    - key: little-water
      source: de-AT
      text:
        en-GB: "The word vodka is a diminutive of the Slavic word for water, so it literally means something like 'little water'."
        de-AT: "Das Wort Wodka ist eine Verkleinerungsform des slawischen Worts für Wasser und bedeutet also so viel wie „Wässerchen“."
    - key: forty-percent
      source: en-GB
      text:
        en-GB: "Standard vodka has been bottled at 40% alcohol since the 1890s, while the European Union only demands a minimum of 37.5%."
        de-AT: "Seit den 1890er-Jahren hat Standardwodka 40 Prozent Alkohol, die Europäische Union verlangt allerdings nur mindestens 37,5 Prozent."

- ingredient: gin
  articles:
    en-GB: {title: "Gin", revision: 1386356110}
    de-AT: {title: "Gin", revision: 266582220}
  facts:
    - key: salerno-monks
      source: en-GB
      text:
        en-GB: "Gin began as a medicinal liquor made by monks and alchemists in 12th-century Salerno, Italy, long before it became England's national spirit."
        de-AT: "Gin begann im 12. Jahrhundert als Heilschnaps von Mönchen und Alchemisten im italienischen Salerno, lange bevor er zu Englands Nationalgetränk wurde."
    - key: gin-craze
      source: en-GB
      text:
        en-GB: "After import limits on French brandy, gin swept England during the so-called Gin Craze, which lasted from 1695 to 1735."
        de-AT: "Nach Einfuhrbeschränkungen für französischen Brandy erfasste England der sogenannte Gin Craze, ein wahrer Ginrausch von 1695 bis 1735."
    - key: juniper-name
      source: de-AT
      text:
        en-GB: "The name gin goes back to the Old French word for juniper, the berry that must flavour every gin."
        de-AT: "Der Name Gin geht auf das altfranzösische Wort für Wacholder zurück, jene Beere, die jedem Gin seinen Geschmack gibt."

- ingredient: port
  articles:
    en-GB: {title: "Port wine", revision: 1384891691}
    de-AT: {title: "Portwein", revision: 269837648}
  facts:
    - key: stopped-fermentation
      source: en-GB
      text:
        en-GB: "Port gets its sweetness because fermentation is stopped early by adding neutral grape spirit, leaving sugar behind and about 19 to 22% alcohol."
        de-AT: "Portwein bleibt süß, weil die Gärung früh durch Zugabe von neutralem Traubenbrand gestoppt wird. Zurück bleiben Restzucker und etwa 19 bis 22 Prozent Alkohol."
    - key: down-the-douro
      source: de-AT
      text:
        en-GB: "Port is grown in the Douro valley but named after the city of Porto, where it was traditionally shipped downriver from Peso da Régua to mature."
        de-AT: "Portwein wächst im Douro-Tal, heißt aber nach der Stadt Porto, wohin er traditionell von Peso da Régua flussabwärts zum Reifen verschifft wurde."

- ingredient: amaretto
  articles:
    en-GB: {title: "Amaretto", revision: 1350652126}
    de-AT: {title: "Amaretto", revision: 271515927}
  facts:
    - key: little-bitter
      source: en-GB
      text:
        en-GB: "Amaretto means 'a little bitter' in Italian, and the liqueur comes from the Italian town of Saronno."
        de-AT: "Amaretto heißt auf Italienisch „ein wenig bitter“, und der Likör stammt aus der italienischen Stadt Saronno."
    - key: benzaldehyde
      source: en-GB
      text:
        en-GB: "Many amarettos contain no almonds at all: apricot kernels or peach stones give the same marzipan flavour, because all of them contain benzaldehyde."
        de-AT: "Viele Amarettos enthalten gar keine Mandeln. Marillenkerne oder Pfirsichsteine liefern dasselbe Marzipanaroma, denn sie alle enthalten Benzaldehyd."

- ingredient: cider
  articles:
    en-GB: {title: "Cider", revision: 1387640252}
    de-AT: {title: "Most (Getränk)", revision: 268311636}
  facts:
    - key: highest-consumption
      source: en-GB
      text:
        en-GB: "Britain and Ireland together drink more cider per head than anywhere else in the world, and they are home to the largest cider makers."
        de-AT: "Großbritannien und Irland trinken gemeinsam pro Kopf mehr Cider als jedes andere Land der Welt und beherbergen die größten Cider-Hersteller."
    - key: mostbirnen
      source: de-AT
      text:
        en-GB: "In the Mostviertel and Upper Austria, Most is traditionally pressed mainly from tannin-rich perry pears, with apples, quinces or service tree fruit added."
        de-AT: "Im Mostviertel und in Oberösterreich wird Most traditionell vor allem aus gerbstoffreichen Mostbirnen gekeltert, ergänzt um Äpfel, Quitten oder Speierling."
    - key: four-styles
      source: de-AT
      text:
        en-GB: "The Mostviertel growers' association sorts its Most into four styles of taste: mild, halbmild, kräftig and resch."
        de-AT: "Der Verband der Mostbauern im Mostviertel teilt den Most in vier Geschmacksrichtungen ein: mild, halbmild, kräftig und resch."

- ingredient: kirsch
  articles:
    en-GB: {title: "Kirsch", revision: 1352793658}
    de-AT: {title: "Kirschwasser", revision: 266987506}
  facts:
    - key: stones-in
      source: en-GB
      text:
        en-GB: "Kirsch is fermented with the cherry stones still inside, and unlike cherry liqueur it contains no added sweetness."
        de-AT: "Kirschwasser wird mitsamt den Kirschkernen vergoren und ist, anders als Kirschlikör, nicht gesüßt."
    - key: serving-temperature
      source: de-AT
      text:
        en-GB: "Kirschwasser is ideally drunk at 14 to 16 °C, and it is the spirit behind both Black Forest gateau and the Swiss Zug cherry cake."
        de-AT: "Kirschwasser trinkt man idealerweise bei 14 bis 16 °C, und es steckt sowohl in der Schwarzwälder als auch in der Zuger Kirschtorte."

- ingredient: tonic_water
  articles:
    en-GB: {title: "Tonic water", revision: 1385912871}
    de-AT: {title: "Tonic Water", revision: 269996583}
  facts:
    - key: malaria
      source: en-GB
      text:
        en-GB: "Tonic water was originally a way to take quinine against malaria; modern versions contain much less quinine and much more sugar."
        de-AT: "Tonic Water war ursprünglich ein Mittel, um Chinin gegen Malaria einzunehmen. Heutige Sorten enthalten viel weniger Chinin und deutlich mehr Zucker."
    - key: glows-uv
      source: de-AT
      text:
        en-GB: "Because of the quinine it contains, tonic water glows under ultraviolet light."
        de-AT: "Wegen des enthaltenen Chinins leuchtet Tonic Water unter UV-Licht."

- ingredient: cola
  articles:
    en-GB: {title: "Cola", revision: 1387641151}
    de-AT: {title: "Cola", revision: 269819550}
  facts:
    - key: kola-nut
      source: en-GB
      text:
        en-GB: "Cola is named after the kola nut, which supplied the caffeine, although most colas today get their caffeine from other sources."
        de-AT: "Cola ist nach der Kolanuss benannt, die das Koffein lieferte, auch wenn die meisten Colas ihr Koffein heute aus anderen Quellen beziehen."
    - key: pemberton-coca
      source: en-GB
      text:
        en-GB: "John Stith Pemberton's 1886 recipe still contained coca leaf extract, and it was inspired by a coca wine created by Angelo Mariani in 1863."
        de-AT: "John Stith Pembertons Rezept von 1886 enthielt noch Extrakt aus Kokablättern und war von einem Kokawein inspiriert, den Angelo Mariani 1863 erfunden hatte."

- ingredient: lemonade
  articles:
    en-GB: {title: "Lemonade", revision: 1387497256}
    de-AT: {title: "Limonade", revision: 271273604}
  facts:
    - key: kracherl
      source: de-AT
      text:
        en-GB: "In parts of Bavaria and Austria, fizzy lemonade is also called Kracherl, and in its original sense lemonade simply meant lemon juice diluted with water."
        de-AT: "In Teilen Bayerns und Österreichs heißt Limonade auch Kracherl. Ursprünglich bedeutete das Wort einfach mit Wasser verdünnten Zitronensaft."
    - key: ade-suffix
      source: en-GB
      text:
        en-GB: "The ending of lemonade has been borrowed for other fruit drinks too, giving us limeade, orangeade and cherryade."
        de-AT: "Die Endung von Lemonade wurde im Englischen auch für andere Fruchtgetränke übernommen, daher gibt es dort Limeade, Orangeade und Cherryade."

- ingredient: grape_juice
  articles:
    en-GB: {title: "Grape juice", revision: 1384011330}
    de-AT: {title: "Traubenmost", revision: 259502490}
  facts:
    - key: concord
      source: en-GB
      text:
        en-GB: "In North America, most purple grape juice is made from the Concord grape, a native American species and not the European wine grape."
        de-AT: "In Nordamerika wird violetter Traubensaft meist aus der Concord-Traube gepresst, einer amerikanischen Art und nicht der europäischen Weinrebe."
    - key: young-wine
      source: de-AT
      text:
        en-GB: "Freshly pressed grape juice is called must, from the Latin vinum mustum, meaning 'young wine'."
        de-AT: "Frisch gepresster Traubensaft heißt Most, nach dem lateinischen vinum mustum, was „junger Wein“ bedeutet."

- ingredient: sherry
  articles:
    en-GB: {title: "Sherry", revision: 1377689311}
    de-AT: {title: "Sherry", revision: 267335345}
  facts:
    - key: xeres-sack
      source: en-GB
      text:
        en-GB: "The word sherry is an English rendering of Xérès, the old name of Jerez; before that, the English called the wine sack."
        de-AT: "Das Wort Sherry ist eine englische Abwandlung von Xérès, dem alten Namen von Jerez. Davor nannten die Engländer den Wein „Sack“."
    - key: flor
      source: en-GB
      text:
        en-GB: "Fino and manzanilla age under flor, a yeast-like layer that protects the wine from too much oxidation."
        de-AT: "Fino und Manzanilla reifen unter dem Flor, einer hefeartigen Schicht, die den Wein vor zu starker Oxidation schützt."
    - key: first-do-1933
      source: en-GB
      text:
        en-GB: "In 1933, Jerez became the first Spanish wine region to receive official denominación de origen status."
        de-AT: "1933 wurde Jerez als erste spanische Weinregion offiziell mit einer Denominación de Origen ausgezeichnet."

- ingredient: vermouth
  articles:
    en-GB: {title: "Vermouth", revision: 1387860966}
    de-AT: {title: "Wermut (Getränk)", revision: 271422347}
  facts:
    - key: turin
      source: en-GB
      text:
        en-GB: "Modern vermouth was first made in Turin in the 18th century, where fashionable cafés served it to guests around the clock."
        de-AT: "Der moderne Wermut entstand im 18. Jahrhundert in Turin, wo ihn elegante Cafés ihren Gästen rund um die Uhr servierten."
    - key: wormwood
      source: de-AT
      text:
        en-GB: "Vermouth owes its name to wormwood, Artemisia absinthium, whose bitter compounds shape its taste."
        de-AT: "Seinen Namen verdankt der Wermut dem Wermutkraut, Artemisia absinthium, dessen Bitterstoffe den Geschmack deutlich prägen."

- ingredient: marsala
  articles:
    en-GB: {title: "Marsala wine", revision: 1382991268}
    de-AT: {title: "Marsala (Wein)", revision: 270409760}
  facts:
    - key: woodhouse-1773
      source: en-GB
      text:
        en-GB: "Marsala owes its fame to the Liverpool merchant John Woodhouse, who landed in Marsala in 1773 and found a wine like the port and sherry England loved."
        de-AT: "Seinen Ruhm verdankt der Marsala dem Kaufmann John Woodhouse aus Liverpool, der 1773 in Marsala landete und einen Wein fand, der Port und Sherry ähnelte."
    - key: doc-1969
      source: en-GB
      text:
        en-GB: "Marsala received DOC status in 1969, and unfortified wine from the same area does not qualify for the name."
        de-AT: "Marsala erhielt 1969 den DOC-Status, und ungespriteter Wein aus derselben Gegend darf den Namen nicht tragen."

- ingredient: whisky
  articles:
    en-GB: {title: "Whisky", revision: 1388239637}
    de-AT: {title: "Whisky", revision: 269864083}
  facts:
    - key: uisce
      source: en-GB
      text:
        en-GB: "Whisky goes back to the Gaelic uisce beatha, a translation of the Latin aqua vitae, 'water of life'."
        de-AT: "Whisky geht auf das gälische uisce beatha zurück, eine Übersetzung des lateinischen aqua vitae, „Lebenswasser“."
    - key: second-hand-casks
      source: en-GB
      text:
        en-GB: "Whisky is often aged in casks that previously held port, rum or sherry, which adds its own flavour and colour."
        de-AT: "Whisky reift oft in Fässern, in denen zuvor Portwein, Rum oder Sherry lag. Das verleiht ihm zusätzliches Aroma und Farbe."
    - key: whiskey-spelling
      source: de-AT
      text:
        en-GB: "In Ireland and the USA the spirit is mostly spelled whiskey, with an e."
        de-AT: "In Irland und in den USA schreibt man den Brand überwiegend Whiskey, mit e."

- ingredient: tequila
  articles:
    en-GB: {title: "Tequila", revision: 1372454846}
    de-AT: {title: "Tequila", revision: 263194558}
  facts:
    - key: 300-million
      source: en-GB
      text:
        en-GB: "More than 300 million blue agave plants are harvested every year in the red volcanic soils around the town of Tequila in Jalisco."
        de-AT: "Rund um die Stadt Tequila in Jalisco werden auf roter Vulkanerde jedes Jahr mehr als 300 Millionen blaue Agaven geerntet."
    - key: unesco-landscape
      source: en-GB
      text:
        en-GB: "The agave landscape and old distilleries around Tequila were declared a UNESCO World Heritage Site in 2006."
        de-AT: "Die Agavenlandschaft und die alten Brennereien rund um Tequila wurden 2006 zum UNESCO-Welterbe erklärt."
    - key: only-blue-agave
      source: en-GB
      text:
        en-GB: "Tequila is a kind of mezcal, but unlike other agave spirits it may only be made from the blue agave."
        de-AT: "Tequila ist eine Art Mezcal, darf aber anders als andere Agavenbrände nur aus der blauen Agave hergestellt werden."

- ingredient: fruit_brandy
  articles:
    en-GB: {title: "Fruit brandy", revision: 1385903726}
    de-AT: {title: "Obstbrand", revision: 272522405}
  facts:
    - key: label-order
      source: de-AT
      text:
        en-GB: "A mixed fruit brandy must list its fruits on the label in descending order of quantity, for example apples before pears."
        de-AT: "Ein gemischter Obstler muss seine Früchte auf dem Etikett nach Menge absteigend nennen, etwa „aus Äpfeln und Birnen“."
    - key: no-grapes
      source: en-GB
      text:
        en-GB: "Strictly speaking, spirits from grapes are not fruit brandies; the term covers apples, pears, apricots, plums, cherries and other fruit."
        de-AT: "Streng genommen zählen Brände aus Trauben nicht zu den Obstbränden. Gemeint sind Äpfel, Birnen, Marillen, Zwetschken, Kirschen und anderes Obst."

- ingredient: egg_liqueur
  articles:
    en-GB: {title: "Advocaat", revision: 1386361123}
    de-AT: {title: "Eierlikör", revision: 270188351}
  facts:
    - key: advocaat-rule
      source: de-AT
      text:
        en-GB: "Only egg liqueur with at least 140 g of egg yolk per litre may be sold under the name advocaat."
        de-AT: "Nur Eierlikör mit mindestens 140 g Eigelb pro Liter darf als Advocaat verkauft werden."
    - key: dutch-origin
      source: en-GB
      text:
        en-GB: "Advocaat is a traditional Dutch drink of eggs, sugar and brandy with a custard-like texture, usually at 14 to 20% alcohol."
        de-AT: "Advocaat ist ein traditionelles niederländisches Getränk aus Eiern, Zucker und Brandy, cremig wie Vanillepudding und meist mit 14 bis 20 Prozent Alkohol."

- ingredient: raspberry_syrup
  articles:
    en-GB: {title: "Syrup", revision: 1384250240}
    de-AT: {title: "Sirup", revision: 265199550}
  facts:
    - key: sharab
      source: en-GB
      text:
        en-GB: "The word syrup comes via Latin from the Arabic sharāb, meaning a drink or wine."
        de-AT: "Das Wort Sirup kommt über das Lateinische vom arabischen šarāb, was „Trank“ bedeutet."
    - key: hydrogen-bonds
      source: en-GB
      text:
        en-GB: "Syrup is thick because the many hydroxyl groups of dissolved sugar form countless hydrogen bonds with each other."
        de-AT: "Sirup ist dickflüssig, weil die vielen Hydroxygruppen des gelösten Zuckers unzählige Wasserstoffbrücken miteinander bilden."

- ingredient: herbal_tea
  articles:
    en-GB: {title: "Herbal tea", revision: 1380210240}
    de-AT: {title: "Kräutertee", revision: 255533436}
  facts:
    - key: not-tea
      source: en-GB
      text:
        en-GB: "Herbal tea is not technically tea at all, because it is not brewed from the tea plant Camellia sinensis; the proper term is tisane."
        de-AT: "Kräutertee ist streng genommen gar kein Tee, weil er nicht aus der Teepflanze Camellia sinensis aufgebrüht wird. Fachlich heißt er Tisane."
    - key: caffeine-exceptions
      source: en-GB
      text:
        en-GB: "Most herbal teas are naturally caffeine-free, although a number of the plants used for them do contain stimulants such as caffeine."
        de-AT: "Die meisten Kräutertees sind von Natur aus koffeinfrei, einige der verwendeten Pflanzen enthalten aber durchaus anregende Stoffe wie Koffein."

- ingredient: seitan
  articles:
    en-GB: {title: "Seitan", revision: 1376828927}
    de-AT: {title: "Seitan", revision: 270060720}
  facts:
    - key: sixth-century
      source: en-GB
      text:
        en-GB: "Wheat gluten first appeared in the 6th century as an ingredient in Chinese noodles, and Buddhist restaurants have long served it as mock meat."
        de-AT: "Weizengluten taucht erstmals im 6. Jahrhundert als Zutat chinesischer Nudeln auf, und buddhistische Lokale servieren es seit Langem als Fleischersatz."
    - key: ohsawa-1962
      source: de-AT
      text:
        en-GB: "The name seitan began as a Japanese product name, created in 1962 by macrobiotic teacher George Ohsawa; it reached the USA in 1969."
        de-AT: "Seitan war ursprünglich ein japanischer Produktname, 1962 vom Makrobiotik-Lehrer George Ohsawa geschaffen. 1969 kam Seitan erstmals in die USA."

- ingredient: nori
  articles:
    en-GB: {title: "Nori", revision: 1376659213}
    de-AT: {title: "Nori", revision: 266328763}
  facts:
    - key: papermaking
      source: en-GB
      text:
        en-GB: "Nori sheets are made by shredding red algae and drying them on racks, a process that resembles papermaking."
        de-AT: "Noriblätter entstehen, indem Rotalgen zerkleinert und auf Gestellen getrocknet werden, ganz ähnlich wie bei der Papierherstellung."
    - key: currency
      source: en-GB
      text:
        en-GB: "Nori was not farmed until the 1600s, but in Japan it was already used as food, shrine offerings and even currency from the 700s."
        de-AT: "Nori wird erst seit dem 17. Jahrhundert gezüchtet, diente in Japan aber schon ab dem 8. Jahrhundert als Speise, Opfergabe in Schreinen und sogar als Zahlungsmittel."

- ingredient: nutritional_yeast
  articles:
    en-GB: {title: "Nutritional yeast", revision: 1386867099}
    de-AT: {title: "Nährhefe", revision: 255419973}
  facts:
    - key: red-star-1950
      source: en-GB
      text:
        en-GB: "Nutritional yeast was first sold in the United States in 1950 by the Red Star brand; fans nickname it 'nooch'."
        de-AT: "Hefeflocken wurden 1950 von der Marke Red Star erstmals in den USA verkauft. Fans nennen sie dort liebevoll „nooch“."
    - key: dead-yeast
      source: de-AT
      text:
        en-GB: "Yeast flakes are yeast deactivated by heat, and vegan cooking uses them as a cheese substitute for their cheesy flavour."
        de-AT: "Hefeflocken sind durch Hitze inaktivierte Hefe. In der veganen Küche dienen sie wegen ihrer käsigen Note oft als Käseersatz."

- ingredient: pizza_dough
  articles:
    en-GB: {title: "Pizza", revision: 1387307227}
    de-AT: {title: "Pizza", revision: 270644520}
  facts:
    - key: gaeta-997
      source: en-GB
      text:
        en-GB: "The word pizza was first recorded in AD 997, in a Latin manuscript from the southern Italian town of Gaeta."
        de-AT: "Das Wort Pizza ist erstmals im Jahr 997 belegt, in einer lateinischen Handschrift aus der süditalienischen Stadt Gaeta."
    - key: unesco-pizzaiuolo
      source: de-AT
      text:
        en-GB: "Since 2017, the Neapolitan art of the pizza maker has been on UNESCO's list of intangible cultural heritage."
        de-AT: "Seit 2017 steht die neapolitanische Kunst des Pizzabäckers auf der UNESCO-Liste des immateriellen Kulturerbes."
    - key: knife-and-fork
      source: en-GB
      text:
        en-GB: "In Italian restaurants, pizza is served unsliced and eaten with a knife and fork."
        de-AT: "In italienischen Restaurants kommt die Pizza ungeschnitten auf den Tisch und wird mit Messer und Gabel gegessen."

- ingredient: smoked_tofu
  articles:
    en-GB: {title: "Tofu", revision: 1387325521}
    de-AT: {title: "Tofu", revision: 272443249}
  facts:
    - key: 2000-years
      source: en-GB
      text:
        en-GB: "Tofu originated in China and has been eaten for more than 2,000 years."
        de-AT: "Tofu stammt aus China und wird seit über 2.000 Jahren gegessen."
    - key: bean-cheese
      source: de-AT
      text:
        en-GB: "In German, tofu used to be called Bohnenkäse, 'bean cheese', and is still sometimes known as Bohnenquark."
        de-AT: "Auf Deutsch hieß Tofu früher Bohnenkäse und wird bis heute manchmal Bohnenquark genannt."

- ingredient: silken_tofu
  articles:
    en-GB: {title: "Tofu", revision: 1387325521}
    de-AT: {title: "Tofu", revision: 272443249}
  facts:
    - key: not-pressed
      source: en-GB
      text:
        en-GB: "Most tofu is pressed into blocks, but in Japanese raw silken tofu the curds are never pressed, which keeps it so smooth."
        de-AT: "Der meiste Tofu wird zu Blöcken gepresst. Beim japanischen rohen Seidentofu wird der Bruch dagegen gar nicht gepresst, deshalb bleibt er so glatt."
    - key: nigari
      source: en-GB
      text:
        en-GB: "The Japanese coagulant nigari is mainly magnesium chloride from seawater, and its name comes from nigai, the word for bitter."
        de-AT: "Das japanische Gerinnungsmittel Nigari besteht vor allem aus Magnesiumchlorid aus Meerwasser. Sein Name kommt von nigai, „bitter“."
    - key: tofu-hyakuchin
      source: en-GB
      text:
        en-GB: "A Japanese book from 1782, Tofu Hyakuchin, already listed 100 recipes for cooking tofu."
        de-AT: "Schon 1782 erschien in Japan das Buch Tofu Hyakuchin mit 100 Rezepten für Tofu."

- ingredient: plant_based_mince
  articles:
    en-GB: {title: "Meat alternative", revision: 1386822990}
    de-AT: {title: "Fleischersatz", revision: 271598115}
  facts:
    - key: many-bases
      source: en-GB
      text:
        en-GB: "Meat substitutes are made from very different bases: soy as in tofu, wheat gluten as in seitan, pea protein or the fungus-based mycoprotein."
        de-AT: "Fleischersatz entsteht aus ganz unterschiedlichen Grundstoffen: Soja wie bei Tofu, Weizengluten wie bei Seitan, Erbsenprotein oder Mykoprotein aus Pilzen."
    - key: oyster-mushrooms
      source: de-AT
      text:
        en-GB: "The idea of meat substitutes is broad: it even covers firm mushrooms such as oyster mushrooms and vegetables like celeriac."
        de-AT: "Der Begriff Fleischersatz ist weit gefasst. Dazu zählen sogar festfleischige Pilze wie Austernseitlinge und Gemüse wie Sellerie."

- ingredient: hummus
  articles:
    en-GB: {title: "Hummus", revision: 1383627639}
    de-AT: {title: "Hummus", revision: 272188027}
  facts:
    - key: means-chickpea
      source: en-GB
      text:
        en-GB: "Hummus is simply the Arabic word for chickpeas; the full name of the dip is hummus bi tahini."
        de-AT: "Hummus ist schlicht das arabische Wort für Kichererbse. Der volle Name des Dips lautet Hummus bi Tahini."
    - key: aleppo-cookbook
      source: en-GB
      text:
        en-GB: "The earliest written mention of hummus appears in a 13th-century cookbook attributed to the historian Ibn al-Adim of Aleppo."
        de-AT: "Die früheste schriftliche Erwähnung von Hummus findet sich in einem Kochbuch aus dem 13. Jahrhundert, das dem Historiker Ibn al-Adim aus Aleppo zugeschrieben wird."

- ingredient: oat_cream
  articles:
    en-GB: {title: "Oat milk", revision: 1386545009}
    de-AT: {title: "Hafermilch", revision: 271979753}
  facts:
    - key: swedish-1990s
      source: en-GB
      text:
        en-GB: "Oat drinks are young compared with other plant milks: they were developed in the 1990s by Swedish scientists Angeliki Triantafyllou and Rickard Öste."
        de-AT: "Haferdrinks sind jünger als andere Pflanzendrinks: Erst in den 1990er-Jahren entwickelten die schwedischen Forschenden Angeliki Triantafyllou und Rickard Öste das Getränk."
    - key: enzymes-malt-sugar
      source: de-AT
      text:
        en-GB: "In classic oat drink production, the oats are ground with water and enzymes are added to turn their starch into malt sugar."
        de-AT: "Für klassische Haferdrinks wird Hafer mit Wasser vermahlen, und zugesetzte Enzyme wandeln die Haferstärke in Malzzucker um."

- ingredient: soy_cream
  articles:
    en-GB: {title: "Soy milk", revision: 1382757012}
    de-AT: {title: "Sojamilch", revision: 272299074}
  facts:
    - key: tofu-intermediate
      source: en-GB
      text:
        en-GB: "Soya milk started out as an intermediate product in making tofu, and is itself the base for soya cream and soya yoghurt."
        de-AT: "Sojamilch war ursprünglich ein Zwischenprodukt der Tofuherstellung und ist selbst die Grundlage für Sojakochcreme und Sojajoghurt."
    - key: not-milk-eu
      source: de-AT
      text:
        en-GB: "In the EU, soya products may not legally be sold as milk, which is why they carry names like soya drink."
        de-AT: "In der EU dürfen Sojaprodukte nicht als Milch verkauft werden, deshalb heißen sie im Handel etwa „Sojadrink“."

- ingredient: soy_yoghurt
  articles:
    en-GB: {title: "Soy yogurt", revision: 1304324163}
    de-AT: {title: "Sojajoghurt", revision: 257063760}
  facts:
    - key: yofu
      source: en-GB
      text:
        en-GB: "Soya yoghurt is sometimes called yofu, a blend of the words yoghurt and tofu."
        de-AT: "Sojajoghurt wird im Englischen manchmal „Yofu“ genannt, ein Kofferwort aus Yoghurt und Tofu."

- ingredient: edam
  articles:
    en-GB: {title: "Edam cheese", revision: 1385276258}
    de-AT: {title: "Edamer", revision: 270744276}
  facts:
    - key: red-wax-sailors
      source: en-GB
      text:
        en-GB: "Edam hardens instead of spoiling as it ages, which made it the world's most popular cheese at sea and in colonies from the 14th to the 18th century."
        de-AT: "Edamer wird beim Altern hart, statt zu verderben. Das machte ihn vom 14. bis 18. Jahrhundert auf See und in Kolonien zum beliebtesten Käse der Welt."
    - key: pgi-2010
      source: de-AT
      text:
        en-GB: "Since 2010, 'Edam Holland' has been a protected geographical indication, named after the town of Edam in North Holland."
        de-AT: "Seit 2010 ist „Edam Holland“ eine geschützte geografische Angabe, benannt nach der Stadt Edam in Nordholland."

- ingredient: tilsiter
  articles:
    en-GB: {title: "Tilsit cheese", revision: 1380143172}
    de-AT: {title: "Tilsiter", revision: 267715772}
  facts:
    - key: swiss-settlers
      source: en-GB
      text:
        en-GB: "Tilsit cheese was created in the mid-19th century by the Westphal family, Swiss settlers from the Emmental living in East Prussia."
        de-AT: "Tilsiter wurde Mitte des 19. Jahrhunderts von der Familie Westphal erfunden, Schweizer Siedlern aus dem Emmental in Ostpreußen."
    - key: sovetsk
      source: de-AT
      text:
        en-GB: "Tilsiter is named after the East Prussian town of Tilsit, which today is Sovetsk in Russia."
        de-AT: "Der Tilsiter ist nach der ostpreußischen Stadt Tilsit benannt, dem heutigen Sowetsk in Russland."

- ingredient: smoked_cheese
  articles:
    en-GB: {title: "Smoked cheese", revision: 1383014838}
    de-AT: {title: "Geräucherter Käse", revision: 266137510}
  facts:
    - key: cold-hot
      source: en-GB
      text:
        en-GB: "Cheese can be cold-smoked at 20 to 30 °C, which can take up to a month, or hot-smoked at 40 to 90 °C."
        de-AT: "Käse wird entweder kalt bei 20 bis 30 °C geräuchert, was bis zu einem Monat dauern kann, oder heiß bei 40 bis 90 °C."
    - key: fake-smoke
      source: en-GB
      text:
        en-GB: "Cheaper smoked cheeses often never see a smokehouse: they get artificial smoke flavouring and food colouring for the brown rind."
        de-AT: "Günstiger Räucherkäse sieht oft nie eine Räucherkammer. Er bekommt künstliches Raucharoma und Lebensmittelfarbe für die braune Rinde."

- ingredient: processed_cheese
  articles:
    en-GB: {title: "Processed cheese", revision: 1377720722}
    de-AT: {title: "Schmelzkäse", revision: 271962451}
  facts:
    - key: calcium-chelator
      source: en-GB
      text:
        en-GB: "The emulsifier in processed cheese actually works as a calcium chelator, and the product is typically only 50 to 60% cheese."
        de-AT: "Der Emulgator im Schmelzkäse wirkt eigentlich als Calciumbinder, und das Produkt besteht meist nur zu 50 bis 60 Prozent aus Käse."
    - key: eckerlkaese
      source: de-AT
      text:
        en-GB: "In Austria, processed cheese wedges are also called Eckerlkäse, while the Swiss know processed cheese as Schachtelkäse."
        de-AT: "In Österreich heißen die Schmelzkäseecken auch Eckerlkäse, in der Schweiz nennt man Schmelzkäse Schachtelkäse."

- ingredient: char
  articles:
    en-GB: {title: "Arctic char", revision: 1387140670}
    de-AT: {title: "Seesaibling", revision: 262301399}
  facts:
    - key: most-northerly
      source: en-GB
      text:
        en-GB: "The Arctic char is the world's most northerly freshwater fish, yet it is also native to cold alpine lakes."
        de-AT: "Der Wandersaibling ist der nördlichste Süßwasserfisch der Welt und kommt zugleich in kalten Alpenseen vor."
    - key: schwarzreuter
      source: de-AT
      text:
        en-GB: "Alpine char grow 40 to 75 cm long, but small alpine lakes hold dwarf forms known as Schwarzreuter."
        de-AT: "Seesaiblinge werden 40 bis 75 Zentimeter lang, in kleinen Alpenseen leben aber kleinwüchsige Formen, die Schwarzreuter heißen."
    - key: umbla-2009
      source: de-AT
      text:
        en-GB: "For a long time the alpine char was lumped in with the Arctic char; only in 2009 was its own name, Salvelinus umbla, confirmed."
        de-AT: "Lange galt der Seesaibling als dieselbe Art wie der arktische Wandersaibling. Erst 2009 wurde sein eigener Name Salvelinus umbla bestätigt."

- ingredient: wels_catfish
  articles:
    en-GB: {title: "Wels catfish", revision: 1387912445}
    de-AT: {title: "Europäischer Wels", revision: 271642683}
  facts:
    - key: largest-freshwater
      source: de-AT
      text:
        en-GB: "The wels catfish is the largest purely freshwater fish in Europe and is regionally also called Waller."
        de-AT: "Der Wels ist der größte reine Süßwasserfisch Europas und wird regional auch Waller genannt."
    - key: eats-birds
      source: de-AT
      text:
        en-GB: "Welses hunt mostly at night and dusk; besides fish they occasionally take small water birds and mammals."
        de-AT: "Welse jagen vor allem nachts und in der Dämmerung. Neben Fischen erbeuten sie gelegentlich auch kleine Wasservögel und Säugetiere."

- ingredient: sea_bream
  articles:
    en-GB: {title: "Gilt-head bream", revision: 1387172717}
    de-AT: {title: "Goldbrasse", revision: 270567182}
  facts:
    - key: only-sparus
      source: de-AT
      text:
        en-GB: "The gilt-head bream is the only species in its genus Sparus, and it has been prized as a food fish since antiquity."
        de-AT: "Die Goldbrasse ist die einzige Art ihrer Gattung Sparus und schon seit der Antike als Speisefisch geschätzt."
    - key: dorade-name
      source: de-AT
      text:
        en-GB: "Its German market name Dorade comes from the French daurade, and Italians call the same fish orata."
        de-AT: "Der Handelsname Dorade stammt vom französischen Daurade, in Italien heißt derselbe Fisch Orata."

- ingredient: redfish
  articles:
    en-GB: {title: "Sebastes norvegicus", revision: 1386384410}
    de-AT: {title: "Rotbarsch", revision: 265544071}
  facts:
    - key: ascanius-1772
      source: de-AT
      text:
        en-GB: "The redfish was described as early as 1772 by the Norwegian naturalist Peder Ascanius, who named it Perca norvegica."
        de-AT: "Der Rotbarsch wurde schon 1772 vom norwegischen Naturforscher Peder Ascanius beschrieben, der ihn Perca norvegica nannte."
    - key: slow-growing
      source: en-GB
      text:
        en-GB: "The Atlantic redfish is a rockfish of the North Atlantic that grows slowly and matures late, which makes its fishery delicate."
        de-AT: "Der Rotbarsch ist ein Drachenkopf des Nordatlantiks, der langsam wächst und spät geschlechtsreif wird."

- ingredient: matjes
  articles:
    en-GB: {title: "Soused herring", revision: 1374399365}
    de-AT: {title: "Matjes", revision: 268283307}
  facts:
    - key: immature-enzymes
      source: en-GB
      text:
        en-GB: "Matjes are made from young herring that ripen in brine for a few days, softened by the fish's own pancreatic enzymes."
        de-AT: "Matjes werden aus jungen Heringen gemacht, die einige Tage in Salzlake reifen und dabei von fischeigenen Enzymen zart werden."
    - key: dutch-middle-ages
      source: de-AT
      text:
        en-GB: "The matjes method was developed in the Netherlands in the Middle Ages, and Dutch matjes is now a guaranteed traditional speciality."
        de-AT: "Das Matjesverfahren wurde im Mittelalter in den Niederlanden entwickelt, und Holländischer Matjes ist heute eine garantiert traditionelle Spezialität."

- ingredient: crayfish
  articles:
    en-GB: {title: "Astacus astacus", revision: 1387132101}
    de-AT: {title: "Edelkrebs", revision: 272467923}
  facts:
    - key: largest-native
      source: de-AT
      text:
        en-GB: "The noble crayfish is the largest crayfish species native to Europe, and it can live for 15 to 20 years."
        de-AT: "Der Edelkrebs ist die größte in Europa heimische Krebsart und kann 15 bis 20 Jahre alt werden."
    - key: clean-water
      source: en-GB
      text:
        en-GB: "The European crayfish lives only in fresh, unpolluted streams, rivers and lakes; males grow up to 16 cm long."
        de-AT: "Der Edelkrebs lebt nur in sauberen Bächen, Flüssen und Seen mit Süßwasser. Männchen werden bis zu 16 cm lang."

- ingredient: halibut
  articles:
    en-GB: {title: "Halibut", revision: 1374813215}
    de-AT: {title: "Heilbutt", revision: 271454160}
  facts:
    - key: holy-flatfish
      source: en-GB
      text:
        en-GB: "The name halibut comes from haly (holy) and butte (flatfish), because it was popular on Catholic holy days."
        de-AT: "Der englische Name halibut kommt von haly (heilig) und butte (Plattfisch), weil der Fisch an katholischen Feiertagen beliebt war."
    - key: largest-flatfish
      source: de-AT
      text:
        en-GB: "The Atlantic halibut is the largest flatfish, reaching up to 3 metres and 400 kg, and it can live for up to 50 years."
        de-AT: "Der Atlantische Heilbutt ist der größte Plattfisch, wird bis zu 3 Meter lang und 400 kg schwer und kann bis zu 50 Jahre alt werden."

- ingredient: sole
  articles:
    en-GB: {title: "Common sole", revision: 1387706878}
    de-AT: {title: "Seezunge", revision: 262856802}
  facts:
    - key: dover
      source: en-GB
      text:
        en-GB: "Dover sole is named after the English port of Dover, which landed more sole than any other in the 19th century."
        de-AT: "Der englische Name Dover sole stammt vom Hafen Dover, der im 19. Jahrhundert mehr Seezungen anlandete als jeder andere."
    - key: buries-itself
      source: en-GB
      text:
        en-GB: "The sole lives on sandy or muddy seabeds and often half buries itself; its upper side is greyish brown and its underside white."
        de-AT: "Die Seezunge lebt auf sandigem oder schlammigem Meeresgrund und gräbt sich oft halb ein. Oben ist sie graubraun, unten weiß."

- ingredient: octopus
  articles:
    en-GB: {title: "Octopus", revision: 1387842682}
    de-AT: {title: "Kraken", revision: 264687481}
  facts:
    - key: 300-species
      source: en-GB
      text:
        en-GB: "There are around 300 species of octopus, and their flexible bodies can squeeze through remarkably small gaps."
        de-AT: "Es gibt rund 300 Krakenarten, und ihr verformbarer Körper zwängt sich durch erstaunlich kleine Spalten."
    - key: rat-intelligence
      source: de-AT
      text:
        en-GB: "Octopuses are considered the most intelligent molluscs, with an intelligence often compared to that of rats."
        de-AT: "Kraken gelten als die intelligentesten Weichtiere, und ihre Intelligenz wird mit der von Ratten verglichen."
    - key: short-lives
      source: en-GB
      text:
        en-GB: "Most octopuses grow fast and live short lives: males usually die soon after mating, and females guard their eggs until they hatch."
        de-AT: "Die meisten Kraken wachsen schnell und leben kurz. Männchen sterben meist bald nach der Paarung, Weibchen bewachen ihre Eier bis zum Schlüpfen."

- ingredient: kaeferbohnen
  articles:
    en-GB: {title: "Phaseolus coccineus", revision: 1387351520}
    de-AT: {title: "Feuerbohne", revision: 266798956}
  facts:
    - key: fire-bean
      source: de-AT
      text:
        en-GB: "The runner bean is called fire bean in German after its bright scarlet flowers; in Austria it is known as Käferbohne."
        de-AT: "Die Feuerbohne verdankt ihren Namen den leuchtend roten Blüten. In Österreich heißt sie Käferbohne."
    - key: ornamental
      source: en-GB
      text:
        en-GB: "The scarlet runner bean is grown not only as food but also as an ornamental plant."
        de-AT: "Die Käferbohne wird nicht nur als Nahrungspflanze, sondern auch als Zierpflanze angebaut."

- ingredient: fusilli
  articles:
    en-GB: {title: "Fusilli", revision: 1380092776}
    de-AT: {title: "Fusilli", revision: 270447130}
  facts:
    - key: spindle
      source: de-AT
      text:
        en-GB: "Fusilli take their name from the Italian fuso, a spindle, and are about 4 cm long."
        de-AT: "Fusilli verdanken ihren Namen dem italienischen fuso, der Spindel, und sind etwa 4 cm lang."
    - key: rotini
      source: en-GB
      text:
        en-GB: "Fusilli come from southern Italy and are known as rotini in the United States and Canada."
        de-AT: "Fusilli stammen aus Süditalien und heißen in den USA und Kanada Rotini."

- ingredient: farfalle
  articles:
    en-GB: {title: "Farfalle", revision: 1384238198}
    de-AT: {title: "Farfalle", revision: 245983717}
  facts:
    - key: butterflies
      source: en-GB
      text:
        en-GB: "Farfalle means 'butterflies' in Italian, and in Emilia-Romagna they are called strichetti, a local word for bow ties."
        de-AT: "Farfalle heißt auf Italienisch „Schmetterlinge“. In der Emilia-Romagna nennt man sie Strichetti, ein lokales Wort für Mascherl."
    - key: sixteenth-century
      source: en-GB
      text:
        en-GB: "Farfalle date back to the 16th century in Lombardy and Emilia-Romagna; the big version is farfalloni and the tiny one farfalline."
        de-AT: "Farfalle gibt es seit dem 16. Jahrhundert in der Lombardei und der Emilia-Romagna. Die großen heißen Farfalloni, die winzigen Farfalline."

- ingredient: rigatoni
  articles:
    en-GB: {title: "Rigatoni", revision: 1332730180}
    de-AT: {title: "Rigatoni", revision: 269876674}
  facts:
    - key: ridged
      source: en-GB
      text:
        en-GB: "Rigatoni gets its name from the Italian rigato, 'ridged', and unlike penne its ends are cut straight rather than diagonally."
        de-AT: "Rigatoni haben ihren Namen vom italienischen rigato, „gerillt“, und sind anders als Penne gerade statt schräg abgeschnitten."
    - key: sauce-grip
      source: de-AT
      text:
        en-GB: "Rigatoni are the favourite pasta of southern Italy and Sicily, because their ridges hold sauce and grated cheese better than smooth pasta."
        de-AT: "Rigatoni sind die Lieblingsnudel Süditaliens und Siziliens, weil Sauce und geriebener Käse an ihren Rillen besser haften als an glatten Nudeln."

- ingredient: macaroni
  articles:
    en-GB: {title: "Macaroni", revision: 1384669350}
    de-AT: {title: "Makkaroni", revision: 260895048}
  facts:
    - key: extrusion-curve
      source: en-GB
      text:
        en-GB: "Elbow macaroni get their curve because the dough is extruded at different speeds on opposite sides of the tube."
        de-AT: "Gebogene Makkaroni entstehen, weil der Teig an den gegenüberliegenden Seiten der Röhre unterschiedlich schnell aus der Maschine gepresst wird."
    - key: us-law
      source: en-GB
      text:
        en-GB: "US federal rules define three shapes of dried pasta, macaroni, spaghetti and vermicelli, as 'macaroni product'."
        de-AT: "US-Bundesvorschriften fassen drei getrocknete Nudelformen, nämlich Makkaroni, Spaghetti und Vermicelli, als „Makkaroni-Produkt“ zusammen."
    - key: magronen
      source: de-AT
      text:
        en-GB: "In Switzerland, macaroni are also called Magronen."
        de-AT: "In der Schweiz heißen Makkaroni auch Magronen."

- ingredient: soup_noodles
  articles:
    en-GB: {title: "Noodle soup", revision: 1358909044}
    de-AT: {title: "Nudelsuppe", revision: 252728406}
  facts:
    - key: han-dynasty
      source: en-GB
      text:
        en-GB: "The oldest written record of noodles, from China's Han dynasty, describes a noodle soup called tang bing."
        de-AT: "Die älteste schriftliche Erwähnung von Nudeln stammt aus der chinesischen Han-Dynastie und beschreibt eine Nudelsuppe namens Tang Bing."
    - key: starter-or-main
      source: de-AT
      text:
        en-GB: "In European cooking noodle soup is mostly a starter, while across Asia dishes like pho, ramen or udon are a full main course."
        de-AT: "In der europäischen Küche ist die Nudelsuppe meist Vorspeise, in Asien dagegen sind Gerichte wie Phở, Ramen oder Udon eine ganze Hauptmahlzeit."

- ingredient: spaetzle
  articles:
    en-GB: {title: "Spätzle", revision: 1383235282}
    de-AT: {title: "Spätzle", revision: 271737306}
  facts:
    - key: stirred-not-kneaded
      source: de-AT
      text:
        en-GB: "Unlike pasta dough, Spätzle batter is stirred rather than kneaded, then scraped or pressed straight into boiling salted water."
        de-AT: "Anders als Nudelteig wird Spätzleteig gerührt und nicht geknetet und dann direkt ins siedende Salzwasser geschabt oder gedrückt."
    - key: nokedli
      source: en-GB
      text:
        en-GB: "Spätzle are known well beyond Swabia: in Hungary the same egg pasta is called nokedli."
        de-AT: "Spätzle kennt man weit über Schwaben hinaus. In Ungarn heißt dieselbe Eierteigware Nokedli."

- ingredient: spaghettini
  articles:
    en-GB: {title: "Spaghetti", revision: 1386269527}
  facts:
    - key: thinner-spaghetti
      source: en-GB
      text:
        en-GB: "Spaghettini are simply a thinner form of spaghetti, so they need less time in the pot than the regular strands."
        de-AT: "Spaghettini sind einfach eine dünnere Form der Spaghetti und brauchen deshalb weniger Zeit im Kochtopf als die normalen Stränge."
    - key: naples-is-thinner
      source: en-GB
      text:
        en-GB: "Thin is relative: spaghetti in Naples is thinner than in the United States, and even spaghettini are still thicker than the Neapolitan kind."
        de-AT: "Dünn ist relativ: In Neapel sind Spaghetti dünner als in den USA, und selbst Spaghettini sind noch dicker als die neapolitanische Variante."

- ingredient: linguine
  articles:
    en-GB: {title: "Linguine", revision: 1377710150}
  facts:
    - key: little-tongues
      source: en-GB
      text:
        en-GB: "The name linguine is Italian for little tongues, from the Latin lingua. The strands have an elliptical rather than a round or flat cross-section."
        de-AT: "Der Name Linguine bedeutet auf Italienisch „Zünglein“ und geht auf das lateinische lingua zurück. Der Querschnitt ist elliptisch, weder rund noch flach."
    - key: genoese-festive-dish
      source: en-GB
      text:
        en-GB: "Linguine was first documented in 18th-century Genoa, where it was served with basil pesto, green beans and potatoes as a festive Ligurian family dish."
        de-AT: "Linguine wurden erstmals im Genua des 18. Jahrhunderts beschrieben, als festliches Essen ligurischer Familien mit Basilikumpesto, Fisolen und Erdäpfeln."
    - key: seafood-favourite
      source: en-GB
      text:
        en-GB: "At about 4 mm wide, linguine sits between spaghetti and fettuccine, and Neapolitans prefer it for seafood because sauces cling to its flat surface."
        de-AT: "Mit etwa 4 mm Breite liegen Linguine zwischen Spaghetti und Fettuccine. In Neapel nimmt man sie am liebsten für Meeresfrüchte, weil die Sauce gut haftet."

- ingredient: bucatini
  articles:
    en-GB: {title: "Bucatini", revision: 1368524370}
  facts:
    - key: hole-in-the-name
      source: en-GB
      text:
        en-GB: "Bucatini take their name from the Italian buco, meaning hole: each thick strand has a narrow channel running right through the middle."
        de-AT: "Bucatini haben ihren Namen vom italienischen buco, „Loch“: Durch jeden dicken Strang läuft der Länge nach ein feiner Kanal."
    - key: amatriciana-partner
      source: en-GB
      text:
        en-GB: "Bucatini are a Roman favourite and one of the classic partners for amatriciana sauce, traditionally made with guanciale, cured pork jowl."
        de-AT: "Bucatini sind in Rom sehr beliebt und klassische Partner der Amatriciana, die traditionell mit Guanciale gekocht wird, gepökelter Schweinebacke."
    - key: extruded-not-rolled
      source: en-GB
      text:
        en-GB: "Unlike ribbon pasta, bucatini cannot be rolled and cut. The dough has to be pressed through a perforated die, much like a meat grinder, to form the tubes."
        de-AT: "Anders als Bandnudeln lassen sich Bucatini nicht ausrollen und schneiden. Der Teig wird wie bei einem Fleischwolf durch eine Lochscheibe gepresst."

- ingredient: capellini
  articles:
    en-GB: {title: "Capellini", revision: 1368524619}
    de-AT: {title: "Capellini", revision: 260828389}
  facts:
    - key: under-a-millimetre
      source: en-GB
      text:
        en-GB: "Capellini measure only 0.85 to 0.92 mm across, which makes them a natural match for broths and light seafood or vegetable sauces."
        de-AT: "Capellini messen nur 0,85 bis 0,92 mm im Durchmesser und passen deshalb am besten in Suppen oder zu leichten Saucen mit Fisch oder Gemüse."
    - key: little-hairs
      source: de-AT
      text:
        en-GB: "The name capellini means little hairs in Italian, and with a cooking time of about three minutes they are among the fastest pasta shapes to cook."
        de-AT: "Der Name Capellini bedeutet so viel wie „Härchen“. Mit etwa drei Minuten Kochzeit zählen sie zu den Nudeln, die am schnellsten fertig sind."
    - key: since-the-14th-century
      source: en-GB
      text:
        en-GB: "The even finer angel hair pasta, capelli d'angelo, has been popular in Italy since at least the 14th century."
        de-AT: "Die noch feineren Engelshaar-Nudeln, Capelli d’angelo, sind in Italien schon mindestens seit dem 14. Jahrhundert beliebt."

- ingredient: fettuccine
  articles:
    en-GB: {title: "Fettuccine", revision: 1383086471}
  facts:
    - key: alfredo-performance
      source: en-GB
      text:
        en-GB: "Fettuccine Alfredo was created at a restaurant in Rome in the early 20th century, where it was prepared at the table as a kind of performance."
        de-AT: "Fettuccine Alfredo entstanden Anfang des 20. Jahrhunderts in einem Restaurant in Rom, wo man sie als kleine Vorführung direkt am Tisch zubereitete."
    - key: cream-is-american
      source: en-GB
      text:
        en-GB: "In the United States fettuccine Alfredo is made with cream, a version that is almost unknown in Italy."
        de-AT: "In den USA kommen Fettuccine Alfredo mit Obers auf den Tisch, eine Variante, die man in Italien kaum kennt."
    - key: one-egg-per-100g
      source: en-GB
      text:
        en-GB: "Traditional fettuccine is an egg pasta, usually made with one egg for every 100 g of flour, and is a little wider and thicker than Bolognese tagliatelle."
        de-AT: "Klassische Fettuccine sind Eiernudeln, meist mit einem Ei pro 100 g Mehl, und etwas breiter und dicker als die Tagliatelle aus Bologna."

- ingredient: pappardelle
  articles:
    en-GB: {title: "Pappardelle", revision: 1368524935}
    de-AT: {title: "Pappardelle", revision: 258050800}
  facts:
    - key: to-gobble-up
      source: en-GB
      text:
        en-GB: "Pappardelle probably owe their name to the Italian verb pappare, to gobble up. The broad ribbons come from Tuscany."
        de-AT: "Pappardelle verdanken ihren Namen wohl dem italienischen Verb pappare, „futtern“. Die breiten Bandnudeln stammen aus der Toskana."
    - key: sold-in-nests
      source: en-GB
      text:
        en-GB: "Fresh pappardelle are two to three centimetres wide. Dried ones are sold in nests so they do not break and separate easily in the boiling water."
        de-AT: "Frische Pappardelle sind zwei bis drei Zentimeter breit. Getrocknete werden als Nester verkauft, damit sie nicht brechen und sich im Wasser gut lösen."
    - key: wild-boar-ragu
      source: de-AT
      text:
        en-GB: "In Tuscany pappardelle are typically served with a ragù, for example ragù di cinghiale made with minced wild boar."
        de-AT: "In der Toskana isst man Pappardelle gern mit Ragù, zum Beispiel mit Ragù di cinghiale aus faschiertem Wildschweinfleisch."

- ingredient: tagliolini
  articles:
    en-GB: {title: "Tagliolini", revision: 1368525310}
  facts:
    - key: to-cut
      source: en-GB
      text:
        en-GB: "Tagliolini is a diminutive of the Italian tagliare, to cut: the thin ribbons are cut from a sheet of dough, like tagliatelle but much narrower."
        de-AT: "Tagliolini ist eine Verkleinerungsform von tagliare, „schneiden“: Die feinen Bänder werden wie Tagliatelle aus einer Teigplatte geschnitten, nur schmaler."
    - key: tajarin-with-truffles
      source: en-GB
      text:
        en-GB: "In Piedmont tagliolini are called tajarin and made with egg dough. A classic way to serve them is with butter and truffles."
        de-AT: "Im Piemont heißen Tagliolini tajarin und werden aus Eierteig gemacht. Klassisch serviert man sie mit Butter und Trüffeln."

- ingredient: spaghetti_chitarra
  articles:
    en-GB: {title: "Spaghetti alla chitarra", revision: 1384448310}
  facts:
    - key: the-guitar
      source: en-GB
      text:
        en-GB: "Spaghetti alla chitarra are named after the chitarra, a frame strung with parallel wires. The rolled dough is pressed through the wires to cut it."
        de-AT: "Spaghetti alla chitarra sind nach der Chitarra benannt, einem Rahmen mit parallel gespannten Drähten. Der ausgerollte Teig wird durch die Drähte gedrückt."
    - key: square-strands
      source: en-GB
      text:
        en-GB: "Because they are cut from a sheet rather than extruded, these Abruzzo egg noodles have a square cross-section instead of a round one."
        de-AT: "Weil sie aus einer Teigplatte geschnitten und nicht gepresst werden, haben diese Eiernudeln aus den Abruzzen einen eckigen statt runden Querschnitt."
    - key: teramo-meatballs
      source: en-GB
      text:
        en-GB: "Around Teramo in Abruzzo, the traditional sauce for chitarra is tomato with tiny beef meatballs, the so-called pallottine."
        de-AT: "Rund um Teramo in den Abruzzen isst man Chitarra traditionell mit Paradeisersauce und winzigen Rindfleischbällchen, den sogenannten Pallottine."

- ingredient: mafaldine
  articles:
    en-GB: {title: "Mafaldine", revision: 1387042379}
    de-AT: {title: "Mafalde", revision: 244711164}
  facts:
    - key: princess-mafalda
      source: en-GB
      text:
        en-GB: "Mafaldine were named in honour of the birth of Princess Mafalda of Savoy, which is why they are also called reginette, little queens."
        de-AT: "Mafaldine wurden zu Ehren der Geburt von Prinzessin Mafalda von Savoyen benannt. Daher kommt auch ihr zweiter Name Reginette, „kleine Königinnen“."
    - key: renamed-in-1902
      source: de-AT
      text:
        en-GB: "Before the early 20th century this Neapolitan pasta was known in Campania under other names. It took the name mafalde in 1902."
        de-AT: "Vor dem 20. Jahrhundert kannte man diese Pasta aus Neapel in Kampanien unter anderen Namen. Den Namen Mafalde bekam sie erst 1902."
    - key: wavy-edges
      source: de-AT
      text:
        en-GB: "The wavy edges of mafalde stay firmer than the middle after cooking, giving an uneven bite that suits meat sauces such as ragù napoletano."
        de-AT: "Die gewellten Ränder bleiben nach dem Kochen fester als die Mitte. Diese ungleichmäßige Konsistenz passt gut zu Fleischsaucen wie dem Ragù napoletano."

- ingredient: ziti
  articles:
    en-GB: {title: "Ziti", revision: 1371490922}
  facts:
    - key: wedding-pasta
      source: en-GB
      text:
        en-GB: "Ziti translates as brides or grooms. In Sicily it used to be served with stewed pork at weddings of every social class."
        de-AT: "Ziti heißt übersetzt „Bräute“ oder „Bräutigame“. In Sizilien kamen sie früher bei Hochzeiten aller Schichten mit geschmortem Schweinefleisch auf den Tisch."
    - key: epiphany-belief
      source: en-GB
      text:
        en-GB: "In Molise there is a popular belief that eating ziti on the Feast of the Epiphany keeps the devil away from your deathbed."
        de-AT: "In Molise glaubt man, dass einem der Teufel am Sterbebett nicht erscheint, wenn man am Dreikönigstag Ziti isst."
    - key: box-of-ziti
      source: en-GB
      text:
        en-GB: "In New York a box of ziti became slang for 1,000 dollars after the phrase was used in the television series The Sopranos."
        de-AT: "In New York wurde „a box of ziti“ zum Slangausdruck für 1.000 Dollar, nachdem die Fernsehserie „Die Sopranos“ die Wendung bekannt gemacht hatte."

- ingredient: pici
  articles:
    en-GB: {title: "Pici", revision: 1368525022}
  facts:
    - key: rolled-by-hand
      source: en-GB
      text:
        en-GB: "Pici from the province of Siena are rolled by hand into strands a little thinner than a pencil, so no two are quite the same thickness."
        de-AT: "Pici aus der Provinz Siena werden von Hand zu Strängen gerollt, etwas dünner als ein Bleistift. Darum ist kaum einer gleich dick wie der andere."
    - key: pinci-in-montalcino
      source: en-GB
      text:
        en-GB: "Around Montalcino pici are called pinci. The dough is usually just flour and water, and whether egg goes in depends on family tradition."
        de-AT: "Rund um Montalcino heißen Pici auch Pinci. Der Teig besteht meist nur aus Mehl und Wasser, ob ein Ei dazukommt, entscheidet die Familientradition."

- ingredient: bigoli
  articles:
    en-GB: {title: "Bigoli", revision: 1387639108}
  facts:
    - key: patented-press-1604
      source: en-GB
      text:
        en-GB: "In 1604 a pasta maker from Padua, Bartolomio Veronese, patented a press for making bigoli, the thick Venetian strands."
        de-AT: "1604 ließ sich der Nudelmacher Bartolomio Veronese aus Padua eine Presse für Bigoli patentieren, die dicken Nudelstränge aus Venetien."
    - key: buckwheat-and-duck-eggs
      source: en-GB
      text:
        en-GB: "Bigoli were first made with buckwheat flour. Today they are mostly made with wholewheat flour, which gives them their dark colour, and sometimes with duck eggs."
        de-AT: "Ursprünglich machte man Bigoli aus Buchweizenmehl. Heute nimmt man meist Vollkornmehl, das ihnen die dunkle Farbe gibt, manchmal auch Enteneier."
    - key: turkish-wars-theory
      source: en-GB
      text:
        en-GB: "One theory says bigoli date to the Venetian Turkish wars of the 14th century, when scarce durum wheat had to be stretched with common wheat flour."
        de-AT: "Einer Theorie nach stammen Bigoli aus den venezianischen Türkenkriegen im 14. Jahrhundert, als knapper Hartweizen mit Weichweizenmehl gestreckt wurde."

- ingredient: strozzapreti
  articles:
    en-GB: {title: "Strozzapreti", revision: 1387527569}
  facts:
    - key: priest-choker
      source: en-GB
      text:
        en-GB: "Strozzapreti literally means priest chokers. According to one legend, greedy priests ate the pasta so fast that they choked on it."
        de-AT: "Strozzapreti heißt wörtlich „Priesterwürger“. Der Legende nach aßen gierige Priester die Nudeln so hastig, dass sie sich daran verschluckten."
    - key: anticlerical-romagna
      source: en-GB
      text:
        en-GB: "The many legends behind the name strozzapreti reflect the widespread anticlerical mood among the people of Romagna and Tuscany."
        de-AT: "Die vielen Legenden um den Namen Strozzapreti spiegeln die verbreitete kirchenkritische Stimmung der Menschen in der Romagna und der Toskana wider."
    - key: pinched-by-hand
      source: en-GB
      text:
        en-GB: "Strozzapreti are made by twisting strips of dough between the palms and pinching them into pieces about 10 cm long, so no two look alike."
        de-AT: "Für Strozzapreti werden Teigstreifen zwischen den Handflächen gedreht und in etwa 10 cm lange Stücke gezwickt. Darum gleicht keine der anderen."

- ingredient: trofie
  articles:
    en-GB: {title: "Trofie", revision: 1359234777}
  facts:
    - key: born-in-sori
      source: en-GB
      text:
        en-GB: "Trofie are believed to come from Sori, a town near Genoa. In 2019 trofie di Sori received the De.Co. label, which recognises products closely tied to their local area."
        de-AT: "Trofie stammen vermutlich aus Sori, einem Ort bei Genua. 2019 erhielten die Trofie di Sori das De.Co.-Siegel, für Produkte mit enger Bindung an ihre Heimat."
    - key: wood-shavings
      source: en-GB
      text:
        en-GB: "Each trofia is rolled from a small piece of dough and twisted into a spiral with tapered ends, a shape compared to wood shavings or a corkscrew."
        de-AT: "Jede Trofia wird aus einem kleinen Teigstück gerollt und zu einer Spirale mit spitzen Enden gedreht. Die Form erinnert an Hobelspäne oder einen Korkenzieher."
    - key: made-for-pesto
      source: en-GB
      text:
        en-GB: "In Ligurian cooking trofie are most often served with pesto, and their name may come from a Ligurian verb meaning to rub."
        de-AT: "In der ligurischen Küche isst man Trofie meist mit Pesto. Der Name kommt vielleicht von einem ligurischen Verb, das „reiben“ bedeutet."

- ingredient: busiate
  articles:
    en-GB: {title: "Busiate", revision: 1368524534}
  facts:
    - key: grass-stem
      source: en-GB
      text:
        en-GB: "Busiate get their name and their spiral shape from busa, the Sicilian word for the stem of a local grass around which the dough is coiled."
        de-AT: "Busiate haben Namen und Spiralform von busa, dem sizilianischen Wort für den Halm eines heimischen Grases, um den der Teig gewickelt wird."
    - key: pesto-trapanese
      source: en-GB
      text:
        en-GB: "Busiate come from the province of Trapani and are traditionally served with pesto alla trapanese, made with almonds, tomatoes, garlic and basil."
        de-AT: "Busiate kommen aus der Provinz Trapani und werden traditionell mit Pesto alla trapanese serviert, aus Mandeln, Paradeisern, Knoblauch und Basilikum."
    - key: in-the-dictionary
      source: en-GB
      text:
        en-GB: "The word busiate was officially added to the Italian Zingarelli dictionary in its 2026 edition."
        de-AT: "Das Wort Busiate wurde mit der Ausgabe 2026 offiziell in das italienische Wörterbuch Zingarelli aufgenommen."

- ingredient: tortiglioni
  articles:
    en-GB: {title: "Tortiglioni", revision: 1296432695}
  facts:
    - key: to-twist
      source: en-GB
      text:
        en-GB: "Tortiglioni take their name from the Latin torquere, to twist, after the grooves that spiral around each tube."
        de-AT: "Tortiglioni haben ihren Namen vom lateinischen torquere, „drehen“, wegen der Rillen, die sich spiralförmig um jede Röhre winden."
    - key: bigger-than-rigatoni
      source: en-GB
      text:
        en-GB: "Tortiglioni look like rigatoni but are larger, and their grooves are deeper."
        de-AT: "Tortiglioni ähneln Rigatoni, sind aber größer und haben tiefere Rillen."

- ingredient: paccheri
  articles:
    en-GB: {title: "Paccheri", revision: 1369338874}
  facts:
    - key: slaps
      source: en-GB
      text:
        en-GB: "Paccheri comes from the Neapolitan word for slaps, and the name has been linked to the slapping sound the big tubes can make when eaten."
        de-AT: "Paccheri kommt vom neapolitanischen Wort für „Ohrfeigen“. Der Name wird mit dem klatschenden Geräusch in Verbindung gebracht, das die Röhren beim Essen machen."
    - key: split-open
      source: en-GB
      text:
        en-GB: "These very large tubes from Campania often split open as they are eaten and turn into flat sheets on the fork."
        de-AT: "Diese sehr großen Röhren aus Kampanien platzen beim Essen oft auf und liegen dann als flache Teigblätter auf der Gabel."
    - key: ricotta-and-tomato
      source: en-GB
      text:
        en-GB: "In Campania paccheri are commonly made with beans, or with ricotta and tomato sauce, and they can also be stuffed."
        de-AT: "In Kampanien isst man Paccheri gern mit Bohnen oder mit Ricotta und Paradeisersauce, man kann sie aber auch füllen."

- ingredient: calamarata
  articles:
    en-GB: {title: "Calamarata", revision: 1346179978}
  facts:
    - key: looks-like-squid
      source: en-GB
      text:
        en-GB: "Calamarata are thick pasta rings that are often dyed black with squid ink so that they look like sliced calamari."
        de-AT: "Calamarata sind dicke Nudelringe, die oft mit Sepiatinte schwarz gefärbt werden, damit sie wie in Ringe geschnittene Calamari aussehen."

- ingredient: sedani
  articles:
    en-GB: {title: "Sedani", revision: 1358224337}
  facts:
    - key: smooth-or-ridged
      source: en-GB
      text:
        en-GB: "Sedani are slightly larger than macaroni with a similar gentle bend, and come either smooth (lisce) or ridged (rigati)."
        de-AT: "Sedani sind etwas größer als Makkaroni, ähnlich leicht gebogen und entweder glatt (lisce) oder gerillt (rigati) erhältlich."

- ingredient: mezze_maniche
  articles:
    en-GB: {title: "List of pasta", revision: 1382639734}
  facts:
    - key: half-sleeves
      source: en-GB
      text:
        en-GB: "Mezze maniche means half sleeves in Italian, a fitting name for these short tubes, which are about half the length of rigatoni."
        de-AT: "Mezze maniche heißt auf Italienisch „halbe Ärmel“. Der Name passt zu den kurzen Röhren, die nur etwa halb so lang wie Rigatoni sind."

- ingredient: ditalini
  articles:
    en-GB: {title: "Ditalini", revision: 1331179687}
  facts:
    - key: small-thimbles
      source: en-GB
      text:
        en-GB: "Ditalini means small thimbles, a good description of these short tubes, which have also been called very short macaroni."
        de-AT: "Ditalini bedeutet „kleine Fingerhüte“, eine treffende Beschreibung dieser kurzen Röhrchen, die man auch schon als sehr kurze Makkaroni bezeichnet hat."
    - key: fits-on-a-spoon
      source: en-GB
      text:
        en-GB: "Ditalini are a classic in soups such as pasta e fagioli, because they are small enough to fit well on a spoon."
        de-AT: "Ditalini sind ein Klassiker in Suppen wie Pasta e fagioli, weil sie so klein sind, dass sie gut auf einen Löffel passen."
    - key: peas-inside
      source: en-GB
      text:
        en-GB: "In Campania ditalini are often paired with peas or beans, which get lodged inside the little tubes."
        de-AT: "In Kampanien kombiniert man Ditalini oft mit Erbsen oder Bohnen, die sich im Inneren der kleinen Röhrchen verfangen."

- ingredient: garganelli
  articles:
    en-GB: {title: "Garganelli", revision: 1297558206}
    de-AT: {title: "Garganelli", revision: 262713171}
  facts:
    - key: ridged-board
      source: en-GB
      text:
        en-GB: "Garganelli from Emilia-Romagna are made by rolling a square of egg pasta into a tube over a ridged wooden board, which gives them their grooves."
        de-AT: "Garganelli aus der Emilia-Romagna entstehen, indem man ein Quadrat Eierteig über einem geriffelten Holzbrett aufrollt. So bekommen sie ihre Rillen."
    - key: legend-of-1725
      source: de-AT
      text:
        en-GB: "According to legend, a cook in 1725 had to improvise when his pets ate the filling for his cappelletti, so he rolled the dough squares into tubes."
        de-AT: "Der Legende nach musste ein Koch im Jahr 1725 improvisieren, weil seine Haustiere die Füllung für die Cappelletti gefressen hatten. Also rollte er die Teigquadrate zu Röhren."
    - key: two-to-one-dough
      source: de-AT
      text:
        en-GB: "Garganelli dough is unusual: it uses soft wheat flour and durum wheat semolina in a ratio of 2 to 1, bound with egg."
        de-AT: "Der Teig für Garganelli ist besonders: Er besteht im Verhältnis 2:1 aus Weichweizenmehl und Hartweizengrieß und wird mit Ei gebunden."

- ingredient: cannelloni
  articles:
    en-GB: {title: "Cannelloni", revision: 1383981064}
  facts:
    - key: large-reeds
      source: en-GB
      text:
        en-GB: "Cannelloni is Italian for large reeds. Stuffed pasta is mentioned as early as 1770, but the word cannelloni seems to date from around 1900."
        de-AT: "Cannelloni bedeutet auf Italienisch „große Rohre“. Gefüllte Nudeln werden schon 1770 erwähnt, das Wort Cannelloni taucht aber erst um 1900 auf."
    - key: catalan-saint-stephen
      source: en-GB
      text:
        en-GB: "In Catalonia cannelloni are called canelons and are traditionally eaten on Saint Stephen's Day."
        de-AT: "In Katalonien heißen Cannelloni Canelons und werden traditionell am Stephanitag gegessen."
    - key: manicotti
      source: en-GB
      text:
        en-GB: "Manicotti are the American version of cannelloni. One suggested difference is that cannelloni are sheets rolled around the filling, while manicotti are filled tubes."
        de-AT: "Manicotti sind die amerikanische Version der Cannelloni. Ein möglicher Unterschied: Cannelloni sind um die Füllung gerollte Teigplatten, Manicotti gefüllte Röhren."

- ingredient: elbow_macaroni
  articles:
    en-GB: {title: "Macaroni", revision: 1384669350}
  facts:
    - key: bent-by-extrusion
      source: en-GB
      text:
        en-GB: "The bend in elbow macaroni is made by the machine: the dough is pushed out faster on one side of the tube than the other, so the pasta curls as it leaves the die."
        de-AT: "Die Biegung der Hörnchennudeln entsteht in der Maschine: Der Teig wird auf einer Seite der Röhre schneller herausgepresst als auf der anderen, dadurch krümmt sich die Nudel."
    - key: blessed-ones
      source: en-GB
      text:
        en-GB: "Most scholars trace the word macaroni to the Greek makaria, which is linked to makares, meaning the blessed ones or the blessed dead."
        de-AT: "Das Wort Makkaroni führen die meisten Fachleute auf das griechische makaria zurück, verwandt mit makares, den „Seligen“ oder seligen Toten."
    - key: makerouns-1390
      source: en-GB
      text:
        en-GB: "English first recorded the word as makerouns in The Forme of Cury of 1390, a cookbook that also holds the earliest recipe for macaroni and cheese."
        de-AT: "Im Englischen taucht das Wort erstmals 1390 als „makerouns“ in der Forme of Cury auf, einem Kochbuch, das auch das älteste Rezept für Makkaroni mit Käse enthält."

- ingredient: conchiglie
  articles:
    en-GB: {title: "Conchiglie", revision: 1368441381}
  facts:
    - key: seashell-and-conch
      source: en-GB
      text:
        en-GB: "Conchiglie is Italian for seashells, and the word shares its Greek root with the English conch."
        de-AT: "Conchiglie heißt auf Italienisch Muscheln, und das Wort hat dieselbe griechische Wurzel wie das englische „conch“."
    - key: abissine-controversy
      source: en-GB
      text:
        en-GB: "In 2021 the maker La Molisana advertised conchiglie under the old name abissine, a nod to Mussolini's occupation of Abyssinia. After a backlash it apologised and dropped the name."
        de-AT: "2021 bewarb der Hersteller La Molisana Conchiglie unter dem alten Namen „abissine“, einer Anspielung auf Mussolinis Besetzung Abessiniens. Nach heftiger Kritik entschuldigte sich die Firma."
    - key: natural-colours
      source: en-GB
      text:
        en-GB: "Besides the plain durum wheat kind, conchiglie are sold in colours made with natural pigments such as tomato extract, spinach extract or squid ink."
        de-AT: "Neben der schlichten Variante aus Hartweizen gibt es Conchiglie in Farben aus natürlichen Pigmenten, etwa Paradeiser- oder Spinatextrakt oder Sepiatinte."

- ingredient: conchiglioni
  articles:
    en-GB: {title: "List of pasta", revision: 1382639734}
  facts:
    - key: large-shells
      source: en-GB
      text:
        en-GB: "Conchiglioni simply means large shells: they are the big version of conchiglie, made roomy enough to be stuffed."
        de-AT: "Conchiglioni bedeutet einfach große Muscheln: Es ist die große Ausgabe der Conchiglie, geräumig genug, um gefüllt zu werden."
    - key: from-campania
      source: en-GB
      text:
        en-GB: "The list of Italian pasta shapes credits conchiglioni to Campania, the southern region around Naples."
        de-AT: "In der Liste der italienischen Pastaformen werden Conchiglioni Kampanien zugeordnet, der süditalienischen Region rund um Neapel."

- ingredient: lumache
  articles:
    en-GB: {title: "List of pasta", revision: 1382639734}
  facts:
    - key: snails
      source: en-GB
      text:
        en-GB: "Lumache means snails: the pieces are shaped like snail shells and are larger than the similar gomiti or pipe."
        de-AT: "Lumache heißt Schnecken: Die Nudeln haben die Form von Schneckenhäusern und sind größer als die ähnlichen Gomiti oder Pipe."
    - key: many-names
      source: en-GB
      text:
        en-GB: "Few shapes have as many relatives in name as lumache. Lumachelle, lumaconi, chifferini, pipette and tofarelle are all listed as related forms."
        de-AT: "Kaum eine Form hat so viele Namensvettern wie Lumache: Lumachelle, Lumaconi, Chifferini, Pipette und Tofarelle zählen alle zur Verwandtschaft."

- ingredient: orecchiette
  articles:
    en-GB: {title: "Orecchiette", revision: 1355490900}
    de-AT: {title: "Orecchiette", revision: 272273698}
  facts:
    - key: thumb-shaped-ears
      source: en-GB
      text:
        en-GB: "Orecchiette means little ears. By hand, a small cube of dough is dragged across the board with a knife and then turned inside out over the thumb."
        de-AT: "Orecchiette heißt Öhrchen. Von Hand wird ein kleiner Teigwürfel mit dem Messer über das Brett gezogen und dann über dem Daumen umgestülpt."
    - key: pasta-grannies-of-bari
      source: en-GB
      text:
        en-GB: "In Bari Vecchia, especially along Via dell'Arco Basso, women have long made orecchiette by hand and sold them from tables outside their front doors."
        de-AT: "In der Altstadt von Bari, vor allem in der Via dell'Arco Basso, formen Frauen seit jeher Orecchiette von Hand und verkaufen sie an Tischen vor ihren Haustüren."
    - key: priests-ears
      source: en-GB
      text:
        en-GB: "In Cisternino they make bigger orecchiette with deep ribs, called priest's ears, and serve them on holidays with a rabbit ragù."
        de-AT: "In Cisternino formt man größere Orecchiette mit tiefen Rillen, die „Priesterohren“ heißen und an Feiertagen mit Kaninchenragù serviert werden."

- ingredient: cavatelli
  articles:
    en-GB: {title: "Cavatelli", revision: 1304509810}
  facts:
    - key: palm-sunday-parmitieddi
      source: en-GB
      text:
        en-GB: "In Teggiano in Campania, cavatelli are rolled with three fingers instead of one. These flat parmitieddi recall palm leaves and are eaten on Palm Sunday."
        de-AT: "In Teggiano in Kampanien rollt man Cavatelli mit drei Fingern statt mit einem. Die flachen „parmitieddi“ erinnern an Palmblätter und kommen am Palmsonntag auf den Tisch."
    - key: dozens-of-names
      source: en-GB
      text:
        en-GB: "Cavatelli go by dozens of local names, from cecatelli in Apulia and Campania to cavatuneddi in Sicily and pincinelle in the Marche."
        de-AT: "Cavatelli tragen Dutzende lokale Namen, von „cecatelli“ in Apulien und Kampanien über „cavatuneddi“ auf Sizilien bis „pincinelle“ in den Marken."
    - key: boiling-water-dough
      source: en-GB
      text:
        en-GB: "For softer cavatelli, the water is brought to the boil before it is worked into the flour."
        de-AT: "Für besonders weiche Cavatelli wird das Wasser erst aufgekocht und dann unter das Mehl gearbeitet."

- ingredient: casarecce
  articles:
    en-GB: {title: "Casarecce", revision: 1312453629}
  facts:
    - key: homemade-scrolls
      source: en-GB
      text:
        en-GB: "Casarecce means homemade. The short twists come from Sicily and are rolled up on themselves like a little scroll."
        de-AT: "Casarecce heißt hausgemacht. Die kurzen Nudeln stammen aus Sizilien und sind wie eine kleine Schriftrolle in sich eingerollt."
    - key: all-rounder
      source: en-GB
      text:
        en-GB: "Casarecce are an all rounder at the table: the scroll shape goes with pesto, seafood, meat sauces, cream and cheese alike."
        de-AT: "Casarecce sind echte Allrounder: Die eingerollte Form passt zu Pesto, Meeresfrüchten, Fleischsaucen genauso wie zu Obers und Käse."

- ingredient: gemelli
  articles:
    en-GB: {title: "Gemelli (pasta)", revision: 1297815596}
  facts:
    - key: not-really-twins
      source: en-GB
      text:
        en-GB: "Gemelli is Italian for twins, yet the pasta is not two strands wound together. It is a single strand with an S shaped cross section, twisted into a spiral."
        de-AT: "Gemelli heißt Zwillinge, doch die Nudel besteht nicht aus zwei Strängen. Es ist ein einziger Strang mit S-förmigem Querschnitt, der zu einer Spirale gedreht ist."
    - key: salad-pasta
      source: en-GB
      text:
        en-GB: "Gemelli are most often used in pasta salads and baked dishes, where the tight twist holds dressing and sauce."
        de-AT: "Gemelli landen am häufigsten in Nudelsalaten und Aufläufen, wo die enge Drehung Dressing und Sauce festhält."

- ingredient: cavatappi
  articles:
    en-GB: {title: "Cavatappi", revision: 1371491227}
  facts:
    - key: corkscrew
      source: en-GB
      text:
        en-GB: "Cavatappi literally means stopper extractor, the Italian word for a corkscrew, which the ridged spiral tube resembles."
        de-AT: "Cavatappi bedeutet wörtlich „Stöpselzieher“, also Korkenzieher, und genau dem ähnelt die gerillte, spiralförmige Röhre."
    - key: barilla-mistake-celentano
      source: en-GB
      text:
        en-GB: "The shape was born at Barilla in Parma in the 1970s from pasta dies made by mistake with spiral lines. Barilla named it cellentani after the singer Adriano Celentano."
        de-AT: "Die Form entstand in den 1970er Jahren bei Barilla in Parma, weil Matrizen versehentlich mit spiralförmigen Linien gefertigt wurden. Barilla nannte sie nach Adriano Celentano „cellentani“."
    - key: scoobi-doo
      source: en-GB
      text:
        en-GB: "In parts of the US and Canada cavatappi are called double elbows or scoobi doo pasta, reportedly because they look like scoubidou cord crafts."
        de-AT: "In Teilen der USA und Kanadas heißen Cavatappi „double elbows“ oder „scoobi doo“, angeblich weil sie an geflochtene Scoubidou-Bänder erinnern."

- ingredient: radiatori
  articles:
    en-GB: {title: "Radiatori", revision: 1337810536}
  facts:
    - key: old-radiators
      source: en-GB
      text:
        en-GB: "Radiatori are modelled on old heating radiators: a straight core with parallel fins running round it, which leave hollows that trap sauce."
        de-AT: "Radiatori sind alten Heizkörpern nachempfunden: ein gerader Kern mit parallelen Rippen rundherum, zwischen denen sich die Sauce fängt."
    - key: between-the-wars
      source: en-GB
      text:
        en-GB: "A popular story says an industrial designer created radiatori in the 1960s, but the shape was actually invented between the First and Second World Wars."
        de-AT: "Oft heißt es, ein Industriedesigner habe Radiatori in den 1960er Jahren erfunden. Tatsächlich entstand die Form schon zwischen dem Ersten und dem Zweiten Weltkrieg."

- ingredient: rotelle
  articles:
    en-GB: {title: "Rotelle", revision: 1381878605}
  facts:
    - key: little-wheels
      source: en-GB
      text:
        en-GB: "Rotelle means little wheels. In Italy they are also called ruote, and in the US they are often sold as wagon wheels."
        de-AT: "Rotelle heißt Rädchen. In Italien nennt man sie auch „ruote“, in den USA kennt man sie als „wagon wheels“, also Wagenräder."
    - key: apulia-around-1900
      source: en-GB
      text:
        en-GB: "Rotelle first appeared in Italy around 1900, probably in Apulia. Their spokes help them keep their shape in the pot instead of getting squashed."
        de-AT: "Rotelle tauchten um 1900 in Italien auf, vermutlich in Apulien. Dank der Speichen behalten die Rädchen beim Kochen ihre Form und werden nicht zerdrückt."

- ingredient: campanelle
  articles:
    en-GB: {title: "Campanelle", revision: 1295748189}
  facts:
    - key: bell-flower
      source: en-GB
      text:
        en-GB: "Campanelle look like a cone with a ruffled rim, much like a bell shaped flower, which is why they are also sold as gigli, meaning lilies."
        de-AT: "Campanelle sehen aus wie ein Kegel mit gewelltem Rand, ähnlich einer glockenförmigen Blüte. Deshalb werden sie auch als „gigli“ verkauft, also Lilien."
    - key: trumpets
      source: en-GB
      text:
        en-GB: "Another name for campanelle is trompetti, trumpets. The frilly cone is meant for thick sauces and baked pasta dishes."
        de-AT: "Ein weiterer Name für Campanelle ist „trompetti“, Trompeten. Der gekräuselte Trichter ist für dicke Saucen und Nudelaufläufe gedacht."

- ingredient: gnocchetti_sardi
  articles:
    en-GB: {title: "Malloreddus", revision: 1354708725}
  facts:
    - key: little-calves
      source: en-GB
      text:
        en-GB: "In Sardinian these are malloreddus. One explanation of the name links it to malloru, the Campidanese word for bull, making them little calves."
        de-AT: "Auf Sardisch heißen sie „malloreddus“. Eine Deutung leitet den Namen von „malloru“ ab, dem campidanesischen Wort für Stier, was sie zu kleinen Kälbern macht."
    - key: pressed-on-a-sieve
      source: en-GB
      text:
        en-GB: "Their stripes traditionally came from pressing each cube of dough against a straw sieve called su ciuliri. Pressed on plain wood, they stay smooth."
        de-AT: "Die Rillen bekamen sie traditionell, indem man jedes Teigstück gegen ein Strohsieb namens „su ciuliri“ drückte. Auf glattem Holz gedrückt bleiben sie glatt."
    - key: alla-campidanese
      source: en-GB
      text:
        en-GB: "The classic Sardinian dish is malloreddus alla campidanese, with a ragù of Sardinian sausage and tomato, a few strands of saffron and grated pecorino sardo."
        de-AT: "Der sardische Klassiker sind Malloreddus alla campidanese: mit einem Ragù aus sardischer Wurst und Paradeisern, ein paar Safranfäden und geriebenem Pecorino sardo."

- ingredient: maltagliati
  articles:
    en-GB: {title: "Maltagliati", revision: 1357491639}
  facts:
    - key: badly-cut
      source: en-GB
      text:
        en-GB: "Maltagliati means badly cut. In Emilia-Romagna they are made from the uneven scraps left over when dough is cut into tagliatelle."
        de-AT: "Maltagliati heißt schlecht geschnitten. In der Emilia-Romagna entstehen sie aus den unregelmäßigen Resten, die beim Schneiden von Tagliatelle übrig bleiben."
    - key: bean-soup
      source: en-GB
      text:
        en-GB: "As a thrifty food of the poor, maltagliati go into simple dishes, and their most classic use is in bean soup."
        de-AT: "Als sparsames Essen der armen Leute landen Maltagliati in einfachen Gerichten, am klassischsten in der Bohnensuppe."

- ingredient: stelline
  articles:
    en-GB: {title: "Stelline", revision: 1306992674}
    de-AT: {title: "Buchstabensuppe", revision: 260474801}
  facts:
    - key: star-with-a-hole
      source: en-GB
      text:
        en-GB: "Stelline are tiny stars with a hole in the middle, and their use is already recorded in several 19th century dictionaries."
        de-AT: "Sternchennudeln sind winzige Sterne mit einem Loch in der Mitte, und ihre Verwendung ist schon in mehreren Wörterbüchern des 19. Jahrhunderts belegt."
    - key: knorr-1884
      source: de-AT
      text:
        en-GB: "A Knorr price list from October 1884 already offered egg pasta stars, supplied by J. F. Schüle in Plüderhausen, the first German egg pasta factory."
        de-AT: "Eine Preisliste von Knorr vom Oktober 1884 führte schon „Eier-Sternchen“, geliefert von J. F. Schüle in Plüderhausen, der ersten deutschen Eierteigwarenfabrik."

- ingredient: alphabet_pasta
  articles:
    en-GB: {title: "Alphabet pasta", revision: 1378186940}
    de-AT: {title: "Buchstabensuppe", revision: 260474801}
  facts:
    - key: paris-1877
      source: en-GB
      text:
        en-GB: "As early as 1877, Paris grocers sold bits of macaroni stamped with letters of the alphabet for soup, and in 1908 Wilbur Wright was served alphabet soup in Le Mans."
        de-AT: "Schon 1877 verkauften Pariser Händler Makkaronistückchen in Buchstabenform für die Suppe, und 1908 bekam Wilbur Wright in Le Mans eine Buchstabensuppe serviert."
    - key: no-umlauts
      source: de-AT
      text:
        en-GB: "Alphabet pasta usually covers the 26 capital letters of the Latin alphabet and sometimes the digits, but national letters such as umlauts are normally left out."
        de-AT: "Buchstabennudeln umfassen meist die 26 Großbuchstaben des lateinischen Alphabets und manchmal die Ziffern, Umlaute oder Buchstaben mit Akzenten fehlen aber in der Regel."
    - key: novelty-1867
      source: de-AT
      text:
        en-GB: "In 1867 five American newspapers praised alphabet soup as a culinary novelty, noting that the pasta letters keep their shape even after cooking."
        de-AT: "1867 priesen fünf US-Zeitungen die Buchstabensuppe als kulinarische Neuheit an und hoben hervor, dass die Nudelbuchstaben auch nach dem Kochen ihre Form behalten."

- ingredient: anellini
  articles:
    de-AT: {title: "Anellini", revision: 240205276}
  facts:
    - key: little-rings
      source: de-AT
      text:
        en-GB: "Anellini is the diminutive of anelli, rings. They are only a little over a quarter of the size and look like thin slices of smooth penne."
        de-AT: "Anellini ist die Verkleinerung von Anelli, also Ringe. Die kleinen Ringe haben nur gut ein Viertel der Größe und gleichen einer dünnen Scheibe glatter Penne."
    - key: soup-only
      source: de-AT
      text:
        en-GB: "Anellini are used almost exclusively as a garnish for soup, and they cook in six to eight minutes."
        de-AT: "Anellini werden fast ausschließlich als Suppeneinlage verwendet, ihre Kochzeit liegt bei sechs bis acht Minuten."

- ingredient: acini_di_pepe
  articles:
    en-GB: {title: "Acini di pepe", revision: 1383808345}
  facts:
    - key: grape-stones
      source: en-GB
      text:
        en-GB: "Acini comes from the Latin acinus, meaning grape or grape stones, so acini di pepe translates as seeds of a pepper. The pieces are tiny cylinders of about 1 mm."
        de-AT: "Acini kommt vom lateinischen acinus, Traube oder Traubenkern, Acini di pepe heißt also „Samen des Pfeffers“. Die Stückchen sind winzige Zylinder von etwa 1 mm."

- ingredient: fregola
  articles:
    en-GB: {title: "Fregula", revision: 1379525773}
    de-AT: {title: "Fregula", revision: 271696272}
  facts:
    - key: toasted-balls
      source: en-GB
      text:
        en-GB: "Fregola is Sardinian semolina dough rolled into balls of 2 to 3 mm and toasted in the oven, which makes it similar to couscous."
        de-AT: "Fregola ist sardischer Grießteig, zu Kügelchen von 2 bis 3 mm gerollt und im Ofen geröstet. Damit ähnelt sie Couscous."
    - key: millers-statute
      source: de-AT
      text:
        en-GB: "A 14th century statute of the millers of Tempio Pausania reportedly limited fregola making to weekdays, so the water was free for watering fields at weekends."
        de-AT: "Ein Statut der Müller von Tempio Pausania aus dem 14. Jahrhundert soll die Fregula-Herstellung auf Montag bis Freitag beschränkt haben, damit das Wasser am Wochenende für die Felder blieb."
    - key: with-clams
      source: de-AT
      text:
        en-GB: "A typical way to serve fregola is with clams. In Sardinian the dish is called fregula de còciula, and it is sprinkled with powdered bottarga."
        de-AT: "Typisch ist Fregula mit Muscheln. Auf Sardisch heißt das Gericht „frègula de còciula“ und wird mit pulverisierter Bottarga bestreut."

- ingredient: tortelloni
  articles:
    en-GB: {title: "Tortelloni", revision: 1383519989}
    de-AT: {title: "Tortelloni", revision: 260493540}
  facts:
    - key: christmas-eve
      source: en-GB
      text:
        en-GB: "Classic tortelloni are filled with ricotta and herbs and no meat, rare for northern Italian pasta, which makes them a traditional Christmas Eve dish."
        de-AT: "Klassische Tortelloni sind mit Ricotta und Kräutern gefüllt, ganz ohne Fleisch, was in Norditalien selten ist. Darum sind sie ein traditionelles Gericht am Heiligen Abend."
    - key: butter-and-sage
      source: en-GB
      text:
        en-GB: "After boiling, ricotta tortelloni are traditionally tossed in melted butter with sage leaves and finished with grated Parmesan."
        de-AT: "Nach dem Kochen schwenkt man Ricotta-Tortelloni traditionell in zerlassener Butter mit Salbeiblättern und bestreut sie mit geriebenem Parmesan."
    - key: pumpkin-and-amaretti
      source: de-AT
      text:
        en-GB: "In the provinces of Ferrara, Reggio nell'Emilia and Mantua, tortelloni are filled with a pumpkin purée mixed with grated amaretti."
        de-AT: "In den Provinzen Ferrara, Reggio nell’Emilia und Mantua füllt man Tortelloni gern mit einem Kürbisbrei, dem geriebene Amaretti beigemischt werden."

- ingredient: cappelletti
  articles:
    en-GB: {title: "Cappelletti", revision: 1377924853}
  facts:
    - key: little-hats
      source: en-GB
      text:
        en-GB: "Cappelletti are named after their hat shape. Compared with tortellini they are larger, with a thicker dough and a different filling."
        de-AT: "Cappelletti verdanken ihren Namen der Hutform. Verglichen mit Tortellini sind sie größer, haben einen dickeren Teig und eine andere Füllung."
    - key: messisbugo-1556
      source: en-GB
      text:
        en-GB: "An early reference may be found in a 1556 text by Cristoforo di Messisbugo, who had cooked at the Este court in Ferrara."
        de-AT: "Ein früher Hinweis findet sich womöglich in einem Text von 1556 von Cristoforo di Messisbugo, der am Hof der Este in Ferrara gekocht hatte."
    - key: faenza-broth
      source: en-GB
      text:
        en-GB: "In Faenza, cappelletti are filled with soft cheeses, Parmesan and nutmeg but no meat, and they are eaten only in chicken broth."
        de-AT: "In Faenza füllt man Cappelletti mit Weichkäse, Parmesan und Muskat, aber ohne Fleisch, und isst sie ausschließlich in Hühnersuppe."

- ingredient: agnolotti
  articles:
    en-GB: {title: "Agnolotti", revision: 1372037381}
  facts:
    - key: plin-pinch
      source: en-GB
      text:
        en-GB: "In agnolotti del plin, plin means a pinch: the dough is pinched between thumb and forefinger between each mound of filling to seal the little parcels."
        de-AT: "Bei Agnolotti del plin bedeutet „plin“ Kniff: Zwischen den Füllungshäufchen wird der Teig mit Daumen und Zeigefinger zusammengezwickt und so verschlossen."
    - key: angiolino-legend
      source: en-GB
      text:
        en-GB: "According to legend, agnolotti are named after a cook from Montferrat called Angiolino, or Angelot, said to have invented the recipe."
        de-AT: "Der Legende nach gehen Agnolotti auf einen Koch aus dem Montferrat namens Angiolino oder Angelot zurück, der das Rezept erfunden haben soll."
    - key: donkey-filling
      source: en-GB
      text:
        en-GB: "In the historic Montferrat area of Piedmont there is a special version of agnolotti with a filling of donkey meat."
        de-AT: "Im historischen Montferrat im Piemont gibt es eine besondere Variante der Agnolotti mit einer Füllung aus Eselfleisch."

- ingredient: tortelli
  articles:
    en-GB: {title: "Tortelli", revision: 1384871367}
  facts:
    - key: hazan-birthplace
      source: en-GB
      text:
        en-GB: "Tortelli are made in Emilia-Romagna, Lombardy and Tuscany, and the cookbook author Marcella Hazan named Emilia-Romagna as their birthplace."
        de-AT: "Tortelli werden in der Emilia-Romagna, der Lombardei und der Toskana gemacht, die Kochbuchautorin Marcella Hazan sah in der Emilia-Romagna ihren Ursprung."
    - key: three-shapes
      source: en-GB
      text:
        en-GB: "Tortelli come in several shapes: square like ravioli, half moons like agnolini, or twisted into a round hat like cappelletti."
        de-AT: "Tortelli gibt es in mehreren Formen: quadratisch wie Ravioli, halbmondförmig wie Agnolini oder zu einem runden Hütchen gedreht wie Cappelletti."

- ingredient: fleckerl
  articles:
    de-AT: {title: "Schinkenfleckerl", revision: 271501146}
  facts:
    - key: mid-18th-century
      source: de-AT
      text:
        en-GB: "Fleckerl mixed with ham, the Viennese Schinkenfleckerl, were first mentioned in the middle of the 18th century."
        de-AT: "Mit Schinken vermengte Fleckerl, die Wiener Schinkenfleckerl, wurden erstmals Mitte des 18. Jahrhunderts erwähnt."
    - key: leopoldi-song
      source: de-AT
      text:
        en-GB: "Schinkenfleckerl even have their own song: Fritz Spielmann wrote it in 1936, and Hermann Leopoldi recorded one of the earliest versions on shellac that year."
        de-AT: "Schinkenfleckerl haben sogar ein eigenes Lied: Fritz Spielmann schrieb es 1936, und Hermann Leopoldi nahm im selben Jahr eine der frühesten Fassungen auf Schellack auf."

- ingredient: soy_chunks
  articles:
    en-GB: {title: "Textured vegetable protein", revision: 1371776204}
    de-AT: {title: "Texturiertes Soja", revision: 235909254}
  facts:
    - key: oil-by-product
      source: en-GB
      text:
        en-GB: "Soya chunks are a by-product of soybean oil: they are made from the defatted soy flour that is left over after the oil is extracted."
        de-AT: "Sojaschnetzel sind ein Nebenprodukt der Sojaölherstellung und bestehen aus dem entfetteten Sojamehl, das nach dem Pressen übrig bleibt."
    - key: extruder
      source: de-AT
      text:
        en-GB: "The defatted soy flour is pressed to below five per cent fat and then puffed into its meat-like shape in an extruder."
        de-AT: "Das Sojamehl wird bis knapp unter fünf Prozent Restfett ausgepresst und dann im Extruder in seine fleischähnliche Form gepufft."

- ingredient: dried_fig
  articles:
    en-GB: {title: "Fig", revision: 1384934984}
    de-AT: {title: "Echte Feige", revision: 271959502}
  facts:
    - key: turkey-production
      source: en-GB
      text:
        en-GB: "In 2020 the world produced 1.26 million tonnes of figs, and Turkey alone grew a quarter of them."
        de-AT: "2020 wurden weltweit 1,26 Millionen Tonnen Feigen geerntet, ein Viertel davon allein in der Türkei."
    - key: oldest-crops
      source: de-AT
      text:
        en-GB: "The fig is one of the oldest domesticated crops, and like all figs it relies on a complex pollination ecology."
        de-AT: "Die Echte Feige zählt zu den ältesten domestizierten Nutzpflanzen und hat, wie alle Feigen, eine komplexe Bestäubungsökologie."
    - key: 800-species
      source: en-GB
      text:
        en-GB: "The common fig is the type species of the genus Ficus, which includes more than 800 tropical and subtropical species."
        de-AT: "Die Echte Feige ist die Typusart der Gattung Ficus, zu der über 800 tropische und subtropische Arten gehören."

- ingredient: dried_mango
  articles:
    en-GB: {title: "Dried fruit", revision: 1383775222}
    de-AT: {title: "Trockenobst", revision: 270859920}
  facts:
    - key: mesopotamia
      source: en-GB
      text:
        en-GB: "Drying fruit is an ancient technique: its use goes back to the fourth millennium BC in Mesopotamia."
        de-AT: "Obst zu trocknen ist uralt. Die Tradition reicht bis ins vierte Jahrtausend vor Christus in Mesopotamien zurück."
    - key: sweetened-first
      source: en-GB
      text:
        en-GB: "Unlike raisins or dates, mango is usually soaked in a sugar syrup before drying; nearly half of all dried fruit sold is raisins."
        de-AT: "Anders als Rosinen oder Datteln wird Mango vor dem Trocknen meist in Zuckersirup eingelegt. Fast die Hälfte des verkauften Trockenobsts sind Rosinen."

- ingredient: powidl
  articles:
    en-GB: {title: "Powidl", revision: 1364160935}
    de-AT: {title: "Pflaumenmus", revision: 258461322}
  facts:
    - key: no-sugar
      source: en-GB
      text:
        en-GB: "Proper powidl contains no added sugar or gelling agent; it is cooked for hours from late plums, ideally harvested after the first frost."
        de-AT: "Echter Powidl enthält weder Zucker noch Geliermittel. Er wird stundenlang aus späten Zwetschken eingekocht, am besten nach dem ersten Frost geerntet."
    - key: communal-stirring
      source: en-GB
      text:
        en-GB: "Powidl used to be made in large batches in late autumn as a communal event, with people taking turns at the exhausting stirring."
        de-AT: "Früher wurde Powidl im Spätherbst in großen Mengen gemeinsam gekocht, und weil das Rühren so anstrengend war, wechselte man sich dabei ab."
    - key: latwerge
      source: de-AT
      text:
        en-GB: "What Austrians call Powidl is Latwerge in Switzerland and Zwetschgenhonig in parts of Hesse."
        de-AT: "Was in Österreich Powidl heißt, nennt man in der Schweiz Latwerge und in Teilen Hessens Zwetschgenhonig."

- ingredient: redcurrant_jam
  articles:
    en-GB: {title: "Redcurrant", revision: 1387942399}
    de-AT: {title: "Rote Johannisbeere", revision: 267140902}
  facts:
    - key: ribisel
      source: de-AT
      text:
        en-GB: "In Austrian German the redcurrant is the Ribisel, while Germany calls it Johannisbeere; Vorarlberg sides with Germany."
        de-AT: "Im österreichischen Deutsch heißt die Rote Johannisbeere Ribisel, in Deutschland und auch in Vorarlberg dagegen Johannisbeere."
    - key: white-is-red
      source: de-AT
      text:
        en-GB: "The white currant is not a separate species: it is only a colour variant of the redcurrant."
        de-AT: "Die Weiße Ribisel ist keine eigene Art, sondern nur eine Farbvariante der Roten Ribisel."

- ingredient: agave_syrup
  articles:
    en-GB: {title: "Agave syrup", revision: 1382950746}
    de-AT: {title: "Agavensirup", revision: 264114914}
  facts:
    - key: blue-agave
      source: en-GB
      text:
        en-GB: "Agave syrup is made from the same blue agave used for tequila, and from Agave salmiana; blue agave syrup contains 56% fructose and 12% glucose."
        de-AT: "Agavendicksaft wird aus derselben blauen Agave wie Tequila gewonnen und aus Agave salmiana. Sirup der blauen Agave enthält 56 Prozent Fruchtzucker und 12 Prozent Traubenzucker."
    - key: sweeter-than-honey
      source: de-AT
      text:
        en-GB: "Agave syrup is sweeter than honey but runnier, and in Mexico it is traditionally also used to make the fermented drink pulque."
        de-AT: "Agavendicksaft ist süßer als Honig, aber dünnflüssiger. In Mexiko wird er traditionell auch für das vergorene Getränk Pulque verwendet."

- ingredient: chili_powder
  articles:
    en-GB: {title: "Chili powder", revision: 1381259284}
    de-AT: {title: "Chilipulver", revision: 256678736}
  facts:
    - key: texas-1890
      source: de-AT
      text:
        en-GB: "The first ready-made chili powder blends were produced in Texas, in 1890 by D. C. Pendry in Fort Worth and in 1894 by William Gebhardt."
        de-AT: "Die ersten fertigen Chili-Gewürzmischungen entstanden in Texas: 1890 bei D. C. Pendry in Fort Worth und 1894 bei William Gebhardt."
    - key: two-ls
      source: en-GB
      text:
        en-GB: "American English spells it chili, while British English consistently uses chilli with two l's."
        de-AT: "Im amerikanischen Englisch schreibt man chili, im britischen Englisch durchgehend chilli mit zwei l."

- ingredient: five_spice
  articles:
    en-GB: {title: "Five-spice powder", revision: 1374817494}
    de-AT: {title: "Fünf-Gewürze-Pulver", revision: 240844196}
  facts:
    - key: five-elements
      source: en-GB
      text:
        en-GB: "The five flavours of five-spice powder are meant to reflect the five traditional Chinese elements: wood, fire, earth, metal and water."
        de-AT: "Die fünf Aromen des Fünf-Gewürze-Pulvers spiegeln die fünf traditionellen chinesischen Elemente wider: Holz, Feuer, Erde, Metall und Wasser."
    - key: thirteen-spice
      source: en-GB
      text:
        en-GB: "Add eight more spices and five-spice powder becomes thirteen-spice powder, a less common Chinese blend."
        de-AT: "Mit acht weiteren Gewürzen wird aus dem Fünf-Gewürze-Pulver das Dreizehn-Gewürze-Pulver, eine seltenere chinesische Mischung."

- ingredient: sichuan_pepper
  articles:
    en-GB: {title: "Sichuan pepper", revision: 1384417494}
    de-AT: {title: "Szechuanpfeffer", revision: 258771425}
  facts:
    - key: citrus-family
      source: en-GB
      text:
        en-GB: "Sichuan pepper is not related to black pepper or chilli: it comes from Zanthoxylum, a plant in the citrus family."
        de-AT: "Szechuanpfeffer ist weder mit schwarzem Pfeffer noch mit Chili verwandt. Er stammt von Zanthoxylum, einer Pflanze aus der Familie der Zitrusgewächse."
    - key: sanshool
      source: en-GB
      text:
        en-GB: "The tingling, numbing feeling of Sichuan pepper comes from hydroxy-alpha sanshool; paired with chilli it gives the flavour called málà."
        de-AT: "Das Kribbeln und Taubheitsgefühl beim Szechuanpfeffer kommt vom Hydroxy-alpha-Sanshool. Zusammen mit Chili ergibt das den Geschmack Málà."

- ingredient: pink_peppercorns
  articles:
    en-GB: {title: "Pink peppercorn", revision: 1367857082}
    de-AT: {title: "Rosa Pfeffer", revision: 270673052}
  facts:
    - key: three-species
      source: en-GB
      text:
        en-GB: "Pink peppercorns are not true pepper: the name covers dried berries from three different species, including the Peruvian peppertree."
        de-AT: "Rosa Pfeffer ist kein echter Pfeffer. Der Name umfasst getrocknete Beeren dreier verschiedener Arten, darunter den Peruanischen Pfefferbaum."
    - key: schinus
      source: de-AT
      text:
        en-GB: "The pink peppercorns sold as a spice come mainly from the Brazilian and the Peruvian peppertree of the genus Schinus."
        de-AT: "Rosa Pfeffer stammt vor allem vom Brasilianischen und vom Peruanischen Pfefferbaum aus der Gattung Schinus."

- ingredient: green_peppercorns
  articles:
    en-GB: {title: "Black pepper", revision: 1387670743}
    de-AT: {title: "Pfeffer", revision: 271227050}
  facts:
    - key: same-plant
      source: en-GB
      text:
        en-GB: "Green, black and white pepper all come from the same vine: green is dried unripe fruit, black is cooked and dried unripe fruit, white is the ripe seed."
        de-AT: "Grüner, schwarzer und weißer Pfeffer stammen von derselben Pflanze: grün ist die getrocknete unreife Frucht, schwarz die gekochte und getrocknete, weiß der reife Samen."
    - key: malabar
      source: en-GB
      text:
        en-GB: "In the ancient world, the Malabar Coast of south-west India was the only source of pepper, exported as 'black gold' to Rome."
        de-AT: "In der Antike war die Malabarküste im Südwesten Indiens die einzige Pfefferquelle. Von dort ging das „schwarze Gold“ bis nach Rom."

- ingredient: ras_el_hanout
  articles:
    en-GB: {title: "Ras el hanout", revision: 1362382739}
    de-AT: {title: "Ras el-Hanout", revision: 269186566}
  facts:
    - key: head-of-shop
      source: en-GB
      text:
        en-GB: "Ras el hanout means 'head of the shop' in Arabic: it stands for the best spices a merchant has to offer."
        de-AT: "Ras el-Hanout heißt auf Arabisch „Oberhaupt des Ladens“ und steht für die besten Gewürze, die ein Händler zu bieten hat."
    - key: thirty-spices
      source: de-AT
      text:
        en-GB: "There is no fixed recipe: depending on region and family, ras el hanout can contain up to about 30 ground spices."
        de-AT: "Ein festes Rezept gibt es nicht. Je nach Region und Familie kann Ras el-Hanout aus bis zu etwa 30 gemahlenen Gewürzen bestehen."

- ingredient: zaatar
  articles:
    en-GB: {title: "Za'atar", revision: 1388073094}
    de-AT: {title: "Zatar (Gewürzmischung)", revision: 272163605}
  facts:
    - key: thyme
      source: de-AT
      text:
        en-GB: "Za'atar is the Arabic word for thyme, and in German it names a spice blend from North Africa and the Middle East."
        de-AT: "Zatar ist das arabische Wort für Thymian und bezeichnet eine Gewürzmischung aus Nordafrika und Vorderasien."
    - key: sumac-sesame
      source: en-GB
      text:
        en-GB: "The classic blend mixes dried herbs with toasted sesame seeds, tart sumac and salt; Lebanese versions put more weight on the sumac."
        de-AT: "Die klassische Mischung kombiniert getrocknete Kräuter mit geröstetem Sesam, säuerlichem Sumach und Salz. Libanesische Varianten betonen den Sumach."

- ingredient: gingerbread_spice
  articles:
    en-GB: {title: "Lebkuchen", revision: 1386083386}
    de-AT: {title: "Lebkuchen", revision: 272043644}
  facts:
    - key: pepper-cakes
      source: en-GB
      text:
        en-GB: "Lebkuchen also go by the names Honigkuchen, 'honey cakes', and Pfefferkuchen, 'pepper cakes'."
        de-AT: "Lebkuchen sind auch als Honigkuchen und als Pfefferkuchen bekannt."
    - key: lebzelter
      source: de-AT
      text:
        en-GB: "Gingerbread makers once formed their own trade, separate from other bakers, and were called Lebzelter or Lebküchler."
        de-AT: "Lebkuchenmacher bildeten früher ein eigenes Handwerk, getrennt von den übrigen Bäckern, und nannten sich Lebzelter oder Lebküchler."

- ingredient: herb_salt
  articles:
    en-GB: {title: "Seasoned salt", revision: 1388035853}
    de-AT: {title: "Gewürzsalz", revision: 213964227}
  facts:
    - key: forty-percent
      source: de-AT
      text:
        en-GB: "Under German food guidelines, seasoned salt such as herb salt must contain at least 40 per cent salt and 15 per cent spices."
        de-AT: "Nach dem Deutschen Lebensmittelbuch muss Gewürzsalz wie Kräutersalz mindestens 40 Prozent Salz und 15 Prozent Gewürze enthalten."
    - key: chip-shops
      source: en-GB
      text:
        en-GB: "Seasoned salt is a staple of fish and chip shops and takeaways, where it is the standard seasoning on chips and fried chicken."
        de-AT: "Gewürzsalz ist in englischen Fish-and-Chips-Buden und Imbissen Standard und landet dort auf Pommes und frittiertem Huhn."

- ingredient: canned_pineapple
  articles:
    en-GB: {title: "Pineapple", revision: 1387932324}
    de-AT: {title: "Ananas", revision: 269344916}
  facts:
    - key: luxury-icon
      source: en-GB
      text:
        en-GB: "When the pineapple reached Europe in the 17th century it became a cultural icon of luxury; greenhouse growing began in the 1820s."
        de-AT: "Als die Ananas im 17. Jahrhundert nach Europa kam, wurde sie zum Sinnbild für Luxus. Seit den 1820er-Jahren wird sie in Glashäusern angebaut."
    - key: multiple-fruit
      source: en-GB
      text:
        en-GB: "A pineapple is not one fruit but many: the individual flowers of the plant fuse together into a single multiple fruit."
        de-AT: "Eine Ananas ist nicht eine Frucht, sondern viele: Die einzelnen Blüten der Pflanze verwachsen zu einem einzigen Fruchtverband."
    - key: guarani
      source: de-AT
      text:
        en-GB: "The word ananas comes from naná, meaning 'fruit' in the Guaraní language, and comosus refers to its tuft of leaves."
        de-AT: "Das Wort Ananas stammt von naná, „Frucht“ in der Sprache der Guaraní. Der Beiname comosus, „schopfig“, spielt auf den Blattschopf an."

- ingredient: canned_mandarins
  articles:
    en-GB: {title: "Mandarin orange", revision: 1387797880}
    de-AT: {title: "Mandarine", revision: 270768987}
  facts:
    - key: original-citrus
      source: en-GB
      text:
        en-GB: "The wild mandarin is one of the original citrus species, and the sweet orange is in fact a mandarin and pomelo hybrid."
        de-AT: "Die wilde Mandarine ist eine der ursprünglichen Zitrusarten, und die Orange ist eigentlich eine Kreuzung aus Mandarine und Pomelo."
    - key: bitter-ancestor
      source: en-GB
      text:
        en-GB: "The ancestral mandarin was bitter; most commercial mandarins taste sweet because of crossing with the pomelo."
        de-AT: "Die Urmandarine schmeckte bitter. Die meisten Handelssorten sind erst durch Einkreuzung der Pomelo süß geworden."

- ingredient: jarred_sour_cherries
  articles:
    en-GB: {title: "Prunus cerasus", revision: 1372118937}
    de-AT: {title: "Sauerkirsche", revision: 267909335}
  facts:
    - key: morello-amarelle
      source: en-GB
      text:
        en-GB: "Sour cherries come in two main groups: the dark red morello and the lighter red amarelle."
        de-AT: "Sauerkirschen gibt es in zwei Hauptgruppen: die dunkelrote Morelle und die hellere Amarelle."
    - key: weichsel
      source: de-AT
      text:
        en-GB: "In Austria, Old Bavaria and Switzerland the sour cherry is simply called Weichsel, a name that strictly means the morello group."
        de-AT: "In Österreich, Altbayern und der Schweiz heißt die Sauerkirsche kurz Weichsel, was im engeren Sinn die Gruppe der Morellen meint."

- ingredient: pickled_beetroot
  articles:
    en-GB: {title: "Beetroot", revision: 1386059077}
    de-AT: {title: "Rote Bete", revision: 271571319}
  facts:
    - key: sugar-beet-cousin
      source: en-GB
      text:
        en-GB: "Beetroot belongs to the same subspecies as the sugar beet, Swiss chard and the fodder beet mangelwurzel."
        de-AT: "Die Rote Rübe gehört zur selben Unterart wie die Zuckerrübe, der Mangold und die Futterrübe."
    - key: rahne
      source: de-AT
      text:
        en-GB: "In parts of Austria and Bavaria beetroot is also called Rahne, and in Switzerland Randen."
        de-AT: "In Teilen Österreichs und Bayerns heißt die Rote Rübe auch Rahne oder Rana, in der Schweiz Randen."

- ingredient: artichoke_hearts
  articles:
    en-GB: {title: "Artichoke", revision: 1382935401}
    de-AT: {title: "Artischocke", revision: 271472163}
  facts:
    - key: thistle-bud
      source: en-GB
      text:
        en-GB: "An artichoke is the flower bud of a thistle; if it is left to bloom, it turns coarse and barely edible."
        de-AT: "Die Artischocke ist die Blütenknospe einer Distel. Lässt man sie aufblühen, wird sie hart und kaum noch essbar."
    - key: cardoon
      source: en-GB
      text:
        en-GB: "The artichoke is a variety of the same species as the cardoon, a perennial native to the Mediterranean."
        de-AT: "Die Artischocke gehört zur selben Art wie das Cardy, eine mehrjährige Pflanze aus dem Mittelmeerraum."

- ingredient: bamboo_shoots
  articles:
    en-GB: {title: "Bamboo shoot", revision: 1341012766}
  facts:
    - key: cyanogenic
      source: en-GB
      text:
        en-GB: "Raw bamboo shoots contain the same kind of natural toxins as cassava, which is why they are always boiled, and why canning makes them safe."
        de-AT: "Rohe Bambussprossen enthalten ähnliche natürliche Giftstoffe wie Maniok. Deshalb werden sie immer gekocht, und auch das Konservieren macht sie unbedenklich."
    - key: new-culms
      source: en-GB
      text:
        en-GB: "Bamboo shoots are the new stems that push out of the ground, harvested from species such as moso bamboo, Phyllostachys edulis."
        de-AT: "Bambussprossen sind die jungen Halme, die aus dem Boden schießen, geerntet etwa vom Moso-Bambus, Phyllostachys edulis."

- ingredient: canned_mackerel
  articles:
    en-GB: {title: "Atlantic mackerel", revision: 1387133944}
    de-AT: {title: "Makrele", revision: 268346292}
  facts:
    - key: huge-shoals
      source: en-GB
      text:
        en-GB: "Atlantic mackerel gather in huge shoals near the surface in summer and move into deeper, warmer water in autumn and winter."
        de-AT: "Makrelen ziehen im Sommer in riesigen Schwärmen nahe der Oberfläche und weichen im Herbst und Winter in tiefere, wärmere Gewässer aus."
    - key: seventeen-years
      source: de-AT
      text:
        en-GB: "A mackerel can grow up to 60 cm long, weigh up to 3.4 kg and live for 17 years."
        de-AT: "Makrelen können 60 Zentimeter lang, bis zu 3,4 kg schwer und 17 Jahre alt werden."

- ingredient: ajvar
  articles:
    en-GB: {title: "Ajvar", revision: 1362029572}
    de-AT: {title: "Ajvar", revision: 271359526}
  facts:
    - key: yugoslavia
      source: en-GB
      text:
        en-GB: "Ajvar became a popular side dish all over Yugoslavia after the Second World War, and it is still a staple across south-eastern Europe."
        de-AT: "Ajvar wurde nach dem Zweiten Weltkrieg in ganz Jugoslawien zur beliebten Beilage und ist bis heute in Südosteuropa allgegenwärtig."
    - key: wipo
      source: en-GB
      text:
        en-GB: "'Homemade Leskovac Ajvar' and 'Macedonian Ajvar' are registered with the World Intellectual Property Organization to protect their names."
        de-AT: "„Hausgemachter Leskovac-Ajvar“ und „Mazedonischer Ajvar“ sind bei der Weltorganisation für geistiges Eigentum registriert, um ihre Namen zu schützen."
    - key: autumn-roasting
      source: de-AT
      text:
        en-GB: "Every autumn in the Balkans, huge quantities of peppers and aubergines are roasted outdoors to make ajvar for the winter."
        de-AT: "Jeden Herbst werden auf dem Balkan große Mengen Paprika und Melanzani im Freien geröstet, um Ajvar als Vorrat einzukochen."

- ingredient: bbq_sauce
  articles:
    en-GB: {title: "Barbecue sauce", revision: 1385878587}
    de-AT: {title: "Barbecuesauce", revision: 266802841}
  facts:
    - key: german-mustard-sauce
      source: en-GB
      text:
        en-GB: "South Carolina's mustard-based barbecue sauce can be traced back to German settlers in the 18th century."
        de-AT: "Die senfbasierte Barbecuesauce aus South Carolina lässt sich auf deutsche Siedler im 18. Jahrhundert zurückführen."
    - key: sugar-after-war
      source: en-GB
      text:
        en-GB: "Early homemade barbecue sauces were just vinegar, salt and pepper; sugar and ketchup only arrived in the 1920s."
        de-AT: "Frühe hausgemachte Barbecuesaucen bestanden nur aus Essig, Salz und Pfeffer. Zucker und Ketchup kamen erst in den 1920er-Jahren dazu."

- ingredient: hot_sauce
  articles:
    en-GB: {title: "Hot sauce", revision: 1388080302}
    de-AT: {title: "Chilisauce", revision: 263801105}
  facts:
    - key: tabasco-1868
      source: en-GB
      text:
        en-GB: "Tabasco, launched in 1868, is the oldest recognisable brand in the American hot sauce industry, and it is aged in wooden casks."
        de-AT: "Tabasco kam 1868 auf den Markt, ist die älteste noch bekannte Marke der amerikanischen Chilisaucen und reift in Holzfässern."
    - key: massachusetts-1807
      source: en-GB
      text:
        en-GB: "One of the first bottled hot sauces sold in the United States appeared in Massachusetts in 1807."
        de-AT: "Eine der ersten in Flaschen verkauften Chilisaucen der USA erschien 1807 in Massachusetts."
    - key: cooked-or-fermented
      source: de-AT
      text:
        en-GB: "Chilli sauces can be made by cooking, by fermentation or purely from raw ingredients, and they count among the cold sauces."
        de-AT: "Chilisaucen entstehen durch Kochen, durch Fermentation oder ganz aus rohen Zutaten und zählen zu den kalten Saucen."

- ingredient: remoulade
  articles:
    en-GB: {title: "Remoulade", revision: 1372390204}
    de-AT: {title: "Remoulade", revision: 269973975}
  facts:
    - key: black-radish
      source: de-AT
      text:
        en-GB: "The name rémoulade may come from rémola, French for black radish, or from the Latin molere, 'to grind'."
        de-AT: "Der Name Remoulade kommt entweder von rémola, französisch für Schwarzrettich, oder vom lateinischen molere, „mahlen“."
    - key: fifty-percent-fat
      source: de-AT
      text:
        en-GB: "A product sold as remoulade must contain at least 50 per cent fat; lighter versions go by names such as Remouladencreme."
        de-AT: "Ein Produkt namens Remoulade muss mindestens 50 Prozent Fett enthalten. Leichtere Varianten heißen etwa Remouladencreme."

- ingredient: cocktail_sauce
  articles:
    en-GB: {title: "Cocktail sauce", revision: 1381188384}
    de-AT: {title: "Cocktailsauce", revision: 249005401}
  facts:
    - key: american-seafood
      source: en-GB
      text:
        en-GB: "Cocktail sauce is served with seafood cocktail, and seafood with spiced cold sauces like it was common in 19th- and 20th-century American cooking."
        de-AT: "Cocktailsauce gehört zum Meeresfrüchte-Cocktail, und Meeresfrüchte mit solchen kalten Würzsaucen waren in der amerikanischen Küche des 19. und 20. Jahrhunderts üblich."
    - key: madeira-kren
      source: de-AT
      text:
        en-GB: "A classic cocktail sauce mixes mayonnaise with ketchup, horseradish, mustard and a splash of Madeira."
        de-AT: "Eine klassische Cocktailsauce mischt Mayonnaise mit Ketchup, Kren, Senf und einem Schuss Madeira."

- ingredient: balsamic_glaze
  articles:
    en-GB: {title: "Balsamic vinegar", revision: 1379915431}
    de-AT: {title: "Aceto balsamico", revision: 268807325}
  facts:
    - key: grape-must
      source: en-GB
      text:
        en-GB: "Balsamic vinegar is made wholly or partly from grape must, freshly crushed grapes with their skins, seeds and stems."
        de-AT: "Aceto balsamico wird ganz oder teilweise aus Traubenmost hergestellt, also aus frisch gepressten Trauben mitsamt Schalen, Kernen und Stielen."
    - key: fragrance
      source: de-AT
      text:
        en-GB: "The name balsamico refers to the vinegar's fragrant character, as balsam means a pleasant scent."
        de-AT: "Der Name Balsamico verweist auf den wohlriechenden Charakter des Essigs, denn Balsam bedeutet „Wohlgeruch“."

- ingredient: sherry_vinegar
  articles:
    en-GB: {title: "Sherry vinegar", revision: 1283390605}
    de-AT: {title: "Vinagre de Jerez", revision: 267335782}
  facts:
    - key: solera
      source: en-GB
      text:
        en-GB: "Most sherry vinegar is aged in the same solera system of stacked barrels as sherry itself and Brandy de Jerez."
        de-AT: "Der meiste Sherryessig reift im selben Solera-System aus gestapelten Fässern wie der Sherry selbst und der Brandy de Jerez."
    - key: sherry-triangle
      source: en-GB
      text:
        en-GB: "Sherry vinegar has its own protected designation of origin and may only be aged inside the Sherry Triangle around Jerez de la Frontera."
        de-AT: "Sherryessig hat eine eigene geschützte Ursprungsbezeichnung und darf nur im Sherry-Dreieck rund um Jerez de la Frontera reifen."

- ingredient: peanut_oil
  articles:
    en-GB: {title: "Peanut oil", revision: 1383214639}
    de-AT: {title: "Erdnussöl", revision: 270363798}
  facts:
    - key: diesel-1900
      source: en-GB
      text:
        en-GB: "At the 1900 Paris Exhibition, a diesel engine was run on peanut oil, one of the earliest demonstrations of biodiesel."
        de-AT: "Auf der Pariser Weltausstellung 1900 lief ein Dieselmotor mit Erdnussöl, eine der frühesten Vorführungen von Biodiesel."
    - key: smoke-point
      source: en-GB
      text:
        en-GB: "Groundnut oil has a high smoke point, which makes it good for frying; oil from roasted peanuts tastes much more of peanut."
        de-AT: "Erdnussöl hat einen hohen Rauchpunkt und eignet sich daher gut zum Frittieren. Öl aus gerösteten Erdnüssen schmeckt deutlich nussiger."

- ingredient: linseed_oil
  articles:
    en-GB: {title: "Linseed oil", revision: 1383452585}
    de-AT: {title: "Leinöl", revision: 272417515}
  facts:
    - key: drying-oil
      source: en-GB
      text:
        en-GB: "Because it forms polymers, linseed oil is also used in wood finishes, as a binder in oil paints and to make linoleum."
        de-AT: "Weil Leinöl Polymere bildet, dient es auch zur Holzbehandlung, als Bindemittel in Ölfarben und zur Herstellung von Linoleum."
    - key: flax
      source: en-GB
      text:
        en-GB: "Linseed oil is pressed from the dried, ripe seeds of the flax plant, Linum usitatissimum."
        de-AT: "Leinöl wird aus den getrockneten, reifen Samen des Flachses gepresst, Linum usitatissimum."

- ingredient: kremser_mustard
  articles:
    en-GB: {title: "Mustard (condiment)", revision: 1383632101}
    de-AT: {title: "Senf", revision: 272407208}
  facts:
    - key: hietzgern-1819
      source: de-AT
      text:
        en-GB: "In Krems an der Donau, the Hietzgern brothers began offering mustard for sale in 1819."
        de-AT: "In Krems an der Donau boten die Brüder Hietzgern ab 1819 Senf an."
    - key: grape-must
      source: de-AT
      text:
        en-GB: "Krems mustard is made from coarsely ground yellow and brown mustard seeds, a little sugar, unfermented grape must and wine vinegar."
        de-AT: "Kremser Senf besteht aus grob gemahlenen gelben und braunen Senfkörnern, etwas Zucker, unvergorenem Traubenmost und Weinessig."
    - key: sweet-but-spicy
      source: de-AT
      text:
        en-GB: "Austrians often call Krems mustard sweet mustard, but it is spicier than Bavarian sweet mustard; with tarragon mustard it is standard in Austrian restaurants."
        de-AT: "Kremser Senf heißt in Österreich oft „süßer Senf“, ist aber würziger als bayerischer Süßer Senf und gehört mit dem Estragonsenf zur Standardauswahl der Gastronomie."

- ingredient: liquid_seasoning
  articles:
    en-GB: {title: "Maggi", revision: 1387765254}
    de-AT: {title: "Maggi-Würze", revision: 267818873}
  facts:
    - key: meat-extract-1886
      source: de-AT
      text:
        en-GB: "Julius Maggi developed his liquid seasoning on 8 June 1886 as a cheap substitute for meat extract."
        de-AT: "Julius Maggi entwickelte seine Würze am 8. Juni 1886 als preiswerten Ersatz für Fleischextrakt."
    - key: maggikraut
      source: de-AT
      text:
        en-GB: "The herb Maggikraut and the Maggipilz mushroom were named after the seasoning for their smell, yet neither is actually in it."
        de-AT: "Maggikraut und Maggipilz wurden wegen ihres typischen Geruchs nachträglich nach der Würze benannt, sind in ihr aber gar nicht enthalten."
    - key: square-bottle
      source: de-AT
      text:
        en-GB: "The square bottle with its yellow and red label was designed by Julius Maggi himself in 1887 and is still used, only slightly changed."
        de-AT: "Die eckige Flasche mit dem gelb-roten Etikett entwarf Julius Maggi 1887 selbst, und sie ist bis heute kaum verändert im Einsatz."

- ingredient: sweet_chilli_sauce
  articles:
    en-GB: {title: "Sweet chili sauce", revision: 1325992694}
  facts:
    - key: nam-chim-kai
      source: en-GB
      text:
        en-GB: "In Thailand sweet chilli sauce is called nam chim kai, which literally means 'dipping sauce for chicken'."
        de-AT: "In Thailand heißt Sweet-Chili-Sauce Nam Chim Kai, wörtlich „Dipsauce für Huhn“."
    - key: ingredients
      source: en-GB
      text:
        en-GB: "It is typically made from red chillies, rice wine vinegar, sometimes garlic or fish sauce, and a sweetener such as fruit, sugar or honey."
        de-AT: "Typische Zutaten sind rote Chilis, Reisessig, manchmal Knoblauch oder Fischsauce und ein Süßungsmittel wie Obst, Zucker oder Honig."

- ingredient: teriyaki_sauce
  articles:
    en-GB: {title: "Teriyaki", revision: 1378575155}
    de-AT: {title: "Teriyaki", revision: 269320293}
  facts:
    - key: shine-grill
      source: en-GB
      text:
        en-GB: "Teriyaki combines teri, the shine given by the sugar in the glaze, and yaki, grilling or broiling."
        de-AT: "Teriyaki setzt sich aus teri zusammen, dem Glanz, den der Zucker der Glasur verleiht, und aus yaki, grillen oder braten."
    - key: mos-burger-1973
      source: de-AT
      text:
        en-GB: "Teriyaki with meat is a re-import from the USA: it reached Japan in 1973 as a teriyaki burger at MOS Burger."
        de-AT: "Teriyaki mit Fleisch ist ein Rückimport aus den USA und kam erst 1973 als Teriyaki-Burger von MOS Burger nach Japan."
    - key: fish-in-japan
      source: en-GB
      text:
        en-GB: "In Japan teriyaki is mostly made with fish such as yellowtail, salmon or mackerel, while the West prefers chicken, pork and beef."
        de-AT: "In Japan macht man Teriyaki vor allem mit Fisch wie Gelbschwanzmakrele, Lachs oder Makrele, im Westen eher mit Huhn, Schwein und Rind."

- ingredient: kecap_manis
  articles:
    en-GB: {title: "Sweet soy sauce", revision: 1378036089}
  facts:
    - key: ninety-percent
      source: en-GB
      text:
        en-GB: "Kecap manis is by far the most used soy sauce in Indonesia, accounting for an estimated 90 per cent of the country's soy sauce output."
        de-AT: "Kecap Manis ist in Indonesien die mit Abstand meistverwendete Sojasauce und macht geschätzt 90 Prozent der Sojasaucenproduktion des Landes aus."
    - key: palm-sugar
      source: en-GB
      text:
        en-GB: "Its dark colour and syrupy, molasses-like taste come from a generous amount of palm sugar."
        de-AT: "Die dunkle Farbe und den sirupartigen, melasseähnlichen Geschmack verdankt Kecap Manis einer großzügigen Portion Palmzucker."

- ingredient: crisps
  articles:
    en-GB: {title: "Potato chips", revision: 1387853612}
    de-AT: {title: "Kartoffelchips", revision: 271931929}
  facts:
    - key: kitchiner-1817
      source: en-GB
      text:
        en-GB: "The earliest known recipe for crisps comes from England, in William Kitchiner's bestselling cookbook The Cook's Oracle of 1817."
        de-AT: "Das älteste bekannte Rezept für Chips stammt aus England, aus William Kitchiners Bestseller-Kochbuch The Cook's Oracle von 1817."
    - key: crum-legend
      source: en-GB
      text:
        en-GB: "The popular story that crisps were invented by the cook George Crum in Saratoga Springs is now known to be untrue."
        de-AT: "Die beliebte Geschichte, der Koch George Crum habe die Chips in Saratoga Springs erfunden, gilt heute als widerlegt."
    - key: rohscheiben
      source: de-AT
      text:
        en-GB: "In eastern Austria crisps used to be called Rohscheiben, a name that is only rarely heard today."
        de-AT: "In Ostösterreich hießen Chips früher Rohscheiben, ein Name, den man heute nur noch selten hört."

- ingredient: crackers
  articles:
    en-GB: {title: "Cracker (food)", revision: 1387978863}
    de-AT: {title: "Cracker (Gebäck)", revision: 255785647}
  facts:
    - key: docking-holes
      source: en-GB
      text:
        en-GB: "The little holes in crackers are called docking holes; they stop large air pockets forming while the dough bakes."
        de-AT: "Die kleinen Löcher in Crackern heißen auf Englisch docking holes und verhindern, dass sich beim Backen große Luftblasen bilden."
    - key: ships-biscuit
      source: de-AT
      text:
        en-GB: "Crackers developed from ship's biscuit and hardtack, and the word was borrowed into German from English."
        de-AT: "Cracker haben sich aus Schiffszwieback und Hartkeksen entwickelt, und das Wort wurde aus dem Englischen ins Deutsche übernommen."
