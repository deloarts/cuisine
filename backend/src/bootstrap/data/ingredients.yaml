# The base ingredient catalogue every instance is seeded with. Hand-edited;
# scripts/build_base_ingredients.py reads it and never writes it.
#
# Fields: key (stable, never renamed), names per locale as [singular,
# plural], category (a key of categories.yaml), family (optional, a key of
# families.yaml), aliases (optional, other names per locale that search,
# pickers and imports match; unique per locale across every name and
# alias), allergens, diet_markers, season (optional, the months 1 to 12 when
# it is in season in Austria outdoors or from regional storage; storage
# crops count from harvest until regional stock usually runs out in
# spring, never the whole year),
# fdc_id / fdc_dataset / fdc_description (the matched USDA FoodData Central
# food; the description is checked on every build), optional
# density_g_per_ml, conversions (grams per unit key of units.yaml), proxy
# (the FDC food is a stand-in for a food FDC lacks), nutrition (per 100 g:
# the whole profile for a food FDC lacks, otherwise values that fill the
# gaps FDC leaves), source_note (required with proxy or a whole manual
# profile: which food stands in or where the values come from, and why that
# is close enough). The values the build takes from FDC live in
# ingredients.nutrition.json; the startup seed merges both, and what this
# file sets wins. The curation rules are in docs/reference/cookbook.md
# section 10.


