# ─────────────────────────────────────────────────────────────
# Cuisine - release compose
#
# Runs prebuilt images from GHCR (ghcr.io/deloarts/cuisine/backend and
# ghcr.io/deloarts/cuisine/frontend). No source checkout and no local build
# step required, just this file plus an env file.
#
#   CUISINE_VERSION   image tag pulled for backend and frontend, e.g. v0.1
#                     (pin a minor) or v0.1.0 (pin exact). Required: there
#                     is no default, so nothing ever pulls latest
#   BACKEND_VERSION   overrides CUISINE_VERSION for the backend image only
#   FRONTEND_VERSION  overrides CUISINE_VERSION for the frontend image only
#   FRONTEND_BIND     interface the frontend port binds to (default:
#                     127.0.0.1, reached through the host's reverse proxy)
#   FRONTEND_PORT     host port the frontend is published on (default: 8080)
#   ENV_FILE          env file to load, e.g. stack.env for Portainer
#                     (default: .env)
#   CUISINE_INTERNAL_SUBNET, CUISINE_EXTERNAL_SUBNET
#                     subnets of the two compose networks below (defaults:
#                     192.168.250.0/24 and 192.168.251.0/24)
#   CUISINE_EXTERNAL_GATEWAY, CUISINE_FRONTEND_IP, CUISINE_CLOUDFLARED_IP
#                     fixed addresses on the external network (defaults:
#                     192.168.251.1, 192.168.251.250 and 192.168.251.251).
#                     The backend believes forwarded headers only from the
#                     frontend's address; set all three inside a changed
#                     CUISINE_EXTERNAL_SUBNET
#   CUISINE_TRUSTED_PROXIES
#                     addresses or CIDR networks whose X-Forwarded-For the
#                     frontend's nginx believes, or none (default: the
#                     gateway, which a reverse proxy on the host connects
#                     from, and the cloudflared tunnel)
#   BACKUP_DIR        host directory the nightly database dumps go to
#                     (default: the named volume `backups`)
#   BACKUP_KEEP_DAYS  how many days of dumps the backup sidecar keeps
#                     (default: 14)
#
# Maintenance (--profile maintenance): a do-nothing sidecar for running the
# recovery commands without a host shell (docs/OPERATIONS.md).
#
# Cloudflare Tunnel (--profile cloudflare): publishes the frontend without
# opening a port on the host (docs/INSTALLATION.md).
# ─────────────────────────────────────────────────────────────
name: cuisine

x-logging: &logging
  # Needed on a default Docker install, where json-file has no size cap and
  # stdout grows the volume unbounded over the life of a deploy.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ─── Backend ────────────────────────────────────────────────
  backend:
    image: ghcr.io/deloarts/cuisine/backend:${BACKEND_VERSION:-${CUISINE_VERSION:?CUISINE_VERSION is not set. Set it in the env file to the release to run, e.g. v0.1}}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      # Gunicorn honours X-Forwarded-For and X-Forwarded-Proto only from
      # these peers (gunicorn_conf.py). The frontend's nginx reaches the
      # backend over the external network from its fixed address and is the
      # only proxy in front of it; the other containers on that network are
      # not trusted. Set here rather than in the env file, so a stray value
      # there cannot widen the trust.
      NETWORK__TRUSTED_PROXIES: ${CUISINE_FRONTEND_IP:-192.168.251.250}
      # The backup sidecar's directory, read-only, so the admin area can
      # show the nightly dumps; the values mirror the sidecar's settings.
      BACKUP__DIR: /backups
      BACKUP__KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP__HOUR: ${BACKUP_HOUR:-3}
      BACKUP__CONTROL_DIR: /backup-control
      # Where the `local` storage provider writes (STORAGE__PROVIDER=local).
      LOCAL_STORAGE__BASE_DIR: /app/files
    volumes:
      - ${BACKUP_DIR:-backups}:/backups:ro
      - files:/app/files
      - backup_control:/backup-control
    # Longer than gunicorn's 30s graceful_timeout, so a restart lets
    # in-flight requests finish.
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    logging: *logging

  # ─── Maintenance sidecar (optional, --profile maintenance) ──
  # Same image, network and env as the backend, but it never migrates and
  # never starts the app (entrypoint.sh's "maintenance" case), so
  # `docker compose exec maintenance /entrypoint.sh admin ...` works even
  # while the backend is down.
  maintenance:
    image: ghcr.io/deloarts/cuisine/backend:${BACKEND_VERSION:-${CUISINE_VERSION:?CUISINE_VERSION is not set. Set it in the env file to the release to run, e.g. v0.1}}
    profiles: [ maintenance ]
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    command: maintenance
    environment:
      LOCAL_STORAGE__BASE_DIR: /app/files
    # The same file volume as the backend, so the storage CLI can move
    # files from here.
    volumes:
      - files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ─── Postgres ───────────────────────────────────────────────
  # Holds everything; with the default `postgres` storage provider also the
  # uploaded images and documents (docs/adr/0002-file-storage-providers.md),
  # so then its volume and the nightly dumps below are the whole state of
  # the instance.
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=60", "-c", "log_min_duration_statement=500"]
    env_file: ${ENV_FILE:-.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal
    logging: *logging

  # ─── Nightly backups ────────────────────────────────────────
  # A compressed pg_dump every night at BACKUP_HOUR (UTC), older dumps than
  # BACKUP_KEEP_DAYS removed. Restoring one is described in
  # docs/OPERATIONS.md. The dump holds the TOTP secrets and the SMTP
  # password encrypted, so a restore needs the same SECURITY__ENCRYPTION_KEY.
  backup:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    entrypoint: [ "/bin/sh", "-c" ]
    # Every 15 seconds: run the nightly dump when its hour has come, or at
    # once when the backend dropped /control/request ("back up now").
    # /control/status.json tells the backend how the last run went.
    command:
      - |
        set -eu
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD" PGDATABASE="$$POSTGRES_DB"
        echo "backup: nightly dumps at $$BACKUP_HOUR:00 UTC, keeping $$BACKUP_KEEP_DAYS days"
        next_due() {
          now=$$(date -u +%s)
          hour=$$(printf '%02d' "$$BACKUP_HOUR")
          next=$$(date -u -d "$$(date -u +%Y-%m-%d) $$hour:00:00" +%s)
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          echo "$$next"
        }
        status() {
          printf '{"trigger":"%s","started":"%s","finished":%s,"ok":%s,"file":%s}\n' \
            "$$1" "$$2" "$$3" "$$4" "$$5" > /control/status.json.partial
          mv /control/status.json.partial /control/status.json
        }
        run_dump() {
          trigger="$$1"
          started=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          status "$$trigger" "$$started" null null null
          file="/backups/cuisine-$$(date -u +%Y%m%d-%H%M%S).dump"
          if pg_dump --format=custom --file="$$file.partial"; then
            mv "$$file.partial" "$$file"
            echo "backup: wrote $$file"
            status "$$trigger" "$$started" "\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" true "\"$$(basename "$$file")\""
          else
            rm -f "$$file.partial"
            echo "backup: pg_dump failed" >&2
            status "$$trigger" "$$started" "\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" false null
          fi
          find /backups -name 'cuisine-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
        }
        due=$$(next_due)
        while true; do
          if [ -f /control/request ]; then
            rm -f /control/request
            run_dump manual
          elif [ "$$(date -u +%s)" -ge "$$due" ]; then
            run_dump scheduled
            due=$$(next_due)
          fi
          sleep 15
        done
    volumes:
      - ${BACKUP_DIR:-backups}:/backups
      - backup_control:/control
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *logging

  # ─── Redis ──────────────────────────────────────────────────
  # Login throttling and the TOTP replay guard today, the live shopping
  # list later. Nothing in it is needed after a restart.
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal
    logging: *logging

  # ─── SeaweedFS (optional, --profile seaweedfs) ──────────────
  # An S3 API for the `seaweedfs` storage provider. The backend writes over
  # the internal network; browsers read through the frontend's nginx at
  # /objects/ (GET and HEAD only), with presigned URLs. seaweedfs-check
  # refuses to start the profile with a missing or sample secret.
  seaweedfs-check:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    profiles: [ seaweedfs ]
    restart: "no"
    network_mode: none
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >-
        if [ -z "$$SEAWEEDFS_ACCESS_KEY" ] || [ "$$SEAWEEDFS_SECRET_KEY" = "change_me" ]
        || [ "$${#SEAWEEDFS_SECRET_KEY}" -lt 24 ]; then
        echo "The seaweedfs profile needs SEAWEEDFS_ACCESS_KEY and a SEAWEEDFS_SECRET_KEY of at least 24 characters that is not the sample value (docs/OPERATIONS.md section 2.1)." >&2;
        exit 1; fi

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    profiles: [ seaweedfs ]
    depends_on:
      seaweedfs-check:
        condition: service_completed_successfully
    # Only the `objects` bucket exists, the one nginx serves.
    command: mini -dir=/data -bucket=objects -s3.autoCreateBucket=false -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-}
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8333/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
      - external
    logging: *logging

  # ─── Frontend ───────────────────────────────────────────────
  frontend:
    image: ghcr.io/deloarts/cuisine/frontend:${FRONTEND_VERSION:-${CUISINE_VERSION:?CUISINE_VERSION is not set. Set it in the env file to the release to run, e.g. v0.1}}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    environment:
      # Peers whose X-Forwarded-For nginx resolves the client address from
      # (frontend/docker/trusted-proxies.sh): the gateway, which a reverse
      # proxy on the host connects through, and the cloudflared tunnel.
      CUISINE_TRUSTED_PROXIES: ${CUISINE_TRUSTED_PROXIES:-${CUISINE_EXTERNAL_GATEWAY:-192.168.251.1},${CUISINE_CLOUDFLARED_IP:-192.168.251.251}}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      external:
        # The one address the backend trusts forwarded headers from. High in
        # the subnet, away from the addresses Docker hands out from the
        # bottom up.
        ipv4_address: ${CUISINE_FRONTEND_IP:-192.168.251.250}
    logging: *logging

  # ─── Cloudflare Tunnel (optional, --profile cloudflare) ─────
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    profiles: [ cloudflare ]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    # The tunnel's route points at http://frontend:80 by name, so the
    # address only serves the frontend's trusted proxy list.
    networks:
      external:
        ipv4_address: ${CUISINE_CLOUDFLARED_IP:-192.168.251.251}
    logging: *logging

# Pinned subnets and gateway, so the backend and the frontend's nginx can
# name the addresses they trust forwarded headers from. The internal network
# has no route out: Postgres, Redis, the backup and maintenance sidecars talk
# only to each other and the backend, which reaches the outside (mail,
# webhooks, peers) over the external network.
networks:
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${CUISINE_INTERNAL_SUBNET:-192.168.250.0/24}
  external:
    driver: bridge
    ipam:
      config:
        - subnet: ${CUISINE_EXTERNAL_SUBNET:-192.168.251.0/24}
          gateway: ${CUISINE_EXTERNAL_GATEWAY:-192.168.251.1}

volumes:
  postgres:
  redis:
  backups:
  files:
  seaweedfs:
  backup_control:
